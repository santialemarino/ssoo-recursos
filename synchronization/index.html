<script id="engine">
const MINUS = "−";

function fill(template, values) {
  return template.replace(/\{(\w+)\}/g, function (match, key) {
    return values[key] === undefined ? match : values[key];
  });
}

function showValue(value) {
  if (value === null || value === undefined) return UI_TEXT.none;
  if (value === true) return "true";
  if (value === false) return "false";
  return String(value).replace("-", MINUS);
}

const EXECUTABLE = { code: true, section: true, expansion: true };

function programLines(key) {
  if (!PROGRAMS[key]) return [];
  let numbered = 0;
  return PROGRAMS[key].lines.map(function (line) {
    const shape = typeof line === "string" ? { t: line, role: "code" } : { t: line.t, role: line.role };
    if (shape.role !== "expansion") numbered += 1;
    shape.number = shape.role === "expansion" ? null : numbered;
    return shape;
  });
}

function processById(example, id) {
  return (example.processes || []).filter(function (item) { return item.id === id; })[0] || null;
}

function copy(source) {
  const target = {};
  Object.keys(source).forEach(function (key) { target[key] = source[key]; });
  return target;
}

function cloneBoards(boards) {
  const target = {};
  Object.keys(boards).forEach(function (id) {
    const board = boards[id];
    const lanes = {};
    Object.keys(board.lanes).forEach(function (pid) {
      lanes[pid] = board.lanes[pid].map(copy);
    });
    target[id] = {
      units: board.units,
      spin: board.spin,
      overhead: board.overhead,
      cpu: board.cpu.map(copy),
      lanes: lanes
    };
  });
  return target;
}

function cloneSemaphores(semaphores) {
  const target = {};
  Object.keys(semaphores).forEach(function (key) {
    target[key] = { value: semaphores[key].value, queue: semaphores[key].queue.slice() };
  });
  return target;
}

function cloneLists(lists) {
  const target = {};
  Object.keys(lists).forEach(function (key) {
    target[key] = { items: lists[key].items.slice(), capacity: lists[key].capacity, taken: lists[key].taken };
  });
  return target;
}

function cloneRegions(regions) {
  const target = {};
  Object.keys(regions).forEach(function (key) { target[key] = regions[key].slice(); });
  return target;
}

function cloneState(state) {
  return {
    shared: copy(state.shared),
    registers: copy(state.registers),
    lists: cloneLists(state.lists),
    output: state.output.slice(),
    semaphores: cloneSemaphores(state.semaphores),
    states: copy(state.states),
    lines: copy(state.lines),
    regions: cloneRegions(state.regions),
    mode: state.mode ? copy(state.mode) : null,
    boards: cloneBoards(state.boards),
    spins: state.spins,
    spinning: false
  };
}

function filledList(item) {
  const items = [];
  for (let n = 1; n <= (item.fill || 0); n += 1) items.push(item.prefix + n);
  return { items: items, capacity: item.capacity, taken: null };
}

function initialState(example) {
  const shared = {};
  const lists = {};
  (example.shared || []).forEach(function (item) {
    if (item.kind === "list") lists[item.key] = filledList(item);
    else shared[item.key] = item.value;
  });
  const registers = {};
  const states = {};
  const lines = {};
  (example.processes || []).forEach(function (item) {
    if (item.register) registers[item.register.key] = null;
    states[item.id] = "READY";
    lines[item.id] = null;
  });
  const semaphores = {};
  (example.semaphores || []).forEach(function (item) { semaphores[item.key] = { value: item.value, queue: [] }; });
  const boards = {};
  (example.boards || []).forEach(function (board) {
    const lanes = {};
    (example.laneProcesses || []).forEach(function (item) { lanes[item.id] = []; });
    boards[board.id] = { units: 0, spin: 0, overhead: 0, cpu: [], lanes: lanes };
  });
  return {
    shared: shared,
    registers: registers,
    lists: lists,
    output: [],
    semaphores: semaphores,
    states: states,
    lines: lines,
    regions: example.regions ? cloneRegions(example.regions) : {},
    mode: example.mode ? { mode: example.mode.mode, flag: example.mode.flag, switches: 0, pending: false } : null,
    boards: boards,
    spins: 0,
    spinning: false
  };
}

function guardHolds(state, clauses) {
  return clauses.every(function (clause) {
    const actual = state.shared[clause.key];
    if (clause.cmp === "eq") return actual === clause.value;
    return actual !== clause.value;
  });
}

function stepGuard(example, step) {
  if (!step.actor || !step.line) return null;
  const byProcess = (example.guards || {})[step.actor];
  if (!byProcess) return null;
  return byProcess[step.line] || null;
}

function appendSegment(list, segment) {
  const last = list[list.length - 1];
  if (last && last.kind === segment.kind && last.who === segment.who && last.spinning === segment.spinning) {
    last.units += segment.units;
    return;
  }
  list.push(segment);
}

function advanceTime(state, op) {
  const board = state.boards[op.board];
  if (!board) return;
  board.units += op.units;
  if (op.cpu.kind === "spin") board.spin += op.units;
  if (op.cpu.kind === "overhead") board.overhead += op.units;
  appendSegment(board.cpu, { kind: op.cpu.kind, who: op.cpu.who || null, units: op.units, spinning: false });
  Object.keys(board.lanes).forEach(function (pid) {
    const spinning = (op.spin || []).indexOf(pid) !== -1;
    appendSegment(board.lanes[pid], { kind: op.states[pid], who: pid, units: op.units, spinning: spinning });
    state.states[pid] = op.states[pid];
  });
}

function applyOp(state, op, actor, example) {
  if (op.op === "reg.read") { state.registers[op.reg] = state.shared[op.from]; return; }
  if (op.op === "reg.add") { state.registers[op.reg] = state.registers[op.reg] + op.by; return; }
  if (op.op === "shared.write") { state.shared[op.name] = state.registers[op.reg]; return; }
  if (op.op === "shared.set") { state.shared[op.name] = op.value; return; }
  if (op.op === "reset") {
    (example.shared || []).forEach(function (item) {
      if (item.kind !== "list") state.shared[item.key] = item.value;
    });
    Object.keys(state.registers).forEach(function (key) { state.registers[key] = null; });
    Object.keys(state.lines).forEach(function (key) { state.lines[key] = null; });
    return;
  }
  if (op.op === "region.set") { state.regions = cloneRegions(op.regions); return; }
  if (op.op === "list.push") { state.lists[op.name].items.push(op.item); return; }
  if (op.op === "list.take") {
    const list = state.lists[op.name];
    list.taken = list.items.length ? list.items.shift() : null;
    return;
  }
  if (op.op === "list.fill") {
    const list = state.lists[op.name];
    list.items = [];
    for (let n = 1; n <= op.count; n += 1) list.items.push(op.prefix + n);
    return;
  }
  if (op.op === "output.print") { state.output.push(op.text); return; }
  if (op.op === "sem.set") { state.semaphores[op.name].value = op.value; return; }
  if (op.op === "sem.wait") {
    const semaphore = state.semaphores[op.name];
    if (!semaphore) return;
    semaphore.value -= 1;
    if (semaphore.value < 0) semaphore.queue.push(actor);
    return;
  }
  if (op.op === "sem.signal") {
    const semaphore = state.semaphores[op.name];
    if (!semaphore) return;
    semaphore.value += 1;
    if (semaphore.value <= 0) semaphore.queue.shift();
    return;
  }
  if (op.op === "lock.testAndSet") {
    state.spinning = state.shared[op.name] === true;
    state.shared[op.name] = true;
    return;
  }
  if (op.op === "mode.set") {
    if (state.mode.mode !== op.value) state.mode.switches += 1;
    state.mode.mode = op.value;
    return;
  }
  if (op.op === "flag.set") { state.mode.flag = op.value; return; }
  if (op.op === "interrupt.raise") { state.mode.pending = true; return; }
  if (op.op === "interrupt.service") { state.mode.pending = false; return; }
  if (op.op === "time.advance") { advanceTime(state, op); return; }
}

function blockedProcesses(state) {
  const blocked = {};
  Object.keys(state.semaphores).forEach(function (key) {
    state.semaphores[key].queue.forEach(function (id) { blocked[id] = true; });
  });
  return blocked;
}

function deriveStates(state, step, example) {
  if (!example.processes) return;
  const blocked = blockedProcesses(state);
  example.processes.forEach(function (item) {
    if (blocked[item.id]) { state.states[item.id] = "BLOCKED"; return; }
    if (state.states[item.id] === "BLOCKED") state.states[item.id] = "READY";
    if (!step.actor) return;
    state.states[item.id] = item.id === step.actor ? "RUNNING" : "READY";
  });
}

function applyStep(state, step, example) {
  const ops = step.ops || [];
  ops.forEach(function (op) {
    if (op.op !== "state.set") applyOp(state, op, step.actor, example);
  });
  const guard = stepGuard(example, step);
  if (guard) state.spinning = guardHolds(state, guard);
  if (state.spinning) state.spins += 1;
  if (step.actor && step.line) state.lines[step.actor] = step.line;
  deriveStates(state, step, example);
  ops.forEach(function (op) {
    if (op.op === "state.set") state.states[op.process] = op.value;
  });
}

function fillContext(state) {
  const context = {};
  Object.keys(state.shared).forEach(function (key) { context[key] = showValue(state.shared[key]); });
  Object.keys(state.registers).forEach(function (key) { context[key] = showValue(state.registers[key]); });
  Object.keys(state.semaphores).forEach(function (key) {
    const semaphore = state.semaphores[key];
    context[key] = showValue(semaphore.value);
    context[key + "_count"] = String(semaphore.queue.length);
    context[key + "_queue"] = semaphore.queue.length ? semaphore.queue.join(", ") : UI_TEXT.queueEmpty;
  });
  if (state.mode) {
    context.mode = state.mode.mode;
    context.flag = String(state.mode.flag);
    context.switches = String(state.mode.switches);
  }
  Object.keys(state.lists).forEach(function (key) {
    const list = state.lists[key];
    context[key] = String(list.items.length);
    context[key + "_capacity"] = String(list.capacity);
    context[key + "_taken"] = list.taken === null ? UI_TEXT.none : list.taken;
    context[key + "_items"] = list.items.length ? list.items.join(", ") : UI_TEXT.listEmpty;
  });
  context.output = state.output.length ? state.output.join(" ") : UI_TEXT.outputEmpty;
  Object.keys(state.boards).forEach(function (id) {
    const counts = boardCounts(state.boards[id]);
    Object.keys(counts).forEach(function (key) { context[id + "_" + key] = counts[key]; });
  });
  context.spins = String(state.spins);
  return context;
}

function snapshotOf(state, step) {
  const context = fillContext(state);
  return {
    actor: step.actor || null,
    line: step.line || null,
    spinning: state.spinning,
    narration: fill(step.narration, context),
    note: step.note ? fill(step.note, context) : null,
    context: context,
    shared: state.shared,
    registers: state.registers,
    lists: state.lists,
    output: state.output,
    semaphores: state.semaphores,
    states: state.states,
    lines: state.lines,
    regions: state.regions,
    mode: state.mode,
    boards: state.boards,
    spins: state.spins
  };
}

function changedKeys(before, after) {
  const changed = {};
  Object.keys(after).forEach(function (key) {
    if (before[key] !== after[key]) changed[key] = true;
  });
  return changed;
}

function markOne(snapshot, previous) {
  snapshot.changedShared = changedKeys(previous.shared, snapshot.shared);
  snapshot.changedRegisters = changedKeys(previous.registers, snapshot.registers);
  snapshot.changedSemaphores = {};
  snapshot.freshInQueue = {};
  Object.keys(snapshot.semaphores).forEach(function (key) {
    const after = snapshot.semaphores[key];
    const before = previous.semaphores[key];
    if (before.value !== after.value || before.queue.join() !== after.queue.join()) {
      snapshot.changedSemaphores[key] = true;
    }
    after.queue.forEach(function (id) { if (before.queue.indexOf(id) === -1) snapshot.freshInQueue[id] = true; });
  });
  snapshot.changedLists = {};
  Object.keys(snapshot.lists).forEach(function (key) {
    if (previous.lists[key].items.join() !== snapshot.lists[key].items.join()) snapshot.changedLists[key] = true;
  });
  snapshot.freshOutput = snapshot.output.length - previous.output.length;
  snapshot.changedMode = snapshot.mode ? changedKeys(previous.mode, snapshot.mode) : {};
  snapshot.changedRegions = {};
  Object.keys(snapshot.regions).forEach(function (key) {
    const before = previous.regions[key];
    if (!before || before.join() !== snapshot.regions[key].join()) snapshot.changedRegions[key] = true;
  });
  snapshot.freshUnits = {};
  Object.keys(snapshot.boards).forEach(function (id) {
    snapshot.freshUnits[id] = snapshot.boards[id].units - previous.boards[id].units;
  });
}

function markChanges(snapshots, baseline) {
  snapshots.forEach(function (snapshot, index) {
    markOne(snapshot, index === 0 ? baseline : snapshots[index - 1]);
  });
  return snapshots;
}

function buildSnapshots(example) {
  const baseline = initialState(example);
  let state = baseline;
  const snapshots = example.steps.map(function (step, index) {
    state = cloneState(state);
    applyStep(state, step, example);
    const snapshot = snapshotOf(state, step);
    snapshot.last = index === example.steps.length - 1;
    return snapshot;
  });
  return markChanges(snapshots, baseline);
}

function buildTree(example) {
  const tree = example.tree;
  const ids = example.processes.map(function (item) { return item.id; });
  const totalMoves = ids.reduce(function (sum, id) { return sum + tree.moves[id].length; }, 0);
  const nodes = [];
  const leaves = [];

  function build(state, depth, counts, step) {
    const snapshot = snapshotOf(state, step);
    snapshot.last = depth === totalMoves;
    const node = { snapshot: snapshot, depth: depth, children: {}, available: {} };
    nodes.push(node);
    if (snapshot.last) { leaves.push(node); return node; }
    ids.forEach(function (id) {
      const done = counts[id];
      node.available[id] = done < tree.moves[id].length;
      if (!node.available[id]) return;
      const move = tree.moves[id][done];
      const next = cloneState(state);
      const nextStep = { actor: id, line: move.line, narration: move.narration, ops: move.ops };
      applyStep(next, nextStep, example);
      const nextCounts = copy(counts);
      nextCounts[id] = done + 1;
      node.children[id] = build(next, depth + 1, nextCounts, nextStep);
    });
    return node;
  }

  const start = initialState(example);
  const counts = {};
  ids.forEach(function (id) { counts[id] = 0; });
  const root = build(start, 0, counts, { narration: tree.root.narration, note: tree.root.note });

  const primary = example.shared[0].key;
  const finals = {};
  leaves.forEach(function (leaf) {
    const key = String(leaf.snapshot.shared[primary]);
    finals[key] = (finals[key] || 0) + 1;
  });
  leaves.forEach(function (leaf) {
    const key = String(leaf.snapshot.shared[primary]);
    const context = copy(leaf.snapshot.context);
    context.orders = String(finals[key]);
    leaf.snapshot.note = tree.leafNotes[key] ? fill(tree.leafNotes[key], context) : null;
    leaf.snapshot.context = context;
  });
  markOne(root.snapshot, cloneState(start));
  (function markBranch(node) {
    Object.keys(node.children).forEach(function (id) {
      const child = node.children[id];
      markOne(child.snapshot, node.snapshot);
      markBranch(child);
    });
  })(root);
  return { root: root, nodes: nodes, leaves: leaves, finals: finals, depth: totalMoves };
}

const OP_TARGETS = {
  "reg.read": { reg: "registers", from: "shared" },
  "reg.add": { reg: "registers" },
  "shared.write": { name: "shared", reg: "registers" },
  "shared.set": { name: "shared" },
  "reset": {},
  "region.set": {},
  "sem.wait": { name: "semaphores" },
  "sem.signal": { name: "semaphores" },
  "lock.testAndSet": { name: "shared" },
  "mode.set": {},
  "flag.set": {},
  "interrupt.raise": {},
  "interrupt.service": {},
  "time.advance": { board: "boards" },
  "state.set": { process: "processes" },
  "list.push": { name: "lists" },
  "list.take": { name: "lists" },
  "list.fill": { name: "lists" },
  "output.print": {},
  "sem.set": { name: "semaphores" }
};

function boardCounts(board) {
  const counts = { units: String(board.units), spin: String(board.spin), overhead: String(board.overhead) };
  const kinds = Object.keys(STATES).concat(Object.keys(LANE_KINDS));
  Object.keys(board.lanes).forEach(function (pid) {
    kinds.forEach(function (kind) { counts[pid + "_" + kind] = "0"; });
    board.lanes[pid].forEach(function (segment) {
      const key = pid + "_" + segment.kind;
      counts[key] = String(Number(counts[key]) + segment.units);
    });
  });
  return counts;
}

function unresolved(text) {
  return /\{\w+\}/.test(text);
}

function unbalanced(text) {
  const stars = (text.match(/\*/g) || []).length;
  const opens = (text.match(/\[\[/g) || []).length;
  const closes = (text.match(/\]\]/g) || []).length;
  return stars % 2 !== 0 || opens !== closes;
}

function declaredNames(example) {
  const names = { registers: {}, shared: {}, semaphores: {}, boards: {}, processes: {}, lists: {} };
  (example.processes || []).forEach(function (item) {
    names.processes[item.id] = true;
    if (item.register) names.registers[item.register.key] = true;
  });
  (example.shared || []).forEach(function (item) {
    if (item.kind === "list") names.lists[item.key] = true;
    else names.shared[item.key] = true;
  });
  (example.semaphores || []).forEach(function (item) { names.semaphores[item.key] = true; });
  (example.boards || []).forEach(function (board) { names.boards[board.id] = true; });
  return names;
}

function verifyOp(op, label, example, names, problems, step) {
  const targets = OP_TARGETS[op.op];
  if (!targets) { problems.push(label + " usa la operación " + op.op + ", que no existe"); return; }
  Object.keys(targets).forEach(function (field) {
    const kind = targets[field];
    if (!names[kind][op[field]]) problems.push(label + ": la operación " + op.op + " apunta a " + op[field] + ", que el ejemplo no declara");
  });
  if (op.op === "state.set" && example.processes && !STATES[op.value]) {
    problems.push(label + " pone a " + op.process + " en " + op.value + ", que no es un estado de proceso");
  }
  if (op.op === "sem.set" && step.actor) {
    problems.push(label + " le pone un valor a un semáforo desde un paso que ejecuta un proceso: eso sólo vale para un salto narrado");
  }
  if (op.op === "reset") {
    if ((example.semaphores || []).length) problems.push(label + " reinicia, y el ejemplo tiene semáforos que reiniciar no toca");
    if (example.mode) problems.push(label + " reinicia, y el ejemplo tiene modo que reiniciar no toca");
    if ((example.boards || []).length) problems.push(label + " reinicia, y el ejemplo tiene carriles que reiniciar no toca");
  }
  if (op.op !== "time.advance") return;
  (example.laneProcesses || []).forEach(function (item) {
    if (!op.states[item.id]) problems.push(label + ": la operación no dice en qué estado queda " + item.id);
  });
  (op.spin || []).forEach(function (id) {
    if (!op.states[id]) problems.push(label + ": la operación dice que " + id + " está en busy-wait y no le da estado");
  });
}

function verifyRegisterReads(example, snapshots, problems) {
  const baseline = initialState(example);
  example.steps.forEach(function (step, index) {
    const before = index === 0 ? baseline : snapshots[index - 1];
    const loaded = {};
    Object.keys(before.registers).forEach(function (key) { loaded[key] = before.registers[key] !== null; });
    (step.ops || []).forEach(function (op) {
      const label = "paso " + (index + 1);
      if (op.op === "reg.read") { loaded[op.reg] = true; return; }
      if (op.op === "reset") { Object.keys(loaded).forEach(function (key) { loaded[key] = false; }); return; }
      if (op.op === "reg.add" && !loaded[op.reg]) problems.push(label + " le suma a " + op.reg + ", que está vacío");
      if (op.op === "shared.write" && !loaded[op.reg]) problems.push(label + " escribe " + op.name + " desde " + op.reg + ", que está vacío");
    });
  });
}

function verifyContextKeys(example, problems) {
  const seen = {};
  const claim = function (key, owner) {
    if (seen[key]) problems.push("la clave {" + key + "} la reclaman " + seen[key] + " y " + owner);
    seen[key] = owner;
  };
  (example.shared || []).forEach(function (item) {
    claim(item.key, "la variable " + item.name);
    if (item.kind !== "list") return;
    claim(item.key + "_capacity", "la lista " + item.name);
    claim(item.key + "_taken", "la lista " + item.name);
    claim(item.key + "_items", "la lista " + item.name);
  });
  if (example.output) claim("output", "el panel de salida");
  (example.processes || []).forEach(function (item) {
    if (item.register) claim(item.register.key, "el registro " + item.register.name);
  });
  (example.semaphores || []).forEach(function (item) {
    claim(item.key, "el semáforo " + item.name);
    claim(item.key + "_count", "el semáforo " + item.name);
    claim(item.key + "_queue", "el semáforo " + item.name);
  });
  (example.boards || []).forEach(function (board) {
    claim(board.id + "_units", "el tablero " + board.id);
    claim(board.id + "_spin", "el tablero " + board.id);
    claim(board.id + "_overhead", "el tablero " + board.id);
  });
  if (example.mode) { claim("mode", "el panel de modo"); claim("flag", "el panel de modo"); claim("switches", "el panel de modo"); }
  claim("spins", "el contador de busy-wait");
}

function collectTexts(example, snapshots) {
  const texts = [];
  snapshots.forEach(function (snapshot, index) {
    texts.push({ where: "paso " + (index + 1) + " narración", text: snapshot.narration });
    if (snapshot.note) texts.push({ where: "paso " + (index + 1) + " nota", text: snapshot.note });
  });
  const last = snapshots[snapshots.length - 1].context;
  texts.push({ where: "frase de cierre", text: fill(example.closing, last) });
  if (example.stepUnitNote) texts.push({ where: "nota de unidad", text: fill(example.stepUnitNote, last) });
  if (example.compare) {
    example.compare.headers.forEach(function (text, column) {
      texts.push({ where: "encabezado " + (column + 1) + " de la tabla", text: fill(text, last) });
    });
    example.compare.rows.forEach(function (row, index) {
      row.forEach(function (text, column) {
        texts.push({ where: "celda " + (index + 1) + "," + (column + 1) + " de la tabla", text: fill(text, last) });
      });
    });
  }
  (example.boards || []).forEach(function (board) {
    snapshots.forEach(function (snapshot, index) {
      texts.push({ where: "contador de " + board.id + " en el paso " + (index + 1), text: fill(board.counter, boardCounts(snapshot.boards[board.id])) });
    });
  });
  return texts;
}

function verifyStructure(example, problems) {
  const panels = example.canvas.panels.concat(example.canvas.wide || []);
  panels.forEach(function (id) {
    if (!UI_TEXT.panels[id]) problems.push("el canvas declara el panel " + id + ", que no existe");
    if (!PANEL_TIPS[id]) problems.push("el panel " + id + " no tiene globito");
  });
  (example.processes || []).forEach(function (item) {
    if (!PROGRAMS[item.program]) problems.push(item.id + " apunta al programa " + item.program + ", que no existe");
  });
  (example.semaphores || []).forEach(function (item) {
    if (item.value < 0) problems.push("el semáforo " + item.name + " arranca en " + item.value + ", que es negativo");
  });
  if (!example.group) problems.push("no declara a qué grupo pertenece");
  else if (!UI_TEXT.groups[example.group]) problems.push("dice ser del grupo " + example.group + ", que no tiene nombre");
  if (!example.stepUnit) problems.push("no declara la unidad del paso");
  if (!example.closing) problems.push("no tiene frase de cierre");
  if (example.definition && !DEFINITIONS[example.definition]) {
    problems.push("apunta a la definición " + example.definition + ", que no existe");
  }
  if (example.sharedProgram) {
    if (!PROGRAMS[example.sharedProgram]) problems.push("muestra el listado " + example.sharedProgram + ", que no existe");
    const shown = (example.processes || []).map(function (item) { return item.program; });
    if (shown.filter(function (key) { return key !== shown[0]; }).length) {
      problems.push("muestra un solo listado y sus procesos no corren el mismo programa");
    }
    if (shown.length && shown[0] !== example.sharedProgram) {
      problems.push("muestra un listado que no es el programa que corren sus procesos");
    }
  }
  (example.processes || []).forEach(function (item) {
    let previous = null;
    programLines(item.program).forEach(function (line, index) {
      if (line.role === "expansion" && previous !== "gloss" && previous !== "expansion") {
        problems.push("la línea " + (index + 1) + " de " + item.program + " expande a la de arriba, que no es una línea glosada");
      }
      previous = line.role;
    });
  });
  (example.shared || []).forEach(function (item) {
    if (item.kind !== "list") return;
    if (!item.capacity || item.capacity < 1) problems.push("la lista " + item.name + " no declara cuántas tareas le caben");
    if ((item.fill || 0) > item.capacity) problems.push("la lista " + item.name + " arranca con más tareas de las que le caben");
  });
  if (panels.indexOf("output") !== -1 && !example.output) problems.push("muestra el panel de salida y no declara sus textos");
  const printsHere = example.steps && example.steps.some(function (step) {
    return (step.ops || []).some(function (op) { return op.op === "output.print"; });
  });
  if (printsHere && panels.indexOf("output") === -1) problems.push("imprime y no muestra el panel de salida");
  if (!printsHere && panels.indexOf("output") !== -1) problems.push("muestra el panel de salida y nunca imprime");
  Object.keys(example.panelNotes || {}).forEach(function (id) {
    if (panels.indexOf(id) === -1) problems.push("hay una aclaración para el panel " + id + ", que este ejemplo no muestra");
  });
  const names = declaredNames(example);
  Object.keys(example.guards || {}).forEach(function (id) {
    const item = processById(example, id);
    if (!item) { problems.push("hay una condición de espera para " + id + ", que no es un proceso"); return; }
    const lines = programLines(item.program);
    Object.keys(example.guards[id]).forEach(function (number) {
      const line = lines[Number(number) - 1];
      if (!line || !EXECUTABLE[line.role]) problems.push("la condición de espera de " + id + " apunta a la línea " + number + ", que no es ejecutable");
      example.guards[id][number].forEach(function (clause) {
        if (!names.shared[clause.key]) problems.push("la condición de espera de " + id + " lee " + clause.key + ", que no es una variable compartida");
      });
    });
  });
  verifyContextKeys(example, problems);
  Object.keys(example.regions || {}).forEach(function (id) {
    const item = processById(example, id);
    if (!item) { problems.push("hay una región dibujada sobre " + id + ", que no es un proceso"); return; }
    const lines = programLines(item.program);
    example.regions[id].forEach(function (number) {
      if (!lines[number - 1] || !EXECUTABLE[lines[number - 1].role]) {
        problems.push("la región de " + id + " llega a la línea " + number + ", que no es ejecutable");
      }
    });
  });
}

function verifyLine(example, problems, label, actor, number) {
  const item = processById(example, actor);
  if (!item) { problems.push(label + " ejecuta " + actor + ", que no es un proceso"); return; }
  const line = programLines(item.program)[number - 1];
  if (!line) problems.push(label + " apunta a la línea " + number + ", que no existe en " + item.program);
  else if (!EXECUTABLE[line.role]) problems.push(label + " apunta a la línea " + number + ", que no es ejecutable");
}

function verifySteps(example, problems) {
  const names = declaredNames(example);
  example.steps.forEach(function (step, index) {
    const label = "paso " + (index + 1);
    if (!step.narration) problems.push(label + " no tiene narración");
    if (step.line && !step.actor) problems.push(label + " tiene línea pero no dice qué proceso ejecuta");
    (step.ops || []).forEach(function (op) { verifyOp(op, label, example, names, problems, step); });
    if (!step.line) return;
    verifyLine(example, problems, label, step.actor, step.line);
  });
}

function verifySnapshots(example, snapshots, problems) {
  const hasSemaphores = (example.semaphores || []).length > 0;
  snapshots.forEach(function (snapshot, index) {
    const label = "paso " + (index + 1);
    Object.keys(snapshot.states).forEach(function (id) {
      const value = snapshot.states[id];
      if (!STATES[value] && !LANE_KINDS[value]) problems.push(label + " pone a " + id + " en " + value + ", que no está en STATES");
    });
    Object.keys(snapshot.semaphores).forEach(function (key) {
      const semaphore = snapshot.semaphores[key];
      const expected = semaphore.value < 0 ? -semaphore.value : 0;
      if (semaphore.queue.length !== expected) {
        problems.push(label + ": " + key + " vale " + semaphore.value + " y tiene " + semaphore.queue.length + " en la cola");
      }
    });
    if (hasSemaphores && example.processes) {
      const blocked = blockedProcesses(snapshot);
      example.processes.forEach(function (item) {
        const inQueue = blocked[item.id] === true;
        const isBlocked = snapshot.states[item.id] === "BLOCKED";
        if (inQueue !== isBlocked) problems.push(label + ": " + item.id + " está en BLOCKED sin estar en ninguna cola, o al revés");
      });
    }
    Object.keys(snapshot.boards).forEach(function (id) {
      const board = snapshot.boards[id];
      const sum = function (list) { return list.reduce(function (total, segment) { return total + segment.units; }, 0); };
      if (sum(board.cpu) !== board.units) problems.push(label + ": el carril de CPU de " + id + " no suma " + board.units);
      Object.keys(board.lanes).forEach(function (pid) {
        if (sum(board.lanes[pid]) !== board.units) problems.push(label + ": el carril de " + pid + " en " + id + " no suma " + board.units);
      });
    });
  });

  example.steps.forEach(function (step, index) {
    if (!step.actor || !step.line) return;
    const later = example.steps.slice(index + 1).filter(function (other) { return other.actor === step.actor; })[0];
    if (snapshots[index].spinning && later && later.line !== step.line) {
      problems.push("paso " + (index + 1) + ": " + step.actor + " está en busy-wait y su próximo paso cambia de línea");
    }
    if (snapshots[index].spinning || !later || later.line !== step.line) return;
    const item = processById(example, step.actor);
    const line = item ? programLines(item.program)[step.line - 1] : null;
    if (!line || line.role !== "section") {
      problems.push("paso " + (index + 1) + ": " + step.actor + " repite la línea " + step.line + " sin estar en busy-wait y sin que sea una sección");
    }
  });

  collectTexts(example, snapshots).forEach(function (item) {
    if (unresolved(item.text)) problems.push("quedó un dato sin completar en la " + item.where);
    if (unbalanced(item.text)) problems.push("quedó una marca sin cerrar en la " + item.where);
  });
  verifyRegisterReads(example, snapshots, problems);
}

function verifyFinalState(example, snapshots, problems) {
  const expected = example.expectedFinalState;
  if (!expected) return;
  const last = snapshots[snapshots.length - 1];
  Object.keys(expected.shared || {}).forEach(function (key) {
    if (last.shared[key] !== expected.shared[key]) problems.push("al final " + key + " vale " + last.shared[key] + " y se esperaba " + expected.shared[key]);
  });
  Object.keys(expected.registers || {}).forEach(function (key) {
    if (last.registers[key] !== expected.registers[key]) problems.push("al final " + key + " vale " + last.registers[key] + " y se esperaba " + expected.registers[key]);
  });
  Object.keys(expected.states || {}).forEach(function (id) {
    if (last.states[id] !== expected.states[id]) problems.push("al final " + id + " está en " + last.states[id] + " y se esperaba " + expected.states[id]);
  });
  Object.keys(expected.semaphores || {}).forEach(function (key) {
    const want = expected.semaphores[key];
    const got = last.semaphores[key];
    if (!got) { problems.push("se espera un valor final para " + key + ", que no es un semáforo del ejemplo"); return; }
    if (got.value !== want.value) problems.push("al final " + key + " vale " + got.value + " y se esperaba " + want.value);
    if (got.queue.join() !== want.queue.join()) problems.push("al final la cola de " + key + " tiene [" + got.queue.join(", ") + "] y se esperaba [" + want.queue.join(", ") + "]");
  });
  if (expected.output) {
    if (last.output.join(" ") !== expected.output.join(" ")) {
      problems.push("al final la salida dice [" + last.output.join(" ") + "] y se esperaba [" + expected.output.join(" ") + "]");
    }
  }
  Object.keys(expected.lists || {}).forEach(function (key) {
    const want = expected.lists[key];
    const got = last.lists[key];
    if (!got) { problems.push("se espera un estado final para " + key + ", que no es una lista del ejemplo"); return; }
    if (got.items.length !== want.count) problems.push("al final " + key + " tiene " + got.items.length + " tareas y se esperaban " + want.count);
    if (got.capacity !== want.capacity) problems.push("al final " + key + " tiene lugar para " + got.capacity + " y se esperaba " + want.capacity);
    if (want.items && got.items.join() !== want.items.join()) {
      problems.push("al final " + key + " tiene [" + got.items.join(", ") + "] y se esperaba [" + want.items.join(", ") + "]");
    }
  });
  Object.keys(expected.regions || {}).forEach(function (id) {
    if (!last.regions[id]) { problems.push("se espera una región final para " + id + ", que no tiene región"); return; }
    if (last.regions[id].join() !== expected.regions[id].join()) problems.push("al final la región de " + id + " no es la esperada");
  });
  if (expected.mode && !last.mode) problems.push("se espera un estado final de modo, y el ejemplo no tiene panel de modo");
  if (expected.mode && last.mode) {
    Object.keys(expected.mode).forEach(function (key) {
      if (last.mode[key] !== expected.mode[key]) problems.push("al final " + key + " vale " + last.mode[key] + " y se esperaba " + expected.mode[key]);
    });
  }
  if (expected.spins !== undefined && last.spins !== expected.spins) {
    problems.push("al final hubo " + last.spins + " pasos en busy-wait y se esperaban " + expected.spins);
  }
  Object.keys(expected.boards || {}).forEach(function (id) {
    if (!last.boards[id]) { problems.push("se espera un total para el tablero " + id + ", que no existe"); return; }
    Object.keys(expected.boards[id]).forEach(function (key) {
      if (last.boards[id][key] !== expected.boards[id][key]) {
        problems.push("al final " + key + " de " + id + " vale " + last.boards[id][key] + " y se esperaba " + expected.boards[id][key]);
      }
    });
  });
}

function verifyTreeMoves(example, tree, problems) {
  const names = declaredNames(example);
  Object.keys(example.tree.moves).forEach(function (id) {
    example.tree.moves[id].forEach(function (move, position) {
      const label = "la jugada " + (position + 1) + " de " + id;
      if (!move.narration) problems.push(label + " no tiene narración");
      verifyLine(example, problems, label, id, move.line);
      (move.ops || []).forEach(function (op) { verifyOp(op, label, example, names, problems, { actor: id }); });
    });
  });
  const strings = [
    { where: "etiqueta de los botones", text: fill(example.tree.pickLabel, { label: "P1" }) },
    { where: "etiqueta de los botones agotados", text: fill(example.tree.pickDone, { label: "P1" }) },
    { where: "narración de arranque", text: tree.root.snapshot.narration }
  ];
  if (tree.root.snapshot.note) strings.push({ where: "nota de arranque", text: tree.root.snapshot.note });
  Object.keys(tree.finals).forEach(function (key) {
    if (!example.tree.leafNotes[key]) problems.push("los órdenes que terminan en " + key + " no tienen nota de cierre");
  });
  tree.nodes.forEach(function (node) {
    strings.push({ where: "narración de un nodo", text: node.snapshot.narration });
    if (node.snapshot.note) strings.push({ where: "nota de un nodo", text: node.snapshot.note });
    Object.keys(node.snapshot.states).forEach(function (id) {
      const value = node.snapshot.states[id];
      if (!STATES[value] && !LANE_KINDS[value]) problems.push("un nodo pone a " + id + " en " + value + ", que no está en STATES");
    });
  });
  strings.forEach(function (item) {
    if (unresolved(item.text)) problems.push("quedó un dato sin completar en la " + item.where);
    if (unbalanced(item.text)) problems.push("quedó una marca sin cerrar en la " + item.where);
  });
}

function verifyTree(example, tree, problems) {
  verifyTreeMoves(example, tree, problems);
  const expected = example.expectedTree;
  if (!expected) return;
  if (tree.nodes.length !== expected.nodes) problems.push("el árbol tiene " + tree.nodes.length + " nodos y se esperaban " + expected.nodes);
  if (tree.leaves.length !== expected.leaves) problems.push("el árbol tiene " + tree.leaves.length + " hojas y se esperaban " + expected.leaves);
  Object.keys(expected.finals).forEach(function (key) {
    if (tree.finals[key] !== expected.finals[key]) {
      problems.push("terminan en " + key + " " + (tree.finals[key] || 0) + " órdenes y se esperaban " + expected.finals[key]);
    }
  });
  Object.keys(tree.finals).forEach(function (key) {
    if (expected.finals[key] === undefined) problems.push("el árbol llega a " + key + ", que no está declarado");
  });
}

function boardUnits(example) {
  const totals = {};
  (example.boards || []).forEach(function (board) { totals[board.id] = 0; });
  example.steps.forEach(function (step) {
    (step.ops || []).forEach(function (op) {
      if (op.op === "time.advance" && totals[op.board] !== undefined) totals[op.board] += op.units;
    });
  });
  return totals;
}

function buildVariant(example, label) {
  const problems = [];
  const built = buildOne(example);
  built.problems.forEach(function (problem) { problems.push(label ? label + ": " + problem : problem); });
  built.problems = problems;
  built.label = label;
  return built;
}

function buildExample(example) {
  const variants = example.variants || null;
  if (!variants) {
    const built = buildVariant(example, null);
    return { example: example, variants: [built], problems: built.problems };
  }
  const built = variants.map(function (variant) {
    const merged = Object.assign({}, example, variant);
    delete merged.variants;
    return buildVariant(merged, variant.variantLabel);
  });
  const problems = [];
  built.forEach(function (one) { one.problems.forEach(function (problem) { problems.push(problem); }); });
  if (variants.some(function (variant) { return !variant.variantLabel; })) problems.push("hay una variante sin nombre");
  if (variants.length < 2) problems.push("declara variantes y tiene menos de dos: el selector no se muestra");
  const labels = variants.map(function (variant) { return variant.variantLabel; });
  if (new Set(labels).size !== labels.length) problems.push("hay dos variantes con el mismo nombre");
  return { example: example, variants: built, problems: problems };
}

function buildOne(example) {
  const problems = [];
  verifyStructure(example, problems);
  if (example.mode === "tree") {
    const tree = buildTree(example);
    verifyTree(example, tree, problems);
    const context = tree.leaves[0].snapshot.context;
    [
      { where: "frase de cierre", text: fill(example.closing, context) },
      { where: "nota de unidad", text: fill(example.stepUnitNote || "", context) }
    ].forEach(function (item) {
      if (unresolved(item.text)) problems.push("quedó un dato sin completar en la " + item.where);
      if (unbalanced(item.text)) problems.push("quedó una marca sin cerrar en la " + item.where);
    });
    return { example: example, tree: tree, snapshots: null, maxUnits: 0, problems: problems };
  }
  verifySteps(example, problems);
  const snapshots = buildSnapshots(example);
  verifySnapshots(example, snapshots, problems);
  verifyFinalState(example, snapshots, problems);
  const totals = boardUnits(example);
  const maxUnits = Object.keys(totals).reduce(function (most, id) { return Math.max(most, totals[id]); }, 0);
  return { example: example, tree: null, snapshots: snapshots, maxUnits: maxUnits, problems: problems };
}

const BUILT_EXAMPLES = EXAMPLES.map(buildExample);

(function verifyGroupsAreContiguous() {
  const seen = [];
  EXAMPLES.forEach(function (example) {
    if (seen[seen.length - 1] === example.group) return;
    if (seen.indexOf(example.group) !== -1) {
      console.error("El grupo " + example.group + " aparece cortado en dos tramos de la escalera");
    }
    seen.push(example.group);
  });
})();

BUILT_EXAMPLES.forEach(function (built) {
  built.problems.forEach(function (problem) {
    console.error("Ejemplo " + built.example.number + ": " + problem);
  });
});

</script>

<script id="ui">
const dom = {
  exampleList: document.getElementById("exampleList"),
  choiceRow: document.getElementById("choiceRow"),
  choiceLabel: document.getElementById("choiceLabel"),
  choiceBar: document.getElementById("choiceBar"),
  narration: document.getElementById("narrationPanel"),
  main: document.getElementById("main"),
  title: document.getElementById("exampleTitle"),
  subtitle: document.getElementById("exampleSubtitle"),
  stepUnit: document.getElementById("stepUnit"),
  progress: document.getElementById("progress"),
  progressFill: document.getElementById("progressFill"),
  first: document.getElementById("firstStep"),
  prev: document.getElementById("prevStep"),
  next: document.getElementById("nextStep"),
  last: document.getElementById("lastStep"),
  play: document.getElementById("playPause"),
  tooltip: document.getElementById("tooltip")
};

const AUTOPLAY_DELAY = 2800;
const LABEL_PADDING = 6;

const PANELS = {
  processes: renderProcesses,
  registers: renderRegisters,
  shared: renderShared,
  mode: renderMode,
  semaphores: renderSemaphores,
  output: renderOutput,
  lanes: renderLanes
};

const panelRefs = {};
let canvasKey = "";

const view = { exampleIndex: 0, variantIndex: 0, stepIndex: 0, path: [], playing: false, timer: null };

function currentEntry() { return BUILT_EXAMPLES[view.exampleIndex]; }
function currentVariants() { return currentEntry().variants; }
function currentBuilt() { return currentVariants()[view.variantIndex]; }
function currentExample() { return currentBuilt().example; }
function isTree() { return currentBuilt().tree !== null; }

function treeNode() {
  let node = currentBuilt().tree.root;
  view.path.forEach(function (id) { node = node.children[id]; });
  return node;
}

function currentSnapshots() {
  if (!isTree()) return currentBuilt().snapshots;
  const list = [];
  let node = currentBuilt().tree.root;
  list.push(node.snapshot);
  view.path.forEach(function (id) {
    node = node.children[id];
    list.push(node.snapshot);
  });
  return list;
}

function totalSteps() {
  return isTree() ? currentBuilt().tree.depth + 1 : currentBuilt().snapshots.length;
}

function currentSnapshot() {
  const list = currentSnapshots();
  return isTree() ? list[list.length - 1] : list[view.stepIndex];
}

function currentIndex() { return isTree() ? view.path.length : view.stepIndex; }

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function renderRich(target, text) {
  target.textContent = "";
  const pattern = /\[\[(\w+):([^\]]+)\]\]|\*([^*]+)\*/g;
  let cursor = 0;
  let match = pattern.exec(text);
  while (match) {
    if (match.index > cursor) target.appendChild(document.createTextNode(text.slice(cursor, match.index)));
    if (match[1]) {
      const button = element("button", "tip", match[2]);
      button.type = "button";
      button.dataset.tip = match[1];
      target.appendChild(button);
    } else {
      target.appendChild(element("strong", null, match[3]));
    }
    cursor = match.index + match[0].length;
    match = pattern.exec(text);
  }
  if (cursor < text.length) target.appendChild(document.createTextNode(text.slice(cursor)));
  return target;
}

function buildPanel(id, example) {
  const refs = { body: element("div", "panel-body") };
  const section = element("section", "panel " + id);
  const heading = element("h2");
  const title = element("button", "tip", UI_TEXT.panels[id]);
  title.type = "button";
  title.dataset.tip = "panel:" + id;
  heading.appendChild(title);
  const note = (example.panelNotes || {})[id];
  if (note) heading.appendChild(element("span", "panel-note", note));
  section.appendChild(heading);
  section.appendChild(refs.body);
  refs.section = section;
  return refs;
}

function canvasPanels(example) {
  return example.canvas.panels.concat(example.canvas.wide || []);
}

function buildCanvas(example) {
  const canvas = example.canvas;
  const wide = canvas.wide || [];
  const key = example.number + "|" + canvas.columns + "|" + canvas.panels.join(",") + "|" + wide.join(",");
  if (key === canvasKey) return;
  canvasKey = key;
  Object.keys(panelRefs).forEach(function (id) { delete panelRefs[id]; });
  const fresh = element("main", wide.length > 0 ? "has-wide" : null);
  fresh.id = "main";
  fresh.style.gridTemplateColumns = canvas.columns;
  canvasPanels(example).forEach(function (id) {
    const refs = buildPanel(id, example);
    if (wide.indexOf(id) !== -1) refs.section.classList.add("wide");
    panelRefs[id] = refs;
    fresh.appendChild(refs.section);
  });
  dom.main.replaceWith(fresh);
  dom.main = fresh;
}

function renderExampleList() {
  dom.exampleList.textContent = "";
  let lastGroup = null;
  BUILT_EXAMPLES.forEach(function (built, index) {
    if (built.example.group !== lastGroup) {
      dom.exampleList.appendChild(element("span", "group-cap", UI_TEXT.groups[built.example.group]));
      lastGroup = built.example.group;
    }
    const button = element("button");
    button.type = "button";
    button.appendChild(element("span", "num", built.example.number));
    button.appendChild(element("span", "short", built.example.short));
    button.title = built.example.short + " · " + built.example.adds;
    button.disabled = built.problems.length > 0;
    button.setAttribute("aria-current", index === view.exampleIndex ? "true" : "false");
    button.addEventListener("click", function () { selectExample(index); });
    dom.exampleList.appendChild(button);
  });
}

function renderHeaderChoices() {
  const variants = currentVariants();
  if (variants.length < 2) { dom.choiceRow.hidden = true; return; }
  dom.choiceRow.hidden = false;
  dom.choiceLabel.textContent = UI_TEXT.variantLabel;
  dom.choiceBar.textContent = "";
  variants.forEach(function (variant, index) {
    const button = element("button", null, variant.label);
    button.type = "button";
    button.setAttribute("aria-pressed", index === view.variantIndex ? "true" : "false");
    button.addEventListener("click", function () { selectVariant(index); });
    dom.choiceBar.appendChild(button);
  });
}

function statePill(name) {
  const state = STATES[name];
  const pill = element("span", "state-pill", state.label);
  pill.style.color = state.color;
  pill.style.borderColor = state.color;
  pill.style.background = state.soft;
  pill.title = state.gloss;
  return pill;
}

function codeLine(line, mark, spinning) {
  const row = element("div", "code-line " + line.role);
  if (mark === "current") {
    row.classList.add("current");
    if (spinning) row.classList.add("spinning");
  }
  if (mark === "paused") row.classList.add("paused");
  const number = element("span", "num", line.number === null ? "" : line.number);
  if (line.number === null) number.setAttribute("aria-hidden", "true");
  row.appendChild(number);
  row.appendChild(element("span", "text", line.t));
  return row;
}

function sourceBlock(item, snapshot) {
  const source = element("div", "source");
  const lines = programLines(item.program);
  const region = snapshot.regions[item.id] || null;
  const current = snapshot.lines[item.id] || null;
  const acting = snapshot.actor === item.id;
  const spinning = acting && snapshot.spinning;
  let box = null;
  lines.forEach(function (line, index) {
    const number = index + 1;
    const inside = region && number >= region[0] && number <= region[1];
    if (inside && !box) {
      box = element("div", "region");
      if (snapshot.changedRegions[item.id]) box.classList.add("changed");
      box.appendChild(element("span", "region-tag", UI_TEXT.criticalTag));
      source.appendChild(box);
    }
    if (!inside) box = null;
    const mark = number === current ? (acting ? "current" : "paused") : null;
    const row = codeLine(line, mark, spinning);
    if (line.role === "expansion") {
      if (index === 0 || lines[index - 1].role !== "expansion") row.classList.add("first");
      if (index === lines.length - 1 || lines[index + 1].role !== "expansion") row.classList.add("last");
    }
    (inside ? box : source).appendChild(row);
  });
  return source;
}

function definitionBlock(key) {
  const definition = DEFINITIONS[key];
  const box = element("div", "definition");
  box.appendChild(element("span", "definition-tag", UI_TEXT.definitionTag));
  definition.lines.forEach(function (text) {
    const row = element("div", "code-line code");
    row.appendChild(element("span", "text", text));
    box.appendChild(row);
  });
  return box;
}

function pickRow(item, node) {
  const row = element("div", "pick-row");
  const example = currentExample();
  const available = node.available[item.id] === true;
  const label = available ? example.tree.pickLabel : example.tree.pickDone;
  const button = element("button", null, fill(label, { label: item.label }));
  button.type = "button";
  button.disabled = !available;
  button.addEventListener("click", function () { pickProcess(item.id); });
  row.appendChild(button);
  return row;
}

function markChip(item, snapshot, forLine) {
  const state = STATES[snapshot.states[item.id]];
  const chip = element("span", forLine ? "line-mark" : "mark-chip");
  chip.style.color = state.color;
  chip.style.borderColor = state.color;
  chip.style.background = state.soft;
  if (forLine) {
    chip.textContent = item.label;
    chip.title = item.label + " · " + state.label;
    return chip;
  }
  chip.appendChild(element("span", "who", item.label));
  chip.appendChild(element("span", "where", state.label));
  chip.title = item.gloss ? item.gloss + " · " + state.gloss : state.gloss;
  return chip;
}

function renderSharedSource(snapshot) {
  const example = currentExample();
  const refs = panelRefs.processes;
  refs.body.textContent = "";
  const marks = element("div", "marks-row");
  example.processes.forEach(function (item) { marks.appendChild(markChip(item, snapshot, false)); });
  refs.body.appendChild(marks);
  const source = element("div", "source");
  const lines = programLines(example.sharedProgram);
  lines.forEach(function (line, index) {
    const number = index + 1;
    const here = example.processes.filter(function (item) { return snapshot.lines[item.id] === number; });
    const acting = here.filter(function (item) { return item.id === snapshot.actor; }).length > 0;
    const row = codeLine(line, here.length ? (acting ? "current" : "paused") : null, false);
    if (here.length) {
      const badges = element("span", "line-marks");
      here.forEach(function (item) { badges.appendChild(markChip(item, snapshot, true)); });
      row.appendChild(badges);
    }
    source.appendChild(row);
  });
  refs.body.appendChild(source);
}

function renderProcesses(snapshot) {
  const example = currentExample();
  if (example.sharedProgram) { renderSharedSource(snapshot); return; }
  const refs = panelRefs.processes;
  refs.body.textContent = "";
  const grid = element("div", "processes-grid");
  grid.style.gridTemplateColumns = "repeat(" + example.processes.length + ", minmax(0, 1fr))";
  const node = isTree() ? treeNode() : null;
  example.processes.forEach(function (item) {
    const column = element("div", "process-col");
    if (node) column.appendChild(pickRow(item, node));
    const head = element("div", "process-head");
    head.appendChild(element("span", "name", item.label));
    if (item.gloss) head.appendChild(element("span", "gloss", item.gloss));
    if (snapshot.actor === item.id && snapshot.spinning) head.appendChild(element("span", "spin-chip", UI_TEXT.spinChip));
    head.appendChild(statePill(snapshot.states[item.id]));
    column.appendChild(head);
    column.appendChild(sourceBlock(item, snapshot));
    grid.appendChild(column);
  });
  refs.body.appendChild(grid);
  if (example.definition) refs.body.appendChild(definitionBlock(example.definition));
}

function valueRow(name, value, gloss, owner, changed) {
  const row = element("div", "value-row");
  if (changed) row.classList.add("changed");
  row.appendChild(element("span", "vname", name));
  if (owner) row.appendChild(element("span", "vowner", owner));
  row.appendChild(element("span", "vval", showValue(value)));
  if (gloss) row.appendChild(element("span", "vgloss", gloss));
  return row;
}

function renderRegisters(snapshot) {
  const refs = panelRefs.registers;
  refs.body.textContent = "";
  const list = element("div", "value-rows");
  currentExample().processes.forEach(function (item) {
    if (!item.register) return;
    const key = item.register.key;
    list.appendChild(valueRow(item.register.name, snapshot.registers[key], null, item.label, snapshot.changedRegisters[key]));
  });
  refs.body.appendChild(list);
}

function listBox(item, snapshot) {
  const state = snapshot.lists[item.key];
  const box = element("div", "list-box");
  if (snapshot.changedLists[item.key]) box.classList.add("changed");
  const head = element("div", "list-head");
  head.appendChild(element("span", "list-name", item.name));
  head.appendChild(element("span", "list-count", fill(UI_TEXT.listCount, {
    count: String(state.items.length),
    capacity: String(state.capacity)
  })));
  if (item.gloss) head.appendChild(element("span", "list-gloss", item.gloss));
  box.appendChild(head);
  const bar = element("div", "list-bar");
  bar.setAttribute("aria-hidden", "true");
  const slots = element("div", "list-slots");
  slots.style.gridTemplateColumns = "repeat(" + state.capacity + ", minmax(0, 1fr))";
  for (let n = 0; n < state.capacity; n += 1) {
    slots.appendChild(element("div", "list-slot" + (n < state.items.length ? " taken" : "")));
  }
  bar.appendChild(slots);
  const over = state.items.length - state.capacity;
  if (over > 0) {
    const extra = element("div", "list-extra");
    for (let n = 0; n < over; n += 1) extra.appendChild(element("div", "list-slot taken"));
    bar.appendChild(extra);
  }
  box.appendChild(bar);
  if (over > 0) box.appendChild(element("span", "list-note", fill(UI_TEXT.listOver, { over: String(over) })));
  if (state.items.length === 0) box.appendChild(element("span", "list-empty", UI_TEXT.listEmpty));
  else if (state.items.length <= 6) {
    const chips = element("div", "list-items");
    state.items.forEach(function (name) { chips.appendChild(element("span", "list-chip", name)); });
    box.appendChild(chips);
  }
  return box;
}

function renderShared(snapshot) {
  const refs = panelRefs.shared;
  refs.body.textContent = "";
  const rows = element("div", "value-rows");
  currentExample().shared.forEach(function (item) {
    if (item.kind === "list") rows.appendChild(listBox(item, snapshot));
    else rows.appendChild(valueRow(item.name, snapshot.shared[item.key], item.gloss, null, snapshot.changedShared[item.key]));
  });
  refs.body.appendChild(rows);
}

function renderOutput(snapshot) {
  const refs = panelRefs.output;
  const example = currentExample();
  refs.body.textContent = "";
  const box = element("div", "output-box");
  if (snapshot.output.length === 0) {
    box.appendChild(element("p", "output-empty", example.output.empty));
    refs.body.appendChild(box);
    return;
  }
  const line = element("div", "output-line");
  snapshot.output.forEach(function (text, index) {
    const chip = element("span", "output-chip", text);
    if (index >= snapshot.output.length - snapshot.freshOutput) chip.classList.add("fresh");
    line.appendChild(chip);
  });
  box.appendChild(line);
  box.appendChild(element("span", "output-run", fill(example.output.run, { run: snapshot.output.join("") })));
  refs.body.appendChild(box);
}

function renderMode(snapshot) {
  const refs = panelRefs.mode;
  refs.body.textContent = "";
  const list = element("div", "value-rows");
  const labels = UI_TEXT.modeLabels;
  const gloss = UI_TEXT.modeGloss;
  list.appendChild(valueRow(labels.mode, snapshot.mode.mode, gloss[snapshot.mode.mode], null, snapshot.changedMode.mode));
  list.appendChild(valueRow(labels.flag, snapshot.mode.flag, snapshot.mode.flag === 1 ? gloss.flagOn : gloss.flagOff, null, snapshot.changedMode.flag));
  list.appendChild(valueRow(labels.switches, snapshot.mode.switches, null, null, snapshot.changedMode.switches));
  refs.body.appendChild(list);
  if (!snapshot.mode.pending) return;
  const slot = element("div", "badge-slot");
  slot.appendChild(element("span", "badge", fill(UI_TEXT.pendingBadge, { flag: String(snapshot.mode.flag) })));
  refs.body.appendChild(slot);
}

function renderSemaphores(snapshot) {
  const refs = panelRefs.semaphores;
  refs.body.textContent = "";
  const list = element("div", "sem-list");
  currentExample().semaphores.forEach(function (item) {
    const semaphore = snapshot.semaphores[item.key];
    const box = element("div", "sem-box");
    if (snapshot.changedSemaphores[item.key]) box.classList.add("changed");
    const head = element("div", "sem-head");
    head.appendChild(element("span", "sem-name", item.name));
    head.appendChild(element("span", "sem-value", showValue(semaphore.value)));
    if (item.gloss) head.appendChild(element("span", "sem-gloss", item.gloss));
    box.appendChild(head);
    const queue = element("div", "sem-queue");
    queue.appendChild(element("span", "sem-queue-label", UI_TEXT.queueLabel));
    if (semaphore.queue.length === 0) {
      queue.appendChild(element("span", "queue-empty", UI_TEXT.queueEmpty));
    } else {
      semaphore.queue.forEach(function (id, position) {
        const chip = element("span", "queue-chip");
        if (snapshot.freshInQueue[id]) chip.classList.add("fresh");
        chip.appendChild(element("span", "ord", fill(UI_TEXT.queueOrder, { n: position + 1 })));
        chip.appendChild(element("span", null, id));
        queue.appendChild(chip);
      });
    }
    box.appendChild(queue);
    list.appendChild(box);
  });
  refs.body.appendChild(list);
}

function laneLabel(segment, isCpu) {
  const texts = UI_TEXT.lanes;
  if (LANE_KINDS[segment.kind]) return { full: LANE_KINDS[segment.kind], brief: LANE_KINDS[segment.kind] };
  if (isCpu) {
    return {
      full: fill(texts.kinds[segment.kind], { who: segment.who || "" }),
      brief: fill(texts.shortKinds[segment.kind], { who: segment.who || "" })
    };
  }
  if (segment.spinning) return { full: texts.stateKinds.spinning, brief: texts.shortStateKinds.spinning };
  const base = texts.stateKinds[segment.kind];
  return { full: base, brief: base };
}

function laneCells(grid, name, segments, isCpu, units, maxUnits, freshUnits) {
  grid.appendChild(element("span", "lane-name", name));
  let seen = 0;
  segments.forEach(function (segment) {
    const label = laneLabel(segment, isCpu);
    const box = element("div", "lane-seg " + segment.kind);
    if (!isCpu && segment.spinning) box.classList.add("spinning");
    box.style.gridColumn = "span " + segment.units;
    seen += segment.units;
    if (freshUnits > 0 && seen > units - freshUnits) box.classList.add("fresh");
    box.title = label.full;
    const text = element("span", "lane-label", label.full);
    text.dataset.full = label.full;
    text.dataset.brief = label.brief;
    box.appendChild(text);
    grid.appendChild(box);
  });
  if (units >= maxUnits) return;
  const rest = element("div", "lane-seg pending");
  rest.setAttribute("aria-hidden", "true");
  rest.style.gridColumn = "span " + (maxUnits - units);
  grid.appendChild(rest);
}

function boardHead(definition, board, freshUnits, isLater) {
  const head = element("div", "board-head" + (isLater ? " later" : ""));
  head.appendChild(element("h3", "board-name", definition.label));
  head.appendChild(element("span", "board-gloss", definition.gloss));
  const counter = element("span", "board-counter", fill(definition.counter, boardCounts(board)));
  if (freshUnits > 0) counter.classList.add("changed");
  head.appendChild(counter);
  return head;
}

function axisCells(grid, maxUnits) {
  grid.appendChild(element("span", "lane-name"));
  for (let mark = 1; mark <= maxUnits; mark += 1) {
    const cell = element("div", "axis-mark");
    cell.appendChild(element("span", null, String(mark)));
    grid.appendChild(cell);
  }
}

function renderLanes(snapshot) {
  const example = currentExample();
  const refs = panelRefs.lanes;
  const maxUnits = currentBuilt().maxUnits;
  refs.body.textContent = "";
  const grid = element("div", "lane-grid");
  grid.style.gridTemplateColumns = (example.laneNameWidth || "46px") + " repeat(" + maxUnits + ", minmax(0, 1fr))";
  example.boards.forEach(function (definition, position) {
    const board = snapshot.boards[definition.id];
    const fresh = snapshot.freshUnits[definition.id];
    grid.appendChild(boardHead(definition, board, fresh, position > 0));
    laneCells(grid, UI_TEXT.lanes.cpuLane, board.cpu, true, board.units, maxUnits, fresh);
    example.laneProcesses.forEach(function (item) {
      laneCells(grid, item.label, board.lanes[item.id], false, board.units, maxUnits, fresh);
    });
  });
  axisCells(grid, maxUnits);
  refs.body.appendChild(grid);
  const shown = {};
  example.boards.forEach(function (definition) {
    const board = snapshot.boards[definition.id];
    board.cpu.forEach(function (segment) { shown[segment.kind] = true; });
    Object.keys(board.lanes).forEach(function (pid) {
      board.lanes[pid].forEach(function (segment) {
        if (segment.spinning) shown.spin = true;
        else if (segment.kind === "RUNNING") shown.busy = true;
        else shown[segment.kind] = true;
      });
    });
  });
  const legend = element("div", "legend");
  UI_TEXT.lanes.legend.forEach(function (item) {
    if (!shown[item.kind]) return;
    const row = element("span", "item");
    row.appendChild(element("span", "swatch " + item.kind));
    row.appendChild(element("span", null, item.text));
    legend.appendChild(row);
  });
  refs.body.appendChild(legend);
  fitLaneLabels();
}

function fitLaneLabels() {
  const labels = document.querySelectorAll(".lane-label");
  Array.prototype.forEach.call(labels, function (label) {
    label.hidden = false;
    label.textContent = label.dataset.full;
    const room = label.parentNode.clientWidth - LABEL_PADDING;
    if (label.scrollWidth <= room) return;
    label.textContent = label.dataset.brief;
    if (label.scrollWidth <= room) return;
    label.hidden = true;
  });
}

function takeawayBlock(text) {
  const box = element("div", "takeaway");
  box.appendChild(element("span", "tag", UI_TEXT.takeawayTag));
  renderRich(box.appendChild(element("span", "line")), text);
  return box;
}

function compareBlock(compare, context) {
  const wrapper = element("div", "compare");
  const table = element("table");
  const head = element("tr");
  compare.headers.forEach(function (text) {
    renderRich(head.appendChild(element("th")), fill(text, context));
  });
  table.appendChild(head);
  compare.rows.forEach(function (cells) {
    const row = element("tr");
    cells.forEach(function (text, column) {
      renderRich(row.appendChild(element("td", column === 0 ? "label" : null)), fill(text, context));
    });
    table.appendChild(row);
  });
  wrapper.appendChild(table);
  return wrapper;
}

function renderNarration(snapshot) {
  const example = currentExample();
  dom.narration.textContent = "";
  dom.narration.classList.toggle("with-extras", snapshot.last === true);
  dom.narration.classList.toggle("no-compare", snapshot.last === true && !example.compare);
  const main = element("div", "narration-main");
  renderRich(main.appendChild(element("p", "narration-text")), snapshot.narration);
  if (snapshot.note) renderRich(main.appendChild(element("p", "narration-note")), snapshot.note);
  if (currentIndex() === 0 && example.stepUnitNote) {
    renderRich(main.appendChild(element("p", "narration-note")), example.stepUnitNote);
  }
  dom.narration.appendChild(main);
  if (!snapshot.last) return;
  if (example.compare) {
    const table = compareBlock(example.compare, snapshot.context);
    table.classList.add("full");
    dom.narration.appendChild(table);
  }
  const extras = element("div", "narration-extras");
  extras.appendChild(takeawayBlock(fill(example.closing, snapshot.context)));
  dom.narration.appendChild(extras);
}

function render() {
  const example = currentExample();
  const snapshot = currentSnapshot();
  const total = totalSteps();
  const index = currentIndex();
  buildCanvas(example);
  dom.title.textContent = example.number + ". " + example.title;
  dom.subtitle.textContent = example.subtitle;
  dom.stepUnit.textContent = example.stepUnit;
  renderHeaderChoices();
  canvasPanels(example).forEach(function (id) { PANELS[id](snapshot); });
  renderNarration(snapshot);
  dom.progress.textContent = fill(UI_TEXT.progress, { current: index + 1, total: total });
  dom.progressFill.style.transform = "scaleX(" + ((index + 1) / total) + ")";
  dom.first.disabled = index === 0;
  dom.prev.disabled = index === 0;
  dom.next.disabled = isTree() || index === total - 1;
  dom.last.disabled = isTree() || index === total - 1;
  dom.play.disabled = isTree();
  dom.play.textContent = view.playing ? UI_TEXT.pause : UI_TEXT.play;
  Array.prototype.forEach.call(dom.exampleList.querySelectorAll("button"), function (button, position) {
    button.setAttribute("aria-current", position === view.exampleIndex ? "true" : "false");
  });
}

function goTo(index) {
  if (isTree()) {
    view.path = view.path.slice(0, Math.max(0, Math.min(index, view.path.length)));
    render();
    return;
  }
  const total = currentSnapshots().length;
  view.stepIndex = Math.max(0, Math.min(index, total - 1));
  render();
  if (view.playing && view.stepIndex === total - 1) stopPlaying();
}

function pickProcess(id) {
  const node = treeNode();
  if (!node.children[id]) return;
  view.path = view.path.concat([id]);
  render();
}

function selectExample(index) {
  stopPlaying();
  view.exampleIndex = index;
  view.variantIndex = 0;
  view.stepIndex = 0;
  view.path = [];
  render();
}

function selectVariant(index) {
  stopPlaying();
  view.variantIndex = index;
  view.stepIndex = 0;
  view.path = [];
  render();
}

function stopPlaying() {
  view.playing = false;
  if (view.timer) { clearTimeout(view.timer); view.timer = null; }
  dom.play.textContent = UI_TEXT.play;
}

function scheduleTick() {
  if (view.timer) clearTimeout(view.timer);
  view.timer = setTimeout(function () {
    if (!view.playing) return;
    if (view.stepIndex >= currentSnapshots().length - 1) { stopPlaying(); render(); return; }
    goTo(view.stepIndex + 1);
    if (view.playing) scheduleTick();
  }, AUTOPLAY_DELAY);
}

function startPlaying() {
  view.playing = true;
  scheduleTick();
  render();
}

function togglePlaying() {
  if (isTree()) return;
  if (view.playing) { stopPlaying(); render(); return; }
  startPlaying();
}

function lookupTooltip(key) {
  if (key.indexOf("panel:") === 0) return PANEL_TIPS[key.slice(6)];
  return TOOLTIPS[key];
}

function showTooltip(trigger, tip) {
  dom.tooltip.textContent = "";
  dom.tooltip.appendChild(element("strong", "tip-title", tip.title));
  dom.tooltip.appendChild(document.createTextNode(tip.body));
  dom.tooltip.classList.add("open");
  const box = trigger.getBoundingClientRect();
  const width = dom.tooltip.offsetWidth;
  const height = dom.tooltip.offsetHeight;
  let left = box.left + box.width / 2 - width / 2;
  left = Math.min(left, window.innerWidth - width - 8);
  let top = box.top - height - 8;
  if (top < 8) top = box.bottom + 8;
  dom.tooltip.style.left = Math.max(8, left) + "px";
  dom.tooltip.style.top = top + "px";
}

function hideTooltip() { dom.tooltip.classList.remove("open"); }

function closestElement(target, selector) {
  return target && typeof target.closest === "function" ? target.closest(selector) : null;
}

["mouseover", "focusin"].forEach(function (name) {
  document.addEventListener(name, function (event) {
    const trigger = closestElement(event.target, "[data-tip]");
    const tip = trigger ? lookupTooltip(trigger.dataset.tip) : null;
    if (tip) showTooltip(trigger, tip);
    else hideTooltip();
  });
});

["mouseout", "focusout", "scroll"].forEach(function (name) {
  document.addEventListener(name, hideTooltip, true);
});

dom.first.addEventListener("click", function () { stopPlaying(); goTo(0); });
dom.prev.addEventListener("click", function () { stopPlaying(); goTo(currentIndex() - 1); });
dom.next.addEventListener("click", function () { stopPlaying(); goTo(currentIndex() + 1); });
dom.last.addEventListener("click", function () { stopPlaying(); goTo(totalSteps() - 1); });
dom.play.addEventListener("click", togglePlaying);

document.addEventListener("keydown", function (event) {
  if (event.key === "ArrowRight" && !isTree()) { stopPlaying(); goTo(currentIndex() + 1); event.preventDefault(); }
  if (event.key === "ArrowLeft") { stopPlaying(); goTo(currentIndex() - 1); event.preventDefault(); }
  if (event.key === "Home") { stopPlaying(); goTo(0); event.preventDefault(); }
  if (event.key === "End" && !isTree()) { stopPlaying(); goTo(totalSteps() - 1); event.preventDefault(); }
  if (event.key === "Escape") hideTooltip();
});

window.addEventListener("resize", fitLaneLabels);

dom.first.textContent = UI_TEXT.firstStep;
dom.prev.textContent = UI_TEXT.prevStep;
dom.next.textContent = UI_TEXT.nextStep;
dom.last.textContent = UI_TEXT.lastStep;
dom.play.textContent = UI_TEXT.play;

Object.keys(UI_TEXT.panels).forEach(function (id) {
  if (!PANELS[id]) console.error("El panel " + id + " tiene nombre pero no tiene dibujo");
});

Object.keys(PANELS).forEach(function (id) {
  if (!UI_TEXT.panels[id]) console.error("El panel " + id + " tiene dibujo pero no tiene nombre");
});

renderExampleList();
render();
</script>

</body>
