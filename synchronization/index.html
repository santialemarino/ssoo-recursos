<title>Sincronización</title>
<style>
  :root {
    --ink: #10151d;
    --ink-soft: #35404f;
    --muted: #5f6877;
    --faint: #6b7484;
    --line: #e3e7ee;
    --line-strong: #c6ccd8;
    --page: #edf0f6;
    --card: #ffffff;

    --running: #1d4ed8;
    --running-soft: #e8eefc;
    --ready: #1a7a3f;
    --ready-soft: #e6f4ec;
    --blocked: #c0392f;
    --blocked-soft: #fbeae8;

    --marked: #1c2534;
    --marked-soft: #e3e8f1;
    --region-fill: #fbfcfe;
    --region-fill-alt: #f2f5f9;
    --spin-fill: repeating-linear-gradient(135deg, #e8eefc 0 5px, #cdddfb 5px 10px);

    --radius: 11px;
    --shadow: 0 1px 2px rgba(16, 21, 29, 0.05), 0 1px 8px rgba(16, 21, 29, 0.04);
    --fast: 160ms;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html, body { margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    color: var(--ink);
    background: var(--page);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 10px 14px 12px;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { margin: 0; font-weight: 640; }

  button {
    font: inherit;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    cursor: pointer;
    transition: background-color var(--fast) ease-out, border-color var(--fast) ease-out, color var(--fast) ease-out, transform var(--fast) ease-out;
  }

  button:hover:not([disabled]) { border-color: var(--faint); }
  button:active:not([disabled]) { transform: translateY(1px); }

  button:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid var(--marked);
    outline-offset: 2px;
  }

  button[disabled] { opacity: 0.4; cursor: not-allowed; }

  header { display: flex; flex-direction: column; gap: 8px; flex: 0 0 auto; }

  .head-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  header > h1 { font-size: 16px; letter-spacing: -0.012em; color: var(--ink-soft); }

  .toggle-label { font-size: 12.5px; color: var(--muted); }

  .choices { display: flex; gap: 6px; flex-wrap: wrap; }
  .choices button { padding: 3px 10px; font-size: 12.5px; }
  .choices button[aria-pressed="true"] { background: var(--running); border-color: var(--running); color: #fff; }

  .examples { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  .group-cap {
    font-size: 10.5px;
    font-weight: 750;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 4px 0 8px;
  }

  .examples > .group-cap:first-child { padding-left: 0; }

  .examples button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 5px 8px;
    font-size: 12.5px;
    text-align: left;
    box-shadow: var(--shadow);
  }

  .examples button .num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 19px;
    height: 19px;
    border-radius: 50%;
    background: var(--page);
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .examples button .short { display: none; }
  .examples button[aria-current="true"] .short { display: inline; }
  .examples button[aria-current="true"] { background: var(--running); border-color: var(--running); color: #fff; }
  .examples button[aria-current="true"] .num { background: rgba(0, 0, 0, 0.22); color: #fff; }

  main {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: minmax(0, 1fr);
    gap: 9px;
  }

  main.has-wide { grid-template-rows: minmax(0, 1fr) auto; }

  .panel.wide { grid-column: 1 / -1; }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }

  .panel > h2 {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--faint);
    padding: 9px 12px 8px;
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }

  .panel > h2::before {

    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--line-strong);
    flex: 0 0 auto;
  }

  .panel.processes > h2::before, .panel.lanes > h2::before { background: var(--running); }
  .panel.registers > h2::before, .panel.shared > h2::before { background: var(--ink-soft); }

  .panel > h2 .tip { border-bottom-color: var(--line); color: inherit; letter-spacing: inherit; text-transform: inherit; white-space: nowrap; }
  .panel > h2 .tip:hover { border-bottom-color: var(--faint); }

  .panel > h2 .panel-note {
    margin-left: auto;
    min-width: 0;
    text-transform: none;
    letter-spacing: 0;
    font-size: 10.5px;
    font-weight: 400;
    color: var(--faint);
    text-align: right;
  }

  .panel-body {
    padding: 8px 11px;
    overflow: auto;
    min-height: 0;
    flex: 1 1 auto;
  }

  .processes-grid { display: grid; gap: 12px; align-items: start; }

  .process-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  .process-head { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; flex: 0 0 auto; margin-bottom: 5px; }
  .process-head .name { font-size: 13px; font-weight: 750; }
  .process-head .gloss { font-size: 11px; color: var(--muted); }

  .state-pill {
    margin-left: auto;

    border-radius: 5px;
    font-size: 11px;
    font-weight: 700;
    line-height: 1.3;

    white-space: nowrap;
  }

  .spin-chip {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 2px 6px;
    border-radius: 5px;
    border: 1px solid var(--running);
    color: var(--running);
    background: var(--spin-fill);
    white-space: nowrap;
  }

  .pick-row { display: flex; gap: 6px; flex: 0 0 auto; margin-bottom: 6px; }

  .pick-row button {
    flex: 1 1 auto;
    padding: 5px 10px;
    font-size: 12.5px;
    font-weight: 640;
    background: var(--running);
    border-color: var(--running);
    color: #fff;

  .pick-row button:hover:not([disabled]) { background: #1a45bd; border-color: #1a45bd; }
  .pick-row button[disabled] { background: var(--card); border-color: var(--line-strong); color: var(--muted); }

  .source { display: flex; flex-direction: column; min-width: 0; overflow-x: auto; }

  .code-line {
    display: flex;
    gap: 9px;
    align-items: baseline;
    line-height: 1.34;
    padding: 1px 6px 1px 4px;
    border-left: 3px solid transparent;
    border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 12.5px;
    color: var(--ink-soft);
    white-space: pre;
  }

  .code-line .num { color: var(--muted); min-width: 2ch; text-align: right; font-size: 11px; font-family: inherit; }
  .code-line.current .num { color: var(--ink-soft); }
  .code-line .text { flex: 0 0 auto; }
  .code-line.frame { color: var(--muted); }
  .code-line.gloss { color: var(--ink); font-weight: 700; }

  .code-line.expansion { background: var(--region-fill-alt); border-radius: 0; }
  .code-line.expansion.first { border-top-left-radius: 4px; border-top-right-radius: 4px; }
  .code-line.expansion.last { border-bottom-left-radius: 4px; border-bottom-right-radius: 4px; }

  .code-line.current {
    background: var(--running-soft);
    border-left-color: var(--running);
    color: var(--ink);
    font-weight: 700;
  }

  .code-line.current.spinning { background: var(--spin-fill); }
  .code-line.paused { border-left-color: var(--muted); color: var(--ink); }

  .region {
    border: 1.5px dashed var(--line-strong);
    border-radius: 7px;
    background: var(--region-fill-alt);
    padding: 3px 3px 4px;
    margin: 3px 0;
  }

  .region.changed { border-color: var(--marked); }

  .region-tag {
    display: block;
    font-size: 9.5px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    font-weight: 800;
    color: var(--ink-soft);
    padding: 0 0 2px 7px;
  }

  .definition {

    margin-top: 10px;
    border: 1.5px dashed var(--line-strong);
    border-radius: 8px;
    background: var(--region-fill-alt);
    padding: 5px 7px 6px;
  }

  .definition-tag {
    display: block;
    font-size: 9.5px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    font-weight: 800;
    color: var(--ink-soft);
    margin-bottom: 2px;
  }

  .definition .code-line { border-left: 0; padding-left: 4px; }

  .value-rows { display: flex; flex-direction: column; gap: 7px; }

  .value-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 1px 9px;
    padding: 3px 7px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--region-fill);
  }

  .value-row .vname {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
  }

  .value-row .vval { font-size: 17px; font-weight: 800; line-height: 1.25; margin-left: auto; font-variant-numeric: tabular-nums; }
  .value-row .vgloss { flex: 1 0 100%; font-size: 10.5px; color: var(--muted); line-height: 1.3; }
  .value-row .vowner { font-size: 10.5px; color: var(--muted); }

  .value-row.changed { border-color: var(--marked); box-shadow: 0 0 0 2px var(--marked-soft); background: var(--marked-soft); }
  .value-row.changed .vname, .value-row.changed .vval { color: var(--marked); }

  .list-box {
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: var(--region-fill);
    padding: 5px 8px 7px;
  }

  .list-box.changed { border-color: var(--marked); box-shadow: 0 0 0 2px var(--marked-soft); }
  .list-head { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }

  .list-name {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
  }

  .list-count { margin-left: auto; font-size: 13px; font-weight: 800; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .list-box.changed .list-count, .list-box.changed .list-name { color: var(--marked); }
  .list-gloss { flex: 1 0 100%; font-size: 10.5px; color: var(--muted); line-height: 1.3; }
  .list-bar { display: flex; align-items: stretch; gap: 8px; margin-top: 6px; }
  .list-slots { flex: 1 1 auto; display: grid; gap: 3px; min-width: 0; }

  .list-slot {
    height: 18px;
    border: 1px solid var(--line-strong);
    border-radius: 3px;
    background: var(--card);
  }

  .list-slot.taken { background: var(--marked-soft); border-color: var(--ink-soft); }
  .list-extra { flex: 0 0 auto; display: flex; gap: 3px; padding-left: 7px; border-left: 1px dashed var(--line-strong); }
  .list-extra .list-slot { width: 16px; border-style: dashed; border-color: var(--ink); background: repeating-linear-gradient(135deg, var(--card) 0 4px, var(--marked-soft) 4px 8px); }
  .list-items { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }

  .list-chip {
    border: 1px solid var(--line-strong);
    border-radius: 5px;
    background: var(--card);
    padding: 1px 7px;
    font-size: 11.5px;
    font-weight: 700;
  }

  .list-note { display: block; font-size: 10.5px; color: var(--ink-soft); font-weight: 650; margin-top: 5px; }
  .list-empty { font-size: 11.5px; color: var(--muted); margin-top: 6px; display: block; }

  .output-box { border: 1px solid var(--line-strong); border-radius: 8px; background: var(--region-fill); padding: 7px 9px 9px; }
  .output-line { display: flex; flex-wrap: wrap; gap: 5px; }

  .output-chip {
    border: 1px solid var(--line-strong);
    border-radius: 5px;
    background: var(--card);
    padding: 2px 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink);
  }

  .output-chip.fresh { border-color: var(--marked); box-shadow: 0 0 0 2px var(--marked-soft); }
  .output-empty { font-size: 12px; color: var(--muted); margin: 0; }
  .output-run { display: block; font-size: 10.5px; color: var(--muted); margin-top: 7px; word-break: break-word; }

  .marks-row { display: flex; flex-wrap: wrap; gap: 6px; flex: 0 0 auto; margin-bottom: 7px; }

  .mark-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border: 1.5px solid;
    border-radius: 6px;
    padding: 2px 7px;
    font-size: 11px;
    font-weight: 750;
    white-space: nowrap;
  }

  .mark-chip .where { font-size: 10px; font-weight: 650; }

  .line-marks { display: flex; gap: 3px; padding-left: 12px; }

  .line-mark {
    font-size: 10px;
    font-weight: 800;
    border: 1px solid;
    border-radius: 4px;
    padding: 0 4px;
    white-space: nowrap;
  }

  .sem-list { display: flex; flex-direction: column; gap: 9px; }

  .sem-box {
    border: 1px solid var(--line-strong);
    border-radius: 8px;
    background: var(--region-fill);
    padding: 5px 8px 7px;
  }

  .sem-box.changed { border-color: var(--marked); box-shadow: 0 0 0 2px var(--marked-soft); }

  .sem-head { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }

  .sem-name {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink);
  }

  .sem-value { margin-left: auto; font-size: 19px; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .sem-box.changed .sem-value, .sem-box.changed .sem-name { color: var(--marked); }
  .sem-gloss { flex: 1 0 100%; font-size: 10.5px; color: var(--muted); line-height: 1.3; }
  .sem-queue { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-top: 6px; }
  .sem-queue-label { font-size: 10.5px; color: var(--muted); font-weight: 650; }

  .queue-chip {
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
    border: 1.5px solid var(--line-strong);
    border-radius: 6px;
    background: var(--card);
    padding: 2px 7px;
    font-size: 11.5px;
    font-weight: 750;
  }

  .queue-chip .ord { font-size: 10px; font-weight: 700; color: var(--muted); }
  .queue-chip.fresh { border-color: var(--marked); box-shadow: 0 0 0 2px var(--marked-soft); }
  .queue-empty { font-size: 11.5px; color: var(--muted); }

  .badge {
    display: inline-block;
    border: 1.5px solid var(--marked);
    border-radius: 6px;
    background: var(--marked-soft);
    padding: 3px 8px;
    font-size: 11px;
    font-weight: 700;
    color: var(--marked);
    line-height: 1.3;
  }

  .badge-slot { margin-top: 7px; }

  .lane-grid { --gap: 5px; display: grid; gap: 7px var(--gap); align-content: start; }

  .board-head { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .board-head.later { border-top: 1px solid var(--line-strong); padding-top: 8px; margin-top: 4px; }
  .board-name { font-size: 13px; font-weight: 780; color: var(--ink); }
  .board-gloss { font-size: 11px; color: var(--muted); }
  .board-counter { margin-left: auto; font-size: 11.5px; color: var(--ink-soft); font-weight: 700; white-space: nowrap; }
  .board-counter.changed { color: var(--marked); }

  .lane-name {
    grid-column: 1;
    text-align: right;
    padding-right: 4px;
    font-size: 10.5px;
    color: var(--muted);
    font-weight: 700;
    align-self: center;
    white-space: nowrap;
  }

  .lane-seg {
    min-width: 0;
    height: 19px;
    border: 1px solid var(--line-strong);
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    white-space: nowrap;
    font-size: 9.5px;
    font-weight: 700;
    padding: 0 3px;
  }

  .lane-seg.pending { border-style: dashed; border-color: var(--line); background: transparent; color: var(--muted); }
  .lane-seg.done { border-color: var(--line-strong); background: var(--region-fill-alt); color: var(--muted); }
  .lane-seg.absent { border-style: dashed; border-color: var(--line-strong); background: transparent; color: var(--muted); }
  .lane-seg.busy { border-color: var(--running); background: var(--running-soft); color: var(--running); }
  .lane-seg.spin { border-color: var(--running); background: var(--spin-fill); color: var(--running); }
  .lane-seg.overhead { border-color: var(--blocked); background: var(--blocked-soft); color: var(--blocked); }
  .lane-seg.RUNNING { border-color: var(--running); background: var(--running-soft); color: var(--running); }
  .lane-seg.RUNNING.spinning { background: var(--spin-fill); }
  .lane-seg.READY { border-color: var(--ready); background: var(--ready-soft); color: var(--ready); }
  .lane-seg.BLOCKED { border-color: var(--blocked); background: var(--blocked-soft); color: var(--blocked); }
  .lane-seg.fresh { box-shadow: 0 0 0 2px var(--marked); }

  .axis-mark {
    position: relative;
    min-width: 0;
    display: flex;
    align-items: flex-start;
    justify-content: flex-end;
    font-size: 10.5px;
    font-weight: 650;
    color: var(--ink-soft);
    padding-top: 6px;
    font-variant-numeric: tabular-nums;
  }

  .axis-mark span { transform: translateX(calc(50% + var(--gap) / 2)); }

  .axis-mark::after {
    content: "";
    position: absolute;
    top: 0;
    right: calc(var(--gap) / -2 - 0.5px);
    width: 1px;
    height: 5px;
    background: var(--faint);
  }

  .legend { display: flex; flex-wrap: wrap; gap: 3px 14px; margin-top: 9px; }
  .legend .item { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--muted); }
  .legend .swatch { width: 14px; height: 10px; border-radius: 2px; border: 1px solid; flex: 0 0 auto; }
  .legend .swatch.busy { border-color: var(--running); background: var(--running-soft); }
  .legend .swatch.spin { border-color: var(--running); background: var(--spin-fill); }
  .legend .swatch.overhead { border-color: var(--blocked); background: var(--blocked-soft); }
  .legend .swatch.READY { border-color: var(--ready); background: var(--ready-soft); }
  .legend .swatch.BLOCKED { border-color: var(--blocked); background: var(--blocked-soft); }
  .legend .swatch.absent { border-color: var(--line-strong); border-style: dashed; background: transparent; }
  .legend .swatch.done { border-color: var(--line-strong); background: var(--region-fill-alt); }

  footer { flex: 0 0 auto; display: block; min-height: 0; }

  .narration-panel { display: flex; flex-direction: column; min-height: 0; height: 100%; }

  .narration-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    padding: 8px 12px 7px;
    border-bottom: 1px solid var(--line);
  }

  .narration-head .title { font-weight: 660; font-size: 14.5px; }
  .narration-head .subtitle { font-size: 13px; color: var(--muted); flex: 1; min-width: 160px; }

  .step-unit {
    font-size: 11px;
    color: var(--muted);
    background: var(--page);
    border-radius: 5px;
    padding: 2px 7px;
    white-space: nowrap;
  }

  .narration-body {
    padding: 9px 12px 4px;
    flex: 1 1 auto;
    min-height: 113px;

    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 800;
    color: var(--muted);
    margin-bottom: 2px;
  }

  .compare th .tip { text-transform: inherit; letter-spacing: inherit; }

  .progress-row { display: flex; align-items: center; gap: 10px; padding: 4px 12px 0; }

  .progress-track { flex: 1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }

  .progress-fill {
    height: 100%;
    background: var(--running);
    border-radius: 2px;
    transition: transform var(--fast) ease-out;
    transform-origin: left center;
  }

  .progress { font-size: 12px; line-height: 1.2; color: var(--muted); white-space: nowrap; }

  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 7px 12px 8px; }

  .controls .big { padding: 7px 16px; font-size: 15px; font-weight: 640; }

  .controls .small { padding: 6px 11px; font-size: 13px; }

  .tip {
    font: inherit;
    background: none;
    border: 0;
    padding: 0;
    color: inherit;
    border-bottom: 1px dotted var(--running);

    border-radius: 0;

    max-width: 330px;

    border-radius: 8px;

  @keyframes flash {
    from { opacity: 0.35; }
    to { opacity: 1; }
  }

  @media (max-width: 1000px) {
    body { height: auto; overflow: auto; padding-bottom: calc(122px + env(safe-area-inset-bottom)); }
    main { grid-template-columns: 1fr !important; grid-template-rows: none !important; }
    .panel-body { overflow: visible; }
    .narration-body { overflow: visible; max-height: none; }
    .narration-body.with-extras, .narration-body.with-extras.no-compare { grid-template-columns: 1fr; }
    .compare.full { grid-column: auto; grid-row: auto; margin: 7px 0 0; }
    .narration-extras { overflow: visible; }
    .narration-head { flex-direction: column; align-items: flex-start; gap: 3px; }
    .processes-grid { grid-template-columns: 1fr !important; }

    .controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;

    .controls .big, .controls .small { width: 100%; }

    #nextStep { order: 2; }

    #lastStep { order: 4; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

        expectedFinalState: { boards: { turnos: { units: 9, spin: 0, overhead: 0 } } }
