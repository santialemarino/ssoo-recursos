<script id="engine">
function fill(template, values) {
  return String(template).replace(/\{(\w+)\}/g, function (whole, key) {
    return values[key] === undefined ? whole : String(values[key]);
  });
}

function vectorText(vector) {
  return vector.join(" ");
}

function sameVector(one, other) {
  return one.length === other.length && one.every(function (value, index) { return value === other[index]; });
}

function addVectors(one, other) {
  return one.map(function (value, index) { return value + other[index]; });
}

function subtractVectors(one, other) {
  return one.map(function (value, index) { return value - other[index]; });
}

function fitsIn(need, available) {
  return need.every(function (value, index) { return value <= available[index]; });
}

function unresolved(text) {
  return /\{\w+\}/.test(String(text));
}

function unbalanced(text) {
  const stars = String(text).split("*").length - 1;
  const opens = String(text).split("[[").length - 1;
  const closes = String(text).split("]]").length - 1;
  return stars % 2 !== 0 || opens !== closes;
}

function canvasFor(example, step) {
  if (step && step.stage && example.stages && example.stages[step.stage]) return example.stages[step.stage];
  return example.canvas;
}

function panelsOf(canvas) {
  return canvas.panels.concat(canvas.wide || []);
}

function laneActors(example) {
  return example.lanes.actors;
}

function workingActors(example) {
  return laneActors(example).filter(function (actor) { return !actor.os; });
}

function poolContext(example, step, previous) {
  const context = {};
  const mode = example.pool.secondColumn;
  context.disponible = step.pool.available;
  if (previous) context.disponible_antes = previous.pool.available;
  if (step.pedido !== undefined) context.pedido = step.pedido;
  example.processes.forEach(function (item) {
    const row = step.pool.rows[item.id];
    context[item.id + "_tiene"] = row.assigned;
    if (mode === "max") {
      context[item.id + "_declaro"] = row.second;
      context[item.id + "_falta"] = row.second - row.assigned;
    } else {
      context[item.id + "_pide"] = row.second;
    }
    if (!previous) return;
    const before = previous.pool.rows[item.id];
    context[item.id + "_tiene_antes"] = before.assigned;
    if (mode === "max") context[item.id + "_falta_antes"] = before.second - before.assigned;
    else context[item.id + "_pide_antes"] = before.second;
  });
  return context;
}

function matrixContext(example, step, previous) {
  const context = {};
  context.disponible = vectorText(step.matrices.available);
  context.totales = vectorText(example.matrices.total);
  if (previous) context.disponible_antes = vectorText(previous.matrices.available);
  if (step.pedido !== undefined) context.pedido = vectorText(step.pedido);
  example.processes.forEach(function (item) {
    context[item.id + "_maximo"] = vectorText(step.matrices.max[item.id]);
    context[item.id + "_asignado"] = vectorText(step.matrices.assigned[item.id]);
    context[item.id + "_necesidad"] = vectorText(step.matrices.need[item.id]);
  });
  return context;
}

function laneCounters(example, variant, unit) {
  const counts = { corridas: 0, trabado: 0, unidad: unit };
  const actors = workingActors(example);
  for (let index = 0; index < unit; index += 1) {
    laneActors(example).forEach(function (actor) {
      if (actor.os && variant.program[actor.id][index] === "check") counts.corridas += 1;
    });
    const stuck = actors.every(function (actor) { return variant.program[actor.id][index] === "BLOCKED"; });
    if (stuck) counts.trabado += 1;
  }
  return counts;
}

function orderingContext(example) {
  const context = {};
  example.ordering.ranks.forEach(function (entry) { context["F_" + entry.resource] = entry.rank; });
  return context;
}

function semaphoreContext(step) {
  const context = {};
  Object.keys(step.semaphores).forEach(function (name) { context[name] = step.semaphores[name].value; });
  return context;
}

function stepContext(example, variant, step, previous, index) {
  let context = {};
  if (step.pool) context = poolContext(example, step, previous);
  if (step.matrices) context = matrixContext(example, step, previous);
  if (step.semaphores) context = semaphoreContext(step);
  if (example.ordering) Object.assign(context, orderingContext(example));
  if (example.lanes && variant.program) Object.assign(context, laneCounters(example, variant, index + 1));
  return context;
}

function changedRows(example, step, previous) {
  const fresh = {};
  if (!previous) return fresh;
  if (step.pool) {
    if (step.pool.available !== previous.pool.available) fresh.available = true;
    example.processes.forEach(function (item) {
      const row = step.pool.rows[item.id];
      const before = previous.pool.rows[item.id];
      if (row.assigned !== before.assigned || row.second !== before.second) fresh[item.id] = true;
    });
  }
  if (step.matrices) {
    if (!sameVector(step.matrices.available, previous.matrices.available)) fresh.available = true;
    example.processes.forEach(function (item) {
      ["max", "assigned", "need"].forEach(function (table) {
        step.matrices[table][item.id].forEach(function (value, column) {
          if (value !== previous.matrices[table][item.id][column]) fresh[table + ":" + item.id + ":" + column] = true;
        });
      });
    });
  }
  if (step.semaphores) {
    Object.keys(step.semaphores).forEach(function (name) {
      if (step.semaphores[name].value !== previous.semaphores[name].value) fresh[name] = true;
    });
  }
  return fresh;
}

function snapshotOf(example, variant, step, previous, index, total) {
  const context = stepContext(example, variant, step, previous, index);
  return {
    step: step,
    index: index,
    last: index === total - 1,
    context: context,
    narration: fill(step.narration, context),
    note: step.note ? fill(step.note, context) : null,
    fresh: changedRows(example, step, previous),
    newLedgerRows: step.ledger && previous && previous.ledger ? step.ledger.length - previous.ledger.length : (step.ledger ? step.ledger.length : 0),
    unit: index + 1
  };
}

function buildSnapshots(example, variant) {
  const steps = variant.steps;
  return steps.map(function (step, index) {
    return snapshotOf(example, variant, step, index > 0 ? steps[index - 1] : null, index, steps.length);
  });
}

function verifyTexts(example, variant, snapshots, problems) {
  const pieces = [];
  snapshots.forEach(function (snapshot, index) {
    pieces.push({ where: "narración del paso " + (index + 1), text: snapshot.narration });
    if (snapshot.note) pieces.push({ where: "nota del paso " + (index + 1), text: snapshot.note });
  });
  const last = snapshots[snapshots.length - 1].context;
  pieces.push({ where: "frase de cierre", text: fill(example.closing, last) });
  if (example.stepUnitNote) pieces.push({ where: "nota de unidad", text: fill(example.stepUnitNote, last) });
  if (example.compare) {
    example.compare.headers.forEach(function (text) { pieces.push({ where: "encabezado de la tabla", text: fill(text, last) }); });
    example.compare.rows.forEach(function (row) {
      row.forEach(function (text) { pieces.push({ where: "celda de la tabla", text: fill(text, last) }); });
    });
  }
  pieces.forEach(function (piece) {
    if (unresolved(piece.text)) problems.push("quedó un dato sin completar en la " + piece.where);
    if (unbalanced(piece.text)) problems.push("quedó una marca sin cerrar en la " + piece.where);
  });
}

function verifyGraphSteps(example, variant, problems) {
  const processes = example.processes.map(function (item) { return item.id; });
  const resources = (example.resources || []).map(function (item) { return item.id; });
  const instances = {};
  (example.resources || []).forEach(function (item) { instances[item.id] = item.instances; });
  variant.steps.forEach(function (step, index) {
    if (!step.graph) return;
    const where = "el paso " + (index + 1);
    Object.keys(step.graph.states).forEach(function (id) {
      if (processes.indexOf(id) === -1) problems.push(where + " le da estado a " + id + ", que no es un proceso del ejemplo");
      if (!STATES[step.graph.states[id]]) problems.push(where + " usa el estado " + step.graph.states[id] + ", que no existe");
    });
    processes.forEach(function (id) {
      if (step.graph.states[id] === undefined) problems.push(where + " no dice en qué estado está " + id);
    });
    Object.keys(step.graph.held).forEach(function (id) {
      if (resources.indexOf(id) === -1) problems.push(where + " asigna " + id + ", que no es un recurso del ejemplo");
      const owners = step.graph.held[id];
      const shared = (step.graph.shareable || []).indexOf(id) !== -1;
      if (!shared && owners.length > instances[id]) problems.push(where + " asigna " + owners.length + " instancias de " + id + ", que tiene " + instances[id]);
      owners.forEach(function (owner) {
        if (processes.indexOf(owner) === -1) problems.push(where + " le da " + id + " a " + owner + ", que no es un proceso del ejemplo");
      });
    });
    (step.graph.requests || []).forEach(function (pair) {
      if (processes.indexOf(pair[0]) === -1) problems.push(where + " tiene una petición de " + pair[0] + ", que no es un proceso del ejemplo");
      if (resources.indexOf(pair[1]) === -1) problems.push(where + " tiene una petición de " + pair[1] + ", que no es un recurso del ejemplo");
    });
    (step.graph.cycle || []).forEach(function (edge) {
      const ends = edge.split(">");
      const isAssign = resources.indexOf(ends[0]) !== -1 && (step.graph.held[ends[0]] || []).indexOf(ends[1]) !== -1;
      const isRequest = (step.graph.requests || []).some(function (pair) { return pair[0] === ends[0] && pair[1] === ends[1]; });
      if (!isAssign && !isRequest) problems.push(where + " marca en el ciclo la flecha " + edge + ", que no está dibujada");
    });
    (step.graph.shareable || []).forEach(function (id) {
      if (resources.indexOf(id) === -1) problems.push(where + " declara compartible a " + id + ", que no es un recurso del ejemplo");
    });
  });
}

function verifyPoolSteps(example, variant, problems) {
  const total = example.pool.instances;
  variant.steps.forEach(function (step, index) {
    const where = "el paso " + (index + 1);
    if (!step.pool) { problems.push(where + " no declara el estado de las instancias"); return; }
    let held = 0;
    example.processes.forEach(function (item) {
      const row = step.pool.rows[item.id];
      if (!row) { problems.push(where + " no dice qué tiene " + item.id); return; }
      held += row.assigned;
      if (example.pool.secondColumn === "max" && !row.done && row.second < row.assigned) {
        problems.push(where + " le da a " + item.id + " más instancias que su máximo declarado");
      }
    });
    if (held + step.pool.available !== total) {
      problems.push(where + " suma " + (held + step.pool.available) + " instancias y el recurso tiene " + total);
    }
  });
}

function verifyMatrixSteps(example, variant, problems) {
  const total = example.matrices.total;
  variant.steps.forEach(function (step, index) {
    const where = "el paso " + (index + 1);
    if (!step.matrices) { problems.push(where + " no declara las matrices"); return; }
    let held = total.map(function () { return 0; });
    example.processes.forEach(function (item) {
      const max = step.matrices.max[item.id];
      const assigned = step.matrices.assigned[item.id];
      const need = step.matrices.need[item.id];
      if (!max || !assigned || !need) { problems.push(where + " no tiene las tres filas de " + item.id); return; }
      held = addVectors(held, assigned);
      if (!sameVector(need, subtractVectors(max, assigned))) {
        problems.push(where + ": la necesidad de " + item.id + " no es la resta de su máximo menos lo asignado");
      }
    });
    if (!sameVector(addVectors(held, step.matrices.available), total)) {
      problems.push(where + ": lo asignado más lo disponible no da los recursos totales");
    }
  });
}

function ledgerBaseline(variant) {
  for (let index = 0; index < variant.steps.length; index += 1) {
    const step = variant.steps[index];
    if (step.ledger && step.ledger.length > 0) return step;
  }
  return null;
}

function finalLedger(variant) {
  let ledger = [];
  variant.steps.forEach(function (step) {
    if (step.ledger && step.ledger.length > ledger.length) ledger = step.ledger;
  });
  return ledger;
}

function replayPoolLedger(example, variant, problems) {
  const base = ledgerBaseline(variant);
  const ledger = finalLedger(variant);
  if (!base || ledger.length === 0) return;
  const mode = example.pool.secondColumn;
  const rows = {};
  example.processes.forEach(function (item) {
    const row = base.pool.rows[item.id];
    rows[item.id] = { hold: row.assigned, need: mode === "max" ? row.second - row.assigned : row.second, alive: true };
  });
  let available = base.pool.available;
  if (ledger[0].available !== available) {
    problems.push("la simulación arranca en " + ledger[0].available + " y el estado que simula tiene " + available);
  }
  ledger.forEach(function (row, index) {
    const where = "la fila " + (index + 1) + " de la simulación";
    if (row.act === "start") return;
    if (row.act === "none") {
      const someone = Object.keys(rows).some(function (id) { return rows[id].alive && rows[id].need <= available; });
      if (someone) problems.push(where + " dice que no hay secuencia y todavía hay alguien a quien se le puede dar todo");
      return;
    }
    const who = rows[row.who];
    if (!who) { problems.push(where + " nombra a " + row.who + ", que no es un proceso del ejemplo"); return; }
    if (row.act === "choose") {
      if (who.need > available) problems.push(where + " elige " + row.who + ", que necesita más de lo disponible");
      available -= who.need;
      who.hold += who.need;
      who.need = 0;
    } else {
      available += who.hold;
      who.hold = 0;
      who.alive = false;
    }
    if (row.available !== available) {
      problems.push(where + " dice " + row.available + " y la cuenta da " + available);
    }
  });
  const completes = variant.steps.some(function (step) { return step.ledgerComplete; });
  if (completes && available !== example.pool.instances) {
    problems.push("la simulación termina en " + available + " y el recurso tiene " + example.pool.instances + " instancias");
  }
}

function replayMatrixLedger(example, variant, problems) {
  const base = ledgerBaseline(variant);
  const ledger = finalLedger(variant);
  if (!base || ledger.length === 0) return;
  const rows = {};
  example.processes.forEach(function (item) {
    rows[item.id] = {
      hold: base.matrices.assigned[item.id].slice(),
      need: base.matrices.need[item.id].slice(),
      alive: true
    };
  });
  let available = base.matrices.available.slice();
  if (!sameVector(ledger[0].available, available)) {
    problems.push("la simulación arranca en " + vectorText(ledger[0].available) + " y el estado que simula tiene " + vectorText(available));
  }
  ledger.forEach(function (row, index) {
    const where = "la fila " + (index + 1) + " de la simulación";
    if (row.act === "start") return;
    if (row.act === "none") {
      const someone = Object.keys(rows).some(function (id) { return rows[id].alive && fitsIn(rows[id].need, available); });
      if (someone) problems.push(where + " dice que no hay secuencia y todavía hay alguien a quien se le puede dar todo");
      return;
    }
    const who = rows[row.who];
    if (!who) { problems.push(where + " nombra a " + row.who + ", que no es un proceso del ejemplo"); return; }
    if (row.act === "choose") {
      if (!fitsIn(who.need, available)) problems.push(where + " elige " + row.who + ", que necesita más de lo disponible");
      available = subtractVectors(available, who.need);
      who.hold = addVectors(who.hold, who.need);
      who.need = who.need.map(function () { return 0; });
    } else {
      available = addVectors(available, who.hold);
      who.hold = who.hold.map(function () { return 0; });
      who.alive = false;
    }
    if (!sameVector(row.available, available)) {
      problems.push(where + " dice " + vectorText(row.available) + " y la cuenta da " + vectorText(available));
    }
  });
  const completes = variant.steps.some(function (step) { return step.ledgerComplete; });
  if (completes && !sameVector(available, example.matrices.total)) {
    problems.push("la simulación termina en " + vectorText(available) + " y los recursos totales son " + vectorText(example.matrices.total));
  }
}

function verifyLedgerCompletes(example, variant, problems) {
  variant.steps.forEach(function (step, index) {
    if (!step.ledgerComplete) return;
    const ledger = step.ledger || [];
    const closing = ledger[ledger.length - 1];
    if (!closing || closing.act !== "finish") {
      problems.push("el paso " + (index + 1) + " dice que la secuencia está completa y la simulación no termina con un proceso que finaliza");
    }
  });
}

function verifySemaphoreSteps(example, variant, problems) {
  variant.steps.forEach(function (step, index) {
    const where = "el paso " + (index + 1);
    example.semaphoreOrder.forEach(function (name) {
      const semaphore = step.semaphores[name];
      if (!semaphore) { problems.push(where + " no declara el semáforo " + name); return; }
      const waiting = semaphore.value < 0 ? -semaphore.value : 0;
      if (semaphore.queue.length !== waiting) {
        problems.push(where + ": el semáforo " + name + " vale " + semaphore.value + " y tiene " + semaphore.queue.length + " procesos en la cola");
      }
    });
    const blocked = {};
    example.semaphoreOrder.forEach(function (name) {
      step.semaphores[name].queue.forEach(function (id) { blocked[id] = true; });
    });
    example.processes.forEach(function (item) {
      const isBlocked = step.states[item.id] === "BLOCKED";
      if (isBlocked !== Boolean(blocked[item.id])) {
        problems.push(where + ": " + item.id + " dice " + step.states[item.id] + " y no coincide con las colas de los semáforos");
      }
      const line = step.lines[item.id];
      if (line === null || line === undefined) return;
      const program = example.programs[item.program || item.id];
      if (!program[line - 1]) problems.push(where + " apunta a una línea que no existe en el programa de " + item.id);
      else if (program[line - 1].role === "frame") problems.push(where + " apunta a una línea que no se ejecuta en el programa de " + item.id);
    });
  });
}

function verifyFinalSemaphores(example, variant, problems) {
  if (!variant.expectedFinalState) return;
  const last = variant.steps[variant.steps.length - 1];
  Object.keys(variant.expectedFinalState).forEach(function (name) {
    const value = last.semaphores[name].value;
    if (value !== variant.expectedFinalState[name]) {
      problems.push("el semáforo " + name + " termina en " + value + " y se esperaba " + variant.expectedFinalState[name]);
    }
  });
}

function verifyOrderingSteps(example, variant, problems) {
  const count = example.ordering.requests.length;
  const ranks = {};
  example.ordering.ranks.forEach(function (entry) { ranks[entry.resource] = entry.rank; });
  example.ordering.requests.forEach(function (request, index) {
    if (ranks[request.resource] === undefined) {
      problems.push("la petición " + (index + 1) + " pide " + request.resource + ", que no tiene número asignado");
    }
  });
  variant.steps.forEach(function (step, index) {
    if (step.stage !== "orden") return;
    const where = "el paso " + (index + 1);
    if (!step.cells || step.cells.length !== count) {
      problems.push(where + " declara " + ((step.cells || []).length) + " celdas y hay " + count + " peticiones");
      return;
    }
    const held = {};
    step.cells.forEach(function (verdict, position) {
      const request = example.ordering.requests[position];
      if (verdict === "pending") return;
      const owner = request.process;
      held[owner] = held[owner] || [];
      const highest = held[owner].reduce(function (most, rank) { return Math.max(most, rank); }, 0);
      const allowed = held[owner].length === 0 || ranks[request.resource] > highest;
      if (allowed !== (verdict === "ok")) {
        problems.push(where + ": la petición " + (position + 1) + " está marcada " + verdict + " y la política dice lo contrario");
      }
      if (verdict === "ok") held[owner].push(ranks[request.resource]);
    });
  });
}

function verifyLaneSteps(example, variant, problems) {
  const units = example.lanes.units;
  if (variant.steps.length !== units) {
    problems.push("tiene " + variant.steps.length + " pasos y el horizonte es de " + units + " unidades");
  }
  laneActors(example).forEach(function (actor) {
    const lane = variant.program[actor.id];
    if (!lane) { problems.push("no tiene carril para " + (actor.label || actor.id)); return; }
    if (lane.length !== units) problems.push("el carril de " + actor.id + " tiene " + lane.length + " unidades y el horizonte es de " + units);
    lane.forEach(function (kind, index) {
      if (!Object.prototype.hasOwnProperty.call(UI_TEXT.lanes.kinds, kind)) {
        problems.push("el carril de " + actor.id + " usa " + kind + " en la unidad " + (index + 1) + ", que no tiene nombre");
      }
    });
  });
  workingActors(example).forEach(function (actor) {
    variant.program[actor.id].forEach(function (kind, index) {
      if (kind === "check" || kind === "idle") problems.push("el carril de " + actor.id + " usa una marca que es del sistema operativo");
    });
  });
  let running = 0;
  for (let unit = 0; unit < units; unit += 1) {
    running = workingActors(example).filter(function (actor) { return variant.program[actor.id][unit] === "RUNNING"; }).length;
    if (running > 1) problems.push("en la unidad " + (unit + 1) + " hay " + running + " procesos ejecutando a la vez, y hay una sola CPU");
  }
}

function verifyQuizSteps(example, problems) {
  const ids = example.options.map(function (option) { return option.id; });
  example.steps.forEach(function (step, index) {
    const where = "el caso " + (index + 1);
    if (ids.indexOf(step.correct) === -1) problems.push(where + " marca como correcta una opción que no está en la lista");
    ids.forEach(function (id) {
      if (!step.why[id]) problems.push(where + " no explica por qué " + id);
    });
    Object.keys(step.why).forEach(function (id) {
      if (ids.indexOf(id) === -1) problems.push(where + " explica " + id + ", que no es una opción");
    });
  });
}

function verifyStructure(example, variant, problems) {
  if (!example.closing) problems.push("no tiene frase de cierre");
  if (!example.stepUnit) problems.push("no declara la unidad del paso");
  if (variant.steps.length === 0) problems.push("no tiene pasos");
  const seen = {};
  variant.steps.forEach(function (step) {
    panelsOf(canvasFor(example, step)).forEach(function (id) { seen[id] = true; });
  });
  Object.keys(seen).forEach(function (id) {
    if (!UI_TEXT.panels[id]) problems.push("usa el panel " + id + ", que no tiene nombre");
    if (!PANEL_TIPS[id]) problems.push("usa el panel " + id + ", que no tiene globito");
  });
  variant.steps.forEach(function (step, index) {
    if (!step.narration) problems.push("el paso " + (index + 1) + " no tiene narración");
    if (step.stage && !(example.stages || {})[step.stage]) {
      problems.push("el paso " + (index + 1) + " declara un momento que el ejemplo no define");
    }
  });
}

function buildVariant(example, variant, label) {
  const problems = [];
  verifyStructure(example, variant, problems);
  if (example.resources) verifyGraphSteps(example, variant, problems);
  if (example.pool) { verifyPoolSteps(example, variant, problems); replayPoolLedger(example, variant, problems); verifyLedgerCompletes(example, variant, problems); }
  if (example.matrices) { verifyMatrixSteps(example, variant, problems); replayMatrixLedger(example, variant, problems); verifyLedgerCompletes(example, variant, problems); }
  if (example.semaphoreOrder) { verifySemaphoreSteps(example, variant, problems); verifyFinalSemaphores(example, variant, problems); }
  if (example.ordering) verifyOrderingSteps(example, variant, problems);
  if (example.lanes) verifyLaneSteps(example, variant, problems);
  if (example.options) verifyQuizSteps(example, problems);
  const snapshots = buildSnapshots(example, variant);
  verifyTexts(example, variant, snapshots, problems);
  return {
    label: label,
    variant: variant,
    snapshots: snapshots,
    problems: problems.map(function (problem) { return label ? label + ": " + problem : problem; })
  };
}

function verifySharedBase(example, variants, problems) {
  if (!example.baseState) return;
  variants.forEach(function (built) {
    const first = built.variant.steps[0];
    if (!first.graph) { problems.push(built.label + ": el primer paso no dibuja el grafo"); return; }
    const sameStates = Object.keys(example.baseState.states).every(function (id) {
      return first.graph.states[id] === example.baseState.states[id];
    });
    const sameHeld = Object.keys(example.baseState.held).every(function (id) {
      return first.graph.held[id].length === example.baseState.held[id].length;
    });
    const sameRequests = (first.graph.requests || []).length === example.baseState.requests.length;
    if (!sameStates || !sameHeld || !sameRequests) {
      problems.push(built.label + ": no arranca del mismo estado que las otras variantes");
    }
  });
}

function verifySameScenario(example, variants, problems) {
  if (!example.lanes || variants.length < 2) return;
  const ids = laneActors(example).map(function (actor) { return actor.id; });
  variants.forEach(function (built) {
    ids.forEach(function (id) {
      if (!built.variant.program[id]) problems.push(built.label + ": le falta el carril de " + id);
      else if (built.variant.program[id].length !== example.lanes.units) {
        problems.push(built.label + ": su horizonte no es el mismo que el de las otras variantes");
      }
    });
  });
}

function buildExample(example) {
  const variants = example.variants || null;
  if (!variants) {
    const built = buildVariant(example, example, null);
    return { example: example, variants: [built], problems: built.problems };
  }
  const built = variants.map(function (variant) {
    const merged = Object.assign({}, example, variant);
    delete merged.variants;
    return buildVariant(merged, merged, variant.variantLabel);
  });
  const problems = [];
  built.forEach(function (one) { one.problems.forEach(function (problem) { problems.push(problem); }); });
  if (variants.some(function (variant) { return !variant.variantLabel; })) problems.push("hay una variante sin nombre");
  if (variants.length < 2) problems.push("declara variantes y tiene menos de dos: el selector no se muestra");
  const labels = variants.map(function (variant) { return variant.variantLabel; });
  if (new Set(labels).size !== labels.length) problems.push("hay dos variantes con el mismo nombre");
  verifySharedBase(example, built, problems);
  verifySameScenario(example, built, problems);
  return { example: example, variants: built, problems: problems };
}

const BUILT_EXAMPLES = EXAMPLES.map(buildExample);

(function verifyGroupsAreContiguous() {
  const seen = [];
  EXAMPLES.forEach(function (example) {
    if (seen[seen.length - 1] === example.group) return;
    if (seen.indexOf(example.group) !== -1) {
      console.error("El grupo " + example.group + " aparece cortado en dos tramos de la escalera");
    }
    seen.push(example.group);
  });
  EXAMPLES.forEach(function (example) {

<script id="ui">

const GRAPH_HEIGHT = 300;
const GRAPH_MARGIN = 62;
const BOX_WIDTH = 82;
const BOX_HEIGHT = 56;

};

const panelRefs = {};
let canvasKey = "";

const view = { exampleIndex: 0, variantIndex: 0, stepIndex: 0, playing: false, timer: null, answers: {} };

function currentEntry() { return BUILT_EXAMPLES[view.exampleIndex]; }
function currentVariants() { return currentEntry().variants; }
function currentBuilt() { return currentVariants()[view.variantIndex]; }
function currentExample() { return currentEntry().example; }
function currentVariant() { return currentBuilt().variant; }
function totalSteps() { return currentBuilt().snapshots.length; }

function answerKey() { return currentExample().number + ":" + view.stepIndex; }

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function svgElement(tag, className) {
  const node = document.createElementNS(SVG_NS, tag);
  if (className) node.setAttribute("class", className);
  return node;
}

function renderRich(target, text) {
  target.textContent = "";
  const pattern = /\[\[(\w+):([^\]]+)\]\]|\*([^*]+)\*/g;
  let cursor = 0;
  let match = pattern.exec(text);
  while (match) {
    if (match.index > cursor) target.appendChild(document.createTextNode(text.slice(cursor, match.index)));
    if (match[1]) {
      const button = element("button", "tip", match[2]);
      button.type = "button";
      button.dataset.tip = match[1];
      target.appendChild(button);
    } else {
      target.appendChild(element("strong", null, match[3]));
    }
    cursor = match.index + match[0].length;
    match = pattern.exec(text);
  }
  if (cursor < text.length) target.appendChild(document.createTextNode(text.slice(cursor)));
  return target;
}

function buildPanel(id, example) {
  const refs = { body: element("div", "panel-body") };

  if (key === canvasKey) return;

  Object.keys(panelRefs).forEach(function (id) { delete panelRefs[id]; });

}

function rectEdgePoint(box, toward) {
  const dx = toward.x - box.cx;
  const dy = toward.y - box.cy;
  const scaleX = dx === 0 ? Infinity : (box.w / 2) / Math.abs(dx);
  const scaleY = dy === 0 ? Infinity : (box.h / 2) / Math.abs(dy);
  const scale = Math.min(scaleX, scaleY);
  return { x: box.cx + dx * scale, y: box.cy + dy * scale };
}

function circleEdgePoint(node, toward) {
  const dx = toward.x - node.cx;
  const dy = toward.y - node.cy;
  const length = Math.sqrt(dx * dx + dy * dy) || 1;
  return { x: node.cx + dx / length * node.r, y: node.cy + dy / length * node.r };
}

function pullBack(from, to, distance) {
  const dx = to.x - from.x;
  const dy = to.y - from.y;
  const length = Math.sqrt(dx * dx + dy * dy) || 1;
  return { x: to.x - dx / length * distance, y: to.y - dy / length * distance };
}

function drawEdge(group, from, to, thick) {
  const width = thick ? 4 : 2;
  const headLength = width * 4.2;
  const headWidth = width * 3;
  const tip = pullBack(from, to, EDGE_GAP);
  const dx = tip.x - from.x;
  const dy = tip.y - from.y;
  const length = Math.sqrt(dx * dx + dy * dy) || 1;
  const ux = dx / length;
  const uy = dy / length;
  const base = { x: tip.x - ux * headLength, y: tip.y - uy * headLength };
  const line = svgElement("line", "edge");
  line.setAttribute("x1", from.x);
  line.setAttribute("y1", from.y);
  line.setAttribute("x2", base.x + ux);
  line.setAttribute("y2", base.y + uy);
  line.setAttribute("stroke-width", width);
  group.appendChild(line);
  const head = svgElement("polygon", "edge-head");
  const px = -uy * headWidth / 2;
  const py = ux * headWidth / 2;
  head.setAttribute("points", [
    tip.x + "," + tip.y,
    (base.x + px) + "," + (base.y + py),
    (base.x - px) + "," + (base.y - py)
  ].join(" "));
  group.appendChild(head);
  return { from: from, base: base, ux: ux, uy: uy };
}

function spreadLabel(taken, geometry) {
  let best = null;
  let bestGap = -1;
  LABEL_FRACTIONS.forEach(function (fraction) {
    const spot = {
      x: geometry.from.x + (geometry.base.x - geometry.from.x) * fraction,
      y: geometry.from.y + (geometry.base.y - geometry.from.y) * fraction
    };
    let nearest = Infinity;
    taken.forEach(function (other) {
      const dx = other.x - spot.x;
      const dy = other.y - spot.y;
      nearest = Math.min(nearest, Math.sqrt(dx * dx + dy * dy));
    });
    if (nearest > bestGap) { bestGap = nearest; best = spot; }
  });
  taken.push(best);
  return best;
}

function drawEdgeLabel(group, taken, geometry, text) {
  const spot = spreadLabel(taken, geometry);
  const label = svgElement("text", "edge-label edge-halo");
  label.setAttribute("x", spot.x);
  label.setAttribute("y", spot.y);
  label.setAttribute("text-anchor", "middle");
  label.setAttribute("dominant-baseline", "central");
  label.textContent = text;
  group.appendChild(label);
}

function graphGeometry(example) {
  const places = {};
  const resources = example.resources;
  const processes = example.processes;
  resources.forEach(function (item, index) {
    const span = GRAPH_WIDTH - GRAPH_MARGIN * 2;
    places[item.id] = {
      kind: "resource",
      cx: GRAPH_MARGIN + span * (index + 0.5) / resources.length,
      cy: BOX_TOP + BOX_HEIGHT / 2,
      w: BOX_WIDTH,
      h: BOX_HEIGHT,
      instances: item.instances
    };
  });
  processes.forEach(function (item, index) {
    const span = GRAPH_WIDTH - GRAPH_MARGIN * 2;
    places[item.id] = {
      kind: "process",
      cx: GRAPH_MARGIN + span * (index + 0.5) / processes.length,
      cy: NODE_CENTER_Y,
      r: NODE_RADIUS
    };
  });
  return places;
}

function edgePoint(place, toward) {
  const target = { x: toward.cx, y: toward.cy };
  return place.kind === "resource" ? rectEdgePoint(place, target) : circleEdgePoint(place, target);
}

function renderGraph(snapshot) {
  const example = currentExample();
  const graph = snapshot.step.graph;
  const body = panelRefs.graph.body;
  body.textContent = "";
  const wrap = element("div", "graph-wrap");
  const svg = svgElement("svg");
  svg.setAttribute("viewBox", "0 0 " + GRAPH_WIDTH + " " + GRAPH_HEIGHT);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  svg.setAttribute("role", "img");
  const places = graphGeometry(example);
  const cycle = graph.cycle || [];
  const edges = svgElement("g");
  const labels = svgElement("g");
  const taken = [];
  svg.appendChild(edges);

  Object.keys(graph.held).forEach(function (resourceId) {
    graph.held[resourceId].forEach(function (owner) {
      const from = places[resourceId];
      const to = places[owner];
      const geometry = drawEdge(edges, edgePoint(from, to), edgePoint(to, from), cycle.indexOf(resourceId + ">" + owner) !== -1);
      drawEdgeLabel(labels, taken, geometry, UI_TEXT.graph.assign);
    });
  });

  (graph.requests || []).forEach(function (pair) {
    const from = places[pair[0]];
    const to = places[pair[1]];
    const geometry = drawEdge(edges, edgePoint(from, to), edgePoint(to, from), cycle.indexOf(pair[0] + ">" + pair[1]) !== -1);
    drawEdgeLabel(labels, taken, geometry, UI_TEXT.graph.request);
  });

  const nodes = svgElement("g");
  example.resources.forEach(function (item) {
    const place = places[item.id];
    const box = svgElement("rect", "node-box");
    box.setAttribute("x", place.cx - place.w / 2);
    box.setAttribute("y", place.cy - place.h / 2);
    box.setAttribute("width", place.w);
    box.setAttribute("height", place.h);
    box.setAttribute("rx", 7);
    nodes.appendChild(box);
    const name = svgElement("text", "node-name");
    name.setAttribute("x", place.cx);
    name.setAttribute("y", place.cy - 7);
    name.setAttribute("text-anchor", "middle");
    name.setAttribute("dominant-baseline", "middle");
    name.textContent = item.id;
    nodes.appendChild(name);
    const taken = (graph.held[item.id] || []).length;
    const spacing = 15;
    for (let slot = 0; slot < item.instances; slot += 1) {
      const dot = svgElement("circle", slot < taken ? "slot taken" : "slot");
      dot.setAttribute("cx", place.cx + (slot - (item.instances - 1) / 2) * spacing);
      dot.setAttribute("cy", place.cy + 13);
      dot.setAttribute("r", 4.5);
      nodes.appendChild(dot);
    }
    if ((graph.shareable || []).indexOf(item.id) !== -1) {
      const inner = svgElement("rect", "slot-shared");
      inner.setAttribute("x", place.cx - place.w / 2 + 4);
      inner.setAttribute("y", place.cy - place.h / 2 + 4);
      inner.setAttribute("width", place.w - 8);
      inner.setAttribute("height", place.h - 8);
      inner.setAttribute("rx", 4);
      nodes.appendChild(inner);
      const why = svgElement("title");
      why.textContent = UI_TEXT.graph.shareable;
      box.appendChild(why);
    }
  });

  example.processes.forEach(function (item) {
    const place = places[item.id];
    const state = STATES[graph.states[item.id]];
    const circle = svgElement("circle", "node-circle");
    circle.setAttribute("cx", place.cx);
    circle.setAttribute("cy", place.cy);
    circle.setAttribute("r", place.r);
    circle.setAttribute("stroke", state.color);
    circle.setAttribute("fill", state.soft);
    nodes.appendChild(circle);
    const name = svgElement("text", "node-name");
    name.setAttribute("x", place.cx);
    name.setAttribute("y", place.cy);
    name.setAttribute("text-anchor", "middle");
    name.setAttribute("dominant-baseline", "central");
    name.textContent = item.id;
    nodes.appendChild(name);
    const label = svgElement("text", "node-state");
    label.setAttribute("x", place.cx);
    label.setAttribute("y", place.cy + place.r + 13);
    label.setAttribute("text-anchor", "middle");
    label.setAttribute("fill", state.color);
    label.textContent = state.label;
    nodes.appendChild(label);
  });

  svg.appendChild(nodes);
  svg.appendChild(labels);
  wrap.appendChild(svg);

  const legend = element("div", "graph-legend");
  UI_TEXT.graph.legend.forEach(function (item) {
    if (item.kind === "cycle" && cycle.length === 0) return;
    if (item.kind === "shareable" && (graph.shareable || []).length === 0) return;
    if (item.kind === "request" && (graph.requests || []).length === 0) return;
    const row = element("span", "item");
    if (item.token) row.appendChild(element("span", "token", item.token));
    else row.appendChild(element("span", item.kind === "shareable" ? "boxmark" : "rule"));
    row.appendChild(element("span", null, item.text));
    legend.appendChild(row);
  });
  wrap.appendChild(legend);
  if (snapshot.step.inequalities) {
    const list = element("div", "inequalities");
    snapshot.step.inequalities.forEach(function (text, index) {
      list.appendChild(element("div", "inequality" + (index === snapshot.step.inequalities.length - 1 && !snapshot.step.chain ? " fresh" : ""), text));
    });
    if (snapshot.step.chain) list.appendChild(element("div", "inequality chain", snapshot.step.chain));
    wrap.appendChild(list);
  }
  body.appendChild(wrap);
}

function statePill(name) {
  const state = STATES[name];
  const pill = element("span", "state-pill", state.label);
  pill.style.color = state.color;
  pill.style.borderColor = state.color;

function renderPool(snapshot) {
  const example = currentExample();
  const step = snapshot.step;
  const body = panelRefs.pool.body;
  body.textContent = "";

  const head = element("div", "pool-head");
  head.appendChild(element("span", "pool-title", UI_TEXT.pool.title));
  const available = element("div", "available" + (snapshot.fresh.available ? " fresh" : ""));
  available.appendChild(element("span", "caption", UI_TEXT.pool.availableCaption));
  available.appendChild(element("span", "value", String(step.pool.available)));
  head.appendChild(available);
  body.appendChild(head);

  const strip = element("div", "pool-strip");
  const cells = [];
  example.processes.forEach(function (item) {
    for (let index = 0; index < step.pool.rows[item.id].assigned; index += 1) cells.push(item.id);
  });
  while (cells.length < example.pool.instances) cells.push(null);
  cells.forEach(function (owner) {
    const cell = element("div", "pool-cell" + (owner ? " taken" : ""), owner || "");
    strip.appendChild(cell);
  });
  body.appendChild(strip);

  const rows = element("div", "pool-rows");
  const mode = example.pool.secondColumn;
  example.processes.forEach(function (item) {
    const data = step.pool.rows[item.id];
    const row = element("div", "pool-row");
    if (snapshot.fresh[item.id]) row.classList.add("fresh");
    if (data.done || data.killed) row.classList.add("done");
    row.appendChild(element("span", "who", item.id));
    const bar = element("div", "bar");
    const span = example.pool.instances;
    const filled = element("div", "fill");
    filled.style.width = (data.assigned / span * 100) + "%";
    bar.appendChild(filled);
    if (!data.done && !data.killed) {
      const reach = mode === "max" ? data.second : data.assigned + data.second;
      const ghost = element("div", "ghost");
      ghost.style.width = (reach / span * 100) + "%";
      bar.appendChild(ghost);
    }
    bar.appendChild(element("span", "caption", data.assigned > 0 ? String(data.assigned) : ""));
    row.appendChild(bar);
    const figures = element("span", "figures");
    let text;
    if (data.done || data.killed) text = UI_TEXT.pool.figuresDone;
    else if (mode === "max") text = fill(UI_TEXT.pool.figuresMax, { assigned: data.assigned, second: data.second, missing: data.second - data.assigned });
    else text = fill(UI_TEXT.pool.figuresAsk, { assigned: data.assigned, second: data.second });
    renderRich(figures, text);
    row.appendChild(figures);
    rows.appendChild(row);
  });
  body.appendChild(rows);
}

  body.textContent = "";
  const grid = element("div", "matrix-grid");
  grid.appendChild(matrixTable(UI_TEXT.matrices.max, step.matrices.max, example, snapshot, "max"));
  grid.appendChild(matrixTable(UI_TEXT.matrices.assigned, step.matrices.assigned, example, snapshot, "assigned"));
  grid.appendChild(matrixTable(UI_TEXT.matrices.need, step.matrices.need, example, snapshot, "need"));
  body.appendChild(grid);
  const vectors = element("div", "vector-row");
  vectors.appendChild(vectorBlock(UI_TEXT.matrices.total, example.matrices.total, false));
  vectors.appendChild(vectorBlock(UI_TEXT.matrices.available, step.matrices.available, snapshot.fresh.available));
  body.appendChild(vectors);
}

function renderOrdering(snapshot) {
  const example = currentExample();
  const step = snapshot.step;
  const body = panelRefs.ordering.body;
  body.textContent = "";

  const ranks = element("div", "ranks");
  example.ordering.ranks.forEach(function (entry) {
    const chip = element("span", "rank-chip");
    renderRich(chip, fill(UI_TEXT.ordering.rankCaption, { resource: entry.resource, rank: entry.rank }));
    ranks.appendChild(chip);
  });
  body.appendChild(ranks);

  const byProcess = {};
  example.ordering.requests.forEach(function (request, index) {
    byProcess[request.process] = byProcess[request.process] || [];
    byProcess[request.process].push({ request: request, index: index });
  });
  const depth = example.processes.reduce(function (most, item) {
    return Math.max(most, (byProcess[item.id] || []).length);
  }, 0);

  const scroll = element("div", "table-scroll");
  const table = element("table", "order-table");
  const head = element("tr");
  head.appendChild(element("th", null, ""));
  example.processes.forEach(function (item) { head.appendChild(element("th", null, item.id)); });
  table.appendChild(head);
  for (let rank = 0; rank < depth; rank += 1) {
    const row = element("tr");
    row.appendChild(element("td", "rank", fill(UI_TEXT.ordering.rowLabel, { n: rank + 1 })));
    example.processes.forEach(function (item) {
      const cell = element("td");
      const entry = (byProcess[item.id] || [])[rank];
      if (!entry) {
        cell.appendChild(element("span", "ask pending", UI_TEXT.ordering.pending));
        row.appendChild(cell);
        return;
      }
      const verdict = step.cells[entry.index];
      const chip = element("span", "ask " + (verdict === "pending" ? "pending" : verdict));
      chip.appendChild(element("span", null, fill(UI_TEXT.ordering.rankRow, {
        resource: entry.request.resource,
        rank: example.ordering.ranks.filter(function (item2) { return item2.resource === entry.request.resource; })[0].rank
      })));
      const marks = { ok: UI_TEXT.ordering.ok, no: UI_TEXT.ordering.no, pending: UI_TEXT.ordering.pending };
      const whys = { ok: UI_TEXT.ordering.okWhy, no: UI_TEXT.ordering.noWhy, pending: UI_TEXT.ordering.pendingWhy };
      chip.appendChild(element("span", "mark", marks[verdict]));
      chip.title = whys[verdict];
      if (entry.index === step.current) chip.classList.add("fresh");
      cell.appendChild(chip);
      row.appendChild(cell);
    });
    table.appendChild(row);
  }
  scroll.appendChild(table);
  body.appendChild(scroll);

}

function laneText(example, kind, actorId, short) {
  const table = short ? UI_TEXT.lanes.shortKinds : UI_TEXT.lanes.kinds;
  return fill(table[kind] || "", { who: actorId });
}

function renderLanes(snapshot) {
  const example = currentExample();
  const variant = currentVariant();
  const body = panelRefs.lanes.body;
  body.textContent = "";
  const units = example.lanes.units;
  const shown = snapshot.unit;
  const grid = element("div", "lane-grid");
  grid.style.gridTemplateColumns = "max-content repeat(" + units + ", minmax(0, 1fr))";

  if (example.lanes.counters) {
    const head = element("div", "board-head");
    example.lanes.counters.forEach(function (counter) {
      const item = element("span", "board-counter", fill(counter.text, snapshot.context));
      head.appendChild(item);
    });
    grid.appendChild(head);
  }

  laneActors(example).forEach(function (actor) {
    grid.appendChild(element("div", "lane-name", actor.label || actor.id));
    for (let unit = 0; unit < units; unit += 1) {
      const kind = unit < shown ? variant.program[actor.id][unit] : "pending";
      const segment = element("div", "lane-seg " + kind);
      if (unit === shown - 1 && kind !== "pending") segment.classList.add("fresh");
      const full = kind === "pending" ? "" : laneText(example, kind, actor.id, false);
      segment.textContent = full;
      segment.dataset.full = full;
      segment.dataset.short = kind === "pending" ? "" : laneText(example, kind, actor.id, true);
      if (full) segment.title = full;
      grid.appendChild(segment);
    }
  });

  grid.appendChild(element("div", "lane-name", ""));
  for (let unit = 0; unit < units; unit += 1) {
    const mark = element("div", "axis-mark");
    mark.appendChild(element("span", null, String(unit + 1)));
    grid.appendChild(mark);
  }
  body.appendChild(grid);

  const kinds = {};
  laneActors(example).forEach(function (actor) {
    variant.program[actor.id].slice(0, shown).forEach(function (kind) { kinds[kind] = true; });
  });
  const legend = element("div", "legend");
  UI_TEXT.lanes.legend.forEach(function (item) {
    if (!kinds[item.kind]) return;
    const row = element("span", "item");
    row.appendChild(element("span", "swatch " + item.kind));
    row.appendChild(element("span", null, item.text));
    legend.appendChild(row);
  });
  body.appendChild(legend);

  if (example.lanes.readouts && snapshot.last) {
    const readouts = element("div", "readouts");
    const table = element("table");
    const head = element("tr");
    example.lanes.readouts.headers.forEach(function (text, column) {
      const cell = element("th", column === variant.readoutColumn ? "here" : null, text);
      head.appendChild(cell);
    });
    table.appendChild(head);
    example.lanes.readouts.rows.forEach(function (cells) {
      const row = element("tr");
      cells.forEach(function (text, column) {
        const cell = element("td", column === 0 ? "label" : (column === variant.readoutColumn ? "here" : null), text);
        row.appendChild(cell);
      });
      table.appendChild(row);
    });
    readouts.appendChild(table);
    body.appendChild(readouts);
  }
}

function fitLadderLabels() {
  const labels = dom.exampleList.querySelectorAll("button .short");
  let widest = 0;
  Array.prototype.forEach.call(labels, function (label) {
    label.style.display = "inline";
    label.style.width = "auto";
    widest = Math.max(widest, label.getBoundingClientRect().width);
    label.style.display = "";
    label.style.width = "";
  });
  dom.exampleList.style.setProperty("--ladder-label", Math.ceil(widest) + "px");
}

function fitLaneLabels() {
  const lanes = panelRefs.lanes;
  if (!lanes) return;
  Array.prototype.forEach.call(lanes.body.querySelectorAll(".lane-seg"), function (segment) {
    const full = segment.dataset.full || "";
    if (!full) return;
    segment.textContent = full;
    if (segment.scrollWidth <= segment.clientWidth) return;
    segment.textContent = segment.dataset.short || "";
    if (segment.scrollWidth <= segment.clientWidth) return;
    segment.textContent = "";
  });
}

function renderTimeline(snapshot) {
  const example = currentExample();
  const step = snapshot.step;
  const body = panelRefs.timeline.body;
  body.textContent = "";
  const wrap = element("div", "timeline");
  const line = element("div", "lifeline");
  line.appendChild(element("div", "track"));
  const positions = [18, 54, 88];
  const walk = step.walk === null || step.walk === undefined ? null : example.strategies.walk[step.walk];
  UI_TEXT.timeline.marks.forEach(function (text, index) {
    const mark = element("div", "mark" + (walk && walk.stop === index ? " here" : ""));
    mark.style.left = positions[index] + "%";
    mark.appendChild(element("span", "caption", text));
    mark.appendChild(element("span", "dot"));
    line.appendChild(mark);
  });
  if (walk && walk.stop !== null) {
    const stop = element("div", "stop");
    stop.style.left = positions[walk.stop] + "%";
    stop.appendChild(element("span", "bar"));
    stop.appendChild(element("span", "who", example.strategies.columns[walk.column] + ": " + UI_TEXT.timeline.stopsHere));
    line.appendChild(stop);
  }
  wrap.appendChild(line);
  if (walk) {
    const asks = element("div", "asks-the");
    asks.appendChild(element("span", "tag", UI_TEXT.timeline.asksTag));
    renderRich(asks.appendChild(element("span", "line")), walk.asks);
    wrap.appendChild(asks);
    if (walk.stop === null) {
      const none = element("div", "case-ask", UI_TEXT.timeline.noStop);
      wrap.appendChild(none);
    }
  }
  body.appendChild(wrap);
}

function renderStrategies(snapshot) {
  const example = currentExample();
  const step = snapshot.step;
  const body = panelRefs.strategies.body;
  body.textContent = "";
  const shown = step.walk === null || step.walk === undefined ? -1 : step.walk;
  const scroll = element("div", "table-scroll");
  const table = element("table", "strategy-table");
  const head = element("tr");
  head.appendChild(element("th", null, ""));
  example.strategies.columns.forEach(function (name, column) {
    head.appendChild(element("th", column === shown ? "here" : null, name));
  });
  table.appendChild(head);
  example.strategies.rows.forEach(function (cells) {
    const row = element("tr");
    row.appendChild(element("td", "label", cells[0]));
    example.strategies.columns.forEach(function (name, column) {
      const revealed = column <= shown;
      const cell = element("td", revealed ? (column === shown ? "here" : null) : "pending", revealed ? cells[column + 1] : UI_TEXT.none);
      row.appendChild(cell);
    });
    table.appendChild(row);
  });
  scroll.appendChild(table);
  body.appendChild(scroll);
}

function renderCase(snapshot) {
  const example = currentExample();
  const step = snapshot.step;
  const body = panelRefs.caseText.body;
  body.textContent = "";
  renderRich(body.appendChild(element("p", "case-text")), step.text);
  const answer = currentAnswer();
  if (answer) {
    const again = element("button", null, UI_TEXT.quiz.change);
    again.type = "button";
    again.style.marginTop = "12px";
    again.style.padding = "6px 12px";
    again.style.fontSize = "13px";
    again.addEventListener("click", function () { clearAnswer(); });
    body.appendChild(again);
    return;
  }
  body.appendChild(element("p", "case-ask", UI_TEXT.quiz.ask));
  const list = element("div", "options");
  example.options.forEach(function (option) {
    const button = element("button");
    button.type = "button";
    button.appendChild(element("span", null, option.label));
    button.appendChild(element("span", "hint", option.hint));
    button.addEventListener("click", function () { answerWith(option.id); });
    list.appendChild(button);
  });
  body.appendChild(list);
}

function renderDiscards(snapshot) {
  const example = currentExample();
  const step = snapshot.step;
  const body = panelRefs.discards.body;
  body.textContent = "";
  const answer = currentAnswer();
  if (!answer) {
    body.appendChild(element("p", "case-ask", UI_TEXT.quiz.pickHint));
    return;
  }
  const correct = example.options.filter(function (option) { return option.id === step.correct; })[0];
  const chosen = example.options.filter(function (option) { return option.id === answer; })[0];
  const verdict = element("div", "verdict");
  [{ tag: UI_TEXT.quiz.chosenTag, text: chosen.label }, { tag: UI_TEXT.quiz.answeredTag, text: correct.label }].forEach(function (item) {
    const pair = element("span", "pair");
    pair.appendChild(element("span", "tag", item.tag));
    pair.appendChild(element("span", "line", item.text));
    verdict.appendChild(pair);
  });
  body.appendChild(verdict);
  const list = element("div", "discard-list");
  example.options.forEach(function (option) {
    const isCorrect = option.id === step.correct;
    const card = element("div", "discard" + (isCorrect ? " kept" : ""));
    const who = element("div", "who");
    who.appendChild(element("span", "name", option.label));
    who.appendChild(element("span", "verdict-tag", isCorrect ? UI_TEXT.quiz.keptTag : (option.id === answer ? UI_TEXT.quiz.chosenDiscardTag : UI_TEXT.quiz.discardedTag)));
    card.appendChild(who);
    renderRich(card.appendChild(element("p", "why")), step.why[option.id]);
    list.appendChild(card);
  });
  body.appendChild(list);
}

function takeawayBlock(text) {
  const box = element("div", "takeaway");
  box.appendChild(element("span", "tag", UI_TEXT.takeawayTag));
  renderRich(box.appendChild(element("span", "line")), text);
  return box;
}

function compareBlock(compare, context) {
  const wrapper = element("div", "compare");
  const table = element("table");
  const head = element("tr");
  compare.headers.forEach(function (text) {
    renderRich(head.appendChild(element("th")), fill(text, context));
  });
  table.appendChild(head);
  compare.rows.forEach(function (cells) {
    const row = element("tr");
    cells.forEach(function (text, column) {
      renderRich(row.appendChild(element("td", column === 0 ? "label" : null)), fill(text, context));
    });
    table.appendChild(row);
  });
  wrapper.appendChild(table);
  return wrapper;
}

function renderNarration(snapshot) {
  const example = currentExample();
  dom.narration.textContent = "";
  dom.narration.classList.toggle("with-extras", snapshot.last === true);
  dom.narration.classList.toggle("no-compare", snapshot.last === true && !example.compare);
  const main = element("div", "narration-main");
  renderRich(main.appendChild(element("p", "narration-text")), snapshot.narration);
  if (snapshot.note) renderRich(main.appendChild(element("p", "narration-note")), snapshot.note);
  if (view.stepIndex === 0 && example.stepUnitNote) {
    renderRich(main.appendChild(element("p", "narration-note")), example.stepUnitNote);
  }
  dom.narration.appendChild(main);
  if (!snapshot.last) return;
  if (example.compare) {
    const table = compareBlock(example.compare, snapshot.context);
    table.classList.add("full");
    dom.narration.appendChild(table);
  }
  const extras = element("div", "narration-extras");
  extras.appendChild(takeawayBlock(fill(example.closing, snapshot.context)));
  dom.narration.appendChild(extras);
}

function render() {
  const example = currentExample();
  const snapshot = currentSnapshot();
  const total = totalSteps();
  buildCanvas();
  dom.title.textContent = example.number + ". " + example.title;
  dom.subtitle.textContent = example.subtitle;
  dom.stepUnit.textContent = example.stepUnit;
  renderHeaderChoices();
  panelsOf(activeCanvas()).forEach(function (id) { PANELS[id](snapshot); });
  renderNarration(snapshot);
  dom.progress.textContent = fill(UI_TEXT.progress, { current: view.stepIndex + 1, total: total });
  dom.progressFill.style.transform = "scaleX(" + ((view.stepIndex + 1) / total) + ")";
  dom.first.disabled = view.stepIndex === 0;
  dom.prev.disabled = view.stepIndex === 0;
  dom.next.disabled = view.stepIndex === total - 1;
  dom.last.disabled = view.stepIndex === total - 1;
  dom.play.textContent = view.playing ? UI_TEXT.pause : UI_TEXT.play;
  Array.prototype.forEach.call(dom.exampleList.querySelectorAll("button"), function (button, position) {
    button.setAttribute("aria-current", position === view.exampleIndex ? "true" : "false");
  });
  fitLaneLabels();
}

function goTo(index) {
  const total = totalSteps();
  view.stepIndex = Math.max(0, Math.min(index, total - 1));
  render();
  if (view.playing && view.stepIndex === total - 1) stopPlaying();
}

function answerWith(id) {
  view.answers[answerKey()] = id;
  render();
}

function clearAnswer() {
  delete view.answers[answerKey()];
  render();
}

function selectExample(index) {
  stopPlaying();
  view.exampleIndex = index;
  view.variantIndex = 0;
  view.stepIndex = 0;
  render();
}

function selectVariant(index) {
  stopPlaying();
  view.variantIndex = index;
  view.stepIndex = 0;
  render();
}

function stopPlaying() {
  view.playing = false;
  if (view.timer) { clearTimeout(view.timer); view.timer = null; }
  dom.play.textContent = UI_TEXT.play;
}

function scheduleTick() {
  if (view.timer) clearTimeout(view.timer);
  view.timer = setTimeout(function () {
    if (!view.playing) return;
    if (view.stepIndex >= totalSteps() - 1) { stopPlaying(); render(); return; }
    goTo(view.stepIndex + 1);
    if (view.playing) scheduleTick();
  }, AUTOPLAY_DELAY);
}

function startPlaying() {
  view.playing = true;
  scheduleTick();
  render();
}

function togglePlaying() {
  if (view.playing) { stopPlaying(); render(); return; }
  startPlaying();
}

function lookupTooltip(key) {
  if (key.indexOf("panel:") === 0) return PANEL_TIPS[key.slice(6)];
  return TOOLTIPS[key];
}

function showTooltip(trigger, tip) {
  dom.tooltip.textContent = "";
  dom.tooltip.appendChild(element("strong", "tip-title", tip.title));
  dom.tooltip.appendChild(document.createTextNode(tip.body));
  dom.tooltip.classList.add("open");
  const box = trigger.getBoundingClientRect();
  const width = dom.tooltip.offsetWidth;
  const height = dom.tooltip.offsetHeight;
  let left = box.left + box.width / 2 - width / 2;
  left = Math.min(left, window.innerWidth - width - 8);
  let top = box.top - height - 8;
  if (top < 8) top = box.bottom + 8;
  dom.tooltip.style.left = Math.max(8, left) + "px";
  dom.tooltip.style.top = top + "px";
}

function hideTooltip() { dom.tooltip.classList.remove("open"); }

function closestElement(target, selector) {
  return target && typeof target.closest === "function" ? target.closest(selector) : null;
}

["mouseover", "focusin"].forEach(function (name) {
  document.addEventListener(name, function (event) {
    const trigger = closestElement(event.target, "[data-tip]");
    const tip = trigger ? lookupTooltip(trigger.dataset.tip) : null;
    if (tip) showTooltip(trigger, tip);
    else hideTooltip();
  });
});

["mouseout", "focusout", "scroll"].forEach(function (name) {
  document.addEventListener(name, hideTooltip, true);
});

dom.first.addEventListener("click", function () { stopPlaying(); goTo(0); });
dom.prev.addEventListener("click", function () { stopPlaying(); goTo(view.stepIndex - 1); });
dom.next.addEventListener("click", function () { stopPlaying(); goTo(view.stepIndex + 1); });
dom.last.addEventListener("click", function () { stopPlaying(); goTo(totalSteps() - 1); });
dom.play.addEventListener("click", togglePlaying);

document.addEventListener("keydown", function (event) {
  if (event.target && event.target.tagName === "BUTTON" && (event.key === " " || event.key === "Enter")) return;
  if (event.key === "ArrowRight") { stopPlaying(); goTo(view.stepIndex + 1); event.preventDefault(); }
  if (event.key === "ArrowLeft") { stopPlaying(); goTo(view.stepIndex - 1); event.preventDefault(); }
  if (event.key === "Home") { stopPlaying(); goTo(0); event.preventDefault(); }
  if (event.key === "End") { stopPlaying(); goTo(totalSteps() - 1); event.preventDefault(); }
  if (event.key === "Escape") hideTooltip();
});

window.addEventListener("resize", fitLaneLabels);

dom.first.textContent = UI_TEXT.firstStep;
dom.prev.textContent = UI_TEXT.prevStep;
dom.next.textContent = UI_TEXT.nextStep;
dom.last.textContent = UI_TEXT.lastStep;
dom.play.textContent = UI_TEXT.play;

Object.keys(UI_TEXT.panels).forEach(function (id) {
  if (!PANELS[id]) console.error("El panel " + id + " tiene nombre pero no tiene dibujo");
});

Object.keys(PANELS).forEach(function (id) {
  if (!UI_TEXT.panels[id]) console.error("El panel " + id + " tiene dibujo pero no tiene nombre");
});

renderExampleList();
fitLadderLabels();
render();
</script>
</body>
