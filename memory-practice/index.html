<title>Práctica avanzada de memoria</title>
<style>
  :root {

  .grid-table tr.focus td.role-page, .grid-table tr.focus td.role-frame, .grid-table tr.focus td.role-segment, .grid-table tr.focus td.role-pid, .grid-table tr.focus td.role-outer { color: inherit; }
  .grid-table tr.focus td:first-child { box-shadow: inset 3px 0 0 var(--marked); border-radius: 5px 0 0 5px; }

  .legend { display: flex; flex-wrap: wrap; gap: 3px 14px; margin-top: 9px; }
  .legend .item { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--muted); }

  .legend .swatch.unknown { border-color: var(--line-strong); border-style: dashed; background: var(--card); }

  .strip-wrap { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .strip { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 220px; border-radius: 6px; }

  .block {
    position: relative;
    min-height: 26px;

  }

  .block:first-child { border-top-width: 1.5px; border-radius: 6px 6px 0 0; }

  .block .name { font-weight: 750; white-space: nowrap; }

  .list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }

  .list li {

    align-items: baseline;

  .list li.used { color: var(--muted); }
  .list li.used .state { color: var(--ink-soft); }
  .empty-list { margin: 0; font-size: 13.5px; color: var(--muted); }

  footer { flex: 0 0 auto; display: block; min-height: 0; }

  .narration-panel { display: flex; flex-direction: column; min-height: 0; height: 100%; }

  .narration-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    padding: 8px 12px 7px;
    border-bottom: 1px solid var(--line);
  }

  .narration-head .title { font-weight: 660; font-size: 14.5px; }

  .step-unit {
    font-size: 11px;

  }

  }

  .narration-extras { min-width: 0; min-height: 0; overflow-y: auto; }

  .narration-text { font-size: 15.5px; margin: 0; color: var(--ink); }

  }

  .takeaway .line { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }

  .ask-box { padding: 6px 11px 8px; border: 2px solid var(--ink); border-radius: 8px; }

    font-weight: 620;
    line-height: 1.3;
    box-shadow: var(--shadow);
  }

  .ask-result { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }

<script id="engine">
const USED_TIPS = {};

function fill(template, values) {
  return String(template).replace(/\{(\w+)\}/g, function (whole, key) {
    return values[key] === undefined || values[key] === null ? whole : String(values[key]);
  });
}

function unresolved(text) {
  return /\{\w+\}/.test(String(text));
}

function unbalanced(text) {
  const stars = String(text).split("*").length - 1;
  const opens = String(text).split("[[").length - 1;
  const closes = String(text).split("]]").length - 1;
  return stars % 2 !== 0 || opens !== closes;
}

function power(bits) {
  return Math.pow(2, bits);
}

function slice(value, lowBits, bits) {
  return Math.floor(value / power(lowBits)) % power(bits);
}

function groupThousands(value) {
  const text = String(value);
  if (text.length < 5) return text;
  return text.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function formatNumber(value, hexDigits) {
  if (value === null || value === undefined) return UI_TEXT.unknownValue;
  if (typeof value === "string") return value;
  if (hexDigits) {
    let text = value.toString(16).toUpperCase();
    while (text.length < hexDigits) text = "0" + text;
    return text + "h";
  }
  return groupThousands(value);
}

function binary(value, bits) {
  let text = value.toString(2);
  while (text.length < bits) text = "0" + text;
  return text;
}

function phaseRank(type, phase) {
  return PHASES[type].indexOf(phase);
}

function tableBlock(columns, roles, rows, extra) {
  return Object.assign({ columns: columns, roles: roles, rows: rows }, extra || {});
}

function segPagingMachine(example, address, phase) {
  const machine = example.machine;
  const pageSize = power(machine.offsetBits);
  const span = power(machine.pageBits + machine.offsetBits);
  const rank = phaseRank("segPaging", phase);
  const has = address !== null && address !== undefined;
  const segment = has ? slice(address, machine.pageBits + machine.offsetBits, machine.segBits) : null;
  const page = has ? slice(address, machine.offsetBits, machine.pageBits) : null;
  const offset = has ? address % pageSize : null;
  const inside = has ? address % span : null;
  const entry = has ? machine.segments[segment] : null;
  const within = Boolean(entry) && inside < entry.limit;
  const perm = entry ? UI_TEXT.perms[entry.perm] : null;
  const permitted = Boolean(perm) && perm.allows.indexOf(machine.access) !== -1;
  const frame = entry && entry.pages[page] !== undefined ? entry.pages[page] : null;
  const limitChecked = has && rank >= 3;
  const permChecked = has && rank >= 4 && within;
  let failure = null;
  if (limitChecked && !within) failure = "segfault";
  else if (permChecked && !permitted) failure = "protection";
  const pageLooked = has && rank >= 5 && !failure;
  const composed = has && rank >= 6 && !failure && frame !== null;
  const physical = frame === null ? null : frame * pageSize + offset;
  const context = {
    direccion: has ? formatNumber(address) : null,
    segmento: segment,
    pagina: page,
    desp: has ? formatNumber(offset) : null,
    dentro: has ? formatNumber(inside) : null,
    tam: formatNumber(pageSize),
    limite: entry ? formatNumber(entry.limit) : null,
    acceso: UI_TEXT.access[machine.access],
    permiso: perm ? perm.label : null,
    marco: frame,
    fisica: physical === null ? null : formatNumber(physical)
  };
  const views = {};
  if (has) {
    const lines = [{
      caption: "logical",
      value: address,
      fields: [
        { role: "segment", bits: machine.segBits, value: rank >= 2 ? segment : null },
        { role: "page", bits: machine.pageBits, value: rank >= 2 ? page : null },
        { role: "offset", bits: machine.offsetBits, value: rank >= 2 ? offset : null }
      ]
    }];
    if (limitChecked) {
      lines.push({ kind: "equation", status: within ? "ok" : "fail", text: fill(within ? UI_TEXT.equations.limit : UI_TEXT.equations.limitFail, context) });
    }
    if (permChecked) {
      lines.push({ kind: "equation", status: permitted ? "ok" : "fail", text: fill(UI_TEXT.equations.perm, context) });
    }
    if (failure === "segfault") lines.push({ kind: "verdict", text: fill(UI_TEXT.verdicts.segfault, context) });
    if (failure === "protection") lines.push({ kind: "verdict", text: fill(UI_TEXT.verdicts.protection, context) });
    if (!failure) {
      lines.push({
        caption: "physical",
        value: composed ? physical : null,
        pending: true,
        fields: [
          { role: "frame", bits: null, value: pageLooked ? frame : null },
          { role: "offset", bits: null, value: pageLooked ? offset : null }
        ]
      });
    }
    if (composed) lines.push({ kind: "equation", status: "ok", text: fill(UI_TEXT.equations.framePhysical, context) });
    views.address = { lines: lines };
  }
  const segmentRows = machine.segments.map(function (item, index) {
    return [String(index), formatNumber(item.limit), UI_TEXT.perms[item.perm].label];
  });
  views.segmentTable = { tables: [tableBlock(["segment", "limit", "perms"], ["segment", null, null], segmentRows, {
    highlight: limitChecked && !failure ? [segment] : [],
    faultRow: failure ? segment : null
  })] };
  views.pageTables = { tables: machine.segments.map(function (item, index) {
    const pages = Object.keys(item.pages).map(Number).sort(function (one, other) { return one - other; });
    return tableBlock(["page", "frame"], ["page", "frame"], pages.map(function (number) { return [String(number), String(item.pages[number])]; }), {
      caption: fill(UI_TEXT.segmentCaption, { n: index }),
      active: pageLooked && index === segment,
      highlight: pageLooked && index === segment ? [pages.indexOf(page)] : []
    });
  }) };
  let outcome = null;
  if (failure) outcome = failure;
  else if (composed) outcome = physical;
  return { views: views, context: context, outcome: outcome };
}

const MACHINES = {
  segPaging: segPagingMachine
};

function nextUse(refs, from, page) {
  for (let index = from; index < refs.length; index += 1) {
    if (refs[index].page === page) return index;
  }
  return Infinity;
}

function pickVictim(algorithm, slots, state, refs, position) {
  const count = slots.length;
  if (algorithm === "fifo" || algorithm === "lru") {
    const key = algorithm === "fifo" ? "loaded" : "used";
    let chosen = 0;
    slots.forEach(function (slot, index) { if (slot[key] < slots[chosen][key]) chosen = index; });
    return chosen;
  }
  if (algorithm === "optimal") {
    let chosen = 0;
    let farthest = -1;
    slots.forEach(function (slot, index) {
      const when = nextUse(refs, position + 1, slot.page);
      if (when > farthest) { farthest = when; chosen = index; }
    });
    return chosen;
  }
  if (algorithm === "clock") {
    for (let guard = 0; guard < count * 2 + 1; guard += 1) {
      const slot = slots[state.pointer];
      if (slot.u === 0) return state.pointer;
      slot.u = 0;
      state.pointer = (state.pointer + 1) % count;
    }
    return null;
  }
  for (let round = 0; round < 2; round += 1) {
    for (let step = 0; step < count; step += 1) {
      const index = (state.pointer + step) % count;
      if (slots[index].u === 0 && slots[index].m === 0) return index;
    }
    for (let step = 0; step < count; step += 1) {
      const index = (state.pointer + step) % count;
      if (slots[index].u === 0 && slots[index].m === 1) return index;
      slots[index].u = 0;
    }
  }
  return null;
}

function runReplacement(fact) {
  const slots = fact.slots.map(function (slot) { return slot ? Object.assign({}, slot) : null; });
  const state = { pointer: fact.pointer || 0 };
  let time = 0;
  slots.forEach(function (slot) { if (slot) time = Math.max(time, slot.loaded || 0, slot.used || 0); });
  const victims = [];
  let faults = 0;
  let writes = 0;
  fact.refs.forEach(function (ref, position) {
    time += 1;
    const found = slots.findIndex(function (slot) { return slot && slot.page === ref.page; });
    if (found !== -1) {
      slots[found].u = 1;
      slots[found].used = time;
      if (ref.write) slots[found].m = 1;
      victims.push(null);
      return;
    }
    faults += 1;
    let target = slots.indexOf(null);
    if (target === -1) {
      target = pickVictim(fact.algorithm, slots, state, fact.refs, position);
      victims.push(slots[target].page);
      if (slots[target].m === 1) writes += 1;
      state.pointer = (target + 1) % slots.length;
    } else {
      victims.push(null);
    }
    slots[target] = { page: ref.page, u: 1, m: ref.write ? 1 : 0, loaded: time, used: time };
  });
  return {
    victims: victims,
    faults: faults,
    writes: writes,
    pages: slots.map(function (slot) { return slot ? slot.page : null; }),
    bits: slots.map(function (slot) { return slot ? [slot.u, slot.m] : null; }),
    pointer: state.pointer
  };
}

function sameValue(one, other) {
  return JSON.stringify(one) === JSON.stringify(other);
}

function verifyFact(fact, problems) {
  if (fact.kind === "physical") {
    const physical = fact.frame * fact.pageSize + fact.offset;
    if (physical !== fact.expect) problems.push("la física del marco " + fact.frame + " con desplazamiento " + fact.offset + " da " + physical + ", no " + fact.expect);
    if (fact.address !== undefined && fact.address % fact.pageSize !== fact.offset) problems.push("el desplazamiento de " + fact.address + " no es " + fact.offset);
    if (fact.address !== undefined && fact.page !== undefined && Math.floor(fact.address / fact.pageSize) % power(fact.pageBits || 32) !== fact.page) problems.push("la dirección " + fact.address + " no es de la página " + fact.page);
    return;
  }
  if (fact.kind === "page") {
    const page = Math.floor(fact.address / fact.pageSize);
    if (page !== fact.expect) problems.push("la dirección " + fact.address + " es de la página " + page + ", no de la " + fact.expect);
    return;
  }
  if (fact.kind === "replacement") {
    const result = runReplacement(fact);
    if (fact.expect) {
      Object.keys(fact.expect).forEach(function (key) {
        if (!sameValue(result[key], fact.expect[key])) problems.push(fact.algorithm + " da " + key + " = " + JSON.stringify(result[key]) + ", y el ejemplo dice " + JSON.stringify(fact.expect[key]));
      });
    }
    if (fact.expectNot && sameValue(result.pages, fact.expectNot.pages)) problems.push(fact.algorithm + " llega al estado final, y el ejemplo dice que no puede");
    return;
  }
  problems.push("hay un hecho de tipo " + fact.kind + ", que el recurso no sabe comprobar");
}

function verifyFacts(example, problems) {

}

function mergeViews(previous, declared) {

}

function snapshotsOf(example, steps) {

      context = result.context;
      outcome = result.outcome;
    }
    ACCUMULATING.forEach(function (id) {

      lists[id] = lists[id].concat(added);
      views[id] = { lines: lists[id].slice(), fresh: added.length };

    const snapshot = {
      step: step,
      index: index,
      last: index === steps.length - 1,
      views: views,
      previousViews: previous ? previous.views : {},

      outcome: outcome,

function verifyTables(snapshots, problems) {

function verifyAsks(example, steps, problems) {
  steps.forEach(function (step, index) {
    if (!step.ask) return;
    const ids = step.ask.options.map(function (option) { return option.id; });
    if (ids.indexOf(step.ask.correct) === -1) problems.push("la pregunta del paso " + (index + 1) + " no tiene entre las opciones a la correcta");
    if (new Set(ids).size !== ids.length) problems.push("la pregunta del paso " + (index + 1) + " repite una opción");
    if (step.ask.options.length < 2) problems.push("la pregunta del paso " + (index + 1) + " tiene menos de dos opciones");
    step.ask.options.forEach(function (option) {
      if (!option.why) problems.push("una opción del paso " + (index + 1) + " no explica por qué");
      verifyText("una opción del paso " + (index + 1), option.text + " " + option.why, problems);
    });
    verifyText("la pregunta del paso " + (index + 1), step.ask.question, problems);
    if (index === steps.length - 1) problems.push("el último paso tiene una pregunta, y ahí va la frase de cierre");
  });
}

function canvasPanels(canvas) {
  const flat = [];
  canvas.panels.forEach(function (entry) {
    if (Array.isArray(entry)) entry.forEach(function (id) { flat.push(id); });
    else flat.push(entry);
  });
  return flat;
}

function verifyStructure(example, steps, snapshots, problems) {
  if (!example.closing) problems.push("no tiene frase de cierre");
  if (!example.stepUnit) problems.push("no declara la unidad del paso");
  if (!example.source) problems.push("no dice de qué parcial o guía viene");
  if (steps.length === 0) problems.push("no tiene pasos");
  const panels = canvasPanels(example.canvas);
  panels.forEach(function (id) {
    if (!UI_TEXT.panels[id]) problems.push("usa el panel " + id + ", que no tiene nombre");
    if (!PANEL_TIPS[id]) problems.push("usa el panel " + id + ", que no tiene globito");
  });
  snapshots.forEach(function (snapshot, index) {
    if (!snapshot.step.narration) problems.push("el paso " + (index + 1) + " no tiene narración");
    panels.forEach(function (id) {
      if (!snapshot.views[id]) problems.push("en el paso " + (index + 1) + " el panel " + id + " no tiene nada que mostrar");

  });
  if (example.clues) {
    const used = steps.filter(function (step) { return step.clue !== undefined; }).map(function (step) { return step.clue; });
    if (new Set(used).size !== example.clues.length) problems.push("no se usan todas las pistas, o alguna se usa dos veces");

function buildExample(example) {
  const problems = [];
  const snapshots = snapshotsOf(example, example.steps);
  verifyStructure(example, example.steps, snapshots, problems);
  verifyTexts(example, snapshots, problems);
  verifyFieldLines(snapshots, problems);
  verifyTables(snapshots, problems);
  verifyMachine(example, snapshots, problems);

const BUILT_EXAMPLES = EXAMPLES.map(buildExample);

(function verifyGroupsAreContiguous() {
  const seen = [];
  EXAMPLES.forEach(function (example) {
    if (seen[seen.length - 1] === example.group) return;
    if (seen.indexOf(example.group) !== -1) console.error("El grupo " + example.group + " aparece cortado en dos tramos de la escalera");

BUILT_EXAMPLES.forEach(function (built) {
  built.problems.forEach(function (problem) {
    console.error("Ejemplo " + built.example.number + ": " + problem);
  });

Object.keys(TOOLTIPS).forEach(function (key) {
  if (!USED_TIPS[key]) console.error("El globito " + key + " está escrito y ninguna narración lo invoca");
});

}

function askBlock(ask) {
  const box = element("div", "ask-box");
  box.appendChild(element("span", "tag", UI_TEXT.ask.tag));
  renderRich(box.appendChild(element("p", "question")), ask.question);
  const chosen = currentAnswer();
  if (!chosen) {
    const options = element("div", "ask-options");
    ask.options.forEach(function (option) {
      const button = element("button", null, option.text);
      button.type = "button";
      button.addEventListener("click", function () { answerWith(option.id); });
      options.appendChild(button);
    });
    box.appendChild(options);
    return box;
  }
  const picked = ask.options.find(function (option) { return option.id === chosen; });
  const right = ask.options.find(function (option) { return option.id === ask.correct; });
  const result = element("div", "ask-result");
  const mine = element("p", "answer " + (chosen === ask.correct ? "right" : "wrong"));
  mine.appendChild(element("span", "head", (chosen === ask.correct ? UI_TEXT.ask.right : UI_TEXT.ask.wrong) + " " + picked.text));
  renderRich(mine.appendChild(element("span")), picked.why);
  result.appendChild(mine);
  if (chosen !== ask.correct) {
    const good = element("p", "answer right");
    good.appendChild(element("span", "head", fill(UI_TEXT.ask.correctIs, { text: right.text })));
    renderRich(good.appendChild(element("span")), right.why);
    result.appendChild(good);
  }
  const retry = element("button", "retry", UI_TEXT.ask.retry);
  retry.type = "button";
  retry.addEventListener("click", clearAnswer);
  result.appendChild(retry);
  box.appendChild(result);
  return box;
}

function renderNarration(snapshot) {
  const example = currentExample();
  const ask = snapshot.step.ask;
  dom.narration.textContent = "";
  dom.narration.classList.toggle("with-extras", snapshot.last === true || Boolean(ask));
  dom.narration.classList.toggle("no-compare", snapshot.last === true && !example.compare);
  dom.narration.classList.toggle("asking", Boolean(ask) && !snapshot.last);
  const main = element("div", "narration-main");
  renderRich(main.appendChild(element("p", "narration-text")), snapshot.narration);
  if (snapshot.note) renderRich(main.appendChild(element("p", "narration-note")), snapshot.note);
  if (view.stepIndex === 0 && example.stepUnitNote) renderRich(main.appendChild(element("p", "narration-note")), example.stepUnitNote);
  dom.narration.appendChild(main);
  if (ask) {
    const extras = element("div", "narration-extras");
    extras.appendChild(askBlock(ask));
    dom.narration.appendChild(extras);
    return;
  }
  if (!snapshot.last) return;
  if (example.compare) {
    const table = compareBlock(example.compare);
    table.classList.add("full");
    dom.narration.appendChild(table);
  }
  const extras = element("div", "narration-extras");
  extras.appendChild(takeawayBlock(example.closing));
  dom.narration.appendChild(extras);
}

function render() {
  const example = currentExample();
  const snapshot = currentSnapshot();
  const total = totalSteps();
  buildCanvas();
  dom.title.textContent = example.number + ". " + example.title;
  dom.subtitle.textContent = example.subtitle;
  dom.stepUnit.textContent = example.stepUnit;
  Object.keys(panelRefs).forEach(function (id) { PANELS[id](snapshot, id); });
  renderNarration(snapshot);
  dom.progress.textContent = fill(UI_TEXT.progress, { current: view.stepIndex + 1, total: total });
  dom.progressFill.style.transform = "scaleX(" + ((view.stepIndex + 1) / total) + ")";
  dom.first.disabled = view.stepIndex === 0;
  dom.prev.disabled = view.stepIndex === 0;
  dom.next.disabled = view.stepIndex === total - 1;
  dom.last.disabled = view.stepIndex === total - 1;
  dom.play.textContent = view.playing ? UI_TEXT.pause : UI_TEXT.play;
  Array.prototype.forEach.call(dom.exampleList.querySelectorAll("button"), function (button, position) {
    button.setAttribute("aria-current", position === view.exampleIndex ? "true" : "false");
  });
}

function goTo(index) {
  const total = totalSteps();
  view.stepIndex = Math.max(0, Math.min(index, total - 1));
  render();
  if (view.playing && view.stepIndex === total - 1) stopPlaying();
}

function answerWith(id) {
  view.answers[answerKey()] = id;
  writeStore();
  render();
  const retry = dom.narration.querySelector(".retry");
  if (retry) retry.focus();
}

function clearAnswer() {
  delete view.answers[answerKey()];
  writeStore();
  render();
  const first = dom.narration.querySelector(".ask-options button");
  if (first) first.focus();
}

function selectExample(index) {
  stopPlaying();
  view.exampleIndex = index;
  view.stepIndex = 0;
  render();
}

function stopPlaying() {
  view.playing = false;
  if (view.timer) { clearTimeout(view.timer); view.timer = null; }
  dom.play.textContent = UI_TEXT.play;
}

function scheduleTick() {
  if (view.timer) clearTimeout(view.timer);
  view.timer = setTimeout(function () {
    if (!view.playing) return;
    if (view.stepIndex >= totalSteps() - 1) { stopPlaying(); render(); return; }
    goTo(view.stepIndex + 1);
    if (view.playing) scheduleTick();
  }, AUTOPLAY_DELAY);
}

function startPlaying() {
  view.playing = true;
  scheduleTick();
  render();
}

function togglePlaying() {
  if (view.playing) { stopPlaying(); render(); return; }
  startPlaying();
}

function lookupTooltip(key) {
  if (key.indexOf("panel:") === 0) return PANEL_TIPS[key.slice(6)];
  return TOOLTIPS[key];
}

function showTooltip(trigger, tip) {
  dom.tooltip.textContent = "";
  dom.tooltip.appendChild(element("strong", "tip-title", tip.title));
  dom.tooltip.appendChild(document.createTextNode(tip.body));
  dom.tooltip.classList.add("open");
  const box = trigger.getBoundingClientRect();
  const width = dom.tooltip.offsetWidth;
  const height = dom.tooltip.offsetHeight;
  let left = box.left + box.width / 2 - width / 2;
  left = Math.min(left, window.innerWidth - width - 8);
  let top = box.top - height - 8;
  if (top < 8) top = box.bottom + 8;
  dom.tooltip.style.left = Math.max(8, left) + "px";
  dom.tooltip.style.top = top + "px";
}

function hideTooltip() { dom.tooltip.classList.remove("open"); }

function closestElement(target, selector) {
  return target && typeof target.closest === "function" ? target.closest(selector) : null;
}

["mouseover", "focusin"].forEach(function (name) {
  document.addEventListener(name, function (event) {
    const trigger = closestElement(event.target, "[data-tip]");
    const tip = trigger ? lookupTooltip(trigger.dataset.tip) : null;
    if (tip) showTooltip(trigger, tip);
    else hideTooltip();
  });
});

["mouseout", "focusout", "scroll"].forEach(function (name) {
  document.addEventListener(name, hideTooltip, true);
});

dom.first.addEventListener("click", function () { stopPlaying(); goTo(0); });
dom.prev.addEventListener("click", function () { stopPlaying(); goTo(view.stepIndex - 1); });
dom.next.addEventListener("click", function () { stopPlaying(); goTo(view.stepIndex + 1); });
dom.last.addEventListener("click", function () { stopPlaying(); goTo(totalSteps() - 1); });
dom.play.addEventListener("click", togglePlaying);

document.addEventListener("keydown", function (event) {
  if (event.target && event.target.tagName === "BUTTON" && (event.key === " " || event.key === "Enter")) return;
  if (event.key === "ArrowRight") { stopPlaying(); goTo(view.stepIndex + 1); event.preventDefault(); }
  if (event.key === "ArrowLeft") { stopPlaying(); goTo(view.stepIndex - 1); event.preventDefault(); }
  if (event.key === "Home") { stopPlaying(); goTo(0); event.preventDefault(); }
  if (event.key === "End") { stopPlaying(); goTo(totalSteps() - 1); event.preventDefault(); }
  if (event.key === "Escape") hideTooltip();
});

dom.pageTitle.textContent = UI_TEXT.pageTitle;
dom.first.textContent = UI_TEXT.firstStep;
dom.prev.textContent = UI_TEXT.prevStep;
dom.next.textContent = UI_TEXT.nextStep;
dom.last.textContent = UI_TEXT.lastStep;
dom.play.textContent = UI_TEXT.play;

Object.keys(UI_TEXT.panels).forEach(function (id) {
  if (!PANELS[id]) console.error("El panel " + id + " tiene nombre pero no tiene dibujo");
});

Object.keys(PANELS).forEach(function (id) {
  if (!UI_TEXT.panels[id]) console.error("El panel " + id + " tiene dibujo pero no tiene nombre");
});

renderExampleList();
render();
</script>
</body>
</html>
