function signature(item) {
  return JSON.stringify(item);
}

function markTables(view, before) {
  if (!view.track || !before || !before.tables) return;
  view.tables.forEach(function (block) {
    if (!block.track) return;
    const old = before.tables.find(function (one) { return one.caption === block.caption; });
    if (!old) return;
    block.highlight = (block.highlight || []).slice();
    block.rows.forEach(function (row, index) {
      const same = old.rows.some(function (other) { return signature(other) === signature(row); });
      if (!same && block.highlight.indexOf(index) === -1) block.highlight.push(index);
    });
  });
}

function markChanges(views, previous) {
  if (!previous) return;
  Object.keys(views).forEach(function (id) {
    const view = views[id];
    const before = previous[id];
    if (!view || !before || view.kind !== before.kind) return;
    if (view.kind === "tables") markTables(view, before);
    if (view.kind === "disk") {
      view.blocks.forEach(function (block, index) {
        const old = before.blocks[index];
        if (!old) return;
        const now = Object.assign({}, block, { focus: false, mark: "", who: "" });
        const was = Object.assign({}, old, { focus: false, mark: "", who: "" });
        if (signature(now) !== signature(was)) block.focus = true;
      });
    }
    if (view.kind === "counters") {
      view.items.forEach(function (item, index) { if (before.items[index] && before.items[index].value !== item.value) item.fresh = true; });
    }
    if (view.kind === "actors") {
      view.rows.forEach(function (row, index) { if (before.rows[index] && before.rows[index].state !== row.state) row.fresh = true; });
    }
    if (view.kind === "bits") {
      view.groups.forEach(function (group, at) {
        const old = before.groups[at];
        if (!old) return;
        group.bits.forEach(function (bit, index) { if (old.bits[index] && old.bits[index].v !== bit.v) bit.focus = true; });
      });
    }
  });
}

function snapshotsOf(example, steps, problems) {
  const model = MODELS[example.model.type];
  if (!model) { problems.push("usa el modelo " + example.model.type + ", que no existe"); return []; }
  const state = model.init(example.model, problems);
  const snapshots = [];
  const calcLines = [];
  const declared = {};
  let canvas = example.canvas;
  let stepUnit = example.stepUnit;
  let previous = null;
  steps.forEach(function (step, index) {
    if (step.canvas) canvas = step.canvas;
    if (step.stepUnit) stepUnit = step.stepUnit;
    const effect = step.do ? model.apply(state, step.do, example.model, problems) || {} : {};
    const context = Object.assign({}, model.context(state, example.model), effect);
    if (step.calcReset) calcLines.length = 0;
    const added = (step.calc || []).map(function (line) { return fill(line, context); });
    added.forEach(function (line) { calcLines.push(line); });
    Object.keys(step.views || {}).forEach(function (id) { declared[id] = step.views[id]; });
    const views = model.views(state, example.model);
    Object.keys(declared).forEach(function (id) { views[id] = JSON.parse(JSON.stringify(declared[id])); });
    views.calc = listView(calcLines.map(function (line, at) { return { text: line, fresh: at >= calcLines.length - added.length }; }), UI_TEXT.emptyCalc);
    if (index > 0) markChanges(views, previous.views);
    Object.keys(step.expect || {}).forEach(function (key) {
      if (String(context[key]) !== String(step.expect[key])) problems.push("el paso " + (index + 1) + " espera " + key + " = " + step.expect[key] + " y el modelo da " + context[key]);
    });
    const snapshot = {
      step: step,
      index: index,
      last: index === steps.length - 1,
      canvas: canvas,
      stepUnit: stepUnit,
      stepUnitNote: step.stepUnitNote || null,
      views: views,
      context: context,
      narration: fill(step.narration, context),
      note: step.note ? fill(step.note, context) : null
    };
    snapshots.push(snapshot);
    previous = snapshot;
  });
  return snapshots;
}

function collectTipKeys(text, into) {
  const pattern = /\[\[(\w+):/g;
  let match = pattern.exec(text);
  while (match) {
    into[match[1]] = true;
    match = pattern.exec(text);
  }
}

function verifyText(where, text, problems) {
  if (unresolved(text)) problems.push("quedó un dato sin completar en " + where + ": " + text);
  if (unbalanced(text)) problems.push("quedó una marca sin cerrar en " + where);
  const keys = {};
  collectTipKeys(text, keys);
  Object.keys(keys).forEach(function (key) {
    if (!TOOLTIPS[key]) problems.push(where + " pide el globito " + key + ", que no existe");
    USED_TIPS[key] = true;
  });
}

function viewTexts(view) {
  const texts = [];
  if (!view) return texts;
  if (view.kind === "list") view.lines.forEach(function (line) { texts.push(line.text); });
  if (view.kind === "tables") view.tables.forEach(function (block) { if (block.note) texts.push(block.note); block.rows.forEach(function (row) { row.forEach(function (cell) { texts.push(cell); }); }); });
  if (view.kind === "layout" && view.note) texts.push(view.note);
  if (view.kind === "ixs" && view.note) texts.push(view.note);
  return texts;
}

function verifyTexts(example, snapshots, problems) {
  snapshots.forEach(function (snapshot, index) {
    verifyText("la narración del paso " + (index + 1), snapshot.narration, problems);
    if (snapshot.note) verifyText("la nota del paso " + (index + 1), snapshot.note, problems);
    if (snapshot.stepUnitNote) verifyText("la nota de unidad del paso " + (index + 1), snapshot.stepUnitNote, problems);
    canvasPanels(snapshot.canvas).forEach(function (id) {
      viewTexts(snapshot.views[id]).forEach(function (text) { verifyText("el panel " + id + " en el paso " + (index + 1), text, problems); });
    });
  });
  verifyText("la frase de cierre", example.closing, problems);
  if (example.closingExtra) verifyText("la frase de cierre", example.closingExtra, problems);
  verifyText("el subtítulo", example.subtitle, problems);
}

function verifyAsks(example, steps, problems) {
  steps.forEach(function (step, index) {
    if (!step.ask) return;
    const ids = step.ask.options.map(function (option) { return option.id; });
    if (ids.indexOf(step.ask.correct) === -1) problems.push("la pregunta del paso " + (index + 1) + " no tiene entre las opciones a la correcta");
    if (new Set(ids).size !== ids.length) problems.push("la pregunta del paso " + (index + 1) + " repite una opción");
    if (step.ask.options.length < 2) problems.push("la pregunta del paso " + (index + 1) + " tiene menos de dos opciones");
    step.ask.options.forEach(function (option) {
      if (!option.why) problems.push("una opción del paso " + (index + 1) + " no explica por qué");
      verifyText("una opción del paso " + (index + 1), option.text + " " + option.why, problems);
    });
    verifyText("la pregunta del paso " + (index + 1), step.ask.question, problems);
    if (index === steps.length - 1) problems.push("el último paso tiene una pregunta, y ahí va la frase de cierre");
  });
}

function canvasPanels(canvas) {
  const flat = [];
  canvas.panels.forEach(function (entry) {
    if (Array.isArray(entry)) entry.forEach(function (id) { flat.push(id); });
    else flat.push(entry);
  });
  return flat;
}

function verifyStructure(example, steps, snapshots, problems) {
  if (!example.closing) problems.push("no tiene frase de cierre");
  if (!example.stepUnit) problems.push("no declara la unidad del paso");
  if (steps.length === 0) problems.push("no tiene pasos");
  snapshots.forEach(function (snapshot, index) {
    if (!snapshot.step.narration) problems.push("el paso " + (index + 1) + " no tiene narración");
    canvasPanels(snapshot.canvas).forEach(function (id) {
      if (!UI_TEXT.panels[id]) problems.push("usa el panel " + id + ", que no tiene nombre");
      if (!PANEL_TIPS[id]) problems.push("usa el panel " + id + ", que no tiene globito");
      if (!snapshot.views[id]) problems.push("en el paso " + (index + 1) + " el panel " + id + " no tiene nada que mostrar");
    });
    if (index > 0 && JSON.stringify(snapshot.canvas) !== JSON.stringify(snapshots[index - 1].canvas)) {
      const before = canvasPanels(snapshots[index - 1].canvas);
      const gone = before.filter(function (id) { return canvasPanels(snapshot.canvas).indexOf(id) === -1; });
      if (gone.length > 0 && !snapshot.stepUnitNote && !/salen? de la pantalla/.test(snapshot.narration)) problems.push("en el paso " + (index + 1) + " sale un panel y la narración no lo dice");
    }
  });
}

function verifyFact(fact, problems) {
  if (fact.kind === "equals") {
    if (String(fact.value) !== String(fact.expect)) problems.push(fact.what + " da " + fact.value + ", no " + fact.expect);
    return;
  }
  problems.push("hay un hecho de tipo " + fact.kind + ", que el recurso no sabe comprobar");
}

function buildVariant(example, label) {
  const problems = [];
  const steps = example.steps;
  const snapshots = snapshotsOf(example, steps, problems);
  verifyStructure(example, steps, snapshots, problems);
  verifyTexts(example, snapshots, problems);
  verifyAsks(example, steps, problems);
  (example.facts || []).forEach(function (fact) { verifyFact(fact, problems); });
  return { label: label, example: example, snapshots: snapshots, problems: problems.map(function (problem) { return label ? label + ": " + problem : problem; }) };
}

function buildExample(example) {
  if (!example.variants) {
    const built = buildVariant(example, null);
    return { example: example, variants: [built], problems: built.problems.slice() };
  }
  const built = example.variants.map(function (variant) {
    const merged = Object.assign({}, example, variant);
    merged.model = Object.assign({}, example.model, variant.model || {});
    delete merged.variants;
    return buildVariant(merged, variant.variantLabel);
  });
  const problems = [];
  built.forEach(function (one) { one.problems.forEach(function (problem) { problems.push(problem); }); });
  if (example.variants.length < 2) problems.push("declara variantes y tiene menos de dos");
  const labels = example.variants.map(function (variant) { return variant.variantLabel; });
  if (labels.some(function (text) { return !text; })) problems.push("hay una variante sin nombre");
  if (new Set(labels).size !== labels.length) problems.push("hay dos variantes con el mismo nombre");
  return { example: example, variants: built, problems: problems };
}

const BUILT_EXAMPLES = EXAMPLES.map(buildExample);

(function verifyGroupsAreContiguous() {
  const seen = [];
  EXAMPLES.forEach(function (example) {
    if (seen[seen.length - 1] === example.group) return;
    if (seen.indexOf(example.group) !== -1) console.error("El grupo " + example.group + " aparece cortado en dos tramos de la escalera");
    seen.push(example.group);
  });
  EXAMPLES.forEach(function (example, index) {
    if (!UI_TEXT.groups[example.group]) console.error("El grupo " + example.group + " no tiene nombre");
    if (example.number !== index + 1) console.error("El ejemplo en la posición " + (index + 1) + " dice ser el " + example.number);
  });
})();

BUILT_EXAMPLES.forEach(function (built) {
  built.problems.forEach(function (problem) {
    console.error("Ejemplo " + built.example.number + ": " + problem);
  });
});

Object.keys(TOOLTIPS).forEach(function (key) {
  if (!USED_TIPS[key]) console.error("El globito " + key + " está escrito y ninguna narración lo invoca");
});
</script>

<script id="ui">
const dom = {
  pageTitle: document.getElementById("pageTitle"),
  exampleList: document.getElementById("exampleList"),
  choiceRow: document.getElementById("choiceRow"),
  choiceLabel: document.getElementById("choiceLabel"),
  choiceBar: document.getElementById("choiceBar"),
  narration: document.getElementById("narrationPanel"),
  main: document.getElementById("main"),
  title: document.getElementById("exampleTitle"),
  subtitle: document.getElementById("exampleSubtitle"),
  stepUnit: document.getElementById("stepUnit"),
  progress: document.getElementById("progress"),
  progressFill: document.getElementById("progressFill"),
  first: document.getElementById("firstStep"),
  prev: document.getElementById("prevStep"),
  next: document.getElementById("nextStep"),
  last: document.getElementById("lastStep"),
  play: document.getElementById("playPause"),
  tooltip: document.getElementById("tooltip")
};

const AUTOPLAY_DELAY = 2800;
const DISK_ROW_MAX = 86;
const STORE_KEY = "ssoo-recursos:file-system:v1";

const RENDERERS = {
  tables: renderTables,
  disk: renderDisk,
  list: renderList,
  counters: renderCounters,
  actors: renderActors,
  bits: renderBits,
  layout: renderLayout,
  bytes: renderBytes,
  term: renderTerm,
  ixs: renderIndexes
};

const panelRefs = {};
let canvasKey = "";

const view = { exampleIndex: 0, variantIndex: 0, stepIndex: 0, playing: false, timer: null, answers: readStore() };

function readStore() {
  try {
    const raw = window.localStorage.getItem(STORE_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
  } catch (error) {
    return {};
  }
}

function writeStore() {
  try {
    window.localStorage.setItem(STORE_KEY, JSON.stringify(view.answers));
  } catch (error) {
    return;
  }
}

function currentEntry() { return BUILT_EXAMPLES[view.exampleIndex]; }

function currentVariants() { return currentEntry().variants; }

function currentBuilt() { return currentVariants()[view.variantIndex]; }

function currentExample() { return currentBuilt().example; }

function totalSteps() { return currentBuilt().snapshots.length; }

function currentSnapshot() { return currentBuilt().snapshots[view.stepIndex]; }

function answerKey() { return currentEntry().example.number + ":" + view.variantIndex + ":" + view.stepIndex; }

function currentAnswer() {
  const ask = currentSnapshot().step.ask;
  const stored = view.answers[answerKey()];
  if (!ask || typeof stored !== "string") return null;
  return ask.options.some(function (option) { return option.id === stored; }) ? stored : null;
}

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function renderRich(target, text) {
  target.textContent = "";
  const pattern = /\[\[(\w+):([^\]]+)\]\]|\*([^*]+)\*|`([^`]+)`/g;
  let cursor = 0;
  let match = pattern.exec(text);
  while (match) {
    if (match.index > cursor) target.appendChild(document.createTextNode(text.slice(cursor, match.index)));
    if (match[1]) {
      const button = element("button", "tip", match[2]);
      button.type = "button";
      button.dataset.tip = match[1];
      target.appendChild(button);
    } else if (match[3]) {
      target.appendChild(element("strong", null, match[3]));
    } else {
      target.appendChild(element("code", null, match[4]));
    }
    cursor = match.index + match[0].length;
    match = pattern.exec(text);
  }
  if (cursor < text.length) target.appendChild(document.createTextNode(text.slice(cursor)));
  return target;
}

function buildPanel(id) {
  const refs = { body: element("div", "panel-body") };
  const section = element("section", "panel " + id);
  const heading = element("h2");
  const title = element("button", "tip", UI_TEXT.panels[id]);
  title.type = "button";
  title.dataset.tip = "panel:" + id;
  heading.appendChild(title);
  section.appendChild(heading);
  section.appendChild(refs.body);
  refs.section = section;
  return refs;
}

function buildCanvas() {
  const snapshot = currentSnapshot();
  const canvas = snapshot.canvas;
  const key = currentExample().number + "|" + view.variantIndex + "|" + JSON.stringify(canvas);
  if (key === canvasKey) return;
  canvasKey = key;
  Object.keys(panelRefs).forEach(function (id) { delete panelRefs[id]; });
  const fresh = element("main");
  fresh.id = "main";
  fresh.style.gridTemplateColumns = canvas.columns;
  canvas.panels.forEach(function (entry, position) {
    if (Array.isArray(entry)) {
      const stack = element("div", "stack");
      stack.style.gridTemplateRows = (canvas.stackRows && canvas.stackRows[position]) || "auto minmax(0, 1fr)";
      entry.forEach(function (id) {
        const refs = buildPanel(id);
        panelRefs[id] = refs;
        stack.appendChild(refs.section);
      });
      fresh.appendChild(stack);
      return;
    }
    const refs = buildPanel(entry);
    panelRefs[entry] = refs;
    fresh.appendChild(refs.section);
  });
  dom.main.replaceWith(fresh);
  dom.main = fresh;
}

function renderExampleList() {
  dom.exampleList.textContent = "";
  let lastGroup = null;
  let section = null;
  BUILT_EXAMPLES.forEach(function (built, index) {
    if (built.example.group !== lastGroup) {
      section = element("span", "group");
      section.appendChild(element("span", "group-cap", UI_TEXT.groups[built.example.group]));
      dom.exampleList.appendChild(section);
      lastGroup = built.example.group;
    }
    const button = element("button");
    button.type = "button";
    button.appendChild(element("span", "num", built.example.number));
    button.title = built.example.short + " · " + built.example.adds;
    button.setAttribute("aria-label", built.example.number + ". " + built.example.title);
    button.setAttribute("aria-current", index === view.exampleIndex ? "true" : "false");
    button.addEventListener("click", function () { selectExample(index); });
    section.appendChild(button);
  });
}

function renderHeaderChoices() {
  const variants = currentVariants();
  dom.choiceBar.textContent = "";
  dom.choiceRow.classList.toggle("empty", variants.length < 2);
  if (variants.length < 2) return;
  dom.choiceLabel.textContent = UI_TEXT.variantLabel;
  variants.forEach(function (built, index) {
    const button = element("button", null, built.label);
    button.type = "button";
    button.setAttribute("aria-pressed", index === view.variantIndex ? "true" : "false");
    button.addEventListener("click", function () { selectVariant(index); });
    dom.choiceBar.appendChild(button);
  });
}

function emptyNote(body, text) {
  if (text) body.appendChild(element("p", "empty-list", text));
}

function renderTables(body, data) {
  if (data.sub) body.appendChild(element("p", "panel-sub", data.sub));
  if (data.tables.length === 0) { emptyNote(body, data.empty); return; }
  const group = element("div", "table-group");
  data.tables.forEach(function (block) {
    const holder = element("div", "table-block");
    if (block.caption) holder.appendChild(element("h3", null, block.caption));
    if (block.rows.length === 0) {
      holder.appendChild(element("p", "empty-list", block.empty || UI_TEXT.none));
      group.appendChild(holder);
      return;
    }
    const scroll = element("div", "table-scroll");
    const grid = element("table", "grid-table" + (block.wrap ? " wrap" : ""));
    if (!block.noHead) {
      const head = element("tr");
      block.columns.forEach(function (label) { head.appendChild(element("th", null, label)); });
      grid.appendChild(head);
    }
    block.rows.forEach(function (cells, rowIndex) {
      const row = element("tr");
      if ((block.highlight || []).indexOf(rowIndex) !== -1) row.classList.add("focus");
      if ((block.faultRows || []).indexOf(rowIndex) !== -1) row.classList.add("fault");
      cells.forEach(function (text, column) {
        const empty = text === UI_TEXT.none || text === "";
        const cell = element("td", empty ? "empty" : null, text);
        if ((block.marks || []).some(function (mark) { return mark[0] === rowIndex && mark[1] === column; })) cell.classList.add("mark");
        row.appendChild(cell);
      });
      grid.appendChild(row);
    });
    scroll.appendChild(grid);
    holder.appendChild(scroll);
    if (block.note) renderRich(holder.appendChild(element("p", "table-note")), block.note);
    group.appendChild(holder);
  });
  body.appendChild(group);
}

function diskLegend(blocks, files) {
  const legend = element("div", "legend");
  const kinds = {};
  let focus = false;
  blocks.forEach(function (block) {
    kinds[block.kind] = true;
    if (block.focus) focus = true;
  });
  (files || []).forEach(function (file) {
    if (!blocks.some(function (block) { return block.file === file.file; })) return;
    const item = element("span", "item named file-" + file.file);
    item.appendChild(element("span", "swatch named"));
    item.appendChild(document.createTextNode(file.name));
    legend.appendChild(item);
  });
  ["data", "pointer", "dir", "meta", "other", "free"].forEach(function (kind) {
    if (!kinds[kind]) return;
    const item = element("span", "item");
    item.appendChild(element("span", "swatch " + kind));
    item.appendChild(document.createTextNode(UI_TEXT.disk.legend[kind]));
    legend.appendChild(item);
  });
  if (focus) {
    const item = element("span", "item");
    item.appendChild(element("span", "swatch focus"));
    item.appendChild(document.createTextNode(UI_TEXT.disk.legend.focus));
    legend.appendChild(item);
  }
  return legend;
}

function renderDisk(body, data) {
  if (data.sub) body.appendChild(element("p", "panel-sub", data.sub));
  if (data.blocks.length === 0) { emptyNote(body, data.empty); return; }
  const grid = element("div", "disk-grid");
  const cols = window.innerWidth <= 700 ? Math.min(data.cols, 4) : data.cols;
  grid.style.setProperty("--cols", cols);
  grid.style.maxHeight = Math.ceil(data.blocks.length / cols) * DISK_ROW_MAX + "px";
  body.classList.add("disk-body");
  data.blocks.forEach(function (block, index) {
    const cell = element("div", "dblock " + block.kind + (block.file ? " file-" + block.file : "") + (block.focus ? " focus" : ""));
    const label = block.idx !== undefined ? block.idx : (data.idx === false ? null : String(index));
    if (label !== null) cell.appendChild(element("span", "idx", label));
    if (block.mark) cell.appendChild(element("span", "mark", block.mark));
    if (block.who) cell.appendChild(element("span", "who", block.who));
    if (block.txt) cell.appendChild(element("span", "txt", block.txt));
    cell.title = [label, block.who, block.txt].filter(Boolean).join(" · ");
    grid.appendChild(cell);
  });
  body.appendChild(grid);
  Array.prototype.forEach.call(grid.querySelectorAll(".dblock[class*='file-'] .who"), function (who) {
    if (who.scrollWidth > who.parentNode.clientWidth - 4) who.remove();
  });
  body.appendChild(diskLegend(data.blocks, data.files));
}

function renderList(body, data) {
  if (data.lines.length === 0) { emptyNote(body, data.empty); return; }
  const list = element("ol", "list");
  data.lines.forEach(function (line, index) {
    const item = element("li", line.fresh ? "fresh" : null);
    item.appendChild(element("span", "n", String(index + 1)));
    renderRich(item.appendChild(element("span")), line.text);
    list.appendChild(item);
  });
  body.appendChild(list);
}

function renderCounters(body, data) {
  const wrap = element("div", "counters");
  data.items.forEach(function (item) {
    const box = element("div", "counter" + (item.fresh ? " fresh" : "") + (item.na ? " na" : ""));
    box.appendChild(element("span", "caption", item.caption));
    box.appendChild(element("span", "value", String(item.value)));
    wrap.appendChild(box);
  });
  body.appendChild(wrap);
}

function renderActors(body, data) {
  const wrap = element("div", "actors");
  data.rows.forEach(function (row) {
    const line = element("div", "actor" + (row.fresh ? " fresh" : ""));
    line.appendChild(element("span", "who", row.who));
    const what = element("span", "what");
    what.appendChild(element("span", "state-pill " + row.state, row.state));
    what.appendChild(element("span", "state-gloss", row.gloss));
    line.appendChild(what);
    wrap.appendChild(line);
  });
  body.appendChild(wrap);
}

function renderBits(body, data) {
  const wrap = element("div", "bitrow-wrap");
  data.groups.forEach(function (group) {
    const holder = element("div", "bitrow-group");
    if (group.caption) holder.appendChild(element("div", "bitrow-cap", group.caption));
    const row = element("div", "bitrow");
    group.bits.forEach(function (bit) {
      const cell = element("div", "bitcell");
      cell.appendChild(element("span", "bitv" + (bit.v === "1" ? " one" : "") + (bit.focus ? " focus" : ""), bit.v));
      cell.appendChild(element("span", "bitn", bit.n));
      row.appendChild(cell);
    });
    holder.appendChild(row);
    wrap.appendChild(holder);
  });
  body.appendChild(wrap);
  if (data.note) renderRich(body.appendChild(element("p", "layout-note")), data.note);
}

function layoutSeg(item) {
  const seg = element("div", "seg" + (item.kind ? " " + item.kind : "") + (item.focus ? " focus" : ""));
  seg.textContent = item.label;
  if (item.grow) seg.style.flexGrow = item.grow;
  return seg;
}

function renderLayout(body, data) {
  const wrap = element("div", "layout");
  data.items.forEach(function (item) {
    if (!item.parts) { wrap.appendChild(layoutSeg(item)); return; }
    const vol = element("div", "vol" + (item.thumb ? " thumb" : ""));
    if (item.grow) vol.style.flexGrow = item.grow;
    vol.appendChild(element("span", "cap", item.label));
    const row = element("div", "row");
    item.parts.forEach(function (part) { row.appendChild(layoutSeg(part)); });
    vol.appendChild(row);
    wrap.appendChild(vol);
  });
  body.appendChild(wrap);
  if (data.note) renderRich(body.appendChild(element("p", "layout-note")), data.note);
}

function renderBytes(body, data) {
  if (data.blocks.length === 0) {
    emptyNote(body, data.empty);
  } else {
    const wrap = element("div", "bytes");
    const lastBlock = data.blocks.length - 1;
    data.blocks.forEach(function (block, blockIndex) {
      const holder = element("div", "byte-block file-" + block.file);
      holder.appendChild(element("span", "cap", block.cap));
      const cells = element("div", "byte-cells");
      block.bytes.forEach(function (byte, byteIndex) {
        const cell = element("div", "byte");
        if (byte.n === data.caret) cell.classList.add("caret");
        if (data.caret === data.size && blockIndex === lastBlock && byteIndex === block.bytes.length - 1) cell.classList.add("caret-end");
        cell.appendChild(element("span", "ch", byte.ch));
        cell.appendChild(element("span", "n", String(byte.n)));
        cells.appendChild(cell);
      });
      holder.appendChild(cells);
      wrap.appendChild(holder);
    });
    body.appendChild(wrap);
  }
  if (data.label) {
    const label = element("p", "caret-label");
    label.appendChild(element("span", "bar"));
    label.appendChild(document.createTextNode(data.label));
    body.appendChild(label);
  }
}

function renderTerm(body, data) {
  if (data.lines.length === 0) { emptyNote(body, data.empty); return; }
  const pre = element("pre", "term");
  data.lines.forEach(function (line) {
    pre.appendChild(element("span", "line" + (line.cmd ? " cmd" : "") + (line.focus ? " focus" : ""), line.text));
  });
  body.appendChild(pre);
}

function renderIndexes(body, data) {
  const wrap = element("div", "ixs");
  data.boxes.forEach(function (box) {
    const holder = element("div", "ix" + (box.inode ? " inode" : "") + (box.focus ? " focus" : ""));
    holder.appendChild(element("span", "cap", box.cap));
    const slots = element("div", "slots");
    slots.style.setProperty("--slots", box.cols || 4);
    box.slots.forEach(function (slot) { slots.appendChild(element("span", "slot" + (slot.cls ? " " + slot.cls : ""), slot.text)); });
    holder.appendChild(slots);
    wrap.appendChild(holder);
  });
  body.appendChild(wrap);
  if (data.note) renderRich(body.appendChild(element("p", "layout-note")), data.note);
}

function renderPanel(id, data) {
  const body = panelRefs[id].body;
  body.textContent = "";
  body.className = "panel-body";
  RENDERERS[data.kind](body, data);
}

function takeawayBlock(text, extra) {
  const box = element("div", "takeaway");
  box.appendChild(element("span", "tag", UI_TEXT.takeawayTag));
  renderRich(box.appendChild(element("span", "line")), text);
  if (extra) renderRich(box.appendChild(element("span", "extra")), extra);
  return box;
}

function askBlock(ask) {
  const box = element("div", "ask-box");
  box.appendChild(element("span", "tag", UI_TEXT.ask.tag));
  renderRich(box.appendChild(element("p", "question")), ask.question);
  const chosen = currentAnswer();
  if (!chosen) {
    const options = element("div", "ask-options");
    ask.options.forEach(function (option) {
      const button = element("button", null, option.text);
      button.type = "button";
      button.addEventListener("click", function () { answerWith(option.id); });
      options.appendChild(button);
    });
    box.appendChild(options);
    return box;
  }
  const picked = ask.options.find(function (option) { return option.id === chosen; });
  const right = ask.options.find(function (option) { return option.id === ask.correct; });
  const result = element("div", "ask-result");
  const mine = element("p", "answer " + (chosen === ask.correct ? "right" : "wrong"));
  mine.appendChild(element("span", "head", (chosen === ask.correct ? UI_TEXT.ask.right : UI_TEXT.ask.wrong) + " " + picked.text));
  renderRich(mine.appendChild(element("span")), picked.why);
  result.appendChild(mine);
  if (chosen !== ask.correct) {
    const good = element("p", "answer right");
    good.appendChild(element("span", "head", fill(UI_TEXT.ask.correctIs, { text: right.text })));
    renderRich(good.appendChild(element("span")), right.why);
    result.appendChild(good);
  }
  const retry = element("button", "retry", UI_TEXT.ask.retry);
  retry.type = "button";
  retry.addEventListener("click", clearAnswer);
  result.appendChild(retry);
  box.appendChild(result);
  return box;
}

function renderNarration(snapshot) {
  const example = currentExample();
  const ask = snapshot.step.ask;
  dom.narration.textContent = "";
  dom.narration.classList.toggle("with-extras", snapshot.last === true || Boolean(ask));
  dom.narration.classList.toggle("no-compare", snapshot.last === true);
  dom.narration.classList.toggle("asking", Boolean(ask) && !snapshot.last);
  const main = element("div", "narration-main");
  renderRich(main.appendChild(element("p", "narration-text")), snapshot.narration);
  if (snapshot.note) renderRich(main.appendChild(element("p", "narration-note")), snapshot.note);
  if (snapshot.stepUnitNote) renderRich(main.appendChild(element("p", "narration-note")), snapshot.stepUnitNote);
  dom.narration.appendChild(main);
  if (ask) {
    const extras = element("div", "narration-extras");
    extras.appendChild(askBlock(ask));
    dom.narration.appendChild(extras);
    return;
  }
  if (!snapshot.last) return;
  const extras = element("div", "narration-extras");
  extras.appendChild(takeawayBlock(example.closing, example.closingExtra));
  dom.narration.appendChild(extras);
}

function render() {
  const example = currentExample();
  const snapshot = currentSnapshot();
  const total = totalSteps();
  buildCanvas();
  dom.title.textContent = example.number + ". " + example.title;
  dom.subtitle.textContent = example.subtitle;
  dom.stepUnit.textContent = snapshot.stepUnit;
  renderHeaderChoices();
  Object.keys(panelRefs).forEach(function (id) { renderPanel(id, snapshot.views[id]); });
  renderNarration(snapshot);
  dom.progress.textContent = fill(UI_TEXT.progress, { current: view.stepIndex + 1, total: total });
  dom.progressFill.style.transform = "scaleX(" + ((view.stepIndex + 1) / total) + ")";
  dom.first.disabled = view.stepIndex === 0;
  dom.prev.disabled = view.stepIndex === 0;
  dom.next.disabled = view.stepIndex === total - 1;
  dom.last.disabled = view.stepIndex === total - 1;
  dom.play.textContent = view.playing ? UI_TEXT.pause : UI_TEXT.play;
  Array.prototype.forEach.call(dom.exampleList.querySelectorAll("button"), function (button, position) {
    button.setAttribute("aria-current", position === view.exampleIndex ? "true" : "false");
  });
}

function goTo(index) {
  const total = totalSteps();
  view.stepIndex = Math.max(0, Math.min(index, total - 1));
  render();
  if (view.playing && view.stepIndex === total - 1) stopPlaying();
}

function answerWith(id) {
  view.answers[answerKey()] = id;
  writeStore();
  render();
  const retry = dom.narration.querySelector(".retry");
  if (retry) retry.focus();
}

function clearAnswer() {
  delete view.answers[answerKey()];
  writeStore();
  render();
  const first = dom.narration.querySelector(".ask-options button");
  if (first) first.focus();
}

function selectExample(index) {
  stopPlaying();
  view.exampleIndex = index;
  view.variantIndex = 0;
  view.stepIndex = 0;
  render();
}

function selectVariant(index) {
  stopPlaying();
  view.variantIndex = index;
  view.stepIndex = 0;
  render();
}

function stopPlaying() {
  view.playing = false;
  if (view.timer) { clearTimeout(view.timer); view.timer = null; }
  dom.play.textContent = UI_TEXT.play;
}

function scheduleTick() {
  if (view.timer) clearTimeout(view.timer);
  view.timer = setTimeout(function () {
    if (!view.playing) return;
    if (view.stepIndex >= totalSteps() - 1) { stopPlaying(); render(); return; }
    goTo(view.stepIndex + 1);
    if (view.playing) scheduleTick();
  }, AUTOPLAY_DELAY);
}

function startPlaying() {
  view.playing = true;
  scheduleTick();
  render();
}

function togglePlaying() {
  if (view.playing) { stopPlaying(); render(); return; }
  startPlaying();
}

function lookupTooltip(key) {
  if (key.indexOf("panel:") === 0) return PANEL_TIPS[key.slice(6)];
  return TOOLTIPS[key];
}

function showTooltip(trigger, tip) {
  dom.tooltip.textContent = "";
  dom.tooltip.appendChild(element("strong", "tip-title", tip.title));
  dom.tooltip.appendChild(document.createTextNode(tip.body));
  dom.tooltip.classList.add("open");
  const box = trigger.getBoundingClientRect();
  const width = dom.tooltip.offsetWidth;
  const height = dom.tooltip.offsetHeight;
  let left = box.left + box.width / 2 - width / 2;
  left = Math.min(left, window.innerWidth - width - 8);
  let top = box.top - height - 8;
  if (top < 8) top = box.bottom + 8;
  dom.tooltip.style.left = Math.max(8, left) + "px";
  dom.tooltip.style.top = top + "px";
}

function hideTooltip() { dom.tooltip.classList.remove("open"); }

function closestElement(target, selector) {
  return target && typeof target.closest === "function" ? target.closest(selector) : null;
}

["mouseover", "focusin"].forEach(function (name) {
  document.addEventListener(name, function (event) {
    const trigger = closestElement(event.target, "[data-tip]");
    const tip = trigger ? lookupTooltip(trigger.dataset.tip) : null;
    if (tip) showTooltip(trigger, tip);
    else hideTooltip();
  });
});

["mouseout", "focusout", "scroll"].forEach(function (name) {
  document.addEventListener(name, hideTooltip, true);
});

dom.first.addEventListener("click", function () { stopPlaying(); goTo(0); });
dom.prev.addEventListener("click", function () { stopPlaying(); goTo(view.stepIndex - 1); });
dom.next.addEventListener("click", function () { stopPlaying(); goTo(view.stepIndex + 1); });
dom.last.addEventListener("click", function () { stopPlaying(); goTo(totalSteps() - 1); });
dom.play.addEventListener("click", togglePlaying);

document.addEventListener("keydown", function (event) {
  if (event.target && event.target.tagName === "BUTTON" && (event.key === " " || event.key === "Enter")) return;
  if (event.key === "ArrowRight") { stopPlaying(); goTo(view.stepIndex + 1); event.preventDefault(); }
  if (event.key === "ArrowLeft") { stopPlaying(); goTo(view.stepIndex - 1); event.preventDefault(); }
  if (event.key === "Home") { stopPlaying(); goTo(0); event.preventDefault(); }
  if (event.key === "End") { stopPlaying(); goTo(totalSteps() - 1); event.preventDefault(); }
  if (event.key === "Escape") hideTooltip();
});

let lastNarrow = window.innerWidth <= 700;
window.addEventListener("resize", function () {
  const narrow = window.innerWidth <= 700;
  if (narrow !== lastNarrow) { lastNarrow = narrow; render(); }
});

dom.pageTitle.textContent = UI_TEXT.pageTitle;
dom.first.textContent = UI_TEXT.firstStep;
dom.prev.textContent = UI_TEXT.prevStep;
dom.next.textContent = UI_TEXT.nextStep;
dom.last.textContent = UI_TEXT.lastStep;
dom.play.textContent = UI_TEXT.play;

renderExampleList();
render();
</script>
</body>
</html>
