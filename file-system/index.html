<title>File system</title>
<style>
  :root {
    --ink: #10151d;
    --ink-soft: #35404f;
    --muted: #5f6877;
    --faint: #6b7484;
    --line: #e3e7ee;
    --line-strong: #c6ccd8;
    --page: #edf0f6;
    --card: #ffffff;

    --running: #1d4ed8;
    --running-soft: #e8eefc;

    --file-1: #6d28d9;
    --file-1-soft: #f1ebfd;
    --file-2: #0b6a62;
    --file-2-soft: #e3f4f1;
    --file-3: #be185d;
    --file-3-soft: #fce8f1;
    --file-4: #9a4507;
    --file-4-soft: #fdf1e3;

    --fault: #10151d;
    --fault-soft: #eef0f4;

    --running-state: #1d4ed8;
    --running-state-soft: #e8eefc;
    --ready: #1a7a3f;
    --ready-soft: #e6f4ec;
    --blocked: #c0392f;
    --blocked-soft: #fbeae8;

    --marked: #1c2534;
    --marked-soft: #e3e8f1;
    --region-fill-alt: #f2f5f9;

    --radius: 11px;
    --shadow: 0 1px 2px rgba(16, 21, 29, 0.05), 0 1px 8px rgba(16, 21, 29, 0.04);
    --fast: 160ms;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html, body { margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    color: var(--ink);
    background: var(--page);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 10px 14px 12px;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { margin: 0; font-weight: 640; }

  button {
    font: inherit;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    cursor: pointer;
    transition: background-color var(--fast) ease-out, border-color var(--fast) ease-out, color var(--fast) ease-out, transform var(--fast) ease-out;
  }

  button:hover:not([disabled]) { border-color: var(--faint); }
  button:active:not([disabled]) { transform: translateY(1px); }

  button:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid var(--marked);
    outline-offset: 2px;
  }

  button[disabled] { opacity: 0.4; cursor: not-allowed; }

  header { display: flex; flex-direction: column; gap: 8px; flex: 0 0 auto; }

  .head-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  header h1 { font-size: 16px; letter-spacing: -0.012em; color: var(--ink-soft); }

  .toggle-label { font-size: 12.5px; color: var(--muted); }

  .choices { display: flex; gap: 6px; flex-wrap: wrap; }
  .choices button { padding: 3px 10px; font-size: 12.5px; }
  .choices button[aria-pressed="true"] { background: var(--running); border-color: var(--running); color: #fff; }

  .examples { display: flex; align-items: center; gap: 6px 0; flex-wrap: wrap; }
  .examples .group { display: inline-flex; align-items: center; gap: 6px; }

  .group-cap {
    font-size: 10.5px;
    font-weight: 750;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 4px 0 8px;
  }

  .examples > .group:first-child .group-cap { padding-left: 0; }

  .examples button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 5px 8px;
    font-size: 12.5px;
    text-align: left;
    box-shadow: var(--shadow);
  }

  .examples button .num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 19px;
    height: 19px;
    border-radius: 50%;
    background: var(--page);
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .examples button[aria-current="true"] { background: var(--running); border-color: var(--running); color: #fff; }
  .examples button[aria-current="true"] .num { background: rgba(0, 0, 0, 0.22); color: #fff; }

  main {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: minmax(0, 1fr);
    gap: 9px;
  }

  .stack { display: grid; gap: 9px; min-height: 0; min-width: 0; }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;
  }

  .panel > h2 {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--faint);
    padding: 9px 12px 8px;
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }

  .panel > h2::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--line-strong);
    flex: 0 0 auto;
  }


  .panel > h2 .tip { border-bottom-color: var(--line); color: inherit; letter-spacing: inherit; text-transform: inherit; white-space: nowrap; }
  .panel > h2 .tip:hover { border-bottom-color: var(--faint); }

  .panel > h2 .panel-note {
    margin-left: auto;
    min-width: 0;
    text-transform: none;
    letter-spacing: 0;
    font-size: 10.5px;
    font-weight: 400;
    color: var(--faint);
    text-align: right;
  }

  .panel-body {
    padding: 8px 11px;
    overflow: auto;
    min-height: 0;
    flex: 1 1 auto;
  }

  .table-group { display: flex; flex-wrap: wrap; gap: 14px 16px; align-items: flex-start; }
  .table-block { min-width: 0; }
  .table-block.active h3 { color: var(--ink); }
  .table-block h3 { font-size: 12.5px; color: var(--ink-soft); font-weight: 750; margin-bottom: 4px; }

  .grid-table { border-collapse: separate; border-spacing: 0 3px; font-size: 14px; font-variant-numeric: tabular-nums; margin-top: -3px; }
  .grid-table th { text-align: left; font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--faint); font-weight: 750; padding: 0 11px 3px 7px; white-space: nowrap; border-bottom: 3px solid transparent; }
  .grid-table td { padding: 2px 11px 2px 7px; font-family: var(--mono); font-size: 13.5px; white-space: nowrap; color: var(--ink-soft); }
  .grid-table td.mark { box-shadow: inset 0 0 0 2px var(--marked); border-radius: 5px; background: var(--marked-soft); color: var(--ink); font-weight: 750; }
  .grid-table td.empty { color: var(--muted); font-weight: 400; }
  .grid-table tr.focus td { background: var(--marked-soft); color: var(--ink); }
  .grid-table tr.focus td:first-child { box-shadow: inset 3px 0 0 var(--marked); border-radius: 5px 0 0 5px; }
  .grid-table tr.focus td:last-child { border-radius: 0 5px 5px 0; }
  .grid-table tr.fault td { background: var(--fault-soft); color: var(--fault); }
  .grid-table tr.fault td { font-weight: 750; }
  .grid-table tr.fault td:first-child { box-shadow: inset 3px 0 0 var(--fault); border-radius: 5px 0 0 5px; }
  .grid-table tr.fault td:last-child { border-radius: 0 5px 5px 0; }
  .legend { display: flex; flex-wrap: wrap; gap: 3px 14px; margin-top: 9px; }
  .legend .item { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--muted); }
  .legend .swatch { width: 14px; height: 10px; border-radius: 2px; border: 1px solid; flex: 0 0 auto; }

  .actors { display: flex; flex-direction: column; gap: 7px; }
  .actor { display: grid; grid-template-columns: 100px minmax(0, 1fr); align-items: center; gap: 10px; border-radius: 6px; padding: 2px 4px; }
  .actor.fresh { box-shadow: 0 0 0 2px var(--marked); }
  .actor .who { font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; font-weight: 750; color: var(--faint); }
  .actor .what { font-size: 14px; font-weight: 650; color: var(--ink); min-width: 0; }

  .state-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 5px;
    font-size: 11.5px;
    font-weight: 750;
    line-height: 1.3;
    border: 1.5px solid;
    white-space: nowrap;
  }

  .state-pill.RUNNING { color: var(--running-state); border-color: var(--running-state); background: var(--running-state-soft); }
  .state-pill.READY { color: var(--ready); border-color: var(--ready); background: var(--ready-soft); }
  .state-pill.BLOCKED { color: var(--blocked); border-color: var(--blocked); background: var(--blocked-soft); }
  .state-gloss { margin-left: 8px; font-size: 12px; color: var(--muted); font-weight: 500; }

  .list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }

  .list li {
    display: flex;
    gap: 9px;
    align-items: baseline;
    font-size: 13.5px;
    line-height: 1.38;
    border-left: 3px solid var(--line-strong);
    border-radius: 2px;
    padding: 1px 0 1px 9px;
    color: var(--ink-soft);
  }

  .list li.fresh { border-left-color: var(--marked); background: var(--marked-soft); color: var(--ink); }
  .list li .n { font-size: 11px; font-weight: 750; color: var(--muted); min-width: 1.3em; font-variant-numeric: tabular-nums; }
  .empty-list { margin: 0; font-size: 13.5px; color: var(--muted); }
  footer { flex: 0 0 auto; display: block; min-height: 0; }

  .narration-panel { display: flex; flex-direction: column; min-height: 0; height: 100%; }

  .narration-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    padding: 8px 12px 7px;
    border-bottom: 1px solid var(--line);
  }

  .narration-head .title { font-weight: 660; font-size: 14.5px; }
  .narration-head .subtitle { font-size: 13px; color: var(--muted); flex: 1; min-width: 160px; }

  .step-unit {
    font-size: 11px;
    color: var(--muted);
    background: var(--page);
    border-radius: 5px;
    padding: 2px 7px;
    white-space: nowrap;
  }

  .narration-body {
    padding: 9px 12px 4px;
    flex: 1 1 auto;
    min-height: 113px;
    max-height: 170px;
    overflow-y: auto;
  }

  .narration-body.with-extras {
    display: grid;
    grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.1fr) minmax(300px, 0.85fr);
    gap: 6px 18px;
    align-content: start;
  }

  .narration-body.with-extras.no-compare { grid-template-columns: minmax(0, 1fr) minmax(280px, 0.7fr); }
  .narration-body.with-extras.asking { grid-template-columns: minmax(0, 0.9fr) minmax(360px, 1.1fr); }

  .narration-extras { min-width: 0; min-height: 0; overflow-y: auto; }
  .narration-main { min-width: 0; }

  .narration-text { font-size: 15.5px; margin: 0; color: var(--ink); }
  .narration-note { font-size: 13.5px; color: var(--muted); margin: 4px 0 0; }

  .takeaway {
    padding: 7px 11px;
    border: 2px solid var(--ink);
    border-radius: 8px;
    animation: flash var(--fast) ease-out;
  }

  .takeaway .tag, .ask-box .tag {
    display: block;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 800;
    color: var(--muted);
    margin-bottom: 2px;
  }

  .takeaway .line { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }

  .ask-box { padding: 6px 11px 8px; border: 2px solid var(--ink); border-radius: 8px; }
  .ask-box .question { font-size: 14.5px; font-weight: 700; margin: 0; }

  .ask-options { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 7px; }

  .ask-options button {
    text-align: left;
    padding: 5px 10px;
    font-size: 13.5px;
    font-weight: 620;
    line-height: 1.3;
    box-shadow: var(--shadow);
  }

  .ask-result { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
  .ask-result .answer { font-size: 13px; line-height: 1.38; margin: 0; color: var(--ink-soft); border-left: 3px solid var(--line-strong); padding: 1px 0 1px 9px; }
  .ask-result .answer.right { border-left-color: var(--ink); }
  .ask-result .answer.wrong { border-left-color: var(--fault); }
  .ask-result .answer .head { display: block; font-weight: 750; color: var(--ink); }
  .ask-result .answer.wrong .head { color: var(--fault); }
  .ask-result .retry { align-self: flex-start; padding: 3px 10px; font-size: 12.5px; }


  .progress-row { display: flex; align-items: center; gap: 10px; padding: 4px 12px 0; }

  .progress-track { flex: 1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }

  .progress-fill {
    height: 100%;
    background: var(--running);
    border-radius: 2px;
    transition: transform var(--fast) ease-out;
    transform-origin: left center;
  }

  .progress { font-size: 12px; line-height: 1.2; color: var(--muted); white-space: nowrap; }

  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 7px 12px 8px; }

  .controls .big { padding: 7px 16px; font-size: 15px; font-weight: 640; }

  .controls .big.primary { background: var(--running); border-color: var(--running); color: #fff; }
  .controls .big.primary:hover:not([disabled]) { background: #1a45bd; border-color: #1a45bd; }
  .controls .big.primary[disabled] { background: var(--running); border-color: var(--running); }
  .controls .small { padding: 6px 11px; font-size: 13px; }

  .tip {
    font: inherit;
    background: none;
    border: 0;
    padding: 0;
    color: inherit;
    border-bottom: 1px dotted var(--running);
    cursor: help;
    border-radius: 0;
  }

  .tip:hover { border-bottom-style: solid; }

  #tooltip {
    position: fixed;
    z-index: 20;
    max-width: 330px;
    background: var(--ink);
    color: #fff;
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 13px;
    line-height: 1.42;
    box-shadow: 0 6px 20px rgba(16, 21, 29, 0.3);
    display: none;
  }

  #tooltip.open { display: block; animation: flash var(--fast) ease-out; }
  #tooltip .tip-title { font-weight: 700; display: block; margin-bottom: 3px; }

  @keyframes flash {
    from { opacity: 0.35; }
    to { opacity: 1; }
  }

  .title-row { min-height: 26px; }
  .choice-row { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; margin-left: auto; }
  .choice-row.empty { visibility: hidden; }

  .table-block { max-width: 100%; }
  .table-block:only-child { flex: 1 1 auto; }
  .table-block:only-child > .table-scroll > .grid-table { width: 100%; }
  .table-scroll { overflow-x: auto; max-width: 100%; }
  .counters { display: flex; flex-wrap: wrap; gap: 8px; }
  .counter { display: inline-flex; align-items: center; gap: 7px; border: 2px solid var(--ink); border-radius: 8px; padding: 3px 9px; }
  .counter .caption { font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 750; color: var(--muted); }
  .counter .value { font-size: 18px; font-weight: 750; line-height: 1.1; font-variant-numeric: tabular-nums; }

  .counter.fresh { box-shadow: 0 0 0 2px var(--marked); }
  .ask-box { position: relative; }
  .ask-result .retry { position: absolute; top: 5px; right: 9px; padding: 2px 9px; }
  .narration-body.with-extras.asking { grid-template-columns: minmax(0, 0.72fr) minmax(360px, 1.34fr); max-height: 176px; }

  .examples button { position: relative; }

  .grid-table tr.focus td:first-child, .grid-table tr.fault td:first-child { border-radius: 2px 0 0 2px; }

  @media (max-width: 1000px) {
    .step-unit { white-space: normal; max-width: 100%; }
  }
  .counter { flex-wrap: wrap; max-width: 100%; row-gap: 2px; }
  .ask-result { gap: 3px; margin-top: 3px; }
  .ask-result .answer { line-height: 1.3; }
  .ask-box { padding-bottom: 6px; }
  .ask-box .question { line-height: 1.3; }
  .grid-table.wrap td:last-child { white-space: normal; }
  .table-note { font-size: 12.5px; color: var(--ink-soft); margin: 6px 0 0; max-width: 340px; }
  .narration-text code, .narration-note code, .takeaway code, .ask-box code, .list code { font-family: var(--mono); font-size: 0.9em; font-weight: 650; background: var(--page); border-radius: 4px; padding: 1px 5px; white-space: nowrap; }
  .takeaway .extra { display: block; font-size: 13.5px; font-weight: 600; color: var(--ink-soft); margin-top: 4px; }
  .grid-table td { font-size: 14.5px; }
  @media (max-width: 1239px) {
    body { height: auto; overflow: auto; }
    main { grid-template-columns: minmax(0, 1fr) !important; grid-template-rows: none !important; }
    .stack { grid-template-rows: none !important; }
    .panel-body { overflow: visible; }
    .narration-body { overflow: visible; max-height: none; }
  }
  @media (max-width: 1000px) {
    body { padding-bottom: calc(122px + env(safe-area-inset-bottom)); }
    .narration-body.with-extras, .narration-body.with-extras.no-compare, .narration-body.with-extras.asking { grid-template-columns: 1fr; }
    .narration-extras { overflow: visible; }
    .narration-head { flex-direction: column; align-items: flex-start; gap: 3px; }
    .panel > h2 { flex-wrap: wrap; }

    .controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      background: var(--card);
      border-top: 1px solid var(--line-strong);
      box-shadow: 0 -2px 12px rgba(16, 21, 29, 0.08);
      z-index: 10;
    }

    .controls .big, .controls .small { width: 100%; }
    #playPause { display: none; }

    #prevStep { order: 1; }
    #nextStep { order: 2; }
    #firstStep { order: 3; }
    #lastStep { order: 4; }
  }

  @media (max-width: 700px) {
    .examples .group { flex-wrap: wrap; }
    .ask-options { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  .panel-body.disk-body { display: flex; flex-direction: column; }
  .disk-grid { display: grid; gap: 6px; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); grid-auto-rows: minmax(44px, 1fr); flex: 1 1 auto; }

  .dblock {
    position: relative;
    min-width: 0;
    min-height: 44px;
    border: 1.5px solid var(--line-strong);
    border-radius: 6px;
    background: var(--card);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    padding: 15px 3px 5px;
    text-align: center;
  }

  .dblock .idx { position: absolute; top: 2px; left: 5px; font-size: 10px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dblock .who { font-size: 11.5px; font-weight: 750; line-height: 1.15; white-space: nowrap; }
  .dblock .txt { font-family: var(--mono); font-size: 12px; font-weight: 650; line-height: 1.2; white-space: pre; color: var(--ink-soft); }
  .dblock.free { border-style: dashed; color: var(--muted); }
  .dblock.free .who { font-weight: 600; font-size: 10.5px; }
  .dblock.other { background: var(--region-fill-alt); color: var(--muted); }
  .dblock.other .who { font-weight: 600; font-size: 10.5px; }
  .dblock.meta { background: var(--line); border-color: var(--ink-soft); color: var(--ink-soft); }
  .dblock.data { border-color: currentColor; background: var(--soft); }
  .dblock.pointer { border: 4px double currentColor; padding-top: 13px; padding-bottom: 3px; }
  .dblock.dir { border-color: var(--ink-soft); border-left-width: 6px; color: var(--ink); }
  .dblock.focus { border-color: var(--marked); border-width: 2.5px; padding-top: 14px; padding-bottom: 4px; }
  .dblock.pointer.focus { border-width: 4px; padding-top: 13px; padding-bottom: 3px; }
  .dblock.dir.focus { border-left-width: 6px; }
  .dblock .mark { position: absolute; top: 1px; right: 5px; font-size: 11px; font-weight: 800; color: var(--ink); }

  .file-1 { color: var(--file-1); --soft: var(--file-1-soft); }
  .file-2 { color: var(--file-2); --soft: var(--file-2-soft); }

  .legend .swatch.meta { border: 1.5px solid var(--ink-soft); background: var(--line); }

  .legend .swatch.free { border: 1px dashed var(--muted); background: var(--card); }

  .legend .swatch.named { border: 1.5px solid currentColor; background: var(--soft); }
  .legend .swatch.focus { border: 2.5px solid var(--marked); background: var(--card); }

  .panel-sub { font-size: 12.5px; color: var(--muted); margin: 0 0 7px; }

  .layout { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
  .layout .seg { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 46px; padding: 5px 9px; border: 1.5px solid var(--ink-soft); border-radius: 6px; background: var(--card); font-size: 12.5px; font-weight: 700; color: var(--ink-soft); line-height: 1.25; }

  .layout .seg.data { border-style: dashed; color: var(--muted); font-weight: 600; flex: 1 1 auto; }
  .layout .seg.focus { border-color: var(--marked); border-width: 2.5px; padding: 4px 8px; color: var(--ink); }
  .layout .vol { display: flex; flex-direction: column; gap: 4px; flex: 1 1 auto; min-width: 0; padding: 5px 7px 7px; border: 1.5px solid var(--line-strong); border-radius: 8px; }
  .layout .vol.thumb { flex: 0 1 auto; }
  .layout .vol > .cap { font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; font-weight: 750; color: var(--faint); }
  .layout .vol > .row { display: flex; flex-wrap: wrap; gap: 5px; }
  .layout .vol > .row .seg { flex: 1 1 auto; }
  .layout-note { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }

  .bitrow-wrap { display: flex; flex-direction: column; gap: 5px; }
  .bitrow { display: flex; flex-wrap: wrap; gap: 4px; }
  .bitcell { display: flex; flex-direction: column; align-items: center; gap: 1px; }

  .bitcell .bitv.focus { border-color: var(--marked); border-width: 2.5px; }

  .bitrow-cap { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); font-weight: 750; }
  .bitrow-group + .bitrow-group { margin-top: 10px; }

  .bytes { display: flex; flex-wrap: wrap; gap: 14px 12px; align-items: flex-end; padding-top: 4px; }
  .byte-block { display: flex; flex-direction: column; gap: 4px; }
  .byte-block .cap { font-size: 12px; font-weight: 750; color: var(--ink-soft); text-align: center; }
  .byte-cells { display: flex; gap: 3px; }
  .byte { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .byte .ch { width: 26px; height: 30px; display: flex; align-items: center; justify-content: center; border: 1.5px solid currentColor; border-radius: 4px; background: var(--soft); font-family: var(--mono); font-size: 15px; font-weight: 750; }
  .byte .n { font-size: 10px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .byte.caret::before { content: ""; position: absolute; left: -3px; top: -4px; height: 40px; border-left: 3px solid var(--ink); }
  .byte.caret-end::after { content: ""; position: absolute; right: -3px; top: -4px; height: 40px; border-right: 3px solid var(--ink); }
  .caret-label { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 13px; font-weight: 700; color: var(--ink); }
  .caret-label .bar { display: inline-block; width: 3px; height: 15px; background: var(--ink); }

  .term { margin: 0; padding: 9px 11px; border-radius: 7px; background: var(--region-fill-alt); border: 1px solid var(--line-strong); font-family: var(--mono); font-size: 14px; line-height: 1.65; color: var(--ink-soft); overflow-x: auto; }

  .term .line.focus { background: var(--marked-soft); color: var(--ink); }

  .ixs { display: flex; flex-wrap: wrap; gap: 12px 14px; align-items: flex-start; }
  .ix { border: 4px double var(--ink-soft); border-radius: 7px; padding: 4px 7px 7px; min-width: 0; }
  .ix.inode { border: 1.5px solid var(--ink-soft); border-left-width: 6px; }
  .ix.focus { border-color: var(--marked); }
  .ix .cap { display: block; font-size: 12px; font-weight: 750; color: var(--ink-soft); margin-bottom: 4px; }
  .ix .slots { display: grid; grid-template-columns: repeat(var(--slots, 4), minmax(58px, auto)); gap: 4px; }
  .ix .slot { border: 1px solid var(--line-strong); border-radius: 4px; padding: 3px 6px; font-size: 12px; font-weight: 700; color: var(--ink-soft); text-align: center; white-space: nowrap; }

  .ix .slot.focus { border-color: var(--marked); border-width: 2px; padding: 2px 5px; color: var(--ink); }

  .counter.na .value { color: var(--muted); }

  }

function fatRealSteps(expected, first, askTheoretical, askCopy) {
  const ask = function (narration, question) { return question ? { narration: narration, ask: question } : null; };
  return FAT4_STEPS.concat([
    {
      do: { op: "real" },
      canvas: { columns: "minmax(0, 1.4fr) minmax(0, 0.8fr)", panels: ["calc", "params"] },
      calcReset: true,
      calc: ["Entrada de {nombre}: {bitsEntrada} bits = {bytesEntrada}", "Direcciona {potencia} = {direccionables} clusters"],
      expect: { bytesEntrada: expected.entry, direccionables: expected.addressable },
      narration: "La FAT4 sale de la pantalla. Ahora una FAT real, sobre un disco de {disco} con clusters de {cluster}. " + first
    },
    ask("Con eso ya se puede calcular el tamaño máximo teórico.", askTheoretical),
    {
      calc: ["Teórico = {potencia} × {cluster} = {teorico}"],
      expect: { teorico: expected.theoretical },
      narration: "Tamaño máximo teórico = 2^(bits de dirección) × tamaño de cluster = {potencia} × {cluster} = {teorico}."
    },
    {
      calc: ["Real = mín({teorico}, {disco}) = {real}"],
      expect: { real: expected.real },
      narration: "El real es el mínimo entre el teórico y el físico: mín({teorico}, {disco}) = {real}."
    },
    {
      calc: ["Entradas = {real} / {cluster} = {entradas}"],
      expect: { entradas: expected.entries },
      narration: "La FAT tiene una entrada por cluster del file system: {real} / {cluster} = {entradas} entradas."
    },
    {
      calc: ["Tamaño de la FAT = {entradas} × {bytesEntrada} = {tamFat}"],
      expect: { tamFat: expected.size },
      narration: "Tamaño de la FAT = cantidad de entradas × tamaño de entrada = {entradas} × {bytesEntrada} = {tamFat}."
    },
    ask("Falta un detalle para saber cuánto disco ocupa la FAT.", askCopy),
    {
      calc: ["Con la copia: 2 × {tamFat} = {conCopia}"],
      expect: { conCopia: expected.copy },
      narration: "Y hay que contar la copia de respaldo: en el disco, la FAT ocupa {conCopia}."
    },
    {
      narration: "El tamaño máximo de un archivo tiene además otro límite: la entrada de directorio lo deja en {limiteArchivo}. En este disco el file system mide {real}, menos que eso, así que el límite real es el del file system."
    }
  ].filter(Boolean));
}

<script id="engine">
const USED_TIPS = {};

function fill(template, values) {
  return String(template).replace(/\{(\w+)\}/g, function (whole, key) {
    return values[key] === undefined || values[key] === null ? whole : String(values[key]);
  });
}

function joinList(items) {
  const texts = items.map(String);
  if (texts.length <= 1) return texts.join("");
  return texts.slice(0, -1).join(", ") + UI_TEXT.and + texts[texts.length - 1];
}

function unresolved(text) {
  return /\{\w+\}/.test(String(text));
}

function unbalanced(text) {
  const stars = String(text).split("*").length - 1;
  const opens = String(text).split("[[").length - 1;
  const closes = String(text).split("]]").length - 1;
  return stars % 2 !== 0 || opens !== closes;
}

function groupThousands(value) {
  const text = String(value);
  if (text.length < 5) return text;
  return text.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function range(count) {
  const out = [];
  for (let index = 0; index < count; index += 1) out.push(index);
  return out;
}

function spanText(blocks) {
  if (blocks.length === 0) return UI_TEXT.none;
  if (blocks.length === 1) return String(blocks[0]);
  return blocks[0] + UI_TEXT.dash + blocks[blocks.length - 1];
}

function visible(text) {
  return String(text).replace(/ /g, UI_TEXT.space);
}

function byteLength(text) {
  return String(text).replace(/\\0/g, "0").length;
}

function clock(minutes) {
  const hour = 10 + Math.floor(minutes / 60);
  const minute = minutes % 60;
  return hour + ":" + (minute < 10 ? "0" + minute : minute);
}

function formatBytes(bytes) {
  const units = UI_TEXT.units;
  let unit = 0;
  let value = bytes;
  while (unit < units.length - 1 && value >= 1024 && value % 1024 === 0) {
    value = value / 1024;
    unit += 1;
  }
  return groupThousands(value) + " " + units[unit];
}

function decimal(value) {
  return String(value).replace(".", UI_TEXT.decimalMark);
}

function superscript(value) {
  const digits = "⁰¹²³⁴⁵⁶⁷⁸⁹";
  return String(value).split("").map(function (digit) { return digits[Number(digit)]; }).join("");
}

function binary(value, bits) {
  let text = value.toString(2);
  while (text.length < bits) text = "0" + text;
  return text;
}

function table(caption, columns, rows, extra) {
  return Object.assign({ caption: caption, columns: columns, rows: rows }, extra || {});
}

function tablesView(tables, extra) {
  return Object.assign({ kind: "tables", tables: tables }, extra || {});
}

function diskView(blocks, cols, extra) {
  return Object.assign({ kind: "disk", blocks: blocks, cols: cols }, extra || {});
}

function counterView(items, extra) {
  return Object.assign({ kind: "counters", items: items }, extra || {});
}

function listView(lines, empty) {
  return { kind: "list", lines: lines, empty: empty };
}

function freeCell() {
  return { kind: "free", who: UI_TEXT.disk.free };
}

function otherCell() {
  return { kind: "other", who: UI_TEXT.disk.other };
}

const filesModel = {
  init: function (config, problems) {
    const state = { clock: 0, nextFcb: config.fcbStart, systems: {}, order: [], fcbs: {}, handles: {}, buffer: null, counters: { read: 0, written: 0, freed: 0 }, touch: {} };
    config.systems.forEach(function (fs) {
      const dirs = {};
      fs.dirs.forEach(function (path) { dirs[path] = []; });
      state.systems[fs.id] = { config: Object.assign({ blockSize: config.blockSize }, fs), disk: range(fs.blocks).map(function (index) { return fs.other.indexOf(index) !== -1 ? { kind: "other" } : { kind: "free" }; }), dirs: dirs };
      state.order.push(fs.id);
    });
    (config.files || []).forEach(function (file) {
      const where = { fs: file.fs, dir: file.dir, name: file.name };
      filesModel.apply(state, Object.assign({ op: "create", file: file.file }, where), config, problems);
      filesModel.apply(state, Object.assign({ op: "open", mode: "w" }, where), config, problems);
      filesModel.apply(state, Object.assign({ op: "write", text: file.text }, where), config, problems);
      filesModel.apply(state, Object.assign({ op: "close" }, where), config, problems);
      const fcb = filesFcb(state, where, problems);
      if (fcb && fcb.blocks.join(",") !== file.expectBlocks.join(",")) problems.push(file.name + " queda en los bloques " + fcb.blocks.join(", ") + ", no en " + file.expectBlocks.join(", "));
    });
    state.clock = config.clockStart || 0;
    state.counters = { read: 0, written: 0, freed: 0 };
    return state;
  },
  apply: function (state, op, config, problems) {
    const fs = state.systems[op.fs || state.order[0]];
    const where = { fs: op.fs || state.order[0], dir: op.dir, name: op.name };
    state.touch = { entries: [], blocks: [] };
    state.clock += 1;
    const out = {};
    if (op.op === "create") {
      const id = state.nextFcb;
      state.nextFcb += 1;
      state.fcbs[id] = { id: id, file: op.file, size: 0, blocks: [], created: state.clock, modified: state.clock, fs: where.fs };
      fs.dirs[op.dir].push({ name: op.name, fcb: id });
      state.touch.entries.push(where.fs + "|" + op.dir + "|" + op.name);
      out.tamanio = 0;
      return out;
    }
    const fcb = filesFcb(state, where, problems);
    if (!fcb) return out;
    const handle = state.handles[fcb.id];
    if (op.op === "open") {
      state.handles[fcb.id] = { pos: 0, mode: op.mode };
      out.pos = 0;
      return out;
    }
    if (op.op === "write" || op.op === "writeBuffer") {
      const text = op.op === "write" ? op.text : state.buffer;
      const start = op.op === "write" ? (handle ? handle.pos : problems.push("escribe en un archivo que no está abierto") && 0) : 0;
      const written = filesWrite(fs, fcb, start, text, problems);
      if (op.op === "write" && handle) handle.pos = start + text.length;
      fcb.modified = state.clock;
      state.counters.written += written.length;
      state.touch.blocks = written;
      out.escritos = op.op === "write" ? text.length : written.length;
      out.cantidad = written.length;
      out.bloques = joinList(written);
      out.pos = handle ? handle.pos : 0;
      out.tamanio = fcb.size;
      return out;
    }
    if (op.op === "seek") {
      if (!handle) problems.push("posiciona un archivo que no está abierto");
      else handle.pos = op.to;
      out.pos = op.to;
      return out;
    }
    if (op.op === "read") {
      const from = handle.pos;
      const until = Math.min(fcb.size, from + op.n);
      const blocks = [];
      for (let byte = from; byte < until; byte += 1) {
        const block = fcb.blocks[Math.floor(byte / config.blockSize)];
        if (blocks.indexOf(block) === -1) blocks.push(block);
      }
      out.leido = filesContent(fs, fcb).slice(from, until);
      out.desde = from;
      out.n = until - from;
      handle.pos = until;
      out.pos = until;
      out.bloques = joinList(blocks);
      state.counters.read += blocks.length;
      state.touch.blocks = blocks;
      return out;
    }
    if (op.op === "readAll") {
      state.buffer = filesContent(fs, fcb);
      state.counters.read += fcb.blocks.length;
      state.touch.blocks = fcb.blocks.slice();
      out.leidos = fcb.blocks.length;
      out.bloques = joinList(fcb.blocks);
      out.contenido = visible(state.buffer);
      out.tamanio = fcb.size;
      return out;
    }
    if (op.op === "truncate") {
      const keep = Math.ceil(op.to / config.blockSize);
      if (op.to < fcb.size) {
        const freed = fcb.blocks.slice(keep);
        freed.forEach(function (block) { fs.disk[block] = { kind: "free" }; });
        fcb.blocks = fcb.blocks.slice(0, keep);
        if (keep > 0) fs.disk[fcb.blocks[keep - 1]].text = fs.disk[fcb.blocks[keep - 1]].text.slice(0, op.to - (keep - 1) * config.blockSize);
        out.liberados = joinList(freed);
      } else {
        const fresh = [];
        while (fcb.blocks.length < keep) fresh.push(filesAllocate(fs, fcb, problems));
        out.nuevos = joinList(fresh);
      }
      fcb.size = op.to;
      fcb.modified = state.clock;
      out.tamanio = fcb.size;
      out.bloques = joinList(fcb.blocks);
      out.contenido = visible(filesContent(fs, fcb));
      return out;
    }
    if (op.op === "close") {
      delete state.handles[fcb.id];
      return out;
    }
    if (op.op === "rename") {
      const entry = fs.dirs[op.dir].find(function (one) { return one.name === op.name; });
      entry.name = op.newName;
      state.touch.entries.push(where.fs + "|" + op.dir + "|" + op.newName);
      out.bloques = joinList(fcb.blocks);
      return out;
    }
    if (op.op === "link") {
      fs.dirs[op.toDir].push({ name: op.name, fcb: fcb.id });
      state.touch.entries.push(where.fs + "|" + op.toDir + "|" + op.name);
      return out;
    }
    if (op.op === "unlink" || op.op === "delete") {
      fs.dirs[op.dir] = fs.dirs[op.dir].filter(function (one) { return one.name !== op.name; });
      out.bloques = joinList(fcb.blocks);
      if (op.op === "delete") {
        const freed = fcb.blocks.slice();
        freed.forEach(function (block) { fs.disk[block] = { kind: "free" }; });
        state.counters.freed += freed.length;
        delete state.fcbs[fcb.id];
        out.liberados = joinList(freed);
      }
      return out;
    }
    problems.push("una operación de archivos que el recurso no conoce: " + op.op);
    return out;
  },
  context: function (state, config) {
    const first = state.systems[state.order[0]];
    const free = [];
    first.disk.forEach(function (block, index) { if (block.kind === "free") free.push(index); });
    return {
      total: first.disk.length,
      tam: config.blockSize,
      libres: joinList(free),
      totalLeidos: state.counters.read,
      totalEscritos: state.counters.written,
      totalLiberados: state.counters.freed,
      totalTocados: state.counters.read + state.counters.written
    };
  },
  views: function (state, config) {
    const text = UI_TEXT.files;
    const multiple = state.order.length > 1;
    const dirTables = [];
    state.order.forEach(function (id) {
      const fs = state.systems[id];
      Object.keys(fs.dirs).forEach(function (path) {
        const rows = fs.dirs[path].map(function (entry) { return [entry.name, fill(text.fcbName, { id: entry.fcb })]; });
        const highlight = [];
        fs.dirs[path].forEach(function (entry, index) { if (state.touch.entries && state.touch.entries.indexOf(id + "|" + path + "|" + entry.name) !== -1) highlight.push(index); });
        dirTables.push(table(multiple ? fill(text.dirOnFs, { path: path, fs: fs.config.label }) : path, [text.columns.name, text.columns.fcb], rows, { highlight: highlight, empty: text.emptyDir }));
      });
    });
    const fcbTables = Object.keys(state.fcbs).map(function (id) {
      const fcb = state.fcbs[id];
      return table(fill(text.fcbName, { id: id }), [text.columns.field, text.columns.value], [
        [text.fields.perms, config.perms],
        [text.fields.owner, config.owner],
        [text.fields.dates, fill(text.datesValue, { created: clock(fcb.created), modified: clock(fcb.modified) })],
        [text.fields.size, fill(text.bytes, { n: fcb.size })],
        [text.fields.blocks, fcb.blocks.length ? joinList(fcb.blocks) : UI_TEXT.none]
      ], { track: true });
    });
    const views = {
      directory: tablesView(dirTables, { track: true }),
      dirs: tablesView(dirTables, { track: true }),
      fcb: tablesView(fcbTables, { empty: text.noFcb, track: true }),
      touched: counterView([
        { caption: text.counters.read, value: state.counters.read },
        { caption: text.counters.written, value: state.counters.written },
        { caption: text.counters.freed, value: state.counters.freed }
      ])
    };
    state.order.forEach(function (id, position) {
      const disk = filesDiskView(state, state.systems[id]);
      if (position === 0) { views.disk = disk; views.diskOne = disk; }
      if (position === 1) views.diskTwo = disk;
    });
    const openIds = Object.keys(state.handles);
    if (openIds.length > 0) {
      const fcb = state.fcbs[openIds[0]];
      const fs = state.systems[fcb.fs];
      const content = filesContent(fs, fcb);
      const pos = state.handles[openIds[0]].pos;
      views.position = {
        kind: "bytes",
        blocks: fcb.blocks.map(function (block, order) {
          const bytes = [];
          for (let offset = 0; offset < config.blockSize; offset += 1) {
            const at = order * config.blockSize + offset;
            if (at >= fcb.size) break;
            bytes.push({ ch: visible(content[at] || " "), n: at });
          }
          return { cap: fill(text.blockCap, { n: block }), file: fcb.file, bytes: bytes };
        }).filter(function (one) { return one.bytes.length > 0; }),
        caret: pos,
        size: fcb.size,
        label: fill(text.position, { pos: pos }),
        empty: text.emptyFile
      };
    } else {
      views.position = { kind: "bytes", blocks: [], caret: null, size: 0, label: "", empty: text.closed };
    }
    return views;
  }
};

function filesFcb(state, where, problems) {
  const fs = state.systems[where.fs];
  const entry = fs && fs.dirs[where.dir] ? fs.dirs[where.dir].find(function (one) { return one.name === where.name; }) : null;
  if (!entry) { problems.push("no existe " + where.dir + "/" + where.name); return null; }
  return state.fcbs[entry.fcb];
}

function filesAllocate(fs, fcb, problems) {
  const index = fs.disk.findIndex(function (block) { return block.kind === "free"; });
  if (index === -1) { problems.push("no quedan bloques libres"); return null; }
  fs.disk[index] = { kind: "data", fcb: fcb.id, text: "" };
  fcb.blocks.push(index);
  return index;
}

function filesWrite(fs, fcb, start, text, problems) {
  const size = fs.config.blockSize;
  const written = [];
  for (let offset = 0; offset < text.length; offset += 1) {
    const at = start + offset;
    const order = Math.floor(at / size);
    while (fcb.blocks.length <= order) filesAllocate(fs, fcb, problems);
    const block = fcb.blocks[order];
    const cell = fs.disk[block];
    const local = at - order * size;
    const chars = cell.text.split("");
    while (chars.length < local) chars.push(" ");
    chars[local] = text[offset];
    cell.text = chars.join("");
    if (written.indexOf(block) === -1) written.push(block);
  }
  fcb.size = Math.max(fcb.size, start + text.length);
  return written;
}

function filesContent(fs, fcb) {
  return fcb.blocks.map(function (block) {
    let text = fs.disk[block].text;
    while (text.length < fs.config.blockSize) text += " ";
    return text;
  }).join("").slice(0, fcb.size);
}

function filesDiskView(state, fs) {
  const names = {};
  Object.keys(fs.dirs).forEach(function (path) {
    fs.dirs[path].forEach(function (entry) { if (!names[entry.fcb]) names[entry.fcb] = entry.name; });
  });
  const blocks = fs.disk.map(function (block, index) {
    if (block.kind === "other") return otherCell();
    if (block.kind === "free") return freeCell();
    const fcb = state.fcbs[block.fcb];
    return { kind: "data", file: fcb.file, who: names[block.fcb] || "", txt: visible(block.text), focus: (state.touch.blocks || []).indexOf(index) !== -1 };
  });
  const files = Object.keys(state.fcbs).filter(function (id) { return state.fcbs[id].fs === fs.config.id; }).map(function (id) { return { file: state.fcbs[id].file, name: names[id] || "" }; });
  return diskView(blocks, Math.min(fs.disk.length, 6), { sub: fill(UI_TEXT.files.diskSub, { size: fs.config.blockSize }), files: files });
}

const locksModel = {
  init: function (config) {
    const procs = {};
    config.procs.forEach(function (name) { procs[name] = "READY"; });
    const accounts = {};
    config.accounts.forEach(function (pair) { accounts[pair[0]] = pair[1]; });
    return { procs: procs, shared: [], exclusive: null, waiting: [], accounts: accounts, seen: null, notice: null, total: locksSum(accounts) };
  },
  apply: function (state, op, config, problems) {
    const out = { actor: op.p };
    state.notice = null;
    let actor = op.p;
    if (op.op === "request") {
      if (op.type === "shared") {
        if (state.exclusive) { state.waiting.push({ p: op.p, type: "shared" }); state.procs[op.p] = "BLOCKED"; out.otorgado = "no"; }
        else { state.shared.push(op.p); out.otorgado = "sí"; }
      } else {
        const holders = state.shared.filter(function (one) { return one !== op.p; });
        if (holders.length > 0 || state.exclusive) {
          if (config.mode === "mandatory") { state.waiting.push({ p: op.p, type: "exclusive" }); state.procs[op.p] = "BLOCKED"; out.otorgado = "no"; }
          else { state.notice = fill(UI_TEXT.locks.notice, { holders: joinList(holders) }); out.otorgado = "no"; }
        } else {
          state.exclusive = op.p;
          out.otorgado = "sí";
        }
      }
    } else if (op.op === "release") {
      state.shared = state.shared.filter(function (one) { return one !== op.p; });
      if (state.exclusive === op.p) state.exclusive = null;
      if (state.waiting.length > 0 && state.shared.length === 0 && !state.exclusive) {
        const next = state.waiting.shift();
        if (next.type === "exclusive") state.exclusive = next.p;
        else state.shared.push(next.p);
        state.procs[next.p] = "READY";
        out.despierta = next.p;
      }
    } else if (op.op === "write") {
      if (config.mode === "mandatory" && state.exclusive !== op.p) problems.push(op.p + " escribe sin tener el lock exclusivo");
      state.accounts[op.account] = op.value;
    } else if (op.op === "read") {
      state.seen = Object.assign({}, state.accounts);
    } else {
      problems.push("una operación de locks que el recurso no conoce: " + op.op);
    }
    Object.keys(state.procs).forEach(function (name) {
      if (state.procs[name] === "BLOCKED") return;
      state.procs[name] = name === actor ? "RUNNING" : "READY";
    });
    if (state.procs[actor] === "BLOCKED") {
      const other = Object.keys(state.procs).find(function (name) { return state.procs[name] !== "BLOCKED"; });
      if (other) state.procs[other] = "READY";
    }
    return out;
  },
  context: function (state) {
    const keys = Object.keys(state.accounts);
    const context = { suma: locksSum(state.accounts), total: state.total, titulares: state.shared.length ? joinList(state.shared) : UI_TEXT.none };
    keys.forEach(function (key) { context[key.toLowerCase()] = state.accounts[key]; });
    if (state.seen) {
      context.vioSuma = locksSum(state.seen);
      keys.forEach(function (key) { context["vio" + key] = state.seen[key]; });
    }
    return context;
  },
  views: function (state, config) {
    const text = UI_TEXT.locks;
    const rows = Object.keys(state.accounts).map(function (key) { return [fill(text.account, { name: key }), String(state.accounts[key])]; });
    rows.push([text.sum, String(locksSum(state.accounts))]);
    const tables = [table(config.file, [text.columns.item, text.columns.value], rows, { track: true })];
    if (state.seen) {
      const seenRows = Object.keys(state.seen).map(function (key) { return [fill(text.account, { name: key }), String(state.seen[key])]; });
      const wrong = locksSum(state.seen) !== state.total;
      seenRows.push([text.sum, String(locksSum(state.seen)) + (wrong ? " " + UI_TEXT.fail : "")]);
      tables.push(table(text.seenBy, [text.columns.item, text.columns.value], seenRows, { faultRows: wrong ? [seenRows.length - 1] : [], track: true }));
    }
    return {
      procs: { kind: "actors", rows: Object.keys(state.procs).map(function (name) { return { who: name, state: state.procs[name], gloss: UI_TEXT.states[state.procs[name]] }; }) },
      lockState: tablesView([table(fill(text.lockOf, { file: config.file }), [text.columns.lock, text.columns.who], [
        [text.shared, state.shared.length ? joinList(state.shared) : UI_TEXT.none],
        [text.exclusive, state.exclusive || UI_TEXT.none],
        [text.waiting, state.waiting.length ? joinList(state.waiting.map(function (one) { return one.p; })) : UI_TEXT.none]
      ], { track: true, note: state.notice })], { track: true }),
      content: tablesView(tables, { track: true })
    };
  }
};

function locksSum(accounts) {
  return Object.keys(accounts).reduce(function (sum, key) { return sum + accounts[key]; }, 0);
}

const openModel = {
  init: function (config) {
    const procs = {};
    config.procs.forEach(function (name) { procs[name] = []; });
    return { global: [], procs: procs, lines: [] };
  },
  apply: function (state, op, config, problems) {
    const text = UI_TEXT.open;
    const out = {};
    const entries = state.procs[op.p];
    const global = state.global.find(function (one) { return one.file === op.file; });
    if (op.op === "open") {
      state.lines = [text.perm];
      let entry = global;
      if (entry) {

function freeGroups(free, size) {
  const groups = [];
  if (!size || free.length === 0) return groups;
  let block = free[0];
  let rest = free.slice(1);
  while (rest.length > 0) {
    const holds = rest.slice(0, size);
    groups.push({ block: block, holds: holds });
    if (rest.length <= size) break;
    block = holds[size - 1];
    rest = rest.slice(size);
  }
  return groups;
}

function freeRuns(free) {
  const runs = [];
  free.forEach(function (block) {
    const last = runs[runs.length - 1];
    if (last && last[0] + last[1] === block) last[1] += 1;
    else runs.push([block, 1]);
  });
  return runs;
}

function fatChain(entries, start) {
  const chain = [];
  let cursor = start;
  while (cursor !== "EOF" && cursor !== null && chain.length <= entries.length) {
    chain.push(cursor);
    cursor = entries[cursor];
  }
  return chain;
}

function inodePlace(config, logical) {
  const per = config.blockSize / config.pointerSize;
  if (logical < config.direct) return { level: "direct", entries: [logical] };
  const one = logical - config.direct;
  if (one < per) return { level: "simple", entries: [one] };
  const two = one - per;
  if (two < per * per) return { level: "double", entries: [Math.floor(two / per), two % per] };
  const three = two - per * per;
  return { level: "triple", entries: [Math.floor(three / (per * per)), Math.floor(three / per) % per, three % per] };
}

function inodeTake(state, kind, extra, allocated, problems) {
  const index = state.disk.findIndex(function (block) { return block.kind === "free"; });
  if (index === -1) { problems.push("no quedan bloques libres para el inodo"); return null; }
  state.disk[index] = Object.assign({ kind: kind }, extra);
  if (kind === "pointer") state.pointerBlocks[index] = [];
  allocated.push(index);
  return index;
}

function inodeAllocate(state, config, logical, allocated, problems) {
  const place = inodePlace(config, logical);
  if (place.level === "triple") { problems.push("el ejemplo llega al indirecto triple"); return; }
  if (place.level === "simple" && state.simple === null) state.simple = inodeTake(state, "pointer", { role: "simple" }, allocated, problems);
  let holder = null;
  if (place.level === "simple") holder = state.simple;
  if (place.level === "double") {
    if (state.double === null) state.double = inodeTake(state, "pointer", { role: "double" }, allocated, problems);
    if (state.children[place.entries[0]] === undefined) {
      state.children[place.entries[0]] = inodeTake(state, "pointer", { role: "simple" }, allocated, problems);
      state.pointerBlocks[state.double].push(state.children[place.entries[0]]);
    }
    holder = state.children[place.entries[0]];
  }
  const data = inodeTake(state, "data", { logical: logical }, allocated, problems);
  state.data.push(data);
  if (holder !== null) state.pointerBlocks[holder].push(data);
}
