<title>Procesos e hilos</title>
<style>
  :root {
    --ink: #10151d;
    --ink-soft: #35404f;
    --muted: #5f6877;
    --faint: #838c9a;
    --line: #e3e7ee;
    --line-strong: #c6ccd8;
    --page: #edf0f6;
    --card: #ffffff;

    --running: #1d4ed8;
    --running-soft: #e8eefc;
    --pcb: #a85a06;
    --marked: #1c2534;
    --marked-soft: #e3e8f1;
    --pointer: #35404f;
    --alert: #c0392f;
    --alert-soft: #fbeae8;
    --thread: #6d4aad;
    --thread-soft: #eee9f8;
    --region-fill: #fbfcfe;
    --region-fill-alt: #f2f5f9;

    --radius: 11px;
    --shadow: 0 1px 2px rgba(16, 21, 29, 0.05), 0 1px 8px rgba(16, 21, 29, 0.04);
    --fast: 160ms;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html, body { margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    color: var(--ink);
    background: var(--page);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 10px 14px 12px;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { margin: 0; font-weight: 640; }

  button {
    font: inherit;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    cursor: pointer;
    transition: background-color var(--fast) ease-out, border-color var(--fast) ease-out, color var(--fast) ease-out, transform var(--fast) ease-out;
  }

  button:hover:not([disabled]) { border-color: var(--faint); }
  button:active:not([disabled]) { transform: translateY(1px); }

  button:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid var(--marked);
    outline-offset: 2px;
  }

  button[disabled] { opacity: 0.4; cursor: not-allowed; }

  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-variant-numeric: tabular-nums;
  }

  header { display: flex; flex-direction: column; gap: 8px; flex: 0 0 auto; }

  .head-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  header > h1 { font-size: 16px; letter-spacing: -0.012em; color: var(--ink-soft); }

  .head-row .spacer { flex: 1; }

  .toggle-label { font-size: 12.5px; color: var(--muted); }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters button { padding: 3px 10px; font-size: 12.5px; }
  .filters button[aria-pressed="true"] { color: #fff; }

  .counter-box { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; background: var(--region-fill); }
  .counter-box + .counter-box { margin-top: 8px; }
  .counter-top { display: flex; align-items: baseline; gap: 8px; }
  .counter-label { font-size: 11.5px; font-weight: 650; color: var(--ink-soft); line-height: 1.25; }
  .counter-value { margin-left: auto; font-size: 20px; font-weight: 800; }
  .counter-gloss { display: block; font-size: 10.5px; color: var(--muted); margin-top: 1px; }

  .decider-list { display: flex; flex-direction: column; gap: 3px; }

  .decider-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 2px 8px;
    padding: 2px 6px;
    border-left: 3px solid transparent;
    border-radius: 4px;
    font-size: 11.5px;
    transition: opacity var(--fast) ease-out;
  }

  .decider-row.current { background: var(--marked-soft); border-left-color: var(--marked); font-weight: 650; }
  .decider-row.later { color: var(--faint); opacity: 0.55; }
  .decider-row.faded { opacity: 0.28; }
  .decider-step { color: var(--muted); font-size: 10.5px; min-width: 6ch; }
  .decider-who { font-weight: 800; min-width: 3ch; }
  .decider-change { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .decider-change .arrow { margin: 0 4px; color: var(--muted); }

  .decider-tag {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.03em;
    border: 1px solid;
    border-radius: 4px;
    padding: 0 5px;

  }

  .examples { display: flex; gap: 7px; flex-wrap: wrap; }

  .examples button {

    align-items: center;
    gap: 6px;
    padding: 5px 9px 5px 6px;
    font-size: 12.5px;
    text-align: left;

  .examples button .num {

  .examples button[aria-current="true"] .num { background: rgba(255, 255, 255, 0.22); color: #fff; }

  main {

    min-height: 0;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: minmax(0, 1fr);
    gap: 9px;
  }

  main.has-wide { grid-template-rows: minmax(0, 1fr) auto; }

  .panel.wide { grid-column: 1 / -1; }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    min-height: 0;
    min-width: 0;

  .panel > h2 {

    text-transform: uppercase;

  .panel > h2::before {

  .panel.source > h2::before { background: var(--running); }

  .panel > h2 .file { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-transform: none; letter-spacing: 0; color: var(--ink-soft); font-size: 12px; }

  .panel > h2 .panel-owner {

  .panel > h2 .panel-note {

  .panel-body {

  .source-code { display: flex; flex-direction: column; }

  .code-line {

    display: flex;
    gap: 10px;

    line-height: 1.3;
    padding: 0 6px 1px 4px;

    color: var(--ink-soft);

  .code-line .num { color: var(--faint); min-width: 2ch; text-align: right; font-size: 12px; }
  .code-line .text { flex: 1; }

  .code-line.current {
    background: var(--running-soft);

  .processes { display: grid; gap: 10px; height: 100%; align-items: stretch; }

  .process { display: flex; flex-direction: column; min-height: 0; transition: opacity var(--fast) ease-out; }

  .process-head { display: flex; align-items: baseline; gap: 7px; flex: 0 0 auto; margin-bottom: 6px; }
  .process-head .name { font-size: 13px; font-weight: 700; }

  .active-chip {

  .map {

    padding-right: 16px;

  .map-arrows { position: absolute; inset: 0; pointer-events: none; overflow: visible; }

  .map-region.text, .map-region.data { background: var(--region-fill-alt); }
  .map-region.text, .map-region.data { flex: 0 0 auto; }
  .map-region.stack { flex: 1 1 auto; min-height: 68px; overflow: auto; padding: 5px 7px 3px; }
  .map-region.heap { flex: 0 0 auto; min-height: 28px; justify-content: flex-end; }
  .map-region.heap.empty { justify-content: center; }

  .region-head { display: flex; align-items: baseline; gap: 7px; flex: 0 0 auto; line-height: 1.3; }

  .region-name {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
    font-weight: 700;
    line-height: 1.25;
    color: var(--ink);
    background: var(--card);

  button.region-name:hover { border-color: var(--faint); }
  .region-gloss { font-size: 10.5px; color: var(--muted); }
  .region-grow { font-size: 10.5px; color: var(--faint); margin-left: auto; white-space: nowrap; }
  .region-head { flex-wrap: wrap; }
  .region-head .region-empty { margin: 0 0 0 auto; }
  .region-head .row { margin-left: auto; gap: 7px; padding: 0; }

  .frames { display: flex; flex-direction: column; gap: 5px; margin-top: 6px; }
  .blocks { display: flex; flex-direction: column-reverse; gap: 4px; margin-top: 5px; }

  .frame, .block {
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    background: var(--card);
    padding: 3px 8px;

  .frame { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }

  .thread-stacks { display: grid; gap: 5px; margin-top: 6px; align-items: start; }
  .thread-stack .frames { gap: 3px; margin-top: 4px; }

  .thread-stack {
    border: 1.5px solid var(--thread);
    border-radius: 7px;
    background: var(--thread-soft);
    padding: 4px 6px;
    min-width: 0;
  }

  .thread-stack.changed { box-shadow: 0 0 0 2px var(--marked); border-color: var(--marked); }
  .thread-name { display: block; font-size: 11px; font-weight: 800; color: var(--thread); letter-spacing: 0.03em; margin-bottom: 4px; }
  .frame.thread { border-color: var(--thread); background: var(--card); }

  .line-threads { position: absolute; right: 5px; top: 1px; display: flex; gap: 3px; }

  .thread-chip {

    font-weight: 800;

    background: var(--thread-soft);
    border: 1px solid var(--thread);
    border-radius: 4px;
    padding: 0 4px;
  }

  .thread-chip.current { background: var(--thread); color: #fff; }
  .code-line.marked { background: var(--thread-soft); border-left-color: var(--thread); }

  .tcb-card {
    border: 1.5px solid var(--thread);
    border-radius: 9px;
    background: var(--thread-soft);
    padding: 6px 9px;
  }

  .tcb-card h3 { font-size: 11px; letter-spacing: 0.04em; color: var(--thread); margin-bottom: 4px; }
  .tcb-card.changed { box-shadow: 0 0 0 2px var(--marked); border-color: var(--marked); }
  .frame-name { font-size: 11.5px; font-weight: 700; flex: 0 0 auto; }
  .frame-name .mono { font-size: 12px; }
  .frame-empty { font-size: 10.5px; color: var(--faint); }

  .vars { display: flex; flex-wrap: wrap; gap: 5px; }

  .var {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 1px 7px;
    font-size: 11.5px;
    background: var(--region-fill-alt);
  }

  .var .vname { color: var(--muted); }
  .var .vval { font-weight: 700; }
  .var.points .vval { color: var(--pointer); }
  .var.points::after { content: "\2192"; color: var(--pointer); font-weight: 700; }

  .block { display: flex; align-items: baseline; gap: 8px; font-size: 11.5px; }
  .block .addr { color: var(--muted); }
  .block .size { font-weight: 700; }
  .block .held { color: var(--ink); }
  .block .block-note { margin-left: auto; color: var(--muted); font-size: 10.5px; text-align: right; }
  .block.hole { border-style: dashed; background: var(--region-fill-alt); color: var(--muted); }
  .block.lost { border-color: var(--line-strong); background: var(--region-fill-alt); }

  .free-band {
    flex: 0 0 auto;
    border: 1px dashed var(--line-strong);
    border-radius: 8px;
    padding: 0 7px;
    min-height: 16px;
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
  }

  .free-band .region-name { color: var(--muted); background: transparent; border-color: var(--line); cursor: default; }

  .region-empty { font-size: 11px; color: var(--faint); margin-top: 3px; }

  .region-rows { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; }

  .row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 12px;
    padding: 0 4px;
    border-radius: 4px;
  }

  .row .rname { color: var(--muted); }
  .row .rval { font-weight: 700; margin-left: auto; }

  .changed { animation: flash var(--fast) ease-out; }
  .frame.changed, .block.changed { border-color: var(--marked); box-shadow: 0 0 0 2px var(--marked-soft); }
  .var.changed, .row.changed { background: var(--marked-soft); border-color: var(--marked); }
  .var.changed .vname, .row.changed .rname { color: var(--marked); }
  .var.changed .vval, .row.changed .rval { color: var(--marked); }

  .empty-state { font-size: 13px; color: var(--muted); margin: 0; }

  .panel.states .panel-body { display: flex; flex-direction: column; gap: 7px; }

  .states-diagram { flex: 1 1 auto; min-height: 92px; width: 100%; }

  .state-node text { font-size: 11px; font-weight: 700; letter-spacing: 0.02em; }
  .state-node .holders { font-size: 10px; font-weight: 700; }
  .state-edge { fill: none; stroke: var(--line-strong); stroke-width: 1.4; }
  .state-edge.active { stroke: var(--marked); stroke-width: 2.6; }
  .state-edge.strong { stroke-width: 3.2; }
  .state-edge.faded, .state-arrow.faded, .edge-label.faded { opacity: 0.16; }
  .state-arrow { fill: var(--line-strong); }
  .state-arrow.active { fill: var(--marked); }

  .edge-label {
    font-size: 9.5px;
    fill: var(--muted);
    paint-order: stroke;
    stroke: #fff;
    stroke-width: 3.2px;
    stroke-linejoin: round;
  }

  .edge-label.active { fill: var(--marked); font-weight: 700; }
  .edge-leader { stroke: var(--line-strong); stroke-width: 0.7; opacity: 0.75; }
  .edge-leader.faded { opacity: 0.14; }

  .state-legend { display: flex; flex-wrap: wrap; gap: 2px 10px; flex: 0 0 auto; }
  .state-legend .item { display: inline-flex; align-items: baseline; gap: 4px; font-size: 10.5px; color: var(--muted); }
  .state-legend .dot { width: 8px; height: 8px; border-radius: 2px; border: 1.5px solid; align-self: center; }
  .state-legend .name { font-weight: 700; color: var(--ink-soft); font-size: 10px; letter-spacing: 0.03em; }

  .cpu-owner {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    padding: 1px 2px 7px;
    border-bottom: 1px solid var(--line);
  }

  .cpu-owner .label { font-size: 11px; color: var(--muted); font-weight: 650; }
  .cpu-owner .value { font-size: 15px; font-weight: 800; }
  .cpu-owner.changed .label, .cpu-owner.changed .value { color: var(--marked); }

  .ctx-caption { display: block; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--faint); font-weight: 700; margin-top: 7px; }
  .ctx-rows { display: flex; flex-direction: column; gap: 3px; margin-top: 7px; }

  .ctx-row {

    justify-content: space-between;
    align-items: baseline;

    padding: 2px 4px;

  .ctx-row.changed .name, .ctx-row.changed .val { color: var(--marked); }

  .cpu-empty { font-size: 12px; color: var(--muted); margin: 8px 0 0; }

  .pcb-state { display: inline-block; padding: 0 7px; border-radius: 4px; font-size: 11px; font-weight: 700; border: 1.5px solid; }

  .pcb-context {
    border: 1px solid var(--line-strong);
    border-radius: 6px;
    padding: 3px 6px;
    margin-top: 3px;
  }

  .pcb-context.empty { border-style: dashed; }
  .pcb-context-empty { font-size: 10.5px; color: var(--muted); margin: 0; }

  .panel.occupancy .panel-body { display: flex; flex-direction: column; gap: 10px; }

  .occ-block { border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 8px; background: var(--region-fill); }
  .occ-block.swap, .occ-block.pending { border-style: dashed; background: var(--region-fill-alt); }

  .occ-head { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .occ-name { font-size: 12.5px; font-weight: 700; color: var(--ink); }
  .occ-usage { margin-left: auto; font-size: 11px; color: var(--muted); font-weight: 650; }
  .occ-empty { margin-left: auto; font-size: 11px; color: var(--faint); }

  .occ-bar { display: flex; gap: 4px; margin-top: 7px; height: 42px; }

  .occ-cell {
    min-width: 0;
    border: 1.5px solid var(--line-strong);
    border-radius: 5px;
    background: var(--card);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    white-space: nowrap;
  }

  .occ-cell .who { font-size: 12.5px; font-weight: 800; }
  .occ-cell .units { font-size: 10px; color: var(--muted); }
  .occ-cell.free { border-style: dashed; background: transparent; }
  .occ-cell.free .who { font-size: 11px; font-weight: 650; color: var(--muted); }
  .occ-cell.spacer { border: 0; background: transparent; }
  .occ-cell.changed { border-color: var(--marked); box-shadow: 0 0 0 2px var(--marked-soft); }

  .panel.timeline .panel-body { padding: 8px 12px 10px; overflow: hidden; }

  .tl-lanes { display: flex; flex-direction: column; gap: 3px; }
  .tl-lane { display: flex; align-items: stretch; gap: 8px; }
  .tl-name { flex: 0 0 36px; text-align: right; font-size: 10.5px; color: var(--muted); font-weight: 700; align-self: center; }
  .tl-track { flex: 1 1 auto; display: flex; gap: 2px; min-width: 0; height: 20px; }

  .tl-seg {
    min-width: 0;
    border: 1px solid var(--line-strong);

    align-items: center;
    justify-content: center;

  .tl-seg.overhead { border-color: var(--alert); background: var(--alert-soft); color: var(--alert); }

  .tl-seg.idle {

    flex: 1 1 auto;

    overflow-y: auto;
  }

    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(280px, 0.7fr);
    gap: 6px 16px;
    align-content: start;
  }

  .narration-main { min-width: 0; }

  .narration-text { font-size: 15.5px; margin: 0; color: var(--ink); }
  .narration-note { font-size: 13.5px; color: var(--muted); margin: 4px 0 0; }

  .takeaway {
    padding: 7px 11px;
    border: 2px solid var(--ink);
    border-radius: 8px;
    animation: flash var(--fast) ease-out;
  }

  .takeaway .tag {
    display: block;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 800;
    color: var(--muted);

  }

  .controls .big { padding: 7px 16px; font-size: 15px; font-weight: 640; }

  .controls .big.primary { background: var(--running); border-color: var(--running); color: #fff; }
  .controls .big.primary:hover:not([disabled]) { background: #1a45bd; border-color: #1a45bd; }
  .controls .small { padding: 6px 11px; font-size: 13px; }

  .tip {
    font: inherit;
    background: none;
    border: 0;
    padding: 0;
    color: inherit;
    border-bottom: 1px dotted var(--running);
    cursor: help;
    border-radius: 0;
  }

  .tip:hover { border-bottom-style: solid; }

  #tooltip {
    position: fixed;
    z-index: 20;
    max-width: 330px;
    background: var(--ink);
    color: #fff;
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 13px;
    line-height: 1.42;
    box-shadow: 0 6px 20px rgba(16, 21, 29, 0.3);
    display: none;
  }

  #tooltip .tip-title { font-weight: 700; display: block; margin-bottom: 3px; }

  @keyframes flash {
    from { opacity: 0.35; }
    to { opacity: 1; }
  }

  @media (max-width: 1000px) {
    body { height: auto; overflow: auto; padding-bottom: calc(122px + env(safe-area-inset-bottom)); }
    main { grid-template-columns: 1fr !important; grid-template-rows: none !important; }
    .panel-body { overflow: visible; }
    .map-region.stack { min-height: 120px; }
    .narration-body { overflow: visible; }
    .narration-body.with-extras { grid-template-columns: 1fr; }
    .narration-head { flex-direction: column; align-items: flex-start; gap: 3px; }
    .processes.two { grid-template-columns: 1fr; }
    .pcb-cards.side { grid-template-columns: 1fr; }
    .decider-change { white-space: normal; overflow: visible; text-overflow: clip; }
    .pcb-cards.side .pcb-card + .pcb-card { margin-top: 8px; }

    .controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;

      gap: 7px;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));

      box-shadow: 0 -2px 12px rgba(16, 21, 29, 0.08);
      z-index: 10;

    .controls .big, .controls .small { width: 100%; }
    #playPause { display: none; }
    #prevStep { order: 1; }
    #nextStep { order: 2; }
    #firstStep { order: 3; }
    #lastStep { order: 4; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>

<script id="engine">
function fill(template, values) {
  return template.replace(/\{(\w+)\}/g, function (match, key) {
    return values[key] === undefined ? match : values[key];
  });
}

function findByName(list, name) {
  return list.filter(function (item) { return item.name === name; })[0] || null;
}

function segmentKey(segment) {
  return segment.kind === "block" ? "block:" + segment.id : "hole:" + segment.address;
}

function cloneVariable(variable) {
  return { name: variable.name, value: variable.value, pointsTo: variable.pointsTo || null };
}

function cloneFrame(frame) {
  return { name: frame.name, vars: frame.vars.map(cloneVariable) };
}

function cloneSegment(segment) {
  return {
    kind: segment.kind,
    id: segment.id || null,
    address: segment.address,
    size: segment.size,
    value: segment.value || null,
    lost: segment.lost === true
  };
}

function cloneContext(context) {
  if (!context) return null;
  const copy = {};
  Object.keys(context).forEach(function (key) { copy[key] = context[key]; });
  return copy;
}

function sameContext(a, b) {

    id: thread.id,
    state: thread.state,
    line: thread.line,

    id: process.id,
    pid: process.pid,
    program: process.program,
    line: process.line,
    state: process.state,
    context: cloneContext(process.context),
    location: process.location,
    footprint: process.footprint,
    threads: process.threads.map(cloneThread),
    data: process.data.map(cloneVariable),
    heap: process.heap.map(cloneSegment),
    stack: process.stack.map(cloneFrame)

function cloneTimeline(timeline) {

    units: timeline.units,

    timeline: cloneTimeline(state.timeline)

function emptyState() {

function programFile(key) {

function newProcess(op, example) {
  return {
    id: op.id,
    pid: op.pid,
    program: example.program || null,
    line: null,
    state: null,
    context: null,
    location: op.location || null,
    footprint: op.footprint || 0,
    threads: [],

    heap: [],
    stack: []

function findProcess(processes, id) {
  return processes.filter(function (process) { return process.id === id; })[0] || null;
}

function findThread(process, id) {

function residentProcesses(processes) {

function setLocal(process, op) {

    existing.value = op.value;
    existing.pointsTo = op.pointsTo || null;
    return;
  }
  frame.vars.push({ name: op.name, value: op.value, pointsTo: op.pointsTo || null });

function setGlobal(process, op) {
  const existing = findByName(process.data, op.name);
  if (existing) {
    existing.value = op.value;
    return;
  }
  process.data.push({ name: op.name, value: op.value, pointsTo: null });

function appendSegment(list, kind, label, units, tone) {
  const last = list[list.length - 1];
  if (last && last.kind === kind && last.label === label && last.tone === (tone || null)) {
    last.units += units;
    return;
  }
  list.push({ kind: kind, label: label, units: units, tone: tone || null });

function advanceTime(state, op) {

function applyOp(state, op, focus, example) {
  if (op.op === "process.add") {
    state.processes.push(newProcess(op, example));
    if (state.timeline.units > 0) {
      state.timeline.lanes[op.id] = [{ kind: "none", label: null, units: state.timeline.units, tone: null }];
    }
    return;
  }
  if (op.op === "cpu.set") {
    state.cpu.owner = op.owner;
    state.cpu.context = cloneContext(op.context);
    return;
  }
  if (op.op === "cpu.clear") {
    state.cpu.owner = null;
    state.cpu.context = null;
    return;

  if (op.op === "time.advance") {
    advanceTime(state, op);
    return;

  const process = findProcess(state.processes, op.process || focus);
  if (!process) return;
  if (op.op === "frame.push") {
    process.stack.push({ name: op.name, vars: (op.vars || []).map(cloneVariable) });
    return;
  }
  if (op.op === "frame.pop") {
    process.stack.pop();
    return;
  }
  if (op.op === "var.set") {
    setLocal(process, op);
    return;
  }
  if (op.op === "data.set") {
    setGlobal(process, op);
    return;
  }
  if (op.op === "heap.set") {
    process.heap = op.segments.map(cloneSegment);
    return;
  }
  if (op.op === "state.set") {
    process.state = op.value;
    return;
  }
  if (op.op === "context.set") {
    process.context = cloneContext(op.context);
    return;
  }
  if (op.op === "context.save") {
    process.context = cloneContext(state.cpu.context);
    state.cpu.owner = null;
    state.cpu.context = null;
    return;
  }
  if (op.op === "context.load") {
    state.cpu.owner = process.id;
    state.cpu.context = cloneContext(process.context);
    process.context = null;
    return;
  }
  if (op.op === "location.set") {
    process.location = op.value;
    return;
  }
  if (op.op === "thread.add") {
    process.threads.push({
      id: op.id,
      state: op.state || null,
      line: op.line || null,
      stack: (op.frames || []).map(function (frame) {
        return { name: frame.name, vars: (frame.vars || []).map(cloneVariable) };
      })
    });
    return;
  }
  const thread = op.thread ? findThread(process, op.thread) : null;
  if (!thread) return;
  if (op.op === "thread.state") {
    thread.state = op.value;
    return;
  }
  if (op.op === "thread.frame.push") {
    thread.stack.push({ name: op.name, vars: (op.vars || []).map(cloneVariable) });
    return;
  }
  if (op.op === "thread.var.set") {
    const frame = thread.stack[thread.stack.length - 1];
    if (!frame) return;
    const existing = findByName(frame.vars, op.name);
    if (existing) {
      existing.value = op.value;
      return;
    }
    frame.vars.push({ name: op.name, value: op.value, pointsTo: null });
  }
}

function pcbValues(process, fields) {

    pid: process.pid,
    program: programFile(process.program),
    state: process.state === null ? UI_TEXT.none : process.state,
    line: process.line === null ? UI_TEXT.none : process.line,
    frames: process.stack.length,
    heapBlocks: process.heap.filter(function (segment) { return segment.kind === "block"; }).length,
    context: process.context,

function diffProcess(before, after, fields) {

  if (!before) return changed;

  after.data.forEach(function (variable) {

  if (before.stack.length !== after.stack.length) changed.frames = true;
  changed.location = before.location !== after.location;
  changed.threads = [];
  after.threads.forEach(function (thread) {
    const old = findThread(before, thread.id);
    if (!old || old.state !== thread.state || old.line !== thread.line) changed.threads.push(thread.id);
    else {
      const oldTop = old.stack[old.stack.length - 1];
      const newTop = thread.stack[thread.stack.length - 1];
      const oldText = oldTop ? JSON.stringify(oldTop.vars) : "";
      const newText = newTop ? JSON.stringify(newTop.vars) : "";
      if (oldText !== newText || old.stack.length !== thread.stack.length) changed.threads.push(thread.id);
    }
  });
  after.stack.forEach(function (frame, index) {
    const previous = before.stack[index];
    frame.vars.forEach(function (variable) {
      const old = previous ? findByName(previous.vars, variable.name) : null;
      const moved = !old || old.value !== variable.value || old.pointsTo !== variable.pointsTo;
      if (moved) changed.vars.push(index + ":" + variable.name);

  const newValues = pcbValues(after, fields);
  fields.forEach(function (field) {

function diffCpu(before, after) {

      line: step.line || null,

function verifyExample(example, snapshots) {
  const problems = [];

  example.steps.forEach(function (step, index) {

      else if (program.lines[step.line - 1] === undefined) problems.push(label + " apunta a la línea " + step.line + ", que no existe");
      else if (program.lines[step.line - 1].trim() === "") problems.push(label + " apunta a la línea " + step.line + ", que está vacía");
      if (!step.focus) problems.push(label + " tiene línea pero no dice de qué proceso");
    }
    (step.ops || []).forEach(function (op) {
      const target = op.process || step.focus;
      const global = op.op === "process.add" || op.op === "time.advance" || op.op === "cpu.set" || op.op === "cpu.clear";
      if (!global && !findProcess(snapshots[index].processes, target)) {
        problems.push(label + " opera sobre " + target + ", que no existe");
      }
      if (op.op === "state.set" || op.op === "thread.state") {
        if (!STATES[op.value]) problems.push(label + " usa el estado " + op.value + ", que no está en STATES");
        else if (showsDiagram && declaredStates.indexOf(op.value) === -1) {
          problems.push(label + " usa el estado " + op.value + ", que el ejemplo no declara");
        }
      }

  });

  snapshots.forEach(function (snapshot, index) {
    snapshot.processes.forEach(function (process) {
      const change = snapshot.changed[process.id];

      const edge = change.state.from + ">" + change.state.to;

        problems.push("la transición " + edge + " del paso " + (index + 1) + " no está declarada en el ejemplo");
      }

      if (used > example.capacity) {

    Object.keys(timeline.lanes).forEach(function (id) {
      const total = timeline.lanes[id].reduce(function (sum, segment) { return sum + segment.units; }, 0);

        problems.push("el carril de " + id + " tiene " + total + " unidades y la línea de tiempo " + timeline.units + " en el paso " + (index + 1));
      }
    });
  });

  if (showsDiagram && declaredStates.length === 0) problems.push("muestra el diagrama y no declara estados");
  declaredStates.forEach(function (name) {
    if (!STATES[name]) problems.push("el ejemplo declara el estado " + name + ", que no está en STATES");
  });
  declaredTransitions.forEach(function (edge) {
    const drawn = STATE_EDGES.some(function (candidate) { return candidate.from + ">" + candidate.to === edge; });
    if (!drawn) problems.push("el ejemplo declara la transición " + edge + ", que no está en STATE_EDGES");
  });

  const expected = example.expectedFinalState;
  if (expected) {
    const last = snapshots[snapshots.length - 1];
    const final = last.processes;
    if (final.length !== expected.processes.length) {
      problems.push("quedaron " + final.length + " procesos y se esperaban " + expected.processes.length);
    }
    expected.processes.forEach(function (wanted) {
      const process = findProcess(final, wanted.id);
      if (!process) {
        problems.push("no quedó ningún proceso " + wanted.id);
        return;
      }
      if (process.stack.length !== wanted.frames) {
        problems.push(wanted.id + " terminó con " + process.stack.length + " frames y se esperaban " + wanted.frames);
      }
      const blocks = process.heap.filter(function (segment) { return segment.kind === "block"; }).length;
      if (blocks !== wanted.heapBlocks) {
        problems.push(wanted.id + " terminó con " + blocks + " pedidos sin liberar y se esperaban " + wanted.heapBlocks);
      }
      if (wanted.state !== undefined && process.state !== wanted.state) {
        problems.push(wanted.id + " terminó en " + process.state + " y se esperaba " + wanted.state);
      }
      if (wanted.location !== undefined && process.location !== wanted.location) {
        problems.push(wanted.id + " terminó " + process.location + " y se esperaba " + wanted.location);
      }
      if (wanted.threads !== undefined) {
        Object.keys(wanted.threads).forEach(function (id) {
          const thread = findThread(process, id);
          if (!thread) problems.push(wanted.id + " no tiene el hilo " + id);
          else if (thread.state !== wanted.threads[id]) {
            problems.push(id + " terminó en " + thread.state + " y se esperaba " + wanted.threads[id]);
          }
        });
      }
      Object.keys(wanted.data).forEach(function (name) {
        const variable = findByName(process.data, name);
        if (!variable) problems.push(wanted.id + " no tiene la variable " + name);
        else if (variable.value !== wanted.data[name]) {
          problems.push(wanted.id + "." + name + " es " + variable.value + " y se esperaba " + wanted.data[name]);
        }
      });
    });
    if (expected.maxFrames !== undefined) {
      const deepest = snapshots.reduce(function (most, snapshot) {
        return snapshot.processes.reduce(function (inner, process) {
          return Math.max(inner, process.stack.length);
        }, most);
      }, 0);
      if (deepest !== expected.maxFrames) {
        problems.push("el stack llegó a " + deepest + " frames y se esperaban " + expected.maxFrames);
      }
    }
    if (expected.timelineUnits !== undefined && last.timeline.units !== expected.timelineUnits) {
      problems.push("la línea de tiempo llegó a " + last.timeline.units + " unidades y se esperaban " + expected.timelineUnits);
    }
    if (expected.cpuOwner !== undefined && last.cpu.owner !== expected.cpuOwner) {
      problems.push("la CPU terminó con " + last.cpu.owner + " y se esperaba " + expected.cpuOwner);
    }
    if (expected.threadsTotal !== undefined) {
      const total = final.reduce(function (sum, process) { return sum + process.threads.length; }, 0);
      if (total !== expected.threadsTotal) {
        problems.push("quedaron " + total + " hilos y se esperaban " + expected.threadsTotal);
      }
    }
    if (expected.residentUnits !== undefined) {
      const used = residentProcesses(final).reduce(function (sum, process) { return sum + process.footprint; }, 0);
      if (used !== expected.residentUnits) {
        problems.push("quedaron " + used + " unidades ocupadas y se esperaban " + expected.residentUnits);
      }
    }
  }

  if (example.sameTraceAs !== undefined) {
    const other = EXAMPLES.filter(function (candidate) { return candidate.number === example.sameTraceAs; })[0];
    if (!other) problems.push("dice seguir la traza del ejemplo " + example.sameTraceAs + ", que no existe");
    else {
      const mine = JSON.stringify(example.steps.map(function (step) { return step.ops || []; }));
      const theirs = JSON.stringify(other.steps.map(function (step) { return step.ops || []; }));
      if (mine !== theirs) problems.push("su traza ya no es igual a la del ejemplo " + example.sameTraceAs);
    }
  }

  if (problems.length > 0) {
    console.error("Ejemplo " + example.number + ": " + problems.join("; "));
  }
}

function deriveTransitions(snapshots) {
  const list = [];
  snapshots.forEach(function (snapshot, index) {
    snapshot.processes.forEach(function (process) {
      const change = snapshot.changed[process.id];
      if (!change || !change.state || !change.state.from) return;
      const edge = STATE_EDGES.filter(function (candidate) {
        return candidate.from === change.state.from && candidate.to === change.state.to;
      })[0];
      list.push({
        stepIndex: index,
        processId: process.id,
        from: change.state.from,
        to: change.state.to,
        decider: edge ? edge.decider : "none"
      });
    });
  });
  return list;
}



const BUILT_EXAMPLES = EXAMPLES.map(function (example) {
  const snapshots = buildSnapshots(example);
  const mostProcesses = snapshots.reduce(function (most, snapshot) {
    return Math.max(most, snapshot.processes.length);
  }, 0);
  return {
    example: example,
    snapshots: snapshots,
    transitions: deriveTransitions(snapshots),
    mostProcesses: mostProcesses
  };
});

BUILT_EXAMPLES.forEach(function (built) { verifyExample(built.example, built.snapshots); });

function buildCanvas(example) {
  const canvas = example.canvas;
  const wide = canvas.wide || [];
  const key = canvas.columns + "|" + canvas.panels.join(",") + "|" + wide.join(",");
  if (key === canvasKey) return;
  canvasKey = key;
  Object.keys(panelRefs).forEach(function (id) { delete panelRefs[id]; });
  const fresh = element("main", wide.length > 0 ? "has-wide" : null);
  fresh.id = "main";
  fresh.style.gridTemplateColumns = canvas.columns;
  canvasPanels(example).forEach(function (id) {
    const refs = buildPanel(id);
    if (wide.indexOf(id) !== -1) refs.section.classList.add("wide");

function threadMarks(snapshot) {
  const marks = {};
  const process = snapshot.focus ? findProcess(snapshot.processes, snapshot.focus) : null;
  if (!process) return marks;
  process.threads.forEach(function (thread) {
    if (!thread.line) return;
    if (!marks[thread.line]) marks[thread.line] = [];
    marks[thread.line].push(thread);
  });
  return marks;
}

  program.lines.forEach(function (text, index) {
    const row = element("div", "code-line");

  const wrap = element("div", "thread-stacks");
  wrap.style.gridTemplateColumns = "repeat(" + process.threads.length + ", minmax(0, 1fr))";
  process.threads.forEach(function (thread) {
    const box = element("div", "thread-stack");
    if (changed.threads.indexOf(thread.id) !== -1) box.classList.add("changed");
    box.appendChild(element("span", "thread-name mono", thread.id));
    const frames = element("div", "frames");
    thread.stack.forEach(function (frame) {
      const row = element("div", "frame thread");
      row.appendChild(element("span", "frame-name mono", frame.name));
      if (frame.vars.length > 0) {
        const vars = element("div", "vars");
        frame.vars.forEach(function (variable) {
          const chip = element("span", "var");
          chip.appendChild(element("span", "vname mono", variable.name));

          vars.appendChild(chip);

function stateBox(name) {
  const state = STATES[name];
  const width = Math.max(state.label.length * 6.9 + 30, 60);
  return {
    x: state.x - width / 2,
    y: state.y - STATE_DIAGRAM.nodeHeight / 2,
    w: width,
    h: STATE_DIAGRAM.nodeHeight,
    cx: state.x,
    cy: state.y
  };
}

function clipToBox(box, towardX, towardY) {
  const dx = towardX - box.cx;
  const dy = towardY - box.cy;
  const scaleX = dx === 0 ? Infinity : (box.w / 2 + 3) / Math.abs(dx);
  const scaleY = dy === 0 ? Infinity : (box.h / 2 + 3) / Math.abs(dy);
  const ratio = Math.min(scaleX, scaleY);
  return { x: box.cx + dx * ratio, y: box.cy + dy * ratio };
}

function svgNode(tag, attributes) {
  const node = document.createElementNS(SVG_NS, tag);
  Object.keys(attributes).forEach(function (key) { node.setAttribute(key, attributes[key]); });
  return node;
}

function edgeGeometry(edge) {
  const from = stateBox(edge.from);
  const to = stateBox(edge.to);
  const dx = to.cx - from.cx;
  const dy = to.cy - from.cy;
  const length = Math.sqrt(dx * dx + dy * dy) || 1;
  const perpX = -dy / length;
  const perpY = dx / length;
  const controlX = (from.cx + to.cx) / 2 + perpX * edge.bend;
  const controlY = (from.cy + to.cy) / 2 + perpY * edge.bend;
  const start = clipToBox(from, controlX, controlY);
  const end = clipToBox(to, controlX, controlY);
  const tipFromX = edge.bend === 0 ? start.x : controlX;
  const tipFromY = edge.bend === 0 ? start.y : controlY;
  const tipDx = end.x - tipFromX;
  const tipDy = end.y - tipFromY;
  const tipLength = Math.sqrt(tipDx * tipDx + tipDy * tipDy) || 1;
  const dirX = tipDx / tipLength;
  const dirY = tipDy / tipLength;
  const baseX = end.x - dirX * 8;
  const baseY = end.y - dirY * 8;
  const t = edge.at === undefined ? 0.5 : edge.at;
  const midX = edge.bend === 0
    ? start.x + (end.x - start.x) * t
    : Math.pow(1 - t, 2) * start.x + 2 * (1 - t) * t * controlX + Math.pow(t, 2) * end.x;
  const midY = edge.bend === 0
    ? start.y + (end.y - start.y) * t
    : Math.pow(1 - t, 2) * start.y + 2 * (1 - t) * t * controlY + Math.pow(t, 2) * end.y;
  const nudgeX = edge.nudgeX || 0;
  const nudgeY = edge.nudgeY || 0;
  return {
    anchorX: midX,
    anchorY: midY,
    path: edge.bend === 0
      ? "M " + start.x + " " + start.y + " L " + end.x + " " + end.y
      : "M " + start.x + " " + start.y + " Q " + controlX + " " + controlY + " " + end.x + " " + end.y,
    arrow: end.x + "," + end.y + " " + (baseX - dirY * 3.6) + "," + (baseY + dirX * 3.6) + " " +
      (baseX + dirY * 3.6) + "," + (baseY - dirX * 3.6),
    midX: midX + nudgeX,
    midY: midY + nudgeY,
    perpX: perpX,
    perpY: perpY
  };
}

function labelHitsBox(x, y, halfWidth, boxes) {
  return boxes.some(function (box) {
    return x + halfWidth > box.x - 3 && x - halfWidth < box.x + box.w + 3 && y > box.y - 5 && y < box.y + box.h + 5;
  });
}

function placeEdgeLabel(geometry, edge, boxes, taken, bounds) {
  const halfWidth = edge.label.length * 2.5;
  const attempts = [1, 1.45, 1.9, -1, -1.45, 2.4, -1.9];
  let chosen = null;
  attempts.forEach(function (factor) {
    if (chosen) return;
    const x = geometry.midX + geometry.perpX * edge.labelOffset * factor;
    const y = geometry.midY + geometry.perpY * edge.labelOffset * factor;
    const inside = x - halfWidth > 1 && x + halfWidth < bounds.width - 1 && y > 7 && y < bounds.height - 5;
    if (inside && !labelHitsBox(x, y, halfWidth, boxes) && !labelHitsBox(x, y, halfWidth, taken)) {
      chosen = { x: x, y: y };
    }
  });
  if (!chosen) {
    chosen = {
      x: geometry.midX + geometry.perpX * edge.labelOffset,
      y: geometry.midY + geometry.perpY * edge.labelOffset
    };
  }
  taken.push({ x: chosen.x - halfWidth, y: chosen.y - 6, w: halfWidth * 2, h: 12 });
  return chosen;
}

function diagramBounds(viewBox) {
  const parts = viewBox.split(" ");
  return { width: Number(parts[2]), height: Number(parts[3]) };
}

function renderStates(snapshot) {
  const example = currentExample();
  const body = panelRefs.states.body;
  body.textContent = "";
  const svg = svgNode("svg", {
    class: "states-diagram",
    viewBox: example.diagramViewBox || STATE_DIAGRAM.viewBox,
    preserveAspectRatio: "xMidYMid meet",
    "aria-hidden": "true"
  });
  const byDecider = Boolean(example.filter);
  const viewBox = example.diagramViewBox || STATE_DIAGRAM.viewBox;
  const bounds = diagramBounds(viewBox);
  const boxes = example.states.map(stateBox);
  const taken = [];
  const focusChange = snapshot.focus ? snapshot.changed[snapshot.focus] : null;
  const activeEdge = focusChange && focusChange.state && focusChange.state.from
    ? focusChange.state.from + ">" + focusChange.state.to
    : null;

  STATE_EDGES.forEach(function (edge) {
    const id = edge.from + ">" + edge.to;
    if (example.transitions.indexOf(id) === -1) return;
    const geometry = edgeGeometry(edge);
    const active = id === activeEdge;
    const faded = byDecider && view.filter !== "all" && view.filter !== edge.decider;
    const tone = byDecider ? DECIDERS[edge.decider].color : null;
    const path = svgNode("path", {
      class: "state-edge" + (active && !byDecider ? " active" : "") + (active ? " strong" : "") + (faded ? " faded" : ""),
      d: geometry.path
    });
    const arrow = svgNode("polygon", {
      class: "state-arrow" + (active && !byDecider ? " active" : "") + (faded ? " faded" : ""),
      points: geometry.arrow
    });
    if (tone) {
      path.style.stroke = tone;
      arrow.style.fill = tone;
    }
    svg.appendChild(path);
    svg.appendChild(arrow);
    const spot = placeEdgeLabel(geometry, edge, boxes, taken, bounds);
    const distancia = Math.sqrt(Math.pow(spot.x - geometry.anchorX, 2) + Math.pow(spot.y - geometry.anchorY, 2));
    if (distancia > 15) {
      const leader = svgNode("line", {
        class: "edge-leader" + (faded ? " faded" : ""),
        x1: spot.x, y1: spot.y, x2: geometry.anchorX, y2: geometry.anchorY
      });
      if (tone) leader.style.stroke = tone;
      svg.appendChild(leader);
    }
    const label = svgNode("text", {
      class: "edge-label" + (active && !byDecider ? " active" : "") + (faded ? " faded" : ""),
      x: spot.x,
      y: spot.y,
      "text-anchor": "middle",
      "dominant-baseline": "middle"
    });
    if (tone) label.style.fill = tone;
    label.textContent = edge.label;
    svg.appendChild(label);
  });

  example.states.forEach(function (name) {
    const state = STATES[name];
    const box = stateBox(name);
    const holders = snapshot.processes.filter(function (process) { return process.state === name; });
    const holdsFocus = holders.some(function (process) { return process.id === snapshot.focus; });
    const group = svgNode("g", { class: "state-node" });
    group.appendChild(svgNode("rect", {
      x: box.x, y: box.y, width: box.w, height: box.h, rx: 7,
      fill: holdsFocus ? state.color : state.soft,
      stroke: state.color,
      "stroke-width": holders.length > 0 ? 2.4 : 1.4
    }));
    const label = svgNode("text", {
      x: box.cx, y: box.cy - 5, "text-anchor": "middle", "dominant-baseline": "middle",
      fill: holdsFocus ? "#fff" : state.color
    });
    label.textContent = state.label;
    group.appendChild(label);
    if (holders.length > 0) {
      const chips = svgNode("text", {
        class: "holders", x: box.cx, y: box.cy + 9, "text-anchor": "middle", "dominant-baseline": "middle",
        fill: holdsFocus ? "#fff" : state.color
      });
      chips.textContent = holders.map(function (process) { return process.id; }).join(" ");
      group.appendChild(chips);
    }
    svg.appendChild(group);
  });

  body.appendChild(svg);
  const legend = element("div", "state-legend");
  example.states.forEach(function (name) {
    const state = STATES[name];
    const item = element("span", "item");
    const dot = element("span", "dot");
    dot.style.borderColor = state.color;
    dot.style.background = state.soft;
    item.appendChild(dot);
    item.appendChild(element("span", "name mono", state.label));
    item.appendChild(element("span", null, state.gloss));
    legend.appendChild(item);
  });
  body.appendChild(legend);
}

function contextRows(context, changedFields) {
  const rows = element("div", "ctx-rows");
  Object.keys(context).forEach(function (key) {
    const row = element("div", "ctx-row");
    if (changedFields.indexOf(key) !== -1) row.classList.add("changed");
    row.appendChild(element("span", "name mono", key));
    row.appendChild(element("span", "val mono", context[key]));
    rows.appendChild(row);
  });
  return rows;
}

function occupancyRow(kind, label, gloss, processes, capacity, changed, usage, emptyText) {
  const block = element("div", "occ-block " + kind);
  const head = element("div", "occ-head");
  head.appendChild(element("span", "occ-name mono", label));
  head.appendChild(element("span", "region-gloss", gloss));
  if (processes.length === 0) {
    if (emptyText) head.appendChild(element("span", "occ-empty", emptyText));
    block.appendChild(head);
    return block;
  }
  if (usage) head.appendChild(element("span", "occ-usage", usage));
  block.appendChild(head);
  const bar = element("div", "occ-bar");
  let used = 0;
  processes.forEach(function (process) {
    used += process.footprint;
    const cell = element("div", "occ-cell");
    cell.style.flexGrow = process.footprint;
    cell.style.flexBasis = "0";
    if (changed.indexOf(process.id) !== -1) cell.classList.add("changed");
    cell.appendChild(element("span", "who mono", process.id));
    cell.appendChild(element("span", "units mono", process.footprint));
    bar.appendChild(cell);
  });
  const rest = capacity - used;
  if (rest > 0) {
    const cell = element("div", "occ-cell " + (kind === "memory" ? "free" : "spacer"));
    cell.style.flexGrow = rest;
    cell.style.flexBasis = "0";
    if (kind === "memory") cell.appendChild(element("span", "who", UI_TEXT.occupancy.free));
    bar.appendChild(cell);
  }
  block.appendChild(bar);
  return block;
}

function renderOccupancy(snapshot) {
  const body = panelRefs.occupancy.body;
  const capacity = currentExample().capacity;
  const text = UI_TEXT.occupancy;
  body.textContent = "";
  const moved = snapshot.processes
    .filter(function (process) { return snapshot.changed[process.id].location; })
    .map(function (process) { return process.id; });
  const at = function (where) {
    return snapshot.processes.filter(function (process) { return process.location === where; });
  };
  const resident = at("memory");
  const used = resident.reduce(function (sum, process) { return sum + process.footprint; }, 0);
  body.appendChild(occupancyRow("memory", text.memoryLabel, text.memoryGloss, resident, capacity, moved,
    fill(text.unitsUsed, { used: used, total: capacity }), null));
  body.appendChild(occupancyRow("swap", text.swapLabel, text.swapGloss, at("swap"), capacity, moved, null, text.swapEmpty));
  const pending = at("pending");
  if (pending.length > 0) {
    body.appendChild(occupancyRow("pending", text.pendingLabel, text.pendingGloss, pending, capacity, moved, null, null));
  }
}

function renderCounters(snapshot) {
  const body = panelRefs.counters.body;
  body.textContent = "";
  const values = {
    multiprogramming: residentProcesses(snapshot.processes).length,
    multiprocessing: snapshot.processes.filter(function (process) { return process.state === "RUNNING"; }).length
  };
  UI_TEXT.counters.forEach(function (entry) {
    const box = element("div", "counter-box");
    const top = element("div", "counter-top");
    top.appendChild(element("span", "counter-label", entry.label));
    top.appendChild(element("span", "counter-value mono", values[entry.key]));
    box.appendChild(top);
    box.appendChild(element("span", "counter-gloss", entry.gloss));
    body.appendChild(box);
  });
}

function renderDeciders(snapshot) {
  const body = panelRefs.deciders.body;
  const transitions = currentBuilt().transitions;
  body.textContent = "";
  if (transitions.length === 0) {
    body.appendChild(element("p", "empty-state", UI_TEXT.deciders.empty));
    return;
  }
  const list = element("div", "decider-list");
  transitions.forEach(function (entry) {
    const decider = DECIDERS[entry.decider];
    const row = element("div", "decider-row");
    if (entry.stepIndex === snapshot.index) row.classList.add("current");
    if (entry.stepIndex > snapshot.index) row.classList.add("later");
    if (view.filter !== "all" && view.filter !== entry.decider) row.classList.add("faded");
    row.appendChild(element("span", "decider-step mono", fill(UI_TEXT.deciders.stepLabel, { n: entry.stepIndex + 1 })));
    row.appendChild(element("span", "decider-who mono", entry.processId));
    const change = element("span", "decider-change mono");
    change.appendChild(element("span", null, STATES[entry.from].label));
    change.appendChild(element("span", "arrow", "\u2192"));
    change.appendChild(element("span", null, STATES[entry.to].label));
    row.appendChild(change);
    const tag = element("span", "decider-tag", decider.short);
    tag.style.color = decider.color;
    tag.style.borderColor = decider.color;
    row.appendChild(tag);
    list.appendChild(row);
  });
  body.appendChild(list);
}

function renderCpu(snapshot) {
  const refs = panelRefs.cpu;
  const body = refs.body;
  refs.note.hidden = false;
  refs.note.textContent = UI_TEXT.cpu.note;
  body.textContent = "";
  const owner = element("div", "cpu-owner");
  if (snapshot.changedCpu.owner) owner.classList.add("changed");
  owner.appendChild(element("span", "label", UI_TEXT.cpu.ownerLabel));
  owner.appendChild(element("span", "value", snapshot.cpu.owner || UI_TEXT.none));
  body.appendChild(owner);
  if (!snapshot.cpu.context) {
    body.appendChild(element("p", "cpu-empty", UI_TEXT.cpu.empty));
    return;
  }
  body.appendChild(element("span", "ctx-caption", UI_TEXT.cpu.contextLabel));
  body.appendChild(contextRows(snapshot.cpu.context, snapshot.changedCpu.fields));
}

function timelineLane(name, segments, freshUnits, byState) {
  const lane = element("div", "tl-lane");
  lane.appendChild(element("span", "tl-name mono", name));
  const track = element("div", "tl-track");
  segments.forEach(function (segment, index) {
    const isLast = index === segments.length - 1;
    const kind = byState ? "state" : segment.kind;
    const box = element("div", "tl-seg " + (byState ? "" : kind));
    box.style.flexGrow = segment.units;
    box.style.flexBasis = "0";
    if (isLast && freshUnits > 0) box.classList.add("fresh");
    if (byState && segment.kind !== "none" && STATES[segment.kind]) {
      const state = STATES[segment.kind];
      box.style.borderColor = state.color;
      box.style.background = state.soft;
      box.style.color = state.color;
      box.textContent = state.label;
      box.title = state.label;
    } else if (byState) {
      box.classList.add("none");
    } else if (kind === "busy") {
      box.textContent = segment.label;
      box.title = fill(UI_TEXT.timeline.kinds.busy, { label: segment.label });
    } else {
      box.textContent = UI_TEXT.timeline.shortKinds[kind];
      box.title = UI_TEXT.timeline.kinds[kind];
    }
    track.appendChild(box);
  });
  lane.appendChild(track);
  return lane;
}

function tcbCard(thread, changed) {
  const card = element("div", "tcb-card");
  if (changed) card.classList.add("changed");
  card.appendChild(element("h3", null, fill(UI_TEXT.tcbTitle, { id: thread.id })));
  const stateRow = element("div", "pcb-field");
  stateRow.appendChild(element("span", "name", UI_TEXT.tcbLabels.state));
  if (STATES[thread.state]) {
    const state = STATES[thread.state];
    const chip = element("span", "pcb-state mono", state.label);
    chip.style.borderColor = state.color;
    chip.style.background = state.soft;
    chip.style.color = state.color;
    stateRow.appendChild(chip);
  }
  card.appendChild(stateRow);
  const lineRow = element("div", "pcb-field");
  lineRow.appendChild(element("span", "name", UI_TEXT.tcbLabels.line));
  lineRow.appendChild(element("span", "val mono", thread.line === null ? UI_TEXT.none : thread.line));
  card.appendChild(lineRow);
  return card;
}

function renderTimeline(snapshot) {
  const refs = panelRefs.timeline;
  const body = refs.body;
  refs.note.hidden = false;
  refs.note.textContent = "";
  const legend = element("span", "tl-legend");
  UI_TEXT.timeline.legend.forEach(function (entry) {
    const item = element("span", "item");
    item.appendChild(element("span", "swatch " + entry.kind));
    item.appendChild(element("span", null, entry.text));
    legend.appendChild(item);
  });
  refs.note.appendChild(legend);
  body.textContent = "";
  if (snapshot.timeline.units === 0) {
    body.appendChild(element("p", "empty-state", UI_TEXT.timeline.empty));
    return;
  }
  const lanes = element("div", "tl-lanes");
  lanes.appendChild(timelineLane(UI_TEXT.timeline.cpuLane, snapshot.timeline.cpu, snapshot.freshUnits, false));
  snapshot.processes.forEach(function (process) {
    const segments = snapshot.timeline.lanes[process.id] || [];
    if (segments.length === 0) return;
    lanes.appendChild(timelineLane(process.id, segments, snapshot.freshUnits, true));
  });
  body.appendChild(lanes);
}

function contextBlock(context, changed) {
  const box = element("div", "pcb-context");
  if (changed) box.classList.add("changed");
  if (!context) {
    box.classList.add("empty");
    box.appendChild(element("p", "pcb-context-empty", UI_TEXT.pcbContextEmpty));
    return box;
  }
  box.appendChild(contextRows(context, []));
  return box;
}

function takeawayBlock(text) {
  const box = element("div", "takeaway");
  box.appendChild(element("span", "tag", UI_TEXT.takeawayTag));
  box.appendChild(element("span", "line", text));
  return box;
}

function compareBlock(compare) {
  const wrapper = element("div", "compare");
  const table = element("table");
  const head = element("tr");
  compare.headers.forEach(function (text, index) {
    const cell = element("th", index === 0 ? null : "head-region", text);
    head.appendChild(cell);
  });
  table.appendChild(head);
  compare.rows.forEach(function (cells) {
    const row = element("tr");
    cells.forEach(function (text, index) {
      row.appendChild(element("td", index === 0 ? "label" : null, text));
    });
    table.appendChild(row);
  });
  wrapper.appendChild(table);
  return wrapper;
}

function renderNarration(snapshot) {
  const example = currentExample();
  dom.narration.textContent = "";
  dom.narration.classList.toggle("with-extras", snapshot.last);
  const main = element("div", "narration-main");
  const paragraph = element("p", "narration-text");
  renderRich(paragraph, snapshot.narration);
  main.appendChild(paragraph);
  if (snapshot.note) {
    const note = element("p", "narration-note");
    renderRich(note, snapshot.note);
    main.appendChild(note);
  }
  dom.narration.appendChild(main);
  if (!snapshot.last) return;
  const extras = element("div", "narration-extras");
  extras.appendChild(takeawayBlock(example.closing));
  dom.narration.appendChild(extras);
  if (!example.compare) return;
  const table = compareBlock(example.compare);
  table.classList.add("full");
  dom.narration.appendChild(table);
}

function arrowPath(map, source, target) {
  const mapBox = map.getBoundingClientRect();
  const from = source.getBoundingClientRect();
  const to = target.getBoundingClientRect();
  const channel = mapBox.width - 6;
  const startX = from.right - mapBox.left + 2;
  const startY = from.top - mapBox.top + from.height / 2;
  const endX = to.right - mapBox.left + 4;
  const endY = to.top - mapBox.top + to.height / 2;
  return {
    points: startX + "," + startY + " " + channel + "," + startY + " " + channel + "," + endY + " " + endX + "," + endY,
    head: endX + "," + endY + " " + (endX + 6) + "," + (endY - 4) + " " + (endX + 6) + "," + (endY + 4)
  };
}

function drawArrows() {
  const maps = document.querySelectorAll(".map");
  Array.prototype.forEach.call(maps, function (map) {
    const svg = map.querySelector(".map-arrows");
    const box = map.getBoundingClientRect();
    svg.textContent = "";
    svg.setAttribute("viewBox", "0 0 " + box.width + " " + box.height);
    svg.setAttribute("width", box.width);
    svg.setAttribute("height", box.height);
    const sources = map.querySelectorAll("[data-points-to]");
    Array.prototype.forEach.call(sources, function (source) {
      const target = map.querySelector('[data-seg-id="' + source.dataset.pointsTo + '"]');
      if (!target) return;
      const shape = arrowPath(map, source, target);
      const line = document.createElementNS(SVG_NS, "polyline");
      line.setAttribute("points", shape.points);
      line.setAttribute("fill", "none");
      line.setAttribute("stroke", "currentColor");
      line.setAttribute("stroke-width", "1.5");
      const head = document.createElementNS(SVG_NS, "polygon");
      head.setAttribute("points", shape.head);
      head.setAttribute("fill", "currentColor");
      svg.appendChild(line);
      svg.appendChild(head);
    });
    svg.style.color = "var(--pointer)";
  });
}

function render() {
  const example = currentExample();
  const snapshot = currentSnapshot();
  const total = currentSnapshots().length;
  buildCanvas(example);
  dom.title.textContent = example.number + ". " + example.title;
  dom.subtitle.textContent = example.subtitle;
  dom.granularity.textContent = example.stepUnit;
  renderFilter();
  canvasPanels(example).forEach(function (id) { PANELS[id].render(snapshot); });
  renderNarration(snapshot);
  drawArrows();
  dom.progress.textContent = fill(UI_TEXT.progress, { current: view.stepIndex + 1, total: total });
  dom.progressFill.style.transform = "scaleX(" + ((view.stepIndex + 1) / total) + ")";
  dom.first.disabled = view.stepIndex === 0;
  dom.prev.disabled = view.stepIndex === 0;
  dom.next.disabled = view.stepIndex === total - 1;
  dom.last.disabled = view.stepIndex === total - 1;
  dom.play.textContent = view.playing ? UI_TEXT.pause : UI_TEXT.play;
  Array.prototype.forEach.call(dom.exampleList.children, function (button, index) {
    button.setAttribute("aria-current", index === view.exampleIndex ? "true" : "false");
  });
}

function goTo(index) {
  const total = currentSnapshots().length;
  view.stepIndex = Math.max(0, Math.min(index, total - 1));
  render();
  if (view.playing && view.stepIndex === total - 1) stopPlaying();
}

function selectExample(index) {
  stopPlaying();
  view.exampleIndex = index;
  view.stepIndex = 0;
  view.filter = "all";
  render();
}

function stopPlaying() {
  view.playing = false;
  if (view.timer) { clearTimeout(view.timer); view.timer = null; }
  dom.play.textContent = UI_TEXT.play;
}

function scheduleTick() {
  if (view.timer) clearTimeout(view.timer);
  view.timer = setTimeout(function () {
    if (!view.playing) return;
    if (view.stepIndex >= currentSnapshots().length - 1) { stopPlaying(); render(); return; }
    goTo(view.stepIndex + 1);
    if (view.playing) scheduleTick();
  }, AUTOPLAY_DELAY);
}

function startPlaying() {
  view.playing = true;
  scheduleTick();
  render();
}

function togglePlaying() {
  if (view.playing) { stopPlaying(); render(); return; }
  startPlaying();
}

function lookupTooltip(key) {
  if (key.indexOf("panel:") === 0) return PANEL_TIPS[key.slice(6)];
  return TOOLTIPS[key];
}

function showTooltip(trigger) {
  const tip = lookupTooltip(trigger.dataset.tip);
  if (!tip) return;
  dom.tooltip.textContent = "";
  dom.tooltip.appendChild(element("strong", "tip-title", tip.title));
  dom.tooltip.appendChild(document.createTextNode(tip.body));
  dom.tooltip.classList.add("open");
  const box = trigger.getBoundingClientRect();
  const width = dom.tooltip.offsetWidth;
  const height = dom.tooltip.offsetHeight;
  let left = box.left;
  if (left + width > window.innerWidth - 12) left = window.innerWidth - width - 12;
  let top = box.top - height - 8;
  if (top < 8) top = box.bottom + 8;
  dom.tooltip.style.left = Math.max(8, left) + "px";
  dom.tooltip.style.top = top + "px";
}

function hideTooltip() { dom.tooltip.classList.remove("open"); }

function closestElement(target, selector) {
  return target && typeof target.closest === "function" ? target.closest(selector) : null;
}

dom.first.addEventListener("click", function () { stopPlaying(); goTo(0); });
dom.prev.addEventListener("click", function () { stopPlaying(); goTo(view.stepIndex - 1); });
dom.next.addEventListener("click", function () { stopPlaying(); goTo(view.stepIndex + 1); });
dom.last.addEventListener("click", function () { stopPlaying(); goTo(currentSnapshots().length - 1); });
dom.play.addEventListener("click", togglePlaying);

document.addEventListener("keydown", function (event) {
  if (event.key === "ArrowRight") { stopPlaying(); goTo(view.stepIndex + 1); event.preventDefault(); }
  if (event.key === "ArrowLeft") { stopPlaying(); goTo(view.stepIndex - 1); event.preventDefault(); }
  if (event.key === "Home") { stopPlaying(); goTo(0); event.preventDefault(); }
  if (event.key === "End") { stopPlaying(); goTo(currentSnapshots().length - 1); event.preventDefault(); }
  if (event.key === "Escape") hideTooltip();
});

document.addEventListener("mouseover", function (event) {
  const trigger = closestElement(event.target, "[data-tip]");
  if (trigger) showTooltip(trigger);
});

document.addEventListener("mouseout", function (event) {
  if (closestElement(event.target, "[data-tip]")) hideTooltip();
});

document.addEventListener("click", function (event) {
  const trigger = closestElement(event.target, "[data-tip]");
  if (trigger) { showTooltip(trigger); return; }
  hideTooltip();
});

document.addEventListener("focusin", function (event) {
  const trigger = closestElement(event.target, "[data-tip]");
  if (trigger) showTooltip(trigger);
});

window.addEventListener("resize", drawArrows);

dom.first.textContent = UI_TEXT.firstStep;
dom.prev.textContent = UI_TEXT.prevStep;
dom.next.textContent = UI_TEXT.nextStep;
dom.last.textContent = UI_TEXT.lastStep;
dom.play.textContent = UI_TEXT.play;

renderExampleList();
render();
</script>

</body>
</html>
