}

function frameCells(data) {
  const cells = [];
  for (let index = 0; index < data.count; index += 1) {
    const declared = data.cells[index] || (data.fillAll ? data.fillAll : null);
    cells.push(declared);
  }
  return cells;
}

function memoryLegend(kinds) {
  const legend = element("div", "legend");
  kinds.forEach(function (kind) {
    const item = element("span", "item");
    item.appendChild(element("span", "swatch " + kind));
    item.appendChild(document.createTextNode(UI_TEXT.memory[LEGEND_KEYS[kind]]));
    legend.appendChild(item);
  });
  return legend;
}

const LEGEND_KEYS = { used: "legendUsed", other: "legendOther", free: "legendFree", seg: "legendSeg", os: "legendOs", unknown: "legendUnknown", waste: "legendWaste" };

function renderFrames(body, data) {
  const grid = element("div", "frame-grid" + (data.tight ? " tight" : ""));
  grid.style.gridTemplateColumns = "repeat(" + data.columns + ", minmax(0, 1fr))";
  const kinds = {};
  frameCells(data).forEach(function (cell, index) {
    const kind = cell ? (cell.kind || "used") : "free";
    kinds[kind] = true;
    const frame = element("div", "frame" + (kind === "free" ? "" : " " + kind));
    if ((data.highlight || []).indexOf(index) !== -1) frame.classList.add("focus");
    frame.appendChild(element("span", "index", fill(UI_TEXT.memory.frameIndex, { n: index })));
    if (cell && kind === "used") {
      const part = element("span", "used-part");
      part.style.height = Math.max(cell.fill === undefined ? 1 : cell.fill, 0.08) * 100 + "%";
      frame.appendChild(part);
    }
    frame.appendChild(element("span", "label", cell ? cell.label : ""));
    frame.title = cell ? cell.label : UI_TEXT.memory.legendFree;
    grid.appendChild(frame);
  });
  body.appendChild(grid);
  body.appendChild(memoryLegend(["used", "other", "free"].filter(function (kind) { return kinds[kind]; })));
}

function stripText(value, data) {
  if (data.unit === "kib") return fill(UI_TEXT.memory.kib, { n: value });
  if (data.unit === "hex") return formatNumber(value, data.digits);
  return formatNumber(value);
}

function renderStrip(body, data) {
  const wrap = element("div", "strip-wrap");
  if (data.caption) wrap.appendChild(element("p", "mem-caption", data.caption));
  const strip = element("div", "strip");
  strip.style.minHeight = data.blocks.reduce(function (sum, block) { return sum + (block.tags ? 30 : 22); }, 0) + "px";
  const kinds = {};
  data.blocks.forEach(function (block, index) {
    kinds[block.kind] = true;
    const node = element("div", "block " + block.kind);
    node.style.flex = block.size + " 1 0px";
    if ((data.highlight || []).indexOf(index) !== -1) node.classList.add("focus");
    if (block.label) node.appendChild(element("span", "name", block.label));
    if (block.tags) node.classList.add("tagged");
    (block.tags || []).forEach(function (tag) { node.appendChild(element("span", "tag", tag)); });
    const last = block.start + block.size - 1;
    const range = stripText(block.start, data) + " – " + stripText(data.unit === "kib" ? block.start + block.size : last, data);
    node.appendChild(element("span", "range", range));
    node.title = (block.label ? block.label + ": " : "") + range;
    if (data.marker && data.marker.address >= block.start && data.marker.address < block.start + block.size) {
      const marker = element("span", "marker" + (data.marker.fail ? " fail" : ""));
      marker.style.top = Math.min(92, Math.max(8, (data.marker.address - block.start) / block.size * 100)) + "%";
      marker.appendChild(element("span", "pin", data.marker.label));
      node.appendChild(marker);
    }
    strip.appendChild(node);
  });
  wrap.appendChild(strip);
  wrap.appendChild(memoryLegend(["os", "seg", "waste", "other", "free", "unknown"].filter(function (kind) { return kinds[kind]; })));
  body.appendChild(wrap);
}

function renderMemory(snapshot) {
  const body = panelRefs.memory.body;
  body.textContent = "";
  const data = snapshot.views.memory;
  if (data.kind === "strip") renderStrip(body, data);
  else renderFrames(body, data);
}

function renderActors(snapshot) {
  const body = panelRefs.actors.body;
  body.textContent = "";
  const data = snapshot.views.actors;
  const before = snapshot.previousViews.actors;
  const wrap = element("div", "actors");
  const rows = data.processes.map(function (process, index) {
    const old = before && before.processes ? before.processes[index] : null;
    return { who: fill(UI_TEXT.actors.process, { name: process.name }), state: process.state, changed: !old || old.state !== process.state };
  });
  rows.push({ key: "cpu", who: UI_TEXT.actors.cpu, changed: !before || before.cpu !== data.cpu });
  rows.push({ key: "disk", who: UI_TEXT.actors.disk, changed: !before || before.disk !== data.disk });
  rows.forEach(function (row) {
    const line = element("div", "actor" + (row.changed && snapshot.index > 0 ? " fresh" : ""));
    line.appendChild(element("span", "who", row.who));
    const what = element("span", "what");
    if (row.state) {
      what.appendChild(element("span", "state-pill " + row.state, row.state));
      what.appendChild(element("span", "state-gloss", UI_TEXT.actors.states[row.state]));
    } else if (row.key === "disk" && !data.disk) {
      what.classList.add("idle");
      what.textContent = UI_TEXT.actors.diskIdle;
    } else {
      what.textContent = data[row.key];
    }
    line.appendChild(what);
    wrap.appendChild(line);
  });
  body.appendChild(wrap);
}

function renderTiles(snapshot, id) {
  const body = panelRefs[id].body;
  body.textContent = "";
  const data = snapshot.views[id];
  if (data.pointer) body.appendChild(pointerChip(data.pointer));
  const wrap = element("div", "tiles-wrap");
  wrap.appendChild(element("span", "tiles-caption", data.caption));
  const grid = element("div", "tiles");
  grid.style.gridTemplateColumns = "repeat(" + data.columns + ", 6px)";
  grid.setAttribute("role", "img");
  grid.setAttribute("aria-label", data.caption);
  for (let index = 0; index < data.count; index += 1) {
    const tile = element("span", "tile");
    if (data.used.indexOf(index) !== -1) tile.classList.add("used");
    if (data.selected === index) tile.classList.add("focus");
    grid.appendChild(tile);
  }
  wrap.appendChild(grid);
  const legend = element("div", "legend");
  const words = UI_TEXT.tiles.outer;
  [["tile-used", words.used], ["tile-empty", words.empty]].forEach(function (pair) {
    const item = element("span", "item");
    item.appendChild(element("span", "swatch " + pair[0]));
    item.appendChild(document.createTextNode(pair[1]));
    legend.appendChild(item);
  });
  wrap.appendChild(legend);
  body.appendChild(wrap);
}

function renderTimeline(snapshot) {
  const body = panelRefs.timeline.body;
  body.textContent = "";
  const data = snapshot.views.timeline;
  const wrap = element("div", "timeline");
  data.rows.forEach(function (row) {
    const line = element("div", "timeline-row" + (row.fresh ? " fresh" : ""));
    line.appendChild(element("span", "who", UI_TEXT.timeline[row.label]));
    const chips = element("span", "chips");

      if (index > 0) chips.appendChild(element("span", "arrow", "→"));
      chips.appendChild(element("span", "step-chip", item));
    });
    line.appendChild(chips);
    wrap.appendChild(line);
  });
  if (data.aside) {
    const line = element("div", "timeline-row aside fresh");
    line.appendChild(element("span", "who", UI_TEXT.timeline.aside));
    const chips = element("span", "chips");
    data.aside.forEach(function (item) { chips.appendChild(element("span", "step-chip", item)); });
    line.appendChild(chips);
    wrap.appendChild(line);
  }
  body.appendChild(wrap);
}

function svgNode(tag, attributes) {
  const node = document.createElementNS(SVG_NS, tag);
  Object.keys(attributes).forEach(function (key) { node.setAttribute(key, attributes[key]); });
  return node;
}

function renderCurve(snapshot) {
  const body = panelRefs.curve.body;
  body.textContent = "";
  const data = snapshot.views.curve;
  const width = 360;
  const height = 210;
  const left = 34;
  const bottom = 30;
  const maxX = data.points[data.points.length - 1][0];
  const x = function (value) { return left + value / maxX * (width - left - 12); };
  const y = function (value) { return height - bottom - value / 100 * (height - bottom - 14); };
  const svg = svgNode("svg", { viewBox: "0 0 " + width + " " + height, class: "curve", role: "img", "aria-label": UI_TEXT.curve.y + " / " + UI_TEXT.curve.x });
  svg.appendChild(svgNode("line", { x1: left, y1: y(0), x2: width - 8, y2: y(0), class: "axis" }));
  svg.appendChild(svgNode("line", { x1: left, y1: y(0), x2: left, y2: 8, class: "axis" }));
  svg.appendChild(svgNode("polyline", { points: data.points.map(function (point) { return x(point[0]) + "," + y(point[1]); }).join(" "), class: "line" }));
  const knee = data.points.find(function (point) { return point[0] === data.knee; });
  svg.appendChild(svgNode("line", { x1: x(knee[0]), y1: y(0), x2: x(knee[0]), y2: y(knee[1]), class: "knee" }));
  const kneeLabel = svgNode("text", { x: x(knee[0]) + 6, y: y(0) - 8, class: "label" });
  kneeLabel.textContent = UI_TEXT.curve.knee + " →";
  svg.appendChild(kneeLabel);
  const xLabel = svgNode("text", { x: width - 8, y: height - 8, class: "label", "text-anchor": "end" });
  xLabel.textContent = UI_TEXT.curve.x;
  svg.appendChild(xLabel);
  const yLabel = svgNode("text", { x: left + 6, y: 16, class: "label" });
  yLabel.textContent = UI_TEXT.curve.y;
  svg.appendChild(yLabel);
  body.appendChild(svg);
}

function renderWindow(snapshot) {
  const body = panelRefs.window.body;
  body.textContent = "";
  const data = snapshot.views.window;
  body.appendChild(element("p", "mem-caption", fill(UI_TEXT.window.caption, { n: data.size })));
  const scroll = element("div", "table-scroll");
  const table = element("table", "grid-table window-table");
  const head = element("tr");
  head.appendChild(element("th", null, UI_TEXT.columns.process));
  data.processes[0].refs.forEach(function (ref, index) { head.appendChild(element("th", "ref-index" + (index + 1 === data.after ? " at" : ""), String(index + 1))); });
  head.appendChild(element("th", null, UI_TEXT.columns.set));
  head.appendChild(element("th", null, UI_TEXT.columns.count));
  table.appendChild(head);
  let sum = 0;
  data.processes.forEach(function (process) {
    const row = element("tr");
    row.appendChild(element("td", "role-pid", process.name));
    process.refs.forEach(function (ref, index) {
      const inside = index >= data.after - data.size && index < data.after;
      row.appendChild(element("td", inside ? "in-window" : "out-window", String(ref)));
    });
    const set = workingSet(process.refs, data.after, data.size).slice().sort(function (one, other) { return one - other; });
    sum += set.length;
    row.appendChild(element("td", null, "{" + set.join(", ") + "}"));
    row.appendChild(element("td", null, String(set.length)));
    table.appendChild(row);
  });
  scroll.appendChild(table);
  body.appendChild(scroll);
  body.appendChild(element("p", "window-total" + (sum > data.frames ? " over" : ""), fill(UI_TEXT.window.total, { sum: sum, frames: data.frames })));
}

function boardCell(config, state, index) {
  const frame = state.frames[index];
  const board = UI_TEXT.board;
  const bits = config.bits || [];
  if (frame.page === null) return null;
  if (bits.indexOf("m") !== -1) return fill(board.cellUM, { page: frame.page, u: frame.u, m: frame.m });
  if (bits.indexOf("u") !== -1) return fill(board.cellU, { page: frame.page, u: frame.u });
  return String(frame.page);
}

function renderBoard(snapshot, id) {
  const body = panelRefs[id].body;
  body.textContent = "";
  body.classList.add("board-body");
  const data = snapshot.views[id];
  const simulation = data.simulation;
  const config = data.config;
  const board = UI_TEXT.board;
  const scroll = element("div", "board-scroll");
  const table = element("table", "grid");
  const head = element("thead");
  const indexRow = element("tr");
  const pageRow = element("tr");
  indexRow.appendChild(element("th", "row-label", board.indexRow));
  pageRow.appendChild(element("th", "row-label", board.pageRow));
  simulation.references.forEach(function (reference, position) {
    const current = position + 1 === data.revealed && id === "board" ? " current" : "";
    indexRow.appendChild(element("th", "col-index col-head" + current, String(position + 1)));
    pageRow.appendChild(element("th", "col-page col-head" + current, reference.mode === "E" ? fill(board.write, { page: reference.page }) : String(reference.page)));
  });
  head.appendChild(indexRow);
  head.appendChild(pageRow);
  table.appendChild(head);
  const rows = element("tbody");
  config.frames.forEach(function (label, index) {
    const row = element("tr");
    row.appendChild(element("th", "row-label frame-label", fill(board.frameRow, { frame: label })));
    simulation.references.forEach(function (reference, position) {
      const k = position + 1;
      const cell = element("td", "cell");
      if (k <= data.revealed) {
        const state = simulation.states[k];
        const text = boardCell(config, state, index);
        if (isClock(config) && state.pointer === index) cell.appendChild(element("span", "ptr", board.pointer));
        if (text === null) cell.classList.add("empty");
        else cell.appendChild(document.createTextNode(text));
        if (k === data.revealed && id === "board" && simulation.records[k - 1].kind !== "hit" && simulation.records[k - 1].frame === index) cell.classList.add("fresh");
      } else {
        cell.classList.add("future");
      }
      row.appendChild(cell);
    });
    rows.appendChild(row);
  });
  [["faultRow", function (record) { return record.kind === "hit" ? "" : board.faultMark; }, "fault", "split"],
    ["victimRow", function (record) { return record.victim === undefined ? "" : String(record.victim); }, null, null],
    ["diskRow", function (record) { return String(diskOf(record)); }, null, null]].forEach(function (spec) {
    const row = element("tr", spec[3]);
    row.appendChild(element("th", "row-label", board[spec[0]]));
    simulation.references.forEach(function (reference, position) {
      const cell = element("td", "mark-cell");
      if (position + 1 <= data.revealed) {
        cell.textContent = spec[1](simulation.records[position]);
        if (spec[2] && cell.textContent) cell.classList.add(spec[2]);
      }
      row.appendChild(cell);
    });
    rows.appendChild(row);
  });
  table.appendChild(rows);
  scroll.appendChild(table);
  body.appendChild(scroll);
  if (id === "board") body.appendChild(boardLegend(config, simulation));
  else body.appendChild(element("p", "board-total", fill(UI_TEXT.beladyTotal, { n: simulation.states[simulation.states.length - 1].counters.faults })));
}

function boardLegend(config, simulation) {
  const legend = UI_TEXT.board.legend;
  const bits = config.bits || [];
  const items = [Object.assign({ fault: true }, legend.fault), legend.victim, legend.disk];
  if (simulation.references.some(function (reference) { return reference.mode === "E"; })) items.push(legend.write);
  if (isClock(config)) items.push(legend.pointer);
  if (bits.indexOf("m") !== -1) items.push(legend.um);
  else if (bits.indexOf("u") !== -1) items.push(legend.u);
  items.push(Object.assign({ ring: true }, legend.current));
  const box = element("div", "board-legend");
  items.forEach(function (item) {
    const node = element("span", "item");
    if (item.ring) node.appendChild(element("span", "ring"));
    else node.appendChild(element("span", "token" + (item.fault ? " fault" : ""), item.token));
    node.appendChild(document.createTextNode(item.text));
    box.appendChild(node);
  });
  return box;
}

function renderState(snapshot) {
  const refs = panelRefs.state;
  refs.body.textContent = "";
  refs.body.classList.add("state-body");
  const data = snapshot.views.state;
  const simulation = data.simulation;
  const config = data.config;
  const labels = UI_TEXT.state;
  const state = simulation.states[data.revealed];
  const before = data.revealed > 0 ? simulation.states[data.revealed - 1] : null;
  refs.body.appendChild(element("p", "when", data.revealed === 0 ? labels.initialNote : fill(labels.afterNote, { n: data.revealed })));
  const counters = element("div", "counters");
  const disk = simulation.records.slice(0, data.revealed).reduce(function (sum, record) { return sum + diskOf(record); }, 0);
  const diskBefore = simulation.records.slice(0, Math.max(0, data.revealed - 1)).reduce(function (sum, record) { return sum + diskOf(record); }, 0);
  [[labels.faults, state.counters.faults, before && before.counters.faults !== state.counters.faults], [labels.disk, disk, data.revealed > 0 && disk !== diskBefore]].forEach(function (pair) {
    const box = element("span", "counter" + (pair[2] ? " fresh" : ""));
    box.appendChild(element("span", "caption", pair[0]));
    box.appendChild(element("span", "value", String(pair[1])));
    counters.appendChild(box);
  });
  refs.body.appendChild(counters);
  refs.body.appendChild(element("div", "sub-title", labels.framesTitle));
  const list = element("div", "frame-list");
  state.frames.forEach(function (frame, index) {
    const row = element("div", "frame-row");
    row.appendChild(element("span", "who", fill(UI_TEXT.board.frameRow, { frame: frame.label })));
    const page = element("span", "page" + (frame.page === null ? " free" : ""), frame.page === null ? labels.free : String(frame.page));
    if (before && before.frames[index].page !== frame.page) page.classList.add("fresh");
    row.appendChild(page);
    const info = element("span", "info");
    if (frame.page !== null) {
      const bits = config.bits || [];
      if (config.algorithm === "fifo") info.appendChild(element("span", null, fill(labels.since, { n: frame.since })));
      if (config.algorithm === "optimal") {
        const at = nextUseOf(simulation.references, frame.page, data.revealed);
        info.appendChild(element("span", null, at === null ? labels.nextNever : fill(labels.nextAt, { n: at })));
      }
      if (config.algorithm === "lru") info.appendChild(element("span", null, fill(labels.lastRef, { n: frame.order - REFERENCE_ORDER_BASE })));
      if (bits.indexOf("u") !== -1) info.appendChild(element("span", null, fill(labels.bitU, { u: frame.u })));
      if (bits.indexOf("m") !== -1) info.appendChild(element("span", null, fill(labels.bitM, { m: frame.m })));
    }
    if (isClock(config) && state.pointer === index) info.appendChild(element("span", "ptr-tag", labels.pointerTag));
    row.appendChild(info);
    list.appendChild(row);
  });
  refs.body.appendChild(list);
}

function takeawayBlock(text, extra) {
  const box = element("div", "takeaway");
  box.appendChild(element("span", "tag", UI_TEXT.takeawayTag));
  renderRich(box.appendChild(element("span", "line")), text);
  if (extra) renderRich(box.appendChild(element("span", "extra")), extra);
  return box;
}

function compareBlock(compare) {
  const wrapper = element("div", "compare");
  const table = element("table");
  const head = element("tr");
  compare.headers.forEach(function (text) { renderRich(head.appendChild(element("th")), text); });
  table.appendChild(head);
  compare.rows.forEach(function (cells) {
    const row = element("tr");
    cells.forEach(function (text, column) { renderRich(row.appendChild(element("td", column === 0 ? "label" : null)), text); });
    table.appendChild(row);
  });
  wrapper.appendChild(table);
  return wrapper;
}

function askBlock(ask) {
  const box = element("div", "ask-box");
  box.appendChild(element("span", "tag", UI_TEXT.ask.tag));
  renderRich(box.appendChild(element("p", "question")), ask.question);
  const chosen = currentAnswer();
  if (!chosen) {
    const options = element("div", "ask-options");
    ask.options.forEach(function (option) {
      const button = element("button", null, option.text);
      button.type = "button";
      button.addEventListener("click", function () { answerWith(option.id); });
      options.appendChild(button);
    });
    box.appendChild(options);
    return box;
  }
  const picked = ask.options.find(function (option) { return option.id === chosen; });
  const right = ask.options.find(function (option) { return option.id === ask.correct; });
  const result = element("div", "ask-result");
  const mine = element("p", "answer " + (chosen === ask.correct ? "right" : "wrong"));
  mine.appendChild(element("span", "head", (chosen === ask.correct ? UI_TEXT.ask.right : UI_TEXT.ask.wrong) + " " + picked.text));
  renderRich(mine.appendChild(element("span")), picked.why);
  result.appendChild(mine);
  if (chosen !== ask.correct) {
    const good = element("p", "answer right");
    good.appendChild(element("span", "head", fill(UI_TEXT.ask.correctIs, { text: right.text })));
    renderRich(good.appendChild(element("span")), right.why);
    result.appendChild(good);
  }
  const retry = element("button", "retry", UI_TEXT.ask.retry);
  retry.type = "button";
  retry.addEventListener("click", clearAnswer);
  result.appendChild(retry);
  box.appendChild(result);
  return box;
}

function renderNarration(snapshot) {
  const example = currentExample();
  const ask = snapshot.step.ask;
  dom.narration.textContent = "";
  dom.narration.classList.toggle("with-extras", snapshot.last === true || Boolean(ask));
  dom.narration.classList.toggle("no-compare", snapshot.last === true && !example.compare);
  dom.narration.classList.toggle("asking", Boolean(ask) && !snapshot.last);
  const main = element("div", "narration-main");
  renderRich(main.appendChild(element("p", "narration-text")), snapshot.narration);
  if (snapshot.note) renderRich(main.appendChild(element("p", "narration-note")), snapshot.note);
  if (snapshot.stepUnitNote) renderRich(main.appendChild(element("p", "narration-note")), snapshot.stepUnitNote);
  dom.narration.appendChild(main);
  if (ask) {
    const extras = element("div", "narration-extras");
    extras.appendChild(askBlock(ask));
    dom.narration.appendChild(extras);
    return;
  }
  if (!snapshot.last) return;
  if (example.compare) {
    const table = compareBlock(example.compare);
    table.classList.add("full");
    dom.narration.appendChild(table);
  }
  const extras = element("div", "narration-extras");
  extras.appendChild(takeawayBlock(example.closing, example.closingExtra));
  dom.narration.appendChild(extras);
}

function render() {
  const example = currentExample();
  const snapshot = currentSnapshot();
  const total = totalSteps();
  buildCanvas();
  dom.title.textContent = example.number + ". " + example.title;
  dom.subtitle.textContent = example.subtitle;
  dom.stepUnit.textContent = snapshot.stepUnit;
  renderHeaderChoices();
  Object.keys(panelRefs).forEach(function (id) { PANELS[id](snapshot, id); });
  renderNarration(snapshot);
  dom.progress.textContent = fill(UI_TEXT.progress, { current: view.stepIndex + 1, total: total });
  dom.progressFill.style.transform = "scaleX(" + ((view.stepIndex + 1) / total) + ")";
  dom.first.disabled = view.stepIndex === 0;
  dom.prev.disabled = view.stepIndex === 0;
  dom.next.disabled = view.stepIndex === total - 1;
  dom.last.disabled = view.stepIndex === total - 1;
  dom.play.textContent = view.playing ? UI_TEXT.pause : UI_TEXT.play;
  Array.prototype.forEach.call(dom.exampleList.querySelectorAll("button"), function (button, position) {
    button.setAttribute("aria-current", position === view.exampleIndex ? "true" : "false");
  });
}

function goTo(index) {
  const total = totalSteps();
  view.stepIndex = Math.max(0, Math.min(index, total - 1));
  render();
  if (view.playing && view.stepIndex === total - 1) stopPlaying();
}

function answerWith(id) {
  view.answers[answerKey()] = id;
  writeStore();
  render();
  const retry = dom.narration.querySelector(".retry");
  if (retry) retry.focus();
}

function clearAnswer() {
  delete view.answers[answerKey()];
  writeStore();
  render();
  const first = dom.narration.querySelector(".ask-options button");
  if (first) first.focus();
}

function selectExample(index) {
  stopPlaying();
  view.exampleIndex = index;
  view.variantIndex = 0;
  view.stepIndex = 0;
  render();
}

function selectVariant(index) {
  stopPlaying();
  view.variantIndex = index;
  view.stepIndex = 0;
  render();
}

function stopPlaying() {
  view.playing = false;
  if (view.timer) { clearTimeout(view.timer); view.timer = null; }
  dom.play.textContent = UI_TEXT.play;
}

function scheduleTick() {
  if (view.timer) clearTimeout(view.timer);
  view.timer = setTimeout(function () {
    if (!view.playing) return;
    if (view.stepIndex >= totalSteps() - 1) { stopPlaying(); render(); return; }
    goTo(view.stepIndex + 1);
    if (view.playing) scheduleTick();
  }, AUTOPLAY_DELAY);
}

function startPlaying() {
  view.playing = true;
  scheduleTick();
  render();
}

function togglePlaying() {
  if (view.playing) { stopPlaying(); render(); return; }
  startPlaying();
}

function lookupTooltip(key) {
  if (key.indexOf("panel:") === 0) return PANEL_TIPS[key.slice(6)];
  return TOOLTIPS[key];
}

function showTooltip(trigger, tip) {
  dom.tooltip.textContent = "";
  dom.tooltip.appendChild(element("strong", "tip-title", tip.title));
  dom.tooltip.appendChild(document.createTextNode(tip.body));
  dom.tooltip.classList.add("open");
  const box = trigger.getBoundingClientRect();
  const width = dom.tooltip.offsetWidth;
  const height = dom.tooltip.offsetHeight;
  let left = box.left + box.width / 2 - width / 2;
  left = Math.min(left, window.innerWidth - width - 8);
  let top = box.top - height - 8;
  if (top < 8) top = box.bottom + 8;
  dom.tooltip.style.left = Math.max(8, left) + "px";
  dom.tooltip.style.top = top + "px";
}

function hideTooltip() { dom.tooltip.classList.remove("open"); }

function closestElement(target, selector) {
  return target && typeof target.closest === "function" ? target.closest(selector) : null;
}

["mouseover", "focusin"].forEach(function (name) {
  document.addEventListener(name, function (event) {
    const trigger = closestElement(event.target, "[data-tip]");
    const tip = trigger ? lookupTooltip(trigger.dataset.tip) : null;
    if (tip) showTooltip(trigger, tip);
    else hideTooltip();
  });
});

["mouseout", "focusout", "scroll"].forEach(function (name) {
  document.addEventListener(name, hideTooltip, true);
});

dom.first.addEventListener("click", function () { stopPlaying(); goTo(0); });
dom.prev.addEventListener("click", function () { stopPlaying(); goTo(view.stepIndex - 1); });
dom.next.addEventListener("click", function () { stopPlaying(); goTo(view.stepIndex + 1); });
dom.last.addEventListener("click", function () { stopPlaying(); goTo(totalSteps() - 1); });
dom.play.addEventListener("click", togglePlaying);

document.addEventListener("keydown", function (event) {
  if (event.target && event.target.tagName === "BUTTON" && (event.key === " " || event.key === "Enter")) return;
  if (event.key === "ArrowRight") { stopPlaying(); goTo(view.stepIndex + 1); event.preventDefault(); }
  if (event.key === "ArrowLeft") { stopPlaying(); goTo(view.stepIndex - 1); event.preventDefault(); }
  if (event.key === "Home") { stopPlaying(); goTo(0); event.preventDefault(); }
  if (event.key === "End") { stopPlaying(); goTo(totalSteps() - 1); event.preventDefault(); }
  if (event.key === "Escape") hideTooltip();
});

dom.pageTitle.textContent = UI_TEXT.pageTitle;
dom.first.textContent = UI_TEXT.firstStep;
dom.prev.textContent = UI_TEXT.prevStep;
dom.next.textContent = UI_TEXT.nextStep;
dom.last.textContent = UI_TEXT.lastStep;
dom.play.textContent = UI_TEXT.play;

Object.keys(UI_TEXT.panels).forEach(function (id) {
  if (!PANELS[id]) console.error("El panel " + id + " tiene nombre pero no tiene dibujo");
});

Object.keys(PANELS).forEach(function (id) {
  if (!UI_TEXT.panels[id]) console.error("El panel " + id + " tiene dibujo pero no tiene nombre");
});

renderExampleList();
render();
</script>
</body>
</html>
