<title>Memoria</title>
<style>
  :root {

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html, body { margin: 0; padding: 0; }

  .grid-table td.role-segment { color: var(--role-segment); font-weight: 700; }
  .grid-table td.role-pid { color: var(--role-pid); font-weight: 700; }
  .grid-table td.mark { box-shadow: inset 0 0 0 2px var(--marked); border-radius: 5px; background: var(--marked-soft); color: var(--ink); font-weight: 750; }

  .grid-table tr.focus td { background: var(--marked-soft); color: var(--ink); }
  .grid-table tr.focus td.role-page, .grid-table tr.focus td.role-frame, .grid-table tr.focus td.role-segment, .grid-table tr.focus td.role-pid { color: inherit; }
  .grid-table tr.focus td:first-child { box-shadow: inset 3px 0 0 var(--marked); border-radius: 5px 0 0 5px; }

  .grid-table tr.fault td { font-weight: 750; }
  .grid-table tr.fault td:first-child { box-shadow: inset 3px 0 0 var(--fault); border-radius: 5px 0 0 5px; }
  .grid-table tr.fault td:last-child { border-radius: 0 5px 5px 0; }

  .grid-table tr.gap td { color: var(--muted); font-family: inherit; padding-top: 0; padding-bottom: 0; }

  .frame-grid { display: grid; gap: 5px; }

  .frame {
    position: relative;
    min-width: 0;
    height: 40px;
    border: 1.5px solid var(--line-strong);
    border-radius: 6px;
    background: var(--card);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .frame .index { position: absolute; top: 2px; left: 4px; font-size: 9.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
  .frame .label { position: relative; font-size: 11.5px; font-weight: 750; white-space: nowrap; }
  .frame.used { border-color: var(--role-page); color: var(--role-page); }

  .mem-caption { font-size: 11.5px; color: var(--muted); margin-bottom: 7px; }

  .legend { display: flex; flex-wrap: wrap; gap: 3px 14px; margin-top: 9px; }

  .legend .swatch.used { border-color: var(--role-page); background: var(--role-page-soft); }

  .legend .swatch.seg { border-color: var(--role-segment); background: var(--role-segment-soft); }
  .legend .swatch.os { border-color: var(--ink-soft); background: var(--line); }
  .legend .swatch.unknown { border-color: var(--line-strong); border-style: dashed; background: var(--card); }
  .legend .swatch.tile-used { border-color: var(--ink-soft); background: var(--ink-soft); }
  .legend .swatch.tile-empty { border-color: var(--line-strong); background: var(--card); }

  .strip-wrap { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .strip { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 220px; border-radius: 6px; }

  .block {
    position: relative;
    min-height: 22px;
    border: 1.5px solid var(--line-strong);
    border-top-width: 0.75px;
    border-bottom-width: 0.75px;
    background: var(--card);
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 2px 9px;
    font-size: 12px;
  }

  .block:first-child { border-top-width: 1.5px; border-radius: 6px 6px 0 0; }

  .block .name { font-weight: 750; white-space: nowrap; }

  .state-pill.RUNNING { color: var(--running-state); border-color: var(--running-state); background: var(--running-state-soft); }

  .state-gloss { margin-left: 8px; font-size: 12px; color: var(--muted); font-weight: 500; }

  .list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }

  .list li {
    display: flex;

    align-items: baseline;

<script id="engine">
const USED_TIPS = {};
const ACCUMULATING = ["calc", "routine", "attempts", "beats"];
const PHASES = {
  relocation: ["table", "ask", "compose"],
  paging: ["table", "ask", "split", "lookup", "compose"],
  tlb: ["table", "ref", "totals"],
  segments: ["table", "ask", "compose", "holes"],
  segPaging: ["table", "ask", "split", "segment", "page", "compose"],
  inverted: ["table", "ask", "search", "hash", "probe", "scan", "compose"],
  policy: ["ref"]
};
const REFERENCE_ORDER_BASE = 1000000;
const CLOCK_ALGORITHMS = { clock: true, clockModified: true };

function fill(template, values) {
  return String(template).replace(/\{(\w+)\}/g, function (whole, key) {
    return values[key] === undefined || values[key] === null ? whole : String(values[key]);
  });
}

function joinList(items) {
  if (items.length <= 1) return items.join("");
  return items.slice(0, -1).join(", ") + UI_TEXT.and + items[items.length - 1];
}

function unresolved(text) {
  return /\{\w+\}/.test(String(text));
}

function unbalanced(text) {
  const stars = String(text).split("*").length - 1;
  const opens = String(text).split("[[").length - 1;
  const closes = String(text).split("]]").length - 1;
  return stars % 2 !== 0 || opens !== closes;
}

function power(bits) {
  return Math.pow(2, bits);
}

function slice(value, lowBits, bits) {
  return Math.floor(value / power(lowBits)) % power(bits);
}

function groupThousands(value) {
  const text = String(value);
  if (text.length < 5) return text;
  return text.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}

function formatNumber(value, hexDigits) {
  if (value === null || value === undefined) return UI_TEXT.unknownValue;
  if (typeof value === "string") return value;
  if (hexDigits) {
    let text = value.toString(16).toUpperCase();
    while (text.length < hexDigits) text = "0" + text;
    return "0x" + text;
  }
  return groupThousands(value);
}

function binary(value, bits) {
  let text = value.toString(2);
  while (text.length < bits) text = "0" + text;
  return text;
}

function phaseRank(type, phase) {
  return PHASES[type].indexOf(phase);
}

function tableBlock(columns, roles, rows, extra) {
  return Object.assign({ columns: columns, roles: roles, rows: rows }, extra || {});
}

function stripBlocks(size, used) {
  const ordered = used.slice().sort(function (one, other) { return one.start - other.start; });
  const blocks = [];
  let cursor = 0;
  ordered.forEach(function (block) {
    if (block.start > cursor) blocks.push({ start: cursor, size: block.start - cursor, label: "", kind: "free" });
    blocks.push(block);
    cursor = block.start + block.size;
  });
  if (cursor < size) blocks.push({ start: cursor, size: size - cursor, label: "", kind: "free" });
  return blocks;
}

function relocationMachine(example, address, phase) {
  const machine = example.machine;
  const rank = phaseRank("relocation", phase);
  const has = address !== null && address !== undefined;
  const within = has && address < machine.limit;
  const composed = has && rank >= 2;
  const physical = has ? machine.base + address : null;
  const context = { dl: has ? address : null, base: machine.base, limite: machine.limit, df: within ? physical : null, ultima: machine.limit - 1 };
  const lines = [{ caption: "registers", fields: [{ role: "whole", bits: null, value: machine.base, label: UI_TEXT.roles.base }, { role: "whole", bits: null, value: machine.limit, label: UI_TEXT.roles.limit }] }];
  if (has) lines.push({ caption: "logical", fields: [{ role: "offset", bits: null, value: address, label: "DL" }] });
  if (composed) {
    lines.push({ kind: "equation", status: within ? "ok" : "fail", text: fill(within ? UI_TEXT.equations.relocationLimit : UI_TEXT.equations.relocationLimitFail, context) });
    if (within) lines.push({ kind: "equation", status: "ok", text: fill(UI_TEXT.equations.relocationSum, context) });
    else lines.push({ kind: "verdict", text: UI_TEXT.verdicts.relocationFault });
  }
  const blocks = stripBlocks(machine.memorySize, [{ start: machine.base, size: machine.limit, label: "Proceso", kind: "seg" }]);
  const memory = { kind: "strip", size: machine.memorySize, unit: "dec", blocks: blocks };
  if (composed) {
    memory.marker = within ? { address: physical, fail: false, label: formatNumber(physical) } : { address: machine.base + machine.limit - 1, fail: true, label: UI_TEXT.marks.fail };
    memory.highlight = [blocks.findIndex(function (block) { return block.kind === "seg"; })];
  }
  return { views: { mmu: { lines: lines }, memory: memory }, context: context, outcome: composed ? (within ? physical : "segfault") : null };
}

function pagingMachine(example, address, phase) {
  const machine = example.machine;
  const offsetBits = Math.log2(machine.pageSize);
  const pageBits = machine.logicalBits - offsetBits;
  const frameBits = machine.physicalBits - offsetBits;
  const shown = function (bits) { return machine.display === "values" ? null : bits; };
  const rank = phaseRank("paging", phase);
  const has = address !== null && address !== undefined;
  const page = has ? Math.floor(address / machine.pageSize) : null;
  const offset = has ? address % machine.pageSize : null;
  const frame = has && page < machine.table.length ? machine.table[page] : null;
  const mapped = frame !== null && frame !== undefined;
  const lookedUp = has && rank >= 3;
  const composed = has && rank >= 4;
  const failure = lookedUp && !mapped;
  const physical = mapped ? frame * machine.pageSize + offset : null;
  const lines = [];
  if (has) {
    lines.push({ caption: "logical", value: address, fields: [{ role: "page", bits: shown(pageBits), value: rank >= 2 ? page : null }, { role: "offset", bits: shown(offsetBits), value: rank >= 2 ? offset : null }] });
    if (failure) {
      lines.push({ kind: "verdict", text: fill(UI_TEXT.verdicts.invalid, { pagina: page }) });
    } else {
      lines.push({ caption: "physical", value: composed ? physical : null, pending: true, fields: [{ role: "frame", bits: shown(frameBits), value: lookedUp ? frame : null }, { role: "offset", bits: shown(offsetBits), value: lookedUp ? offset : null }] });
    }
  }
  const rows = machine.table.map(function (target, index) {
    return [String(index), target === null ? UI_TEXT.none : String(target), target === null ? "0" : "1"];
  });
  const cells = {};
  (machine.others || []).forEach(function (index) { cells[index] = { label: "", kind: "other" }; });
  machine.table.forEach(function (target, index) {
    if (target !== null) cells[target] = { label: fill(UI_TEXT.memory.pageLabel, { n: index }) };
  });
  return {
    views: {
      address: { lines: lines },
      pageTable: { pointer: { name: "PTBR", tip: "ptbr" }, tables: [tableBlock(["page", "frame", "valid"], ["page", "frame", null], rows, { highlight: lookedUp && mapped ? [page] : [], faultRows: failure ? [page] : [] })] },
      memory: { kind: "frames", count: machine.frames, columns: machine.memoryColumns, cells: cells, highlight: lookedUp && mapped ? [frame] : [] }
    },
    context: { direccion: has ? formatNumber(address) : null, pagina: page, desp: has ? formatNumber(offset) : null, marco: frame, fisica: physical === null ? null : formatNumber(physical) },
    outcome: !lookedUp ? null : (mapped ? (composed ? physical : null) : "invalid")
  };
}

function tlbMachine(example, index, phase) {
  const machine = example.machine;
  const rank = phaseRank("tlb", phase);
  const upto = rank === 2 ? machine.refs.length - 1 : (index === null || index === undefined ? -1 : index);
  const seen = [];
  const accessRows = [];
  let without = 0;
  let withTlb = 0;
  let current = null;
  for (let position = 0; position <= upto; position += 1) {
    const address = machine.refs[position];
    const page = Math.floor(address / machine.pageSize);
    const hit = seen.indexOf(page) !== -1;
    if (!hit) seen.push(page);
    without += 2;
    withTlb += hit ? 1 : 2;
    accessRows.push([String(address), String(page), UI_TEXT.tlbResults[hit ? "hit" : "miss"], "2", hit ? "1" : "2"]);
    current = { address: address, page: page, hit: hit, frame: machine.table[page], offset: address % machine.pageSize };
  }
  if (current) current.physical = current.frame * machine.pageSize + current.offset;
  const atReference = rank === 1 && current;
  const lines = [];
  if (atReference) {
    lines.push({ caption: "logical", value: current.address, fields: [{ role: "page", bits: null, value: current.page }, { role: "offset", bits: null, value: current.offset }] });
    lines.push({ kind: "equation", status: current.hit ? "ok" : "fail", text: fill(current.hit ? UI_TEXT.equations.tlbHit : UI_TEXT.equations.tlbMiss, { pagina: current.page, marco: current.frame }) });
    if (!current.hit) lines.push({ kind: "equation", status: "ok", text: fill(UI_TEXT.equations.tableLookup, { pagina: current.page, marco: current.frame }) });
    lines.push({ caption: "physical", value: current.physical, fields: [{ role: "frame", bits: null, value: current.frame }, { role: "offset", bits: null, value: current.offset }] });
  }
  const tlbRows = seen.map(function (page) { return [machine.pid, String(page), String(machine.table[page])]; });
  const tableRows = machine.table.map(function (target, page) { return [String(page), target === null ? UI_TEXT.none : String(target), target === null ? "0" : "1"]; });
  if (rank === 2) accessRows.push([UI_TEXT.accessTotal, "", "", String(without), String(withTlb)]);
  return {
    views: {
      address: { lines: lines },
      tlb: tlbRows.length === 0 ? { tables: [], empty: UI_TEXT.emptyTlb } : { tables: [tableBlock(["process", "page", "frame"], [null, "page", "frame"], tlbRows, { highlight: atReference ? [seen.indexOf(current.page)] : [] })] },
      pageTable: { pointer: { name: "PTBR", tip: "ptbr" }, tables: [tableBlock(["page", "frame", "valid"], ["page", "frame", null], tableRows, { highlight: atReference && !current.hit ? [current.page] : [] })] },
      accesses: accessRows.length === 0 ? { tables: [], empty: UI_TEXT.emptyAccesses } : { tables: [tableBlock(["dl", "page", "tlbResult", "withoutTlb", "withTlb"], [null, "page", null, null, null], accessRows, { highlight: [accessRows.length - 1] })] }
    },
    context: { pagina: current ? current.page : null, marco: current ? current.frame : null, fisica: current ? formatNumber(current.physical) : null, sin: without, con: withTlb },
    outcome: atReference ? (current.hit ? "hit:" : "miss:") + current.physical : (rank === 2 ? without + ":" + withTlb : null)
  };
}

function segmentMachine(example, address, phase) {
  const machine = example.machine;
  const rank = phaseRank("segments", phase);
  const has = address !== null && address !== undefined;
  const segment = has ? address[0] : null;
  const offset = has ? address[1] : null;
  const access = has ? address[2] : null;
  const entry = has ? machine.segments[segment] : null;
  const within = has && offset < entry.limit;
  const perm = entry ? UI_TEXT.perms[entry.perm] : null;
  const permitted = Boolean(perm) && perm.allows.indexOf(access) !== -1;
  const composed = has && rank >= 2;
  let failure = null;
  if (composed && !within) failure = "segfault";
  else if (composed && !permitted) failure = "protection";
  const physical = has ? entry.base + offset : null;
  const context = {
    nombre: entry ? entry.name : null,
    desp: offset,
    base: entry ? entry.base : null,
    limite: entry ? entry.limit : null,
    fisica: has ? formatNumber(physical) : null,
    acceso: has ? UI_TEXT.access[access] : null,
    permiso: perm ? perm.label : null
  };
  const lines = [];
  if (has) {
    lines.push({ caption: "logical", fields: [{ role: "segment", bits: null, value: segment }, { role: "offset", bits: null, value: offset }] });
    if (composed) {
      lines.push({ kind: "equation", status: within ? "ok" : "fail", text: fill(within ? UI_TEXT.equations.limit : UI_TEXT.equations.limitFail, context) });
      if (within) lines.push({ kind: "equation", status: permitted ? "ok" : "fail", text: fill(UI_TEXT.equations.perm, context) });
      if (!failure) lines.push({ kind: "equation", status: "ok", text: fill(UI_TEXT.equations.sum, context) });
      if (failure === "segfault") lines.push({ kind: "verdict", text: UI_TEXT.verdicts.segfault });
      if (failure === "protection") lines.push({ kind: "verdict", text: fill(UI_TEXT.verdicts.protection, context) });
    }
  }
  const rows = machine.segments.map(function (item, index) {
    return [String(index), fill(UI_TEXT.segmentName, { nombre: item.name, contenido: item.content }), String(item.base), String(item.limit), UI_TEXT.perms[item.perm].label];
  });
  const used = [{ start: 0, size: machine.osSize, label: "SO", kind: "os" }].concat(machine.segments.map(function (item) { return { start: item.base, size: item.limit, label: item.name, kind: "seg" }; }));
  const blocks = stripBlocks(machine.memorySize, used);
  const memory = { kind: "strip", size: machine.memorySize, unit: "dec", blocks: blocks };
  if (rank === 3) {
    memory.highlight = [];
    blocks.forEach(function (block, index) {
      if (block.kind !== "free") return;
      memory.highlight.push(index);
      block.tags = [fill(UI_TEXT.memory.holeTag, { n: block.size })];
    });
  }
  if (composed && (!failure || failure === "segfault")) {
    const target = blocks.findIndex(function (block) { return block.kind === "seg" && block.start === entry.base; });
    memory.marker = failure ? { address: entry.base + entry.limit - 1, fail: true, label: UI_TEXT.marks.fail } : { address: physical, fail: false, label: formatNumber(physical) };
    memory.highlight = failure ? [] : [target];
  }
  return {
    views: {
      address: { lines: lines },
      segmentTable: { tables: [tableBlock(["segment", "name", "base", "limit", "perms"], ["segment", null, null, null, null], rows, { highlight: composed && !failure ? [segment] : [], faultRows: failure ? [segment] : [] })] },
      memory: memory
    },
    context: context,
    outcome: composed ? (failure || physical) : null
  };
}

function segPagingMachine(example, address, phase) {
  const machine = example.machine;
  const pageSize = power(machine.offsetBits);
  const frameBits = Math.log2(machine.frames);
  const rank = phaseRank("segPaging", phase);
  const has = address !== null && address !== undefined;
  const segment = has ? slice(address, machine.pageBits + machine.offsetBits, machine.segBits) : null;
  const page = has ? slice(address, machine.offsetBits, machine.pageBits) : null;
  const offset = has ? address % pageSize : null;
  const entry = has ? machine.segments[segment] : null;
  const inRange = has && page < entry.table.length;
  const frame = inRange ? entry.table[page] : null;
  const physical = inRange ? frame * pageSize + offset : null;
  const segmentChecked = has && rank >= 3;
  const failure = segmentChecked && !inRange ? "segfault" : null;
  const pageLooked = has && rank >= 4 && !failure;
  const composed = has && rank >= 5 && !failure;
  const context = {
    direccion: has ? formatNumber(address) : null,
    segmento: segment,
    pagina: page,
    desp: has ? formatNumber(offset) : null,
    contenido: entry ? entry.label : null,
    paginas: entry ? entry.table.length : null,
    marco: frame,
    fisica: physical === null ? null : formatNumber(physical)
  };
  const lines = [];
  if (has) {
    lines.push({
      caption: "logical",
      value: address,
      fields: [
        { role: "segment", bits: machine.segBits, value: rank >= 2 ? segment : null },
        { role: "page", bits: machine.pageBits, value: rank >= 2 ? page : null },
        { role: "offset", bits: machine.offsetBits, value: rank >= 2 ? offset : null }
      ]
    });
    if (segmentChecked) {
      lines.push({ kind: "equation", status: inRange ? "ok" : "fail", text: fill(inRange ? UI_TEXT.equations.segPages : UI_TEXT.equations.segPagesFail, context) });
    }
    if (failure) {
      lines.push({ kind: "verdict", text: fill(UI_TEXT.verdicts.segPageOut, context) });
    } else {
      lines.push({
        caption: "physical",
        value: composed ? physical : null,
        pending: true,
        fields: [
          { role: "frame", bits: frameBits, value: pageLooked ? frame : null },
          { role: "offset", bits: machine.offsetBits, value: pageLooked ? offset : null }
        ]
      });
    }
  }
  const segmentRows = machine.segments.map(function (item, index) { return [String(index), item.label, String(item.table.length)]; });
  const pageTables = machine.segments.map(function (item, index) {
    return tableBlock(["page", "frame"], ["page", "frame"], item.table.map(function (target, row) { return [String(row), String(target)]; }), {
      caption: item.label,
      active: segmentChecked && index === segment && !failure,
      highlight: pageLooked && index === segment ? [page] : []
    });
  });
  const cells = {};
  machine.segments.forEach(function (item) {
    item.table.forEach(function (target, row) { cells[target] = { label: item.label + " " + row }; });
  });
  return {
    views: {
      address: { lines: lines },
      segmentTable: { tables: [tableBlock(["segment", "content", "pages"], ["segment", null, null], segmentRows, { highlight: segmentChecked && !failure ? [segment] : [], faultRow: failure ? segment : null })] },
      pageTables: { tables: pageTables },
      memory: { kind: "frames", count: machine.frames, columns: machine.memoryColumns, cells: cells, highlight: pageLooked ? [frame] : [] }
    },
    context: context,
    outcome: failure ? failure : (composed ? physical : null)
  };
}

function invertedChains(machine) {
  const chains = {};
  machine.frames.forEach(function (entry, index) {
    if (!entry) return;
    const slot = (machine.pids[entry.pid] + entry.page) % machine.slots;
    if (!chains[slot]) chains[slot] = [];
    chains[slot].push(index);
  });
  return chains;
}

function nextInChain(chains, index) {
  let following = null;
  Object.keys(chains).forEach(function (slot) {
    const chain = chains[slot];
    const position = chain.indexOf(index);
    if (position !== -1 && position < chain.length - 1) following = chain[position + 1];
  });
  return following;
}

function invertedMachine(example, address, phase, probe) {
  const machine = example.machine;
  const rank = phaseRank("inverted", phase);
  const linear = machine.search === "linear";
  const chains = invertedChains(machine);
  const has = address !== null && address !== undefined;
  const slot = has ? (machine.pids[address.pid] + address.page) % machine.slots : null;
  const chain = has ? (chains[slot] || []) : [];
  const matches = function (index) { return machine.frames[index] && machine.frames[index].pid === address.pid && machine.frames[index].page === address.page; };
  const foundIndex = has ? machine.frames.findIndex(function (entry, index) { return matches(index); }) : -1;
  const frame = foundIndex === -1 ? null : foundIndex;
  const hashed = has && !linear && rank >= 3;
  const probing = has && rank === 4 ? probe : null;
  const probed = probing === null ? null : chain[probing];
  const scanning = has && rank === 5 ? probe : null;
  const composed = has && rank >= 6;
  const found = (probed !== null && probed !== undefined && probed === frame) || (scanning !== null && scanning === frame) || composed;
  const physical = frame === null || !has ? null : frame * machine.pageSize + address.offset;
  const context = {
    proceso: has ? address.pid : null,
    numero: has ? machine.pids[address.pid] : null,
    pagina: has ? address.page : null,
    desp: has ? address.offset : null,
    ranuras: machine.slots,
    hash: slot,
    primero: chain.length > 0 ? chain[0] : null,
    sonda: probed === undefined ? null : probed,
    siguiente: probed === null || probed === undefined ? null : nextInChain(chains, probed),
    leidas: linear && has ? (scanning === null ? frame + 1 : scanning + 1) : null,
    marco: found ? frame : null,
    tam: machine.pageSize,
    fisica: physical === null ? null : formatNumber(physical)
  };
  const lines = [];
  if (has) {
    lines.push({ caption: "logical", fields: [{ role: "pid", bits: null, value: address.pid }, { role: "page", bits: null, value: address.page }, { role: "offset", bits: null, value: address.offset }] });
    if (hashed) lines.push({ kind: "equation", status: "ok", text: fill(UI_TEXT.equations.hash, context) });
    if (linear && (scanning !== null || composed)) lines.push({ kind: "equation", status: found ? "ok" : "fail", text: fill(UI_TEXT.equations.scan, context) });
    if (composed) lines.push({ kind: "equation", status: "ok", text: fill(UI_TEXT.equations.framePhysical, context) });
  }
  const visited = [];
  if (probing !== null) for (let index = 0; index < probing; index += 1) visited.push(chain[index]);
  if (scanning !== null) for (let index = 0; index < scanning; index += 1) visited.push(index);
  const rows = machine.frames.map(function (entry, index) {
    const columns = linear ? [] : [entry ? (nextInChain(chains, index) === null ? UI_TEXT.none : String(nextInChain(chains, index))) : UI_TEXT.none];
    if (!entry) return [String(index), UI_TEXT.none, UI_TEXT.none].concat(columns);
    return [String(index), entry.pid, String(entry.page)].concat(columns);
  });
  let highlight = [];
  if (probed !== null && probed !== undefined) highlight = [probed];
  if (scanning !== null) highlight = [scanning];
  if (composed && frame !== null) highlight = [frame];
  const hashRows = [];
  for (let index = 0; index < machine.slots; index += 1) hashRows.push([String(index), chains[index] ? String(chains[index][0]) : UI_TEXT.none]);
  const columns = linear ? ["frame", "process", "page"] : ["frame", "process", "page", "next"];
  const roles = linear ? ["frame", "pid", "page"] : ["frame", "pid", "page", null];
  return {
    views: {
      address: { lines: lines },
      inverted: { tables: [tableBlock(columns, roles, rows, { highlight: highlight, visited: visited })] },
      hash: { tables: [tableBlock(["slot", "first"], [null, "frame"], hashRows, { highlight: hashed ? [slot] : [] })] }
    },
    context: context,
    outcome: composed ? physical : null
  };
}

function policyMachine(example, index, phase) {
  const machine = example.machine;
  const frames = [];
  for (let slot = 0; slot < machine.frames; slot += 1) frames.push(null);
  const faults = { A: 0, B: 0 };
  let record = null;
  for (let n = 1; n <= index; n += 1) {
    const owner = machine.refs[n - 1].charAt(0);
    const page = Number(machine.refs[n - 1].slice(1));
    record = { owner: owner, page: page };
    const at = frames.findIndex(function (entry) { return entry && entry.owner === owner && entry.page === page; });
    if (at !== -1) { record.kind = "hit"; record.frame = at; continue; }
    faults[owner] += 1;
    const held = frames.filter(function (entry) { return entry && entry.owner === owner; }).length;
    const free = frames.indexOf(null);
    if (free !== -1 && (machine.scope === "global" || held < machine.quota[owner])) {
      record.kind = "load";
      record.frame = free;
    } else {
      let victim = -1;
      frames.forEach(function (entry, slot) {
        if (!entry || (machine.scope === "local" && entry.owner !== owner)) return;
        if (victim === -1 || entry.since < frames[victim].since) victim = slot;
      });
      record.kind = "replace";
      record.frame = victim;
      record.victim = frames[victim];
    }
    frames[record.frame] = { owner: owner, page: page, since: n };
  }
  const holding = function (owner) { return frames.filter(function (entry) { return entry && entry.owner === owner; }).length; };
  const texts = UI_TEXT.policy;
  let texto = "";
  if (record) {
    const values = { proceso: record.owner, pagina: record.page, marco: record.frame };
    if (record.kind === "hit") texto = fill(texts.hit, values);
    if (record.kind === "load") texto = fill(texts.load, values);
    if (record.kind === "replace") {
      values.victima = record.victim.page;
      values.duenio = record.victim.owner;
      values.entre = fill(machine.scope === "local" ? texts.amongOwn : texts.amongAll, values);
      texto = fill(texts.replace, values);
    }
  }
  const frameRows = frames.map(function (entry, slot) { return [String(slot), entry ? entry.owner : UI_TEXT.none, entry ? String(entry.page) : UI_TEXT.none]; });
  const ownerRows = ["A", "B"].map(function (owner) { return [owner, String(holding(owner)), String(faults[owner])]; });
  return {
    views: {
      frames: { tables: [
        tableBlock(["frame", "owner", "page"], ["frame", null, "page"], frameRows, { caption: texts.framesCaption, highlight: record && record.kind !== "hit" ? [record.frame] : [] }),
        tableBlock(["process", "frames", "faults"], [null, null, null], ownerRows, { caption: texts.ownersCaption, highlight: record && record.kind !== "hit" ? [record.owner === "A" ? 0 : 1] : [] })
      ] }
    },
    context: { texto: texto, fallosA: faults.A, fallosB: faults.B, marcosA: holding("A"), marcosB: holding("B") },
    outcome: "A" + faults.A + ":B" + faults.B
  };
}

const MACHINES = {
  relocation: relocationMachine,
  paging: pagingMachine,
  tlb: tlbMachine,
  segments: segmentMachine,
  segPaging: segPagingMachine,
  inverted: invertedMachine,
  policy: policyMachine
};

function copyState(state) {
  return JSON.parse(JSON.stringify(state));
}

function isClock(example) {
  return Boolean(CLOCK_ALGORITHMS[example.algorithm]);
}

function normalizeReference(example, raw, problems, n) {
  if (typeof raw === "number") return { page: raw };
  if (raw.address === undefined) return { page: raw.page, mode: raw.mode };
  const page = Math.floor(raw.address / example.pageSize);
  const offset = raw.address % example.pageSize;
  if (page !== raw.page) problems.push("la referencia " + n + " declara la página " + raw.page + " y la dirección da " + page);
  if (offset !== raw.offset) problems.push("la referencia " + n + " declara el desplazamiento " + raw.offset + " y la dirección da " + offset);
  return { page: page, offset: offset, address: raw.address, mode: raw.mode };
}

function touch(frame, n) {
  frame.order = REFERENCE_ORDER_BASE + n;
  frame.lastText = fill(UI_TEXT.state.lastRef, { n: n });
  frame.lastNarr = fill(UI_TEXT.narr.lastRef, { n: n });
}

function initialState(example, problems) {
  const frames = example.frames.map(function (label) {
    return { label: label, page: null, u: 0, m: 0, order: null, lastText: null, lastNarr: null, since: null };
  });
  const initial = example.initial || { frames: [] };
  initial.frames.forEach(function (item) {
    const position = example.frames.indexOf(item.frame);
    if (position === -1) { problems.push("el estado inicial usa el marco " + item.frame + ", que no existe"); return; }
    const frame = frames[position];
    frame.page = item.page;
    frame.u = item.u || 0;
    frame.m = item.m || 0;
    frame.order = item.instant;
    frame.since = item.since === undefined ? null : item.since;
    frame.lastText = fill(UI_TEXT.state.lastInstant, { t: item.instant });
    frame.lastNarr = fill(UI_TEXT.narr.lastInstant, { t: item.instant });
  });
  let pointer = 0;
  if (initial.pointer !== undefined) {
    pointer = example.frames.indexOf(initial.pointer);
    if (pointer === -1) { problems.push("el puntero inicial apunta a un marco que no existe"); pointer = 0; }
  }
  const tlb = example.tlbSize ? Array.apply(null, Array(example.tlbSize)).map(function () { return null; }) : null;
  return { frames: frames, pointer: pointer, tlb: tlb, counters: { faults: 0, writes: 0, tlb: 0, memory: 0, disk: 0 }, terminated: false };
}

function nextUseOf(references, page, after) {
  for (let index = after; index < references.length; index += 1) {
    if (references[index].page === page) return index + 1;
  }
  return null;
}

function enteredBefore(one, other) {
  const first = one.since === null ? -Infinity : one.since;
  const second = other.since === null ? -Infinity : other.since;
  return first < second;
}

function fifoVictim(frames) {
  let best = 0;
  frames.forEach(function (frame, index) { if (frame.since < frames[best].since) best = index; });
  return { index: best };
}

function optimalVictim(frames, references, n) {
  let best = 0;
  let bestUse = -1;
  let tie = false;
  const uses = frames.map(function (frame, index) {
    const at = nextUseOf(references, frame.page, n);
    const distance = at === null ? Infinity : at;
    if (distance > bestUse) { bestUse = distance; best = index; tie = false; }
    else if (distance === bestUse) { tie = true; if (enteredBefore(frame, frames[best])) best = index; }
    return { page: frame.page, at: at };
  });
  return { index: best, uses: uses, tie: tie };
}

function lruVictim(frames) {
  let best = 0;
  frames.forEach(function (frame, index) { if (frame.order < frames[best].order) best = index; });
  return { index: best };
}

function clockVictim(frames, pointer) {
  const cleared = [];
  let at = pointer;
  while (frames[at].u === 1) {
    frames[at].u = 0;
    cleared.push(at);
    at = (at + 1) % frames.length;
  }
  return { index: at, start: pointer, cleared: cleared };
}

function clockModifiedVictim(frames, pointer) {
  const passes = [];
  for (let round = 0; round < 4; round += 1) {
    const dirty = round % 2 === 1;
    const cleared = [];
    for (let step = 0; step < frames.length; step += 1) {
      const index = (pointer + step) % frames.length;
      const frame = frames[index];
      if (frame.u === 0 && frame.m === (dirty ? 1 : 0)) {
        passes.push({ dirty: dirty, found: index, cleared: cleared });
        return { index: index, start: pointer, passes: passes };
      }
      if (dirty && frame.u === 1) { frame.u = 0; cleared.push(index); }
    }
    passes.push({ dirty: dirty, found: null, cleared: cleared });
  }
  return { index: pointer, start: pointer, passes: passes };
}

function freeFrame(example, state) {
  const frames = state.frames;
  if (!isClock(example)) return frames.findIndex(function (frame) { return frame.page === null; });
  for (let step = 0; step < frames.length; step += 1) {
    const index = (state.pointer + step) % frames.length;
    if (frames[index].page === null) return index;
  }
  return -1;
}

function chooseVictim(example, state, references, n) {
  if (example.algorithm === "fifo") return fifoVictim(state.frames);
  if (example.algorithm === "optimal") return optimalVictim(state.frames, references, n);
  if (example.algorithm === "lru" || example.algorithm === "tlb") return lruVictim(state.frames);
  if (example.algorithm === "clock") return clockVictim(state.frames, state.pointer);
  return clockModifiedVictim(state.frames, state.pointer);
}

function stepFrames(example, state, references, n, problems) {
  const next = copyState(state);
  const reference = references[n - 1];
  const record = { n: n, page: reference.page, offset: reference.offset, address: reference.address, mode: reference.mode, write: reference.mode === "E" };
  if (example.processPages !== undefined && reference.page >= example.processPages) {
    record.kind = "invalid";
    next.terminated = true;
    return { record: record, state: next };
  }
  const frames = next.frames;
  const at = frames.findIndex(function (frame) { return frame.page === reference.page; });
  if (at !== -1) {
    record.kind = "hit";
    record.frame = at;
    frames[at].u = 1;
    if (record.write) frames[at].m = 1;
    touch(frames[at], n);
    record.pointer = next.pointer;
    return { record: record, state: next };
  }
  next.counters.faults += 1;
  const free = freeFrame(example, next);
  if (free !== -1) {
    record.kind = "load";
    record.frame = free;
    if (isClock(example) && free !== next.pointer) problems.push("en la referencia " + n + " el marco libre no es el del puntero");
  } else {
    const choice = chooseVictim(example, next, references, n);
    const victim = frames[choice.index];
    record.kind = "replace";
    record.frame = choice.index;
    record.victim = victim.page;
    record.victimSince = victim.since;
    record.victimLast = victim.lastNarr;
    record.uses = choice.uses;
    record.tie = choice.tie;
    record.cleared = choice.cleared;
    record.passes = choice.passes;
    record.start = choice.start;
    record.written = victim.m === 1;
    if (record.written) next.counters.writes += 1;
  }
  const target = frames[record.frame];
  target.page = reference.page;
  target.u = 1;
  target.m = record.write ? 1 : 0;
  target.since = n;
  touch(target, n);
  if (isClock(example)) next.pointer = (record.frame + 1) % frames.length;
  record.pointer = next.pointer;
  return { record: record, state: next };
}

function describeClock(record, example) {
  const narr = UI_TEXT.narr;
  const labels = example.frames;
  let text = fill(narr.clockStart, { start: labels[record.start] });
  if (record.cleared.length > 0) {
    const list = joinList(record.cleared.map(function (index) { return labels[index]; }));
    const template = record.cleared.length === labels.length ? narr.clockClearAll : record.cleared.length === 1 ? narr.clockClearOne : narr.clockClearMany;
    text += fill(template, { frames: list });
  }
  text += fill(narr.clockPick, { frame: labels[record.frame], victim: record.victim });
  return text;
}

function describeClockModified(record, example) {
  const narr = UI_TEXT.narr;
  const labels = example.frames;
  let text = fill(narr.clockStart, { start: labels[record.start] });
  record.passes.forEach(function (pass, round) {
    const name = narr.rounds[round];
    if (pass.found === null) {
      text += fill(pass.dirty ? narr.passNoneDirty : narr.passNoneClean, { round: name });
      return;
    }
    const values = { round: name, frame: labels[pass.found], victim: record.victim };
    if (!pass.dirty) { text += fill(narr.passFoundClean, values); return; }
    if (pass.cleared.length === 0) { text += fill(narr.passFoundDirty, values); return; }
    const list = joinList(pass.cleared.map(function (index) { return labels[index]; }));
    values.cleared = fill(pass.cleared.length === 1 ? narr.clearedOne : narr.clearedMany, { frames: list });
    text += fill(narr.passFoundDirtyCleared, values);
  });
  return text;
}

function describeReplacement(record, example) {
  const narr = UI_TEXT.narr;
  if (example.algorithm === "fifo") return fill(narr.fifo, { victim: record.victim, since: record.victimSince });
  if (example.algorithm === "optimal") {
    const uses = joinList(record.uses.map(function (use) {
      return use.at === null ? fill(narr.optimalNever, { page: use.page }) : fill(narr.optimalUse, { page: use.page, at: use.at });
    }));
    return fill(record.tie ? narr.optimalTie : narr.optimal, { uses: uses, victim: record.victim });
  }
  if (example.algorithm === "lru") return fill(narr.lru, { victim: record.victim, last: record.victimLast });
  if (example.algorithm === "clock") return describeClock(record, example);
  return describeClockModified(record, example);
}

function describeHitSuffix(record, example) {
  const narr = UI_TEXT.narr;
  let text = "";
  if (example.algorithm === "fifo") text += narr.hitFifo;
  if (example.algorithm === "optimal") text += narr.hitOptimal;
  if (example.algorithm === "lru") text += narr.hitLru;
  if (isClock(example)) text += narr.hitClock;
  if (record.write) text += narr.hitWrite;
  return text;
}

function capitalizeAfterStop(prefix, body) {
  if (!/\.\s*$/.test(prefix)) return prefix + body;
  return prefix + body.charAt(0).toUpperCase() + body.slice(1);
}

function describeBody(record, example) {
  const narr = UI_TEXT.narr;
  const labels = example.frames;
  if (record.kind === "hit") return fill(narr.hit, { page: record.page, frame: labels[record.frame] }) + describeHitSuffix(record, example);
  if (record.kind === "load") {
    const body = isClock(example)
      ? fill(narr.loadClock, { page: record.page, frame: labels[record.frame], next: labels[record.pointer] })
      : fill(narr.load, { page: record.page, frame: labels[record.frame] });
    return body + (record.write ? fill(narr.loadWrite, { page: record.page }) : "");
  }
  let text = fill(narr.replace, { page: record.page }) + describeReplacement(record, example);
  text += fill(record.written ? narr.written : narr.notWritten, { victim: record.victim });
  if (isClock(example)) return text + fill(record.write ? narr.clockEnterWrite : narr.clockEnter, { page: record.page, next: labels[record.pointer] });
  if (record.write) text += fill(narr.loadWrite, { page: record.page });
  return text;
}

function describeRecord(record, example) {
  const prefix = fill(UI_TEXT.narr.prefix, { n: record.n, page: record.page, write: record.write ? UI_TEXT.narr.writeTag : "" });
  return capitalizeAfterStop(prefix, describeBody(record, example));
}

function simulate(example, problems) {
  const references = example.references.map(function (raw, index) { return normalizeReference(example, raw, problems, index + 1); });
  const states = [initialState(example, problems)];
  const records = [];
  for (let n = 1; n <= references.length; n += 1) {
    const before = states[states.length - 1];
    if (before.terminated) break;
    const result = stepFrames(example, before, references, n, problems);
    records.push(result.record);
    states.push(result.state);
  }
  return { references: references, records: records, states: states };
}

function diskOf(record) {
  if (record.kind === "hit") return 0;
  return record.written ? 2 : 1;
}

function cellText(config, frame) {
  if (frame.page === null) return "-";
  const bits = config.bits || [];
  return String(frame.page) + (bits.indexOf("u") !== -1 ? frame.u : "") + (bits.indexOf("m") !== -1 ? frame.m : "");
}

function verifyDeckTable(example, simulation, problems) {
  const expect = example.expect;
  const config = example.replacement;
  const final = simulation.states[simulation.states.length - 1].counters;
  if (final.faults !== expect.faults) problems.push("da " + final.faults + " page faults y el ejemplo dice " + expect.faults);
  if (final.faults + final.writes !== expect.accesses) problems.push("da " + (final.faults + final.writes) + " accesos a disco y el ejemplo dice " + expect.accesses);
  const disk = simulation.records.map(diskOf);
  if (disk.join(",") !== expect.disk.join(",")) problems.push("los accesos a disco por referencia dan " + disk.join(" ") + " y el ejemplo dice " + expect.disk.join(" "));
  expect.frames.forEach(function (row, slot) {
    const got = simulation.states.slice(1).map(function (state) { return cellText(config, state.frames[slot]); });
    if (got.join(",") !== row.join(",")) problems.push("el marco " + config.frames[slot] + " da " + got.join(" ") + " y el ejemplo dice " + row.join(" "));
  });
}

function boardFor(simulation, config, revealed) {
  return { simulation: simulation, config: config, revealed: revealed };
}

function replacementSteps(example, problems) {
  const config = Object.assign({}, example.replacement);
  const simulation = simulate(config, problems);
  verifyDeckTable(example, simulation, problems);
  const steps = [{ narration: example.intro, views: { board: boardFor(simulation, config, 0), state: boardFor(simulation, config, 0) } }];
  simulation.records.forEach(function (record, index) {
    steps.push({ narration: describeRecord(record, config), views: { board: boardFor(simulation, config, index + 1), state: boardFor(simulation, config, index + 1) } });
  });
  if (example.belady) {
    const belady = example.belady;
    const three = simulate({ algorithm: "fifo", frames: ["1", "2", "3"], references: belady.references }, problems);
    const four = simulate({ algorithm: "fifo", frames: ["1", "2", "3", "4"], references: belady.references }, problems);
    const faultsOf = function (simulation) { return simulation.states[simulation.states.length - 1].counters.faults; };
    if (faultsOf(three) !== belady.expect.three) problems.push("Belady con 3 marcos da " + faultsOf(three) + " page faults, no " + belady.expect.three);
    if (faultsOf(four) !== belady.expect.four) problems.push("Belady con 4 marcos da " + faultsOf(four) + " page faults, no " + belady.expect.four);
    steps.push({ narration: belady.askNarration, ask: belady.ask });
    steps.push({
      stepUnit: belady.stepUnit,
      canvas: { columns: "minmax(0, 1fr) minmax(0, 1fr)", panels: ["beladyThree", "beladyFour"] },
      narration: fill(belady.narration, { tres: faultsOf(three), cuatro: faultsOf(four) }),
      views: {
        beladyThree: boardFor(three, { algorithm: "fifo", frames: ["1", "2", "3"] }, three.records.length),
        beladyFour: boardFor(four, { algorithm: "fifo", frames: ["1", "2", "3", "4"] }, four.records.length)
      }
    });
  }
  return steps;
}

function patchedView(previous, declared) {
  if (!declared || !declared.patch) return declared;
  if (!previous || !previous.tables) return declared;
  const tables = previous.tables.slice();
  tables[0] = Object.assign({}, tables[0], declared.patch);
  return Object.assign({}, previous, { tables: tables });
}

function mergeViews(previous, declared) {
  const merged = Object.assign({}, previous || {});
  Object.keys(declared || {}).forEach(function (key) { merged[key] = patchedView(merged[key], declared[key]); });
  return merged;
}

function snapshotsOf(example, steps) {
  const snapshots = [];
  let address;
  let previous = null;
  let machine = example.machine ? Object.assign({}, example.machine) : null;
  let canvas = example.canvas;
  let stepUnit = example.stepUnit;
  const lists = {};
  ACCUMULATING.forEach(function (id) { lists[id] = []; });
  steps.forEach(function (step, index) {
    if (step.address !== undefined) address = step.address;
    if (step.machine) machine = Object.assign({}, machine, step.machine);
    if (step.canvas) canvas = step.canvas;
    if (step.stepUnit) stepUnit = step.stepUnit;
    let views = mergeViews(previous ? previous.views : null, step.views);
    let context = {};
    let outcome = null;
    if (machine && step.phase) {
      const result = MACHINES[machine.type](Object.assign({}, example, { machine: machine }), address, step.phase, step.probe);
      views = mergeViews(views, result.views);
      context = result.context;
      outcome = result.outcome;
    }
    ACCUMULATING.forEach(function (id) {
      const added = (step[id] || []).map(function (line) { return fill(line, context); });
      lists[id] = lists[id].concat(added);
      views[id] = { lines: lists[id].slice(), fresh: added.length };
    });
    const snapshot = {
      step: step,
      index: index,
      last: index === steps.length - 1,
      canvas: canvas,
      stepUnit: stepUnit,
      stepUnitNote: step.stepUnitNote || (index === 0 ? example.stepUnitNote : null) || null,
      views: views,
      previousViews: previous ? previous.views : {},
      context: context,
      outcome: outcome,
      narration: fill(step.narration, context),
      note: step.note ? fill(step.note, context) : null
    };
    snapshots.push(snapshot);
    previous = snapshot;
  });
  return snapshots;
}

function collectTipKeys(text, into) {
  const pattern = /\[\[(\w+):/g;
  let match = pattern.exec(text);
  while (match) {
    into[match[1]] = true;
    match = pattern.exec(text);
  }
}

function verifyText(where, text, problems) {
  if (unresolved(text)) problems.push("quedó un dato sin completar en " + where);
  if (unbalanced(text)) problems.push("quedó una marca sin cerrar en " + where);
  const keys = {};
  collectTipKeys(text, keys);
  Object.keys(keys).forEach(function (key) {
    if (!TOOLTIPS[key]) problems.push(where + " pide el globito " + key + ", que no existe");
    USED_TIPS[key] = true;
  });
}

function verifyTexts(example, snapshots, problems) {
  snapshots.forEach(function (snapshot, index) {
    verifyText("la narración del paso " + (index + 1), snapshot.narration, problems);
    if (snapshot.note) verifyText("la nota del paso " + (index + 1), snapshot.note, problems);
    if (snapshot.stepUnitNote) verifyText("la nota de unidad del paso " + (index + 1), snapshot.stepUnitNote, problems);
    Object.keys(snapshot.views).forEach(function (id) {
      const view = snapshot.views[id];
      if (view && view.pointer) {
        if (!TOOLTIPS[view.pointer.tip]) problems.push("el panel " + id + " pide el globito " + view.pointer.tip + ", que no existe");
        USED_TIPS[view.pointer.tip] = true;
      }
      if (view && view.lines) {
        view.lines.forEach(function (line) {
          const text = typeof line === "string" ? line : line.text;
          if (text) verifyText("una línea del panel " + id + " en el paso " + (index + 1), text, problems);
        });
      }
    });
  });
  verifyText("la frase de cierre", example.closing, problems);
  if (example.closingExtra) verifyText("la frase de cierre", example.closingExtra, problems);
  if (example.compare) {
    example.compare.rows.reduce(function (all, row) { return all.concat(row); }, example.compare.headers.slice()).forEach(function (text) {
      verifyText("la tabla comparativa", text, problems);
    });
  }
}

function verifyFieldLines(snapshots, problems) {
  snapshots.forEach(function (snapshot, index) {
    ["address", "mmu"].forEach(function (id) {
      const view = snapshot.views[id];
      if (!view) return;
      view.lines.forEach(function (line) {
        if (line.kind || line.value === undefined || line.value === null) return;
        const complete = line.fields.every(function (field) { return typeof field.bits === "number" && typeof field.value === "number"; });
        if (!complete) return;
        let rebuilt = 0;
        line.fields.forEach(function (field) { rebuilt = rebuilt * power(field.bits) + field.value; });
        if (rebuilt !== line.value) problems.push("en el paso " + (index + 1) + ", los campos de la dirección no forman " + line.value);
        line.fields.forEach(function (field) {
          if (field.value >= power(field.bits)) problems.push("en el paso " + (index + 1) + ", un campo no entra en sus bits");
        });
      });
    });
  });
}

function verifyTables(snapshots, problems) {
  snapshots.forEach(function (snapshot, index) {
    Object.keys(snapshot.views).forEach(function (id) {
      const view = snapshot.views[id];
      if (!view || !view.tables) return;
      view.tables.forEach(function (block) {
        block.rows.forEach(function (row) {
          if (row.length !== block.columns.length) problems.push("en el paso " + (index + 1) + ", una fila del panel " + id + " no tiene tantas celdas como columnas");
        });
        (block.marks || []).forEach(function (mark) {
          const touching = (block.marks || []).some(function (other) { return other[0] === mark[0] && Math.abs(other[1] - mark[1]) === 1; });
          if (touching) problems.push("en el paso " + (index + 1) + ", dos celdas marcadas del panel " + id + " se tocan: marcá la fila entera");
        });
      });
    });
  });
}

function verifyMachine(snapshots, problems) {
  snapshots.forEach(function (snapshot, index) {
    const step = snapshot.step;
    if (step.expect === undefined) return;
    if (snapshot.outcome !== step.expect) problems.push("el paso " + (index + 1) + " espera " + step.expect + " y la cuenta da " + snapshot.outcome);
  });
}

function verifyHier(example, problems) {
  const check = example.hierCheck;
  if (!check) return;
  const offsetBits = check.bits[2];
  const innerBits = check.bits[1];
  if (slice(check.address, innerBits + offsetBits, check.bits[0]) !== check.outer) problems.push("la dirección no cae en la fila " + check.outer + " de la externa");
  if (slice(check.address, offsetBits, innerBits) !== check.inner) problems.push("la dirección no cae en la fila " + check.inner + " de la interna");
  if (check.frame * power(offsetBits) + check.address % power(offsetBits) !== check.physical) problems.push("la física de la jerárquica no da " + check.physical);
}

function verifyAsks(example, steps, problems) {
  steps.forEach(function (step, index) {
    if (!step.ask) return;
    const ids = step.ask.options.map(function (option) { return option.id; });
    if (ids.indexOf(step.ask.correct) === -1) problems.push("la pregunta del paso " + (index + 1) + " no tiene entre las opciones a la correcta");
    if (new Set(ids).size !== ids.length) problems.push("la pregunta del paso " + (index + 1) + " repite una opción");
    if (step.ask.options.length < 2) problems.push("la pregunta del paso " + (index + 1) + " tiene menos de dos opciones");
    step.ask.options.forEach(function (option) {
      if (!option.why) problems.push("una opción del paso " + (index + 1) + " no explica por qué");
      verifyText("una opción del paso " + (index + 1), option.text + " " + option.why, problems);
    });
    verifyText("la pregunta del paso " + (index + 1), step.ask.question, problems);
    if (index === steps.length - 1) problems.push("el último paso tiene una pregunta, y ahí va la frase de cierre");
  });
}

function canvasPanels(canvas) {
  const flat = [];
  canvas.panels.forEach(function (entry) {
    if (Array.isArray(entry)) entry.forEach(function (id) { flat.push(id); });
    else flat.push(entry);
  });
  return flat;
}

function verifyStructure(example, steps, snapshots, problems) {
  if (!example.closing) problems.push("no tiene frase de cierre");
  if (!example.stepUnit) problems.push("no declara la unidad del paso");
  if (steps.length === 0) problems.push("no tiene pasos");
  snapshots.forEach(function (snapshot, index) {
    if (!snapshot.step.narration) problems.push("el paso " + (index + 1) + " no tiene narración");
    canvasPanels(snapshot.canvas).forEach(function (id) {
      if (!UI_TEXT.panels[id]) problems.push("usa el panel " + id + ", que no tiene nombre");
      if (!PANEL_TIPS[id]) problems.push("usa el panel " + id + ", que no tiene globito");
      if (!snapshot.views[id]) problems.push("en el paso " + (index + 1) + " el panel " + id + " no tiene nada que mostrar");
    });
    if (index > 0 && JSON.stringify(snapshot.canvas) !== JSON.stringify(snapshots[index - 1].canvas)) {
      const before = canvasPanels(snapshots[index - 1].canvas);
      const gone = before.filter(function (id) { return canvasPanels(snapshot.canvas).indexOf(id) === -1; });
      if (gone.length > 0 && !snapshot.stepUnitNote && !/salen? de la pantalla/.test(snapshot.narration) && snapshot.step.stepUnit === undefined) problems.push("en el paso " + (index + 1) + " sale un panel y la narración no lo dice");
    }
  });
}

function holesOf(size, used) {
  const holes = [];
  let cursor = 0;
  used.slice().sort(function (one, other) { return one[0] - other[0]; }).forEach(function (pair) {
    if (pair[0] > cursor) holes.push([cursor, pair[0] - cursor]);
    cursor = Math.max(cursor, pair[0] + pair[1]);
  });
  if (cursor < size) holes.push([cursor, size - cursor]);
  return holes;
}

function partitionHoles(size, placed) {
  return holesOf(size, Object.keys(placed).map(function (name) { return [placed[name].start, placed[name].size]; }));
}

function fitOf(holes, size, pointer, criterion) {
  const fitting = holes.filter(function (hole) { return hole[1] >= size; });
  if (fitting.length === 0) return null;
  if (criterion === "first") return fitting[0][0];
  if (criterion === "next") {
    const after = fitting.filter(function (hole) { return hole[0] + hole[1] > pointer; });
    return (after.length > 0 ? after[0] : fitting[0])[0];
  }
  const sorted = fitting.slice().sort(function (one, other) { return criterion === "best" ? one[1] - other[1] : other[1] - one[1]; });
  return sorted[0][0];
}

function verifyDynamicPartitions(fact, problems) {
  const placed = {};
  let pointer = 0;
  fact.events.forEach(function (event) {
    if (event.arrive) {
      const start = fitOf(partitionHoles(fact.size, placed), event.size, pointer, "first");
      if (start === null) {
        if (!event.expectRefused) problems.push(event.arrive + " no entra y el ejemplo dice que sí");
        return;
      }
      if (event.expectRefused) { problems.push(event.arrive + " entra y el ejemplo dice que no"); return; }
      placed[event.arrive] = { start: start, size: event.size };
      pointer = start + event.size;
      return;
    }
    if (event.leave) { delete placed[event.leave]; return; }
    if (event.compact) {
      let cursor = 0;
      Object.keys(placed).sort(function (one, other) { return placed[one].start - placed[other].start; }).forEach(function (name) {
        placed[name].start = cursor;
        cursor += placed[name].size;
      });
      return;
    }
    const holes = partitionHoles(fact.size, placed);
    const where = "en «" + event.check + "»";
    if (JSON.stringify(holes) !== JSON.stringify(event.holes)) problems.push(where + " los huecos dan " + JSON.stringify(holes));
    const free = holes.reduce(function (sum, hole) { return sum + hole[1]; }, 0);
    if (event.free !== undefined && free !== event.free) problems.push(where + " quedan " + free + " KiB libres, no " + event.free);
    if (event.pointer !== undefined && pointer !== event.pointer) problems.push(where + " el puntero queda en " + pointer);
    Object.keys(event.placed || {}).forEach(function (name) {
      if (!placed[name] || placed[name].start !== event.placed[name]) problems.push(where + " " + name + " no queda en " + event.placed[name]);
    });
    if (event.fits) {
      ["first", "next", "best", "worst"].forEach(function (criterion) {
        const start = fitOf(holes, event.fits.size, pointer, criterion);
        if (start !== event.fits[criterion]) problems.push(where + " el criterio " + criterion + " elige " + start + ", no " + event.fits[criterion]);
      });
    }
  });
}

function thrashStates(fact) {
  const frames = [];
  const states = [];
  for (let attempt = 0; attempt < fact.expect.length; attempt += 1) {
    const missing = fact.needs.find(function (page) { return frames.indexOf(page) === -1; });
    if (missing === undefined) break;
    if (frames.length === fact.frames) frames.shift();
    frames.push(missing);
    states.push(frames.slice());
  }
  return states;
}

function workingSet(refs, after, size) {
  const set = [];
  refs.slice(after - size, after).forEach(function (page) { if (set.indexOf(page) === -1) set.push(page); });
  return set;
}

function sameSet(one, other) {
  return JSON.stringify(one.slice().sort(function (a, b) { return a - b; })) === JSON.stringify(other.slice().sort(function (a, b) { return a - b; }));
}

function verifyFact(fact, problems) {
  if (fact.kind === "relocation") {
    const result = fact.dl < fact.limit ? fact.base + fact.dl : "segfault";
    if (result !== fact.expect) problems.push("con base " + fact.base + " y límite " + fact.limit + ", la " + fact.dl + " da " + result + ", no " + fact.expect);
    return;
  }
  if (fact.kind === "fixedPartitions") {
    const waste = fact.arrivals.slice(0, fact.count).reduce(function (sum, size) { return sum + fact.partition - size; }, 0);
    if (waste !== fact.expectWaste) problems.push("la fragmentación interna da " + waste + ", no " + fact.expectWaste);
    return;
  }
  if (fact.kind === "dynamicPartitions") { verifyDynamicPartitions(fact, problems); return; }
  if (fact.kind === "eat") {
    const time = fact.hit * (fact.tlb + fact.memory) + (1 - fact.hit) * (fact.tlb + 2 * fact.memory);
    if (Math.abs(time - fact.expect) > 1e-9) problems.push("el tiempo promedio da " + time + ", no " + fact.expect);
    return;
  }
  if (fact.kind === "equals") {
    if (fact.value !== fact.expect) problems.push(fact.what + " da " + fact.value + ", no " + fact.expect);
    return;
  }
  if (fact.kind === "holes") {
    const holes = holesOf(fact.size, fact.used).map(function (hole) { return hole[1]; });
    const free = holes.reduce(function (sum, size) { return sum + size; }, 0);
    if (holes.join(",") !== fact.expectHoles.join(",")) problems.push("los huecos dan " + holes.join(", "));
    if (free !== fact.expectFree) problems.push("quedan " + free + " libres, no " + fact.expectFree);
    if (holes.some(function (size) { return size >= fact.request; }) !== fact.expectFits) problems.push("el pedido de " + fact.request + " no da lo que dice el ejemplo");
    return;
  }
  if (fact.kind === "thrash") {
    const states = thrashStates(fact);
    if (JSON.stringify(states) !== JSON.stringify(fact.expect)) problems.push("los intentos dan " + JSON.stringify(states));
    return;
  }
  if (fact.kind === "workingSet") {
    let total = 0;
    fact.refs.forEach(function (process, position) {
      const set = workingSet(process.refs, fact.after, fact.window);
      total += set.length;
      if (!sameSet(set, fact.expect[position])) problems.push("el conjunto de trabajo de " + process.name + " en " + fact.after + " da " + set.join(", "));
    });
    if (total !== fact.total) problems.push("los conjuntos de trabajo en " + fact.after + " suman " + total + ", no " + fact.total);
    return;
  }
  problems.push("hay un hecho de tipo " + fact.kind + ", que el recurso no sabe comprobar");
}

function buildVariant(example, label) {
  const problems = [];
  const steps = (example.replacement ? replacementSteps(example, problems) : example.steps).map(function (step) {
    if (!step.variantNarration) return step;
    if (!step.variantNarration[label]) problems.push("un paso no tiene narración para la variante " + label);
    return Object.assign({}, step, { narration: step.variantNarration[label] });
  });
  const snapshots = snapshotsOf(example, steps);
  verifyStructure(example, steps, snapshots, problems);
  verifyTexts(example, snapshots, problems);
  verifyFieldLines(snapshots, problems);
  verifyTables(snapshots, problems);
  verifyMachine(snapshots, problems);
  verifyAsks(example, steps, problems);
  verifyHier(example, problems);
  (example.facts || []).forEach(function (fact) { verifyFact(fact, problems); });
  if (example.intro) verifyText("la presentación", example.intro, problems);
  return { label: label, example: example, snapshots: snapshots, problems: problems.map(function (problem) { return label ? label + ": " + problem : problem; }) };
}

function buildExample(example) {
  if (!example.variants) {
    const built = buildVariant(example, null);
    return { example: example, variants: [built], problems: built.problems.slice() };
  }
  const built = example.variants.map(function (variant) {
    const merged = Object.assign({}, example, variant);
    delete merged.variants;
    return buildVariant(merged, variant.variantLabel);
  });
  const problems = [];
  built.forEach(function (one) { one.problems.forEach(function (problem) { problems.push(problem); }); });
  if (example.variants.length < 2) problems.push("declara variantes y tiene menos de dos");
  const labels = example.variants.map(function (variant) { return variant.variantLabel; });
  if (labels.some(function (text) { return !text; })) problems.push("hay una variante sin nombre");
  if (new Set(labels).size !== labels.length) problems.push("hay dos variantes con el mismo nombre");
  return { example: example, variants: built, problems: problems };
}

const BUILT_EXAMPLES = EXAMPLES.map(buildExample);

(function verifyGroupsAreContiguous() {
  const seen = [];
  EXAMPLES.forEach(function (example) {
    if (seen[seen.length - 1] === example.group) return;
    if (seen.indexOf(example.group) !== -1) console.error("El grupo " + example.group + " aparece cortado en dos tramos de la escalera");
    seen.push(example.group);
  });
  EXAMPLES.forEach(function (example, index) {
    if (!UI_TEXT.groups[example.group]) console.error("El grupo " + example.group + " no tiene nombre");
    if (example.number !== index + 1) console.error("El ejemplo en la posición " + (index + 1) + " dice ser el " + example.number);
  });
})();

BUILT_EXAMPLES.forEach(function (built) {
  built.problems.forEach(function (problem) {
    console.error("Ejemplo " + built.example.number + ": " + problem);
  });
});

Object.keys(TOOLTIPS).forEach(function (key) {
  if (!USED_TIPS[key]) console.error("El globito " + key + " está escrito y ninguna narración lo invoca");
});

const panelRefs = {};

const view = { exampleIndex: 0, variantIndex: 0, stepIndex: 0, playing: false, timer: null, answers: readStore() };

function readStore() {
  try {
    const raw = window.localStorage.getItem(STORE_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
  } catch (error) {
    return {};
  }
}

function writeStore() {
  try {
    window.localStorage.setItem(STORE_KEY, JSON.stringify(view.answers));
  } catch (error) {
    return;
  }
}

function currentEntry() { return BUILT_EXAMPLES[view.exampleIndex]; }

function currentVariants() { return currentEntry().variants; }

function currentBuilt() { return currentVariants()[view.variantIndex]; }

function currentExample() { return currentBuilt().example; }

function totalSteps() { return currentBuilt().snapshots.length; }

function currentSnapshot() { return currentBuilt().snapshots[view.stepIndex]; }

function answerKey() { return currentEntry().example.number + ":" + view.variantIndex + ":" + view.stepIndex; }

function currentAnswer() {
  const ask = currentSnapshot().step.ask;
  const stored = view.answers[answerKey()];
  if (!ask || typeof stored !== "string") return null;
  return ask.options.some(function (option) { return option.id === stored; }) ? stored : null;
}

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function renderRich(target, text) {
  target.textContent = "";
  const pattern = /\[\[(\w+):([^\]]+)\]\]|\*([^*]+)\*/g;
  let cursor = 0;
  let match = pattern.exec(text);
  while (match) {
    if (match.index > cursor) target.appendChild(document.createTextNode(text.slice(cursor, match.index)));
    if (match[1]) {
      const button = element("button", "tip", match[2]);
      button.type = "button";
      button.dataset.tip = match[1];
      target.appendChild(button);
    } else {
      target.appendChild(element("strong", null, match[3]));
    }
    cursor = match.index + match[0].length;
    match = pattern.exec(text);
  }
  if (cursor < text.length) target.appendChild(document.createTextNode(text.slice(cursor)));
  return target;
}

function buildPanel(id) {
  const refs = { body: element("div", "panel-body") };
  const section = element("section", "panel " + id);
  const heading = element("h2");
  const title = element("button", "tip", UI_TEXT.panels[id]);
  title.type = "button";
  title.dataset.tip = "panel:" + id;
  heading.appendChild(title);
  section.appendChild(heading);
  section.appendChild(refs.body);
  refs.section = section;
  return refs;
}

function buildCanvas() {
  const snapshot = currentSnapshot();
  const canvas = snapshot.canvas;
  const key = currentExample().number + "|" + view.variantIndex + "|" + JSON.stringify(canvas);
  if (key === canvasKey) return;
  canvasKey = key;
  Object.keys(panelRefs).forEach(function (id) { delete panelRefs[id]; });
  const fresh = element("main");
  fresh.id = "main";
  fresh.style.gridTemplateColumns = canvas.columns;
  canvas.panels.forEach(function (entry) {
    if (Array.isArray(entry)) {
      const stack = element("div", "stack");
      stack.style.gridTemplateRows = canvas.stackRows || "auto minmax(0, 1fr)";
      entry.forEach(function (id) {
        const refs = buildPanel(id);
        panelRefs[id] = refs;
        stack.appendChild(refs.section);
      });
      fresh.appendChild(stack);
      return;
    }
    const refs = buildPanel(entry);
    panelRefs[entry] = refs;
    fresh.appendChild(refs.section);
  });
  dom.main.replaceWith(fresh);
  dom.main = fresh;
}

function renderExampleList() {
  dom.exampleList.textContent = "";
  let lastGroup = null;
  let section = null;
  BUILT_EXAMPLES.forEach(function (built, index) {
    if (built.example.group !== lastGroup) {
      section = element("span", "group");
      section.appendChild(element("span", "group-cap", UI_TEXT.groups[built.example.group]));
      dom.exampleList.appendChild(section);
      lastGroup = built.example.group;

    const button = element("button");
    button.type = "button";
    button.appendChild(element("span", "num", built.example.number));
    button.title = built.example.short + " · " + built.example.adds;
    button.setAttribute("aria-label", built.example.number + ". " + built.example.title);
    button.setAttribute("aria-current", index === view.exampleIndex ? "true" : "false");
    button.addEventListener("click", function () { selectExample(index); });
    section.appendChild(button);
  });
}

function renderHeaderChoices() {
  const variants = currentVariants();
  dom.choiceBar.textContent = "";
  dom.choiceRow.classList.toggle("empty", variants.length < 2);
  if (variants.length < 2) return;
  dom.choiceLabel.textContent = UI_TEXT.variantLabel;
  variants.forEach(function (built, index) {
    const button = element("button", null, built.label);
    button.type = "button";
    button.setAttribute("aria-pressed", index === view.variantIndex ? "true" : "false");
    button.addEventListener("click", function () { selectVariant(index); });
    dom.choiceBar.appendChild(button);
  });
}

function bitWidth(totalBits) {
  if (totalBits <= 13) return "19px";
  if (totalBits <= 16) return "17px";
  if (totalBits <= 20) return "15px";
  return "12px";
}

function fieldText(field, line) {
  if (field.value === null || field.value === undefined) return null;
  if (typeof field.value === "string") return field.value;
  const digits = line.hex && field.bits >= 4 ? Math.ceil(field.bits / 4) : null;
  return formatNumber(field.value, digits);
}

function fieldSignature(field, line) {
  return [field.role, field.bits, field.label, fieldText(field, line)].join("|");
}

function renderField(field, line, fresh) {
  const known = field.value !== null && field.value !== undefined;
  const box = element("div", "field role-" + field.role + (known ? "" : " unknown") + (fresh ? " fresh" : ""));
  if (typeof field.bits === "number") {
    const cells = element("div", "cells");
    const digits = known && typeof field.value === "number" ? binary(field.value, field.bits) : null;
    for (let bit = 0; bit < field.bits; bit += 1) {
      const fromRight = field.bits - bit;
      const cell = element("span", "bit", digits ? digits[bit] : "");
      if (line.hex && bit > 0 && fromRight % 4 === 0) cell.classList.add("nibble");
      cells.appendChild(cell);
    }
    box.appendChild(cells);
  } else {
    box.appendChild(element("span", "valuebox", known ? fieldText(field, line) : UI_TEXT.unknownValue));
  }
  const meta = element("span", "meta");
  meta.appendChild(element("span", null, field.label || UI_TEXT.roles[field.role] || ""));
  if (typeof field.bits === "number" && field.bits > 1) meta.appendChild(element("span", "sub", fill(UI_TEXT.bitsCount, { n: field.bits })));
  else if (field.bits === 1) meta.appendChild(element("span", "sub", UI_TEXT.oneBit));
  else if (field.bits === undefined && field.role !== "flag") meta.appendChild(element("span", "sub", UI_TEXT.unknownBits));
  if (known && typeof field.bits === "number" && field.bits > 1) meta.appendChild(element("span", "sub", fill(UI_TEXT.valueIs, { value: fieldText(field, line) })));
  box.appendChild(meta);
  return box;
}

function renderBits(snapshot, id) {
  const body = panelRefs[id].body;
  body.textContent = "";
  const data = snapshot.views[id];
  const before = snapshot.previousViews[id];
  if (data.lines.length === 0) {
    body.appendChild(element("p", "empty-list", UI_TEXT.emptyLists.address));
    return;
  }
  const wrap = element("div", "bitlines");
  data.lines.forEach(function (line, lineIndex) {
    const previousLine = before && before.lines ? before.lines[lineIndex] : null;
    if (line.kind === "equation") {
      const changed = !previousLine || previousLine.text !== line.text;
      const row = element("div", "equation " + (line.status || "") + (changed && snapshot.index > 0 ? " fresh" : ""));
      if (line.status) row.appendChild(element("span", "mark", line.status === "ok" ? UI_TEXT.marks.ok : UI_TEXT.marks.fail));
      renderRich(row.appendChild(element("span")), line.text);
      wrap.appendChild(row);
      return;
    }
    if (line.kind === "verdict") {
      const row = element("div", "verdict-line");
      row.appendChild(element("span", "mark", UI_TEXT.marks.fail));
      row.appendChild(element("span", null, line.text));
      const holder = element("div");
      holder.appendChild(row);
      wrap.appendChild(holder);
      return;
    }
    const row = element("div", "bitline");
    row.appendChild(element("span", "caption", UI_TEXT.captions[line.caption] || line.caption));
    const track = element("div", "track");
    const totalBits = line.fields.reduce(function (sum, field) { return sum + (typeof field.bits === "number" ? field.bits : 0); }, 0);
    const scroll = element("div", "fields-scroll");
    const fields = element("div", "fields");
    fields.style.setProperty("--bit-w", bitWidth(totalBits));
    line.fields.forEach(function (field, fieldIndex) {
      const previousField = previousLine && previousLine.fields ? previousLine.fields[fieldIndex] : null;
      const known = field.value !== null && field.value !== undefined;
      const changed = snapshot.index > 0 && known && (!previousField || fieldSignature(previousField, previousLine) !== fieldSignature(field, line));
      fields.appendChild(renderField(field, line, changed));
    });
    scroll.appendChild(fields);
    track.appendChild(scroll);
    if (line.value !== undefined && (line.value !== null || line.pending)) {
      const total = element("div", "total");
      const text = line.value === null ? UI_TEXT.pendingTotal : fill(UI_TEXT.valueIs, { value: formatNumber(line.value, line.hex) });
      const changed = snapshot.index > 0 && (!previousLine || previousLine.value !== line.value) && line.value !== null;
      if (changed) total.classList.add("fresh");
      total.appendChild(element("span", "equals" + (line.value === null ? " pending" : ""), text));
      total.appendChild(element("span", "sub", UI_TEXT.totalSub));
      track.appendChild(total);
    }
    row.appendChild(track);
    wrap.appendChild(row);
  });
  body.appendChild(wrap);
}

function renderList(snapshot, id) {
  const body = panelRefs[id].body;

function pointerChip(pointer) {
  const chip = element("button", "pointer-chip tip", fill(UI_TEXT.pointerChip, { name: pointer.name }));
  chip.type = "button";
  chip.dataset.tip = pointer.tip;
  return chip;
}

function renderTables(snapshot, id) {
  const body = panelRefs[id].body;
  body.textContent = "";
  const data = snapshot.views[id];

  const group = element("div", "table-group");
  data.tables.forEach(function (block) {
    const holder = element("div", "table-block" + (block.active ? " active" : "") + (block.wrap ? " wide" : ""));
    if (block.caption) holder.appendChild(element("h3", null, block.caption));
    const scroll = element("div", "table-scroll");
    const table = element("table", "grid-table" + (block.wrap ? " wrap" : ""));
    const head = element("tr");
    block.columns.forEach(function (key, column) {
      const role = block.roles && block.roles[column];
      head.appendChild(element("th", role ? "role-" + role : null, UI_TEXT.columns[key] === undefined ? key : UI_TEXT.columns[key]));
    });
    table.appendChild(head);
    block.rows.forEach(function (cells, rowIndex) {
      const row = element("tr");
      if ((block.highlight || []).indexOf(rowIndex) !== -1) row.classList.add("focus");
      if ((block.faultRows || []).indexOf(rowIndex) !== -1) row.classList.add("fault");
      if ((block.visited || []).indexOf(rowIndex) !== -1) row.classList.add("visited");
      if ((block.gapRows || []).indexOf(rowIndex) !== -1) row.classList.add("gap");

        row.appendChild(cell);
      });
      table.appendChild(row);
    });
    scroll.appendChild(table);
    holder.appendChild(scroll);
    if (block.note) renderRich(holder.appendChild(element("p", "table-note")), block.note);
    group.appendChild(holder);
  });
