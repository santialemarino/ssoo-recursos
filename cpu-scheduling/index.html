<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23b45309%22%2F%3E%3Crect%20x%3D%229.5%22%20y%3D%229.5%22%20width%3D%2213%22%20height%3D%2213%22%20rx%3D%222.5%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.4%22%2F%3E%3Cg%20stroke%3D%22%23fff%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M13%209.5V5M19%209.5V5M13%2027v-4.5M19%2027v-4.5M9.5%2013H5M9.5%2019H5M27%2013h-4.5M27%2019h-4.5%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<title>Planificación de procesos</title>
<style>
  :root {
    --ink: #10151d;
    --ink-soft: #35404f;
    --muted: #5f6877;
    --faint: #6b7484;
    --line: #e3e7ee;
    --line-strong: #c6ccd8;
    --page: #edf0f6;
    --card: #ffffff;

    --running: #1d4ed8;
    --running-soft: #e8eefc;
    --blocked: #c0392f;
    --blocked-soft: #fbeae8;
    --ready: #1a7a3f;
    --ready-soft: #e6f4ec;
    --term: #5b6472;
    --term-soft: #eef0f4;
    --rsusp: #8a6a00;
    --rsusp-soft: #fcf3ce;
    --bsusp: #a04d05;
    --bsusp-soft: #fce0cc;

    --marked: #1c2534;
    --marked-soft: #e3e8f1;
    --region-fill: #fbfcfe;
    --region-fill-alt: #f2f5f9;

    --radius: 11px;
    --shadow: 0 1px 2px rgba(16, 21, 29, 0.05), 0 1px 8px rgba(16, 21, 29, 0.04);
    --fast: 160ms;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html, body { margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    color: var(--ink);
    background: var(--page);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 9px 14px 11px;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { margin: 0; font-weight: 640; }

  button {
    font: inherit;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    cursor: pointer;
    transition: background-color var(--fast) ease-out, border-color var(--fast) ease-out, color var(--fast) ease-out, transform var(--fast) ease-out;
  }

  button:hover:not([disabled]):not(.gantt-cell) { border-color: var(--faint); }
  button:active:not([disabled]):not(.gantt-cell) { transform: translateY(1px); }

  button:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid var(--marked);
    outline-offset: 2px;
  }

  button[disabled] { opacity: 0.4; cursor: not-allowed; }

  header { display: flex; flex-direction: column; gap: 7px; flex: 0 0 auto; }

  .head-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  header > h1 { font-size: 16px; letter-spacing: -0.012em; color: var(--ink-soft); }

  .head-row .spacer { flex: 1; }

  .examples { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }

  .group-cap {
    font-size: 10.5px;
    font-weight: 750;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 0 4px 0 8px;
  }

  .examples > .group-cap:first-child { padding-left: 0; }

  .examples button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    font-size: 12.5px;
    line-height: 1.2;
    min-width: 28px;
    justify-content: center;
  }

  .examples button .short { display: none; font-weight: 650; }
  .examples button[aria-current="true"] .short { display: inline; }
  .examples button[aria-current="true"] { background: var(--running); border-color: var(--running); color: #fff; }

  .toggle-label { font-size: 12.5px; color: var(--muted); }

  .switch { display: flex; gap: 5px; flex-wrap: wrap; }
  .switch button { padding: 4px 12px; font-size: 12.5px; font-weight: 620; }
  .tool-row .switch button { padding: 1px 8px; font-size: 11.5px; display: inline-flex; align-items: center; gap: 5px; }
  .switch button[aria-pressed="true"] { background: var(--marked); border-color: var(--marked); color: #fff; }

  main {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(236px, 0.58fr) minmax(0, 1.2fr) minmax(0, 0.94fr);
    grid-template-rows: minmax(0, auto) minmax(0, 1fr);
    grid-template-areas:
      "statement chart chart"
      "statement state decision";
    gap: 9px;
  }

  main.solo {
    grid-template-areas:
      "statement chart chart"
      "statement state state";
  }

  main.quiz {
    grid-template-columns: minmax(224px, 0.5fr) minmax(0, 1.3fr) minmax(0, 1fr);
    grid-template-areas:
      "statement chart chart"
      "state     state decision";
  }

  main.quiz.answered {
    grid-template-areas:
      "statement chart chart"
      "state     state state";
  }

  main.quiz.answered .elim { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 430px), 1fr)); align-content: start; gap: 10px; }
  main.quiz.answered .elim-note { grid-column: 1 / -1; }

  .panel.statement { grid-area: statement; }
  .panel.gantt { grid-area: chart; }
  .panel.state { grid-area: state; }
  .panel.decision { grid-area: decision; }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }

  .panel > h2 {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-wrap: wrap;
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--faint);
    padding: 9px 14px 8px;
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }

  .panel > h2::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--line-strong);
    flex: 0 0 auto;
  }

  .panel.statement > h2::before { background: var(--muted); }
  .panel.gantt > h2::before { background: var(--running); }
  .panel.state > h2::before { background: var(--ready); }
  .panel.decision > h2::before { background: var(--marked); }

  .tip {
    font: inherit;
    background: none;
    border: 0;
    padding: 0;
    color: inherit;
    border-bottom: 1px dotted var(--running);
    cursor: help;
    border-radius: 0;
  }

  .tip:hover { border-bottom-style: solid; }

  .panel-when {
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0;
    text-transform: none;
    color: var(--muted);
  }

  .panel-body { padding: 8px 14px 8px; overflow: auto; min-height: 0; flex: 1 1 auto; }

  .statement-scroll { overflow-x: auto; }
  .statement-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .statement-table th, .statement-table td { padding: 5px 7px; text-align: center; border-bottom: 1px solid var(--line); }
  .statement-table.dense th, .statement-table.dense td { padding: 3px 6px; }
  .statement-table.wide th, .statement-table.wide td { padding-left: 4px; padding-right: 4px; }
  .statement-table th { font-size: 10.5px; font-weight: 700; color: var(--ink-soft); letter-spacing: 0.03em; }
  .statement-table td:first-child, .statement-table th:first-child { text-align: left; font-weight: 700; }
  .statement-table tbody tr:last-child td { border-bottom: none; }
  .statement-table .burst-io { color: var(--blocked); }
  .statement-table .burst-cpu { color: var(--running); }
  .statement-table .spent { text-decoration: line-through; color: var(--muted); }

  .params { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }

  .param {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    padding: 4px 10px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--region-fill-alt);
    font-size: 11.5px;
    line-height: 1.35;
    color: var(--ink-soft);
  }

  .param b { font-weight: 750; }

  .legend { display: flex; flex-wrap: wrap; align-items: center; gap: 7px 12px; padding-top: 7px; border-top: 1px solid var(--line); flex: 0 0 auto; }
  .legend-item { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ink-soft); }
  .legend-item b { font-weight: 750; }
  .legend-item .eq { color: var(--muted); }
  .legend-swatch { width: 16px; height: 14px; border-radius: 3px; border: 1px solid var(--line-strong); flex: 0 0 auto; }

  .gantt-body { display: flex; flex-direction: column; gap: 6px; padding-top: 3px; }

  .tool-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-left: auto;
    text-transform: none;
    letter-spacing: 0;
  }

  .switch button.tool-cpu { color: var(--running); border-color: var(--running); background: var(--running-soft); }
  .switch button.tool-device { color: var(--blocked); border-color: var(--blocked); background: var(--blocked-soft); }
  .switch button.tool-memory { color: var(--ink-soft); border-color: var(--line-strong); background: var(--region-fill-alt); }
  .switch button[aria-pressed="true"].tool-cpu { background: var(--running); border-color: var(--running); color: #fff; }
  .switch button[aria-pressed="true"].tool-device { background: var(--blocked); border-color: var(--blocked); color: #fff; }
  .switch button[aria-pressed="true"].tool-memory { background: var(--marked); border-color: var(--marked); color: #fff; }
  .switch button .swatch { width: 12px; height: 10px; border-radius: 3px; border: 1px solid currentColor; background: currentColor; flex: 0 0 auto; }
  .switch button .key { font-size: 10px; font-weight: 700; opacity: 0.65; }
  .grid-scroll { overflow-x: auto; overflow-y: hidden; padding-top: 6px; padding-bottom: 2px; display: flex; flex-direction: column; justify-content: safe center; flex: 1 1 auto; min-height: 0; }

  .gantt-grid { display: grid; gap: 7px; padding: 3px; width: max-content; min-width: 100%; }

  .gantt-label {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    padding-right: 9px;
    font-size: 13px;
    font-weight: 750;
    color: var(--ink);
    white-space: nowrap;
  }

  .gantt-label .owner { font-size: 10.5px; font-weight: 650; color: var(--muted); }

  .gantt-cell {
    position: relative;
    height: 30px;
    border: 1px solid var(--line);
    border-radius: 5px;
    background: var(--region-fill);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10.5px;
    font-weight: 750;
    letter-spacing: 0.02em;
    color: var(--faint);
    transition: background-color var(--fast) ease-out, border-color var(--fast) ease-out;
  }

  .gantt-grid.painting .gantt-cell {
    appearance: none;
    -webkit-appearance: none;
    padding: 0;
    font: inherit;
    font-size: 10.5px;
    font-weight: 750;
    letter-spacing: 0.02em;
    cursor: default;
  }

  .gantt-cell.blank { color: transparent; }
  .s-running { background: var(--running-soft); border-color: var(--running); color: var(--running); }
  .s-blocked { background: var(--blocked-soft); border-color: var(--blocked); color: var(--blocked); }
  .s-ready { background: var(--ready-soft); border-color: var(--ready); color: var(--ready); }
  .s-term { background: var(--term-soft); border-color: var(--term); color: var(--term); }
  .s-rsusp { background: var(--rsusp-soft); border-color: var(--rsusp); color: var(--rsusp); }
  .s-bsusp { background: var(--bsusp-soft); border-color: var(--bsusp); color: var(--bsusp); }
  .gantt-cell.future { background: var(--card); border-style: dashed; border-color: var(--line); }
  .gantt-cell.now { box-shadow: 0 0 0 2px var(--marked); }
  .gantt-cell.blank.paintable { background: var(--region-fill); border-color: var(--line-strong); }
  .gantt-grid.painting .gantt-cell.blank:not(.paintable) { border-style: dashed; }
  .gantt-cell.blank.waiting { border-style: dashed; border-color: var(--blocked); color: var(--blocked); }
  .gantt-cell.ghost { opacity: 0.42; border-style: dashed; border-width: 2px; }
  .gantt-cell.stroke { opacity: 0.72; border-style: dashed; border-width: 2px; }
  .gantt-cell.blank.ghost, .gantt-cell.blank.stroke { opacity: 1; border-color: var(--ink-soft); }
  .gantt-cell.shown { border-color: var(--marked); border-style: dashed; border-width: 2px; }

  .gantt-cell.wrong {
    color: var(--muted);
    text-decoration: line-through;
    border-color: var(--line-strong);
    background: repeating-linear-gradient(-45deg, var(--card), var(--card) 5px, var(--region-fill-alt) 5px, var(--region-fill-alt) 10px);
  }

  .gantt-cell .flag {
    position: absolute;
    top: -7px;
    right: -4px;
    font-size: 9px;
    line-height: 1.3;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 1px 5px;
    border-radius: 999px;
    background: var(--marked);
    color: #fff;
    text-decoration: none;
    pointer-events: none;
  }

  .gantt-grid.painting { touch-action: none; }
  .gantt-grid.painting .gantt-cell.paintable { cursor: crosshair; }
  .gantt-grid.dense .gantt-cell { height: 20px; }
  main.quiz .gantt-grid { gap: 4px; }
  main.quiz .gantt-cell { height: 23px; }

  .gantt-axis {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 650;
    color: var(--ink-soft);
    padding-top: 2px;
  }

  .gantt-axis.origin { justify-content: flex-end; padding-right: 9px; color: var(--muted); }
  .gantt-axis.now { color: var(--marked); font-weight: 800; }

  .state-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 18px; align-content: start; }

  .queue-rows { display: flex; flex-direction: column; gap: 4px; }
  .queue-row { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 8px; }

  .queue-row .lvl {
    flex: 0 0 auto;
    min-width: 52px;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
  }

  .queue-row .flag { font-size: 11px; font-weight: 700; color: var(--bsusp); }

  .state-block { min-width: 0; }
  .state-block.tuck { grid-column: 2; grid-row: 2; }
  .state-block.span { grid-row: 1 / 3; }

  .block-head {
    display: flex;
    align-items: baseline;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 6px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--line);
  }

  .block-head .what {
    font-size: 10.5px;
    font-weight: 750;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .block-head .gloss { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: none; letter-spacing: 0; }
  .block-head .flag, .queue-row .flag { font-size: 11px; font-weight: 700; color: var(--bsusp); }
  .block-head .flag { margin-left: auto; }

  .queue-list { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .queue-list .sep { font-size: 13px; color: var(--muted); font-weight: 800; }

  .queue-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px;
    border: 1px solid var(--ready);
    border-radius: 7px;
    background: var(--ready-soft);
    font-size: 14px;
    font-weight: 750;
    color: var(--ready);
  }

  .queue-chip .note {
    font-size: 11.5px;
    font-weight: 750;
    line-height: 1.25;
    padding: 2px 6px;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.78);
  }

  .queue-chip.plus { border-color: var(--running); background: var(--running-soft); color: var(--running); border-width: 2px; }
  .queue-chip.dev { border-color: var(--blocked); background: var(--blocked-soft); color: var(--blocked); }
  .queue-chip.mem { border-color: var(--line-strong); background: var(--region-fill-alt); color: var(--ink-soft); }

  .queue-empty { font-size: 12.5px; color: var(--muted); }

  .dev-card {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 3px 9px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--region-fill);
    font-size: 13px;
  }

  .dev-card + .dev-card { margin-top: 3px; }
  .dev-card .dev-name { font-weight: 700; color: var(--ink-soft); flex: 1 1 auto; }
  .dev-card .dev-free { color: var(--muted); font-size: 12.5px; }
  .dev-card .waiting-for { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); flex: 1 1 100%; }

  .event-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }

  .event-list li {
    font-size: 12.5px;
    color: var(--ink);
    padding: 2px 8px;
    border-left: 3px solid var(--marked);
    background: var(--marked-soft);
    border-radius: 0 5px 5px 0;
  }

  .decision-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 11px; padding-top: 9px; border-top: 1px solid var(--line); }

  .score { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .quiz-options { display: grid; grid-template-columns: repeat(auto-fill, minmax(146px, 1fr)); gap: 5px; }

  .quiz-options button { text-align: left; padding: 6px 11px; font-size: 13.5px; font-weight: 620; }
  .quiz-options button[aria-pressed="true"] { background: var(--marked); border-color: var(--marked); color: #fff; }

  .elim { display: flex; flex-direction: column; gap: 3px; }

  .elim-card {
    border: 1px solid var(--line);
    border-left: 3px solid var(--marked);
    border-radius: 0 7px 7px 0;
    padding: 3px 10px;
    background: var(--region-fill);
  }

  .elim-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .elim-when { font-size: 10.5px; font-weight: 750; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); flex: 0 0 auto; }
  .elim-who { font-size: 13px; font-weight: 750; color: var(--ink); }
  .elim-why { font-size: 12.5px; color: var(--ink-soft); margin-top: 0; }
  .elim-note { font-size: 12.5px; color: var(--muted); margin: 0; }

  footer { flex: 0 0 auto; }

  .narration-panel { display: flex; flex-direction: column; }

  .narration-head {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    padding: 7px 14px 2px;
  }

  .narration-head .title { font-weight: 660; font-size: 14.5px; }
  .narration-head .subtitle { font-size: 13px; color: var(--muted); flex: 1; min-width: 160px; }

  .narration-head .granularity {
    align-self: center;
    font-size: 11px;
    color: var(--ink-soft);
    background: var(--region-fill-alt);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 9px;
  }

  .narration-body { padding: 2px 14px 5px; min-height: 38px; }
  .narration-text { font-size: 15.5px; margin: 0; color: var(--ink); }
  .narration-note { font-size: 13.5px; color: var(--muted); margin: 4px 0 0; }
  .verdict-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }

  .verdict-list li {
    font-size: 14px;
    color: var(--ink);
    padding: 1px 9px;
    border-left: 3px solid var(--line-strong);
    background: var(--region-fill);
    border-radius: 0 5px 5px 0;
  }

  .verdict-list li.hit { border-left-color: var(--marked); background: var(--marked-soft); }
  .verdict-list li.miss { border-left-color: var(--blocked); }
  .verdict-list li.note { color: var(--ink-soft); }
  .verdict-list .why { color: var(--muted); }

  .takeaway {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin: 2px 0 0;
    padding: 6px 11px;
    border: 1.5px solid var(--running);
    border-radius: 8px;
    background: var(--running-soft);
    animation: flash var(--fast) ease-out;
  }

  .takeaway .tag {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--running);
  }

  .takeaway .line { font-size: 15px; font-weight: 700; color: var(--ink); }

  .progress-row { display: flex; align-items: center; gap: 10px; padding: 0 12px; }
  .progress-track { flex: 1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--running); border-radius: 2px; transition: transform var(--fast) ease-out; transform-origin: left center; }
  .progress { font-size: 12px; line-height: 1.2; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 12px 8px; }
  .controls .spacer { flex: 1; }
  .big { padding: 7px 16px; font-size: 15px; font-weight: 640; }
  .big.primary { background: var(--running); border-color: var(--running); color: #fff; }
  .big.primary:hover:not([disabled]) { background: #1a45bd; border-color: #1a45bd; }
  .small { padding: 6px 11px; font-size: 13px; }

  #tooltip {
    position: fixed;
    z-index: 20;
    max-width: 330px;
    background: var(--ink);
    color: #fff;
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 13px;
    line-height: 1.42;
    box-shadow: 0 6px 20px rgba(16, 21, 29, 0.3);
    display: none;
  }

  #tooltip.open { display: block; animation: flash var(--fast) ease-out; }
  #tooltip .tip-title { font-weight: 700; display: block; margin-bottom: 3px; }

  @keyframes flash {
    from { opacity: 0.35; }
    to { opacity: 1; }
  }

  em { font-style: normal; font-weight: 700; }

  @media (max-width: 900px) {
    body { height: auto; overflow: auto; }
    .state-grid { grid-template-columns: minmax(0, 1fr); }

    main, main.solo, main.quiz {
      grid-template-columns: 1fr;
      grid-template-rows: none;
      grid-template-areas: "statement" "chart" "state" "decision";
    }
    .panel-body { overflow: visible; }
    .narration-head { flex-direction: column; align-items: flex-start; gap: 3px; }
    .controls .big, .controls .small { flex: 1 1 auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>

<script id="engine">
function parseQueue(spec) {
  if (!spec) return [];
  return spec.split(",").map(function (raw) {
    const text = raw.trim();
    const open = text.indexOf("(");
    if (open === -1) return { id: text, note: null };
    return { id: text.slice(0, open), note: text.slice(open + 1, text.length - 1) };
  }).filter(function (entry) { return entry.id.length > 0; });
}

function fill(template, values) {
  return Object.keys(values).reduce(function (text, key) {
    return text.split("{" + key + "}").join(values[key]);
  }, template);
}

function deviceResources(resources) {
  return resources.filter(function (res) { return res.kind === "device"; });
}

function holdingResources(resources) {
  return resources.filter(function (res) { return res.kind !== "memory"; });
}

function assignedStatus(view, rowId, assign) {
  const outside = view.resources.some(function (res) { return res.kind === "memory" && assign[res.id] === rowId; });
  const held = holdingResources(view.resources).filter(function (res) { return assign[res.id] === rowId; })[0];
  if (held && held.kind === "cpu") return "running";
  if (held) return outside ? "bsusp" : "blocked";
  return outside ? "rsusp" : "ready";
}

function stateFrom(view, rowId, index, assign) {
  if (index >= view.ends[rowId]) return "term";
  if (view.arrivals[rowId] > index) return null;
  return assignedStatus(view, rowId, assign);
}

function cpuResources(resources) {
  return resources.filter(function (res) { return res.kind === "cpu"; });
}

function buildView(example, variant) {
  const source = variant || example;
  const resources = example.resources || DEFAULT_RESOURCES;
  const rows = example.rows || example.table.rows.map(function (row) {
    return { id: row.id, group: row.owner || null };
  });
  const groups = [];
  rows.forEach(function (row) {
    if (row.group && groups.indexOf(row.group) === -1) groups.push(row.group);
  });
  const steps = source.trace.map(function (entry) {
    const assign = {};
    resources.forEach(function (res) { assign[res.id] = entry[res.id] || null; });
    const ults = entry.ults
      ? groups.reduce(function (acc, group) {
          acc[group] = entry.ults[group] === null || entry.ults[group] === undefined
            ? null
            : parseQueue(entry.ults[group]);
          return acc;
        }, {})
      : null;
    return {
      assign: assign,
      ready: parseQueue(entry.ready),
      ults: ults,
      blocked: entry.blocked || [],
      devq: parseQueue(entry.devq),
      waiting: entry.waiting || [],
      mem: entry.mem ? entry.mem.split(",") : null,
      states: entry.states || null,
      events: entry.ev || [],
      key: Boolean(entry.key),
      reason: entry.reason || null
    };
  });
  const arrivals = {};
  example.table.rows.forEach(function (row) { arrivals[row.id] = row.arrival; });
  return {
    example: example,
    resources: resources,
    rows: rows,
    groups: groups,
    arrivals: arrivals,
    ends: source.ends,
    steps: steps,
    length: steps.length
  };
}

function occupancyOf(view, rowId) {
  const counts = {};
  view.resources.forEach(function (res) { counts[res.id] = 0; });
  let last = -1;
  view.steps.forEach(function (step, index) {
    holdingResources(view.resources).forEach(function (res) {
      if (step.assign[res.id] === rowId) {
        counts[res.id] += 1;
        last = Math.max(last, index);
      }
    });
  });
  return { counts: counts, last: last };
}

function verifyView(view) {
  const label = view.example.id;
  const known = view.rows.map(function (row) { return row.id; });
  const defaultDevice = deviceResources(view.resources)[0];
  view.steps.forEach(function (step, index) {
    const held = {};
    holdingResources(view.resources).forEach(function (res) {
      const holder = step.assign[res.id];
      if (!holder) return;
      if (known.indexOf(holder) === -1) {
        throw new Error(label + " t=" + index + ": " + res.id + " asignado a " + holder + ", que no es una fila");
      }
      if (held[holder]) {
        throw new Error(label + " t=" + index + ": " + holder + " ocupa " + held[holder] + " y " + res.id + " al mismo tiempo");
      }
      held[holder] = res.id;
    });
  });
  view.rows.forEach(function (row) {
    const spec = view.example.table.rows.filter(function (item) { return item.id === row.id; })[0];
    if (!spec) throw new Error(label + ": la fila " + row.id + " no está en el enunciado");
    if (view.ends[row.id] === undefined) throw new Error(label + ": falta el fin de " + row.id);
    const wanted = {};
    view.resources.forEach(function (res) { wanted[res.id] = 0; });
    let cpuTotal = 0;
    spec.bursts.forEach(function (burst) {
      if (burst.k === "cpu") cpuTotal += burst.v;
      else wanted[burst.dev || defaultDevice.id] += burst.v;
    });
    const seen = occupancyOf(view, row.id);
    const cpuSeen = cpuResources(view.resources).reduce(function (sum, res) { return sum + seen.counts[res.id]; }, 0);
    if (cpuSeen !== cpuTotal) {
      throw new Error(label + ": " + row.id + " ocupa la CPU " + cpuSeen + " instantes y el enunciado pide " + cpuTotal);
    }
    deviceResources(view.resources).forEach(function (res) {
      if (seen.counts[res.id] !== wanted[res.id]) {
        throw new Error(label + ": " + row.id + " ocupa " + res.label + " " + seen.counts[res.id] + " instantes y el enunciado pide " + wanted[res.id]);
      }
    });
    if (seen.last + 1 !== view.ends[row.id]) {
      throw new Error(label + ": " + row.id + " termina en " + (seen.last + 1) + " y la traza dice " + view.ends[row.id]);
    }
  });
  view.steps.forEach(function (step, index) {
    if (!step.states) return;
    view.rows.forEach(function (row) {
      const onCpu = cpuResources(view.resources).some(function (res) { return step.assign[res.id] === row.id; });
      const outside = view.resources.some(function (res) { return res.kind === "memory" && step.assign[res.id] === row.id; });
      if (onCpu && outside) {
        throw new Error(label + " t=" + index + ": " + row.id + " tiene la CPU y está fuera de memoria a la vez");
      }
      const derived = stateFrom(view, row.id, index, step.assign);
      const declared = step.states[row.id] || null;
      if (derived !== declared) {
        throw new Error(label + " t=" + index + ": " + row.id + " declara " + declared + " y de la asignación sale " + derived);
      }
    });
  });
  return view;
}

function cellState(view, rowId, index) {
  const step = view.steps[index];
  if (step.states) return step.states[rowId] || null;
  const holder = holdingResources(view.resources).filter(function (res) { return step.assign[res.id] === rowId; })[0];
  if (holder) return holder.kind === "cpu" ? "running" : "blocked";
  if (index >= view.ends[rowId]) return "term";
  return null;
}

function cellTag(view, rowId, index) {
  const status = cellState(view, rowId, index);
  if (!status) return "";
  const step = view.steps[index];
  if (!step.states) {
    const holder = holdingResources(view.resources).filter(function (res) { return step.assign[res.id] === rowId; })[0];
    if (holder) return holder.short;
  }
  return UI_TEXT.cells[status] || "";
}

function groupOf(view, rowId) {
  const row = view.rows.filter(function (item) { return item.id === rowId; })[0];
  return row ? row.group : null;
}

function queued(entries, id) {
  return (entries || []).some(function (entry) { return entry.id === id; });
}

function queueNote(entries, id) {
  const hit = (entries || []).filter(function (entry) { return entry.id === id; })[0];
  return hit ? hit.note : null;
}

function dispatchReason(view, index, resource) {
  const step = view.steps[index];
  const holder = step.assign[resource.id];
  if (!holder) return UI_TEXT.reasons.idle;
  const previous = index > 0 ? view.steps[index - 1].assign[resource.id] : null;
  if (holder === previous) return fill(UI_TEXT.reasons.keeps, { p: holder });
  const group = groupOf(view, holder);
  if (view.example.twoLevel) {
    return fill(UI_TEXT.reasons.twoLevel, { p: holder, v: group });
  }
  const note = queueNote(step.ready, holder);
  const algorithm = ALGORITHMS[view.example.algorithm];
  const key = view.example.algorithm === "vrr" && note === "Q+" ? "vrrPlus" : algorithm.reason;
  return fill(UI_TEXT.reasons[key], { p: holder, v: note });
}

function deviceReason(view, index) {
  const step = view.steps[index];
  const lines = [];
  deviceResources(view.resources).forEach(function (res) {
    const holder = step.assign[res.id];
    const previous = index > 0 ? view.steps[index - 1].assign[res.id] : null;
    if (holder && holder !== previous) {
      const single = deviceResources(view.resources).length === 1;
      lines.push(fill(single ? UI_TEXT.reasons.devTakeOne : UI_TEXT.reasons.devTake, { p: holder, v: res.label }));
    }
    else if (!holder && previous) lines.push(fill(UI_TEXT.reasons.devFree, { v: res.label }));
  });
  const only = deviceResources(view.resources).length === 1 ? deviceResources(view.resources)[0] : null;
  if (only) {
    step.waiting.forEach(function (who) {
      lines.push(fill(UI_TEXT.reasons.devWait, { p: who, q: step.assign[only.id] }));
    });
  }
  return lines;
}

function reasonFor(view, index) {
  const step = view.steps[index];
  if (step.reason) return { main: step.reason, extra: [], key: true };
  const cpus = cpuResources(view.resources);
  const main = cpus.map(function (res) {
    const text = dispatchReason(view, index, res);
    return cpus.length > 1 ? res.label + ": " + text : text;
  }).join(" ");
  return { main: main, extra: deviceReason(view, index), key: false };
}

const DECIDING_EVENTS = ["ioStart", "ioStartOn", "ioGet", "quantumLeft", "preempt", "libDispatch", "kltBlock", "kltBlockJacket", "suspend", "readySusp", "idle"];

function eventText(entry) {
  const template = UI_TEXT.events[entry[0]];
  return fill(template, { p: entry[1], v: entry[2] });
}

function resourceOf(view, resId) {
  return view.resources.filter(function (res) { return res.id === resId; })[0];
}

function answerAt(answers, index, resId) {
  return answers[index] ? answers[index][resId] || null : null;
}

function rowFinished(view, answers, rowId, index) {
  const end = view.ends[rowId];
  if (index < end) return false;
  const last = end - 1;
  const holder = holdingResources(view.resources).filter(function (res) {
    return view.steps[last].assign[res.id] === rowId;
  })[0];
  return Boolean(holder && answerAt(answers, last, holder.id));
}

function resourceSettled(view, answers, index, resId) {
  if (!view.steps[index].assign[resId]) return true;
  return Boolean(answerAt(answers, index, resId));
}

function frontierOf(view, answers, resId) {
  for (let t = 0; t < view.length; t += 1) {
    if (!resourceSettled(view, answers, t, resId)) return t;
  }
  return view.length - 1;
}

function settledApartFrom(view, answers, index, resId) {
  return view.resources.every(function (res) {
    return res.id === resId || resourceSettled(view, answers, index, res.id);
  });
}

function columnSettled(view, answers, index) {
  return view.resources.every(function (res) { return resourceSettled(view, answers, index, res.id); });
}

function settledCount(view, answers) {
  let count = 0;
  while (count < view.length && columnSettled(view, answers, count)) count += 1;
  return count;
}

function openPicks(view, answers) {
  const out = [];
  for (let t = 0; t < view.length; t += 1) {
    view.resources.forEach(function (res) {
      if (!resourceSettled(view, answers, t, res.id)) out.push({ t: t, res: res.id });
    });
  }
  return out;
}

function judgePick(view, index, resId, given) {
  const expected = view.steps[index].assign[resId] || null;
  return { expected: expected, correct: given === expected };
}

function criterionFor(algorithm) {
  return UI_TEXT.queues.criterion[algorithm] || null;
}

function schedulerOf(view) {
  return view.example.twoLevel ? view.example.ultAlgorithm : view.example.algorithm;
}

function keepsWhy(view, run) {
  const previous = run.from > 0 ? view.steps[run.from - 1].assign[run.res] : null;
  if (previous !== run.expected) return null;
  const key = ALGORITHMS[schedulerOf(view)].noPreempt ? "whyKeeps" : "whyKeepsPreempt";
  return fill(UI_TEXT.paint[key], { q: run.expected });
}

function queueWhy(view, run, entries) {
  const criterion = criterionFor(schedulerOf(view));
  const winnerNote = queueNote(entries, run.expected);
  const givenNote = queueNote(entries, run.given);
  if (!criterion || !winnerNote) {
    const key = queued(entries, run.given) ? "whyOrder" : "whyOrderAlone";
    return fill(UI_TEXT.paint[key], { q: run.expected, p: run.given });
  }
  if (winnerNote === givenNote) return fill(UI_TEXT.paint.whyTie, { nq: winnerNote, q: run.expected, p: run.given });
  if (!givenNote) return fill(UI_TEXT.paint.whyNotQueued, { c: criterion, q: run.expected, nq: winnerNote, p: run.given });
  return fill(UI_TEXT.paint.whyOther, { c: criterion, q: run.expected, nq: winnerNote, p: run.given, np: givenNote });
}

function otherCpuOf(view, run, step, group) {
  return cpuResources(view.resources).filter(function (res) {
    return res.id !== run.res && groupOf(view, step.assign[res.id]) === group;
  })[0];
}

function levelWhy(view, run, step) {
  const winner = groupOf(view, run.expected);
  const given = groupOf(view, run.given);
  if (given !== winner) {
    const here = resourceOf(view, run.res).phrase;
    if (step.blocked.indexOf(given) !== -1) {
      return fill(UI_TEXT.paint.whyKltBlocked, { kp: given });
    }
    const other = otherCpuOf(view, run, step, given);
    if (other) {
      const there = step.assign[other.id];
      const key = there === run.given ? "whyKltPicked" : "whyKltElsewhere";
      return fill(UI_TEXT.paint[key], { q: run.expected, kq: winner, kp: given, p: run.given, v: other.phrase, o: there, r: here });
    }
    return fill(UI_TEXT.paint.whyKltOther, { kq: winner, kp: given, r: here });
  }
  const entries = (step.ults && step.ults[winner]) || [];
  if (!queued(entries, run.expected)) return keepsWhy(view, run);
  return queueWhy(view, run, entries);
}

function pickWhy(view, run) {
  if (run.status !== "miss") return null;
  const res = resourceOf(view, run.res);
  if (res.kind !== "cpu" || !run.expected) return null;
  const step = view.steps[run.from];
  if (view.arrivals[run.given] > run.from) {
    return fill(UI_TEXT.paint.whyNotArrived, { p: run.given, a: view.arrivals[run.given] });
  }
  if (view.example.twoLevel) return levelWhy(view, run, step);
  if (!queued(step.ready, run.expected)) return keepsWhy(view, run);
  return queueWhy(view, run, step.ready);
}

function pickVerdict(view, run) {
  const res = resourceOf(view, run.res);
  const memory = res.kind === "memory";
  if (run.status === "miss" && run.elsewhere && !memory) {
    const other = resourceOf(view, run.elsewhere);
    const template = run.expected ? UI_TEXT.paint.missElsewhereOther : UI_TEXT.paint.missElsewhereFree;
    return fill(template, { p: run.given, q: run.expected || "", r: res.phrase, r2: other.phrase, a: run.from, b: run.to });
  }
  const key = run.status === "hit" ? "hit" : run.expected ? "missOther" : "missFree";
  const template = UI_TEXT.paint[memory ? key + "Mem" : key];
  return fill(template, { p: run.given, q: run.expected || "", r: res.phrase, a: run.from, b: run.to });
}

function appendRich(parent, text) {
  const pattern = /\[\[([a-zA-ZáéíóúñÁÉÍÓÚÑ0-9]+):([^\]]+)\]\]|\*([^*]+)\*/g;
  let cursor = 0;
  let match = pattern.exec(text);
  while (match) {
    if (match.index > cursor) parent.appendChild(document.createTextNode(text.slice(cursor, match.index)));
    if (match[3]) {
      parent.appendChild(element("em", null, match[3]));
    } else {
      const term = element("button", "tip", match[2]);
      term.type = "button";
      term.dataset.term = match[1];
      parent.appendChild(term);
    }
    cursor = match.index + match[0].length;
    match = pattern.exec(text);
  }
  if (cursor < text.length) parent.appendChild(document.createTextNode(text.slice(cursor)));
}

function burstProgress(view, rowId, bound) {
  const pools = {};
  view.resources.forEach(function (res) { pools[res.id] = 0; });
  for (let t = 0; t < bound && t < view.length; t += 1) {
    view.resources.forEach(function (res) {
      if (view.steps[t].assign[res.id] === rowId) pools[res.id] += 1;
    });
  }
  const cpuIds = cpuResources(view.resources).map(function (res) { return res.id; });
  let cpuPool = cpuIds.reduce(function (sum, id) { return sum + pools[id]; }, 0);
  const defaultDevice = deviceResources(view.resources)[0].id;
  const spec = view.example.table.rows.filter(function (row) { return row.id === rowId; })[0];
  return spec.bursts.map(function (burst) {
    if (burst.k === "cpu") {
      const done = cpuPool >= burst.v;
      cpuPool = Math.max(0, cpuPool - burst.v);
      return done;
    }
    const key = burst.dev || defaultDevice;
    const done = pools[key] >= burst.v;
    pools[key] = Math.max(0, pools[key] - burst.v);
    return done;
  });
}

function renderLadder() {

function renderVariants() {
  const example = currentExample();
  if (!example.variants) {
    dom.variantBar.textContent = "";

  dom.variantLabel.textContent = example.variantLabel;
  const entries = example.variants.map(function (variant, position) {

  renderSwitch(dom.variantBar, entries, String(state.variantIndex), function (key) {
    if (Number(key) === state.variantIndex) return;
    state.variantIndex = Number(key);
    stopPlay();
    resetProgress();
    rebuildView();
    render();
  });
}

function burstDevice(spec, index) {
  const devices = deviceResources(view.resources);
  if (devices.length < 2) return null;
  const used = spec.rows.map(function (row) { return row.bursts[index]; })
    .filter(function (burst) { return burst && burst.k === "io"; })
    .map(function (burst) { return burst.dev || devices[0].id; });
  const unique = used.filter(function (id, position) { return used.indexOf(id) === position; });
  return unique.length === 1 ? resourceOf(view, unique[0]) : null;
}

function renderStatement() {

  body.textContent = "";
  const scroll = element("div", "statement-scroll");
  const table = element("table", "statement-table");
  const head = element("thead");
  const headRow = element("tr");
  const spec = example.table;
  const width = spec.rows.reduce(function (max, row) { return Math.max(max, row.bursts.length); }, 0);
  if (spec.rows.length > 3) table.classList.add("dense");
  if (width > 3) table.classList.add("wide");
  if (spec.kind === "thread") headRow.appendChild(element("th", null, spec.ownerHead));
  headRow.appendChild(element("th", null, spec.kind === "thread" ? spec.unitHead : UI_TEXT.statement.process));
  headRow.appendChild(element("th", null, UI_TEXT.statement.arrival));

    headRow.appendChild(element("th", null, UI_TEXT.statement.estPrev));

  spec.rows.forEach(function (row) {

      line.appendChild(element("td", null, String(row.realPrev)));
      line.appendChild(element("td", null, String(row.est)));

  table.appendChild(bodyRows);

  const params = element("div", "params");

  if (settings.quantum) addParam(UI_TEXT.params.quantum, settings.quantum);
  if (settings.alpha) addParam(UI_TEXT.params.alpha, settings.alpha);
  if (settings.degree) addParam(UI_TEXT.params.degree, settings.degree);

function ganttFor(target, chartView, cursor, bound) {
  target.textContent = "";
  const grid = element("div", "gantt-grid");
  grid.style.gridTemplateColumns = "max-content repeat(" + chartView.length + ", minmax(38px, 1fr))";
  if (chartView.rows.length >= 4) grid.classList.add("dense");
  chartView.rows.forEach(function (row) {
    const label = element("div", "gantt-label");
    label.appendChild(element("span", null, row.id));
    if (row.group) label.appendChild(element("span", "owner", row.group));
    grid.appendChild(label);
    for (let t = 0; t < chartView.length; t += 1) {
      const cell = element("div", "gantt-cell");
      if (t >= bound) {
        cell.classList.add("future", "blank");
      } else {
        const status = cellState(chartView, row.id, t);
        if (status) {
          cell.classList.add(STATES[status].css);
          cell.textContent = cellTag(chartView, row.id, t);
          cell.title = STATES[status].label;
        } else {
          cell.classList.add("blank");
          if (chartView.steps[t].waiting.indexOf(row.id) !== -1) cell.classList.add("waiting");
        }
      }
      if (t === cursor) cell.classList.add("now");
      grid.appendChild(cell);
    }
  });
  grid.appendChild(element("div", "gantt-axis origin", "0"));
  for (let t = 0; t < chartView.length; t += 1) {
    const axis = element("div", "gantt-axis", String(t + 1));
    if (t === cursor) axis.classList.add("now");
    grid.appendChild(axis);
  }
  target.appendChild(grid);
}

function renderGantt() {
  if (isQuiz()) {
    const chart = quizChart();
    ganttFor(dom.ganttPanel, chart.view, -1, chart.view.length);

  if (state.mode === "solve") {

function shownHolder(index, resId) {
  return answerAt(state.answers, index, resId) ? view.steps[index].assign[resId] || null : null;

function paintedAssign(index) {
  const assign = {};
  view.resources.forEach(function (res) { assign[res.id] = shownHolder(index, res.id); });

function flagNode(text) {
  return element("span", "flag", text);
}

function finishedAt(rowId, index) {
  return rowFinished(view, state.answers, rowId, index);

function marksAt(rowId, index) {
  const step = view.steps[index];
  return {
    wrong: view.resources.filter(function (res) {
      const answer = answerAt(state.answers, index, res.id);
      return Boolean(answer && answer.given === rowId && !answer.correct);
    })[0],
    shown: view.resources.some(function (res) {
      const answer = answerAt(state.answers, index, res.id);
      return Boolean(answer && answer.given && !answer.correct && step.assign[res.id] === rowId);
    })
  };
}

function markCell(cell, marks) {
  if (marks.shown) {
    cell.classList.add("shown");
    cell.appendChild(flagNode(UI_TEXT.paint.flagShown));
  }
}

function faceOf(cell, status, text, marks) {
  cell.classList.add(STATES[status].css);
  cell.textContent = text;
  cell.title = STATES[status].label;
  markCell(cell, marks);
}

function paintFace(cell, rowId, index) {
  const step = view.steps[index];
  const assign = paintedAssign(index);
  cell.className = "gantt-cell";
  cell.textContent = "";
  cell.title = "";
  const marks = marksAt(rowId, index);
  if (step.states) {
    const status = finishedAt(rowId, index)
      ? "term"
      : (statusKnown(rowId, index) ? stateFrom(view, rowId, index, assign) : null);
    if (!status) {
      if (marks.wrong) {
        cell.classList.add("wrong");
        cell.textContent = marks.wrong.short || marks.wrong.label;
        cell.title = fill(UI_TEXT.paint.missTitle, { r: marks.wrong.label });
        return;
      }
      cell.classList.add("blank");
      return;
    }
    faceOf(cell, status, UI_TEXT.cells[status] || "", marks);
    return;
  }
  const holder = holdingResources(view.resources).filter(function (res) { return assign[res.id] === rowId; })[0];
  if (holder) {
    faceOf(cell, holder.kind === "cpu" ? "running" : "blocked", holder.short, marks);
    return;
  }
  if (finishedAt(rowId, index)) {
    faceOf(cell, "term", UI_TEXT.cells.term, marks);
    return;
  }
  if (marks.wrong) {
    cell.classList.add("wrong");
    cell.textContent = marks.wrong.short || marks.wrong.label;
    cell.title = fill(UI_TEXT.paint.missTitle, { r: marks.wrong.label });
    return;
  }
  cell.classList.add("blank");
  if (columnSettled(view, state.answers, index) && step.waiting.indexOf(rowId) !== -1) cell.classList.add("waiting");
}

function inStroke(rowId, index) {
  return state.stroke.some(function (spot) { return spot.row === rowId && spot.t === index; });
}

function resourceDone(resId) {
  for (let t = 0; t < view.length; t += 1) {
    if (view.steps[t].assign[resId] && !answerAt(state.answers, t, resId)) return false;
  }
  return true;
}

function rowHolds(rowId, index) {
  return holdingResources(view.resources).some(function (res) {
    return answerAt(state.answers, index, res.id) && view.steps[index].assign[res.id] === rowId;
  });
}

function statusKnown(rowId, index) {
  const onCpu = cpuResources(view.resources).some(function (res) {
    return answerAt(state.answers, index, res.id) && view.steps[index].assign[res.id] === rowId;
  });
  return onCpu || columnSettled(view, state.answers, index);
}

function paintableFor(res, rowId, index) {
  if (index !== settledCount(view, state.answers)) return false;
  if (answerAt(state.answers, index, res.id)) return false;
  if (finishedAt(rowId, index)) return false;
  if (res.kind !== "memory" && rowHolds(rowId, index)) return false;
  return !resourceDone(res.id);
}

function paintableAt(rowId, index) {
  return paintableFor(toolResource(), rowId, index);
}

function resourceHasWork(res) {
  return view.rows.some(function (row) {
    for (let t = 0; t < view.length; t += 1) if (paintableFor(res, row.id, t)) return true;
    return false;
  });
}

function firstWithWork() {
  return view.resources.filter(function (res) { return resourceHasWork(res); })[0];
}

function advanceTool(opened) {
  const start = opened ? firstWithWork() : null;
  if (start) {
    state.tool = start.id;
    state.hover = null;
    return;
  }
  if (resourceHasWork(toolResource())) return;
  const ids = view.resources.map(function (item) { return item.id; });
  const from = ids.indexOf(toolResource().id);
  for (let k = 1; k <= ids.length; k += 1) {
    const next = resourceOf(view, ids[(from + k) % ids.length]);
    if (resourceHasWork(next)) {
      state.tool = next.id;
      state.hover = null;
      return;
    }
  }
}

function previewStatus(res, rowId, index) {
  if (!view.steps[index].states) return res.kind === "cpu" ? "running" : "blocked";
  const onCpu = res.kind === "cpu";
  if (!onCpu && !statusKnown(rowId, index) && !settledApartFrom(view, state.answers, index, res.id)) return null;
  const assign = paintedAssign(index);
  assign[res.id] = rowId;
  return assignedStatus(view, rowId, assign);
}

function decorateCells() {
  const res = toolResource();
  view.rows.forEach(function (row) {
    for (let t = 0; t < view.length; t += 1) {
      const cell = paintCells[row.id][t];
      paintFace(cell, row.id, t);
      if (t === state.index) cell.classList.add("now");
      const open = paintableAt(row.id, t);
      cell.tabIndex = open ? 0 : -1;
      if (!open) continue;
      cell.classList.add("paintable");
      const marked = inStroke(row.id, t);
      const hovered = !state.painting && state.hover && state.hover.row === row.id && state.hover.t === t;
      if (!marked && !hovered) continue;
      const status = previewStatus(res, row.id, t);
      cell.className = "gantt-cell paintable " + (status ? STATES[status].css + " " : "blank ") + (marked ? "stroke" : "ghost");
      cell.textContent = view.steps[t].states ? (status ? UI_TEXT.cells[status] || "" : "") : res.short;
      cell.title = status ? STATES[status].label : res.label;
      if (t === state.index) cell.classList.add("now");
    }
  });
}

function paintGrid() {
  dom.ganttPanel.textContent = "";
  const grid = element("div", "gantt-grid painting");
  grid.style.gridTemplateColumns = "max-content repeat(" + view.length + ", minmax(38px, 1fr))";
  if (view.rows.length >= 4) grid.classList.add("dense");
  paintCells = {};
  view.rows.forEach(function (row) {
    const label = element("div", "gantt-label");
    label.appendChild(element("span", null, row.id));
    if (row.group) label.appendChild(element("span", "owner", row.group));
    grid.appendChild(label);
    paintCells[row.id] = [];
    for (let t = 0; t < view.length; t += 1) {
      const cell = element("button", "gantt-cell");
      cell.type = "button";
      cell.dataset.row = row.id;
      cell.dataset.time = String(t);
      cell.dataset.focus = "cell:" + row.id + ":" + t;
      cell.setAttribute("aria-label", fill(UI_TEXT.paint.cellLabel, { p: row.id, a: t, b: t + 1 }));
      grid.appendChild(cell);
      paintCells[row.id].push(cell);
    }
  });
  grid.appendChild(element("div", "gantt-axis origin", "0"));
  for (let t = 0; t < view.length; t += 1) {
    const axis = element("div", "gantt-axis", String(t + 1));
    if (t === state.index) axis.classList.add("now");
    grid.appendChild(axis);
  }
  grid.addEventListener("pointerdown", onPaintDown);
  grid.addEventListener("pointermove", onPaintMove);
  grid.addEventListener("pointerleave", onPaintLeave);
  grid.addEventListener("click", onPaintKeyClick);
  dom.ganttPanel.appendChild(grid);
  dom.grid = grid;
  decorateCells();
}

function stateBlock(title, gloss, flag) {
  const block = element("div", "state-block");
  const head = element("div", "block-head");
  head.appendChild(element("span", "what", title));
  if (gloss) head.appendChild(element("span", "gloss", gloss));
  if (flag) head.appendChild(element("span", "flag", flag));
  block.appendChild(head);
  return block;
}

function processChip(id, note, extra) {
  const chip = element("span", "queue-chip" + (extra ? " " + extra : ""));
  if (note === "Q+") chip.classList.add("plus");
  chip.appendChild(element("span", null, id));
  if (note) chip.appendChild(element("span", "note", note));
  return chip;
}

function queueBlock(title, gloss, entries, flag, extra, unordered) {
  const block = stateBlock(title, gloss, flag);
  if (!entries || entries.length === 0) {
    block.appendChild(element("div", "queue-empty", UI_TEXT.queues.empty));
    return block;
  }
  const list = element("div", "queue-list");
  entries.forEach(function (entry, position) {
    if (position > 0 && !unordered) list.appendChild(element("span", "sep", "\u203a"));
    list.appendChild(processChip(entry.id, entry.note, extra));
  });
  block.appendChild(list);
  return block;
}

function queueRow(level, entries, flag) {
  const row = element("div", "queue-row");
  row.appendChild(element("span", "lvl", level));
  if (!entries || entries.length === 0) {
    row.appendChild(element("span", "queue-empty", UI_TEXT.queues.empty));
  } else {
    const list = element("div", "queue-list");
    entries.forEach(function (entry, position) {
      if (position > 0) list.appendChild(element("span", "sep", "\u203a"));
      list.appendChild(processChip(entry.id, entry.note, null));
    });
    row.appendChild(list);
  }
  if (flag) row.appendChild(element("span", "flag", flag));
  return row;
}

function readyGloss(algorithm) {
  const criterion = criterionFor(algorithm);
  return criterion ? STATES.ready.label + " \u00b7 " + criterion : STATES.ready.label;
}

function toldResource(resId, index) {
  return state.mode !== "solve" || answerAt(state.answers, index, resId) || columnSettled(view, state.answers, index);
}

function tellableEvents(entries, index) {
  if (state.mode !== "solve" || columnSettled(view, state.answers, index)) return entries;
  return entries.filter(function (entry) { return DECIDING_EVENTS.indexOf(entry[0]) === -1; });
}

function renderState() {
  const body = dom.statePanel;
  body.textContent = "";
  if (isQuiz()) {
    renderQuizState(body);
    return;
  }
  const step = view.steps[state.index];
  const example = currentExample();
  const grid = element("div", "state-grid");
  if (example.twoLevel) {
    const block = stateBlock(UI_TEXT.queues.readyBoth, criterionFor(example.ultAlgorithm), null);
    const rows = element("div", "queue-rows");
    rows.appendChild(queueRow(UI_TEXT.queues.levelKlt, step.ready, null));
    view.groups.forEach(function (group) {
      const entries = step.ults ? step.ults[group] : null;
      if (entries === null || entries === undefined) return;
      rows.appendChild(queueRow(
        fill(UI_TEXT.queues.levelUlt, { klt: group }),
        entries,
        step.blocked.indexOf(group) !== -1 ? UI_TEXT.queues.kltBlocked : null));
    });
    block.appendChild(rows);
    grid.appendChild(block);
  } else {
    grid.appendChild(queueBlock(UI_TEXT.queues.ready, readyGloss(example.algorithm), step.ready));
  }
  if (example.memory) {
    const swap = view.resources.filter(function (res) { return res.kind === "memory"; })[0];
    if (!swap || toldResource(swap.id, state.index)) {
      grid.appendChild(queueBlock(UI_TEXT.queues.memory, null,
        (step.mem || []).map(function (id) { return { id: id, note: null }; }), null, "mem", true));
    } else {
      const block = stateBlock(UI_TEXT.queues.memory, null, null);
      block.appendChild(element("div", "queue-empty", UI_TEXT.queues.pending));
      grid.appendChild(block);
    }
  }
  const devices = stateBlock(UI_TEXT.queues.devices, null, null);
  const deviceList = deviceResources(view.resources);
  deviceList.forEach(function (res) {
    const card = element("div", "dev-card");
    card.appendChild(element("span", "dev-name", res.label));
    const told = toldResource(res.id, state.index);
    const holder = told ? step.assign[res.id] : null;
    const empty = told ? UI_TEXT.queues.free : UI_TEXT.queues.pending;
    card.appendChild(holder ? processChip(holder, null, "dev") : element("span", "dev-free", empty));
    if (deviceList.length === 1 && step.devq.length > 0) {
      const wait = element("div", "waiting-for");
      wait.appendChild(element("span", null, UI_TEXT.queues.deviceQueue));
      step.devq.forEach(function (entry) { wait.appendChild(processChip(entry.id, null, "dev")); });
      card.appendChild(wait);
    }
    devices.appendChild(card);
  });
  grid.appendChild(devices);
  const events = stateBlock(UI_TEXT.queues.events, null, null);
  if (grid.children.length === 2) {
    events.classList.add("tuck");
    grid.children[0].classList.add("span");
  }
  const told = tellableEvents(step.events, state.index);
  if (told.length === 0) {
    events.appendChild(element("div", "queue-empty", UI_TEXT.queues.noEvents));
  } else {
    const list = element("ul", "event-list");
    told.forEach(function (entry) { list.appendChild(element("li", null, eventText(entry))); });
    events.appendChild(list);
  }
  grid.appendChild(events);
  body.appendChild(grid);
}

const quizViews = {};

function quizViewFor(exampleId) {
  if (!quizViews[exampleId]) {
    const source = EXAMPLES.filter(function (item) { return item.id === exampleId; })[0];
    quizViews[exampleId] = verifyView(buildView(source, null));
  }
  return quizViews[exampleId];
}

function quizChart() {
  const spec = currentExample().quiz.charts[state.quizChart];
  return { spec: spec, view: quizViewFor(spec.chartOf) };
}

function nextChartButton() {
  const example = currentExample();
  if (state.quizChart + 1 >= example.quiz.charts.length) return null;
  const next = element("button", "big primary", UI_TEXT.quiz.next);
  next.type = "button";
  next.addEventListener("click", function () {
    state.quizChart += 1;
    state.quizPick = null;
    state.quizAnswered = false;
    rebuildView();
    render();
  });
  return next;
}

function renderQuizState(body) {
  const chart = quizChart();
  if (!state.quizAnswered) {
    body.appendChild(element("p", "queue-empty", UI_TEXT.quiz.prompt));
    return;
  }
  const wrap = element("div", "elim");
  function elimCard(when, algos, text) {
    const card = element("div", "elim-card");
    const head = element("div", "elim-head");
    head.appendChild(element("span", "elim-when", when));
    head.appendChild(element("span", "elim-who", algos.map(function (key) { return ALGORITHMS[key].label; }).join(" · ")));
    card.appendChild(head);
    card.appendChild(element("div", "elim-why", text));
    return card;
  }
  chart.spec.groups.forEach(function (group) {
    wrap.appendChild(elimCard(fill(UI_TEXT.quiz.elimWhen, { t: group.t }), group.algos, group.text));
  });
  if (chart.spec.tie) wrap.appendChild(elimCard(UI_TEXT.quiz.tie, chart.spec.tie.algos, chart.spec.tie.text));
  if (chart.spec.note) wrap.appendChild(element("p", "elim-note", chart.spec.note));
  body.appendChild(wrap);
  const next = nextChartButton();
  if (next) {
    const actions = element("div", "decision-actions");
    actions.appendChild(next);
    body.appendChild(actions);
  }
}

function renderQuizDecision() {
  const chart = quizChart();
  dom.main.classList.remove("solo");
  dom.main.classList.toggle("answered", state.quizAnswered);
  if (state.quizAnswered) {
    dom.decisionPanel.hidden = true;
    return;
  }
  dom.decisionPanel.hidden = false;
  dom.decisionTitle.textContent = UI_TEXT.panels.quiz;
  dom.decisionTitle.dataset.tip = "quiz";
  const body = dom.decisionBody;
  body.textContent = "";
  dom.decisionWhen.textContent = fill(UI_TEXT.quiz.chartOf, {
    n: state.quizChart + 1,
    total: currentExample().quiz.charts.length
  });
  const options = element("div", "quiz-options");
  chart.spec.options.forEach(function (key) {
    const button = element("button", null, ALGORITHMS[key].label);
    button.type = "button";
    button.setAttribute("aria-pressed", state.quizPick === key ? "true" : "false");
    button.addEventListener("click", function () {
      state.quizPick = key;
      render();
    });
    options.appendChild(button);
  });
  body.appendChild(options);
  const actions = element("div", "decision-actions");
  const check = element("button", "big primary", UI_TEXT.quiz.check);
  check.type = "button";
  check.disabled = !state.quizPick;
  check.addEventListener("click", function () {
    state.quizAnswered = true;
    state.asked += 1;
    if (state.quizPick === chart.spec.answer) state.ok += 1;
    render();
  });
  actions.appendChild(check);
  body.appendChild(actions);
}

function renderDecision() {
  if (isQuiz()) {
    renderQuizDecision();
    return;
  }
  dom.decisionPanel.hidden = true;
  dom.main.classList.add("solo");
}

function renderTools() {
  const painting = !isQuiz() && state.mode === "solve";
  dom.toolRow.hidden = !painting;
  if (!painting) return;
  dom.paintLabel.textContent = UI_TEXT.paint.label;
  dom.toolBar.textContent = "";
  const current = toolResource();
  view.resources.forEach(function (res, position) {
    const button = element("button", "tool-" + res.kind);
    button.type = "button";
    button.dataset.focus = "tool:" + res.id;
    button.setAttribute("aria-pressed", current.id === res.id ? "true" : "false");
    button.appendChild(element("span", "swatch"));
    button.appendChild(element("span", null, res.label));
    button.appendChild(element("span", "key", String(position + 1)));
    button.disabled = !resourceHasWork(res);
    button.addEventListener("click", function () { pickTool(res.id); });
    dom.toolBar.appendChild(button);
  });
}

function pickTool(resId) {
  if (!resourceHasWork(resourceOf(view, resId))) return;
  state.tool = resId;
  state.hover = null;
  keepFocus(function () {
    renderTools();
    decorateCells();
  });
}

function cycleTool() {
  const ids = view.resources.map(function (res) { return res.id; });
  const from = ids.indexOf(toolResource().id);
  for (let k = 1; k <= ids.length; k += 1) {
    const next = ids[(from + k) % ids.length];
    if (resourceHasWork(resourceOf(view, next))) {
      pickTool(next);
      return;
    }
  }
}

function emptyPicks() {
  const list = [];
  for (let t = 0; t < view.length; t += 1) list.push({});
  return list;
}

function copyPicks(list) {
  return list.map(function (entry) {
    const copy = {};
    Object.keys(entry).forEach(function (key) { copy[key] = entry[key]; });
    return copy;
  });
}

function rememberPicks() {
  state.history.push({ answers: copyPicks(state.answers), tool: toolResource().id, index: state.index });
}

function elsewhereAt(index, resId, rowId) {
  const held = holdingResources(view.resources).filter(function (res) {
    return res.id !== resId && view.steps[index].assign[res.id] === rowId;
  })[0];
  return held ? held.id : null;
}

function judgeInto(runs, index, resId, given) {
  const call = judgePick(view, index, resId, given);
  state.answers[index][resId] = { given: given, correct: call.correct };
  state.asked += 1;
  if (call.correct) state.ok += 1;
  runs.push({ res: resId, status: call.correct ? "hit" : "miss", given: given, expected: call.expected, elsewhere: elsewhereAt(index, resId, given), from: index, to: index + 1 });
}

function commitStroke(stroke) {
  const before = settledCount(view, state.answers);
  const res = toolResource();
  const fresh = stroke.filter(function (spot) { return !answerAt(state.answers, spot.t, res.id); })
    .sort(function (one, two) { return one.t - two.t; });
  if (fresh.length === 0) return;
  rememberPicks();
  const runs = [];
  fresh.forEach(function (spot) { judgeInto(runs, spot.t, res.id, spot.row); });
  state.runs = runs;
  state.note = null;
  state.index = maxIndex();
  advanceTool(settledCount(view, state.answers) > before);
  render();
}

function undoPick() {
  const last = state.history.pop();
  if (!last) return;
  state.answers = last.answers;
  state.tool = last.tool;
  state.runs = [];
  state.note = UI_TEXT.paint.undone;
  state.index = Math.min(last.index, maxIndex());
  advanceTool();
  render();
}

function finishAll() {
  openPicks(view, state.answers).forEach(function (spot) {
    state.answers[spot.t][spot.res] = { given: null, correct: false };
  });
  state.runs = [];
  state.note = null;
  state.history = [];
  state.index = maxIndex();
  render();
}

function spotFrom(x, y) {
  const node = document.elementFromPoint(x, y);
  if (!node || !node.dataset || node.dataset.row === undefined) return null;
  const t = Number(node.dataset.time);
  if (!paintableAt(node.dataset.row, t)) return null;
  return { row: node.dataset.row, t: t };
}

function addToStroke(spot) {
  if (!spot || inStroke(spot.row, spot.t)) return;
  state.stroke = [spot];
  decorateCells();
}

function onPaintDown(event) {
  if (event.button !== 0 || !event.isPrimary) return;
  const spot = spotFrom(event.clientX, event.clientY);
  if (!spot) return;
  event.preventDefault();
  stopPlay();
  state.painting = true;
  state.stroke = [];
  dom.grid.setPointerCapture(event.pointerId);
  addToStroke(spot);
}

function onPaintKeyClick(event) {
  if (event.detail !== 0) return;
  const cell = event.target.closest ? event.target.closest(".gantt-cell") : null;
  if (!cell || cell.dataset.row === undefined) return;
  const t = Number(cell.dataset.time);
  if (!paintableAt(cell.dataset.row, t)) return;
  stopPlay();
  commitStroke([{ row: cell.dataset.row, t: t }]);
  focusEdge();
}

function focusEdge() {
  const active = document.activeElement;
  if (active && active.tabIndex === 0 && active.classList.contains("gantt-cell")) return;
  const next = dom.grid.querySelector('.gantt-cell[tabindex="0"]');
  if (next) next.focus();
}

function onPaintMove(event) {
  const spot = spotFrom(event.clientX, event.clientY);
  if (state.painting) {
    addToStroke(spot);
    return;
  }
  const same = state.hover && spot && state.hover.row === spot.row && state.hover.t === spot.t;
  if (same || (!state.hover && !spot)) return;
  state.hover = spot;
  decorateCells();
}

function onPaintLeave() {
  if (state.painting) return;
  state.hover = null;
  decorateCells();
}

function endStroke() {
  if (!state.painting) return;
  state.painting = false;
  const stroke = state.stroke;
  state.stroke = [];
  if (stroke.length > 0) commitStroke(stroke);
  else decorateCells();
}

function cancelStroke() {
  if (!state.painting) return;
  state.painting = false;
  state.stroke = [];
  decorateCells();
}

function renderNarration() {
  const example = currentExample();
  dom.exampleTitle.textContent = example.title;
  dom.exampleSubtitle.textContent = example.subtitle;
  dom.granularityNote.textContent = isQuiz() ? "" : UI_TEXT.stepUnit;
  dom.granularityNote.hidden = isQuiz();
  const body = dom.narrationPanel;
  body.textContent = "";
  if (isQuiz()) {
    const chart = quizChart();
    const line = element("p", "narration-text");
    if (!state.quizAnswered) {
      line.textContent = UI_TEXT.quiz.prompt;
    } else {
      line.textContent = fill(state.quizPick === chart.spec.answer ? UI_TEXT.quiz.correct : UI_TEXT.quiz.wrong, {
        p: ALGORITHMS[chart.spec.answer].label,
        c: ALGORITHMS[state.quizPick].label
      });
    }
    body.appendChild(line);
    if (state.quizAnswered && state.quizChart + 1 === example.quiz.charts.length) body.appendChild(closingCard(example));
    return;
  }
  if (state.mode === "solve") {
    renderVerdicts(body);
    if (settledCount(view, state.answers) === view.length) body.appendChild(closingCard(example));
    return;
  }
  const reason = reasonFor(view, state.index);
  const line = element("p", "narration-text");
  appendRich(line, reason.main);
  body.appendChild(line);
  reason.extra.forEach(function (text) {
    const note = element("p", "narration-note");
    appendRich(note, text);
    body.appendChild(note);
  });
  if (state.index === view.length - 1) body.appendChild(closingCard(example));
}

function feedbackLines(closed) {
  const cap = closed ? 1 : FEEDBACK_LINES;
  const lines = state.note ? [{ css: "note", text: state.note }] : [];
  state.runs.slice(0, cap - lines.length).forEach(function (run) { lines.push({ run: run }); });
  return lines.slice(0, cap);
}

function renderVerdicts(body) {
  const closed = settledCount(view, state.answers) === view.length;
  const list = element("ul", "verdict-list");
  let explained = false;
  feedbackLines(closed).forEach(function (line) {
    if (!line.run) {
      list.appendChild(element("li", line.css, line.text));
      return;
    }
    const item = element("li", line.run.status === "hit" ? "hit" : "miss");
    appendRich(item, pickVerdict(view, line.run));
    const why = explained ? null : pickWhy(view, line.run);
    if (why) {
      explained = true;
      item.appendChild(document.createTextNode(" "));
      const note = element("span", "why");
      appendRich(note, why);
      item.appendChild(note);
    }
    list.appendChild(item);
  });
  if (list.childNodes.length > 0) {
    body.appendChild(list);
    if (closed) return;
  } else if (!closed) {
    body.appendChild(element("p", "narration-note", view.example.stateBand ? UI_TEXT.paint.idleBand : UI_TEXT.paint.idle));
  }
  if (!columnSettled(view, state.answers, Math.min(state.index, view.length - 1))) return;
  const reason = reasonFor(view, state.index);
  const line = element("p", "narration-note");
  appendRich(line, reason.main);
  body.appendChild(line);
}

function closingCard(example) {
  const card = element("div", "takeaway");
  card.appendChild(element("span", "tag", UI_TEXT.takeawayTag));
  const line = element("span", "line");
  appendRich(line, example.closing);
  card.appendChild(line);
  return card;
}

function maxIndex() {
  if (state.mode === "watch") return view.length - 1;
  const done = settledCount(view, state.answers);
  return done < view.length ? done : view.length - 1;
}

function renderControls() {
  dom.firstStep.textContent = UI_TEXT.firstStep;
  dom.prevStep.textContent = UI_TEXT.prevStep;
  dom.nextStep.textContent = UI_TEXT.nextStep;
  dom.lastStep.textContent = UI_TEXT.lastStep;
  dom.playPause.textContent = state.playing ? UI_TEXT.pause : UI_TEXT.play;
  const quiz = isQuiz();
  dom.firstStep.disabled = quiz || state.index === 0;
  dom.prevStep.disabled = quiz || state.index === 0;
  dom.nextStep.disabled = quiz || state.index >= maxIndex();
  dom.lastStep.disabled = quiz || state.index >= maxIndex();
  dom.playPause.hidden = quiz || state.mode !== "watch";
  const painting = !quiz && state.mode === "solve";
  dom.undoPick.hidden = !painting;
  dom.finishBoard.hidden = !painting;
  dom.undoPick.textContent = UI_TEXT.paint.undo;
  dom.finishBoard.textContent = UI_TEXT.paint.finish;
  if (painting) {
    dom.undoPick.disabled = state.history.length === 0;
    dom.finishBoard.disabled = settledCount(view, state.answers) === view.length;
  }
  dom.score.textContent = state.asked === 0 ? "" : fill(UI_TEXT.score, { ok: state.ok, total: state.asked });
  if (quiz) {
    dom.progress.textContent = fill(UI_TEXT.quiz.chartOf, { n: state.quizChart + 1, total: currentExample().quiz.charts.length });
    dom.progressFill.style.transform = "scaleX(" + ((state.quizChart + 1) / currentExample().quiz.charts.length) + ")";
    return;
  }
  dom.progress.textContent = fill(UI_TEXT.progress, { current: state.index + 1, total: view.length });
  dom.progressFill.style.transform = "scaleX(" + ((state.index + 1) / view.length) + ")";
}

function keepFocus(step) {
  const before = document.activeElement;
  const key = before && before.dataset ? before.dataset.focus : null;
  step();
  if (!key) return;
  const back = document.querySelector('[data-focus="' + key + '"]');
  if (back) back.focus();
}

function render() {
  keepFocus(renderAll);
}

function renderAll() {
  renderLadder();
  renderModes();
  renderVariants();
  dom.statementTitle.textContent = UI_TEXT.panels.statement;
  dom.stateTitle.textContent = isQuiz() ? UI_TEXT.quiz.elimPanel : UI_TEXT.panels.state;
  dom.stateTitle.dataset.tip = isQuiz() ? "elim" : "state";
  dom.ganttTitle.textContent = UI_TEXT.panels.gantt;
  dom.main.classList.toggle("quiz", isQuiz());
  if (!isQuiz()) dom.main.classList.remove("answered");
  renderStatement();
  renderTools();
  renderGantt();
  renderLegend();
  renderState();
  renderDecision();
  renderNarration();
  renderControls();
}

function resetProgress() {
  state.index = 0;
  state.answers = emptyPicks();
  state.ok = 0;
  state.asked = 0;
  state.runs = [];
  state.note = null;
  state.history = [];
  state.stroke = [];
  state.painting = false;
  state.hover = null;
  state.tool = null;
  state.quizChart = 0;
  state.quizPick = null;
  state.quizAnswered = false;
}

function rebuildView() {
  const example = currentExample();
  view = example.quiz ? quizViewFor(example.quiz.charts[state.quizChart].chartOf) : verifyView(buildView(example, currentVariant()));
  state.answers = emptyPicks();
  state.tool = view.resources[0].id;
}

function selectExample(position) {
  if (position === state.exampleIndex) return;
  stopPlay();
  state.exampleIndex = position;
  state.variantIndex = 0;
  resetProgress();
  rebuildView();
  render();
}

function goTo(index) {
  if (isQuiz()) return;
  const limit = maxIndex();
  state.runs = [];
  state.note = null;
  state.index = Math.max(0, Math.min(index, limit));
  render();
}

function stopPlay() {
  state.playing = false;
  if (state.timer) {
    window.clearInterval(state.timer);
    state.timer = null;
  }
}

function togglePlay() {
  if (state.playing) {
    stopPlay();
    render();
    return;
  }
  if (state.index >= maxIndex()) state.index = 0;
  state.playing = true;
  state.timer = window.setInterval(function () {
    if (state.index >= maxIndex()) {
      stopPlay();
      render();
      return;
    }
    state.index += 1;
    render();
  }, 1100);
  render();
}

function showTip(node, tip) {
  dom.tooltip.textContent = "";
  dom.tooltip.appendChild(element("strong", "tip-title", tip.title));
  dom.tooltip.appendChild(document.createTextNode(tip.body));
  dom.tooltip.classList.add("open");
  const box = node.getBoundingClientRect();
  const width = dom.tooltip.offsetWidth;
  const height = dom.tooltip.offsetHeight;
  let left = box.left + box.width / 2 - width / 2;
  left = Math.min(left, window.innerWidth - width - 8);
  let top = box.top - height - 8;
  if (top < 8) top = box.bottom + 8;
  dom.tooltip.style.left = Math.max(8, left) + "px";
  dom.tooltip.style.top = top + "px";
}

function hideTooltip() { dom.tooltip.classList.remove("open"); }

function tipFor(node) {
  if (node.dataset.tip) return PANEL_TIPS[node.dataset.tip];
  if (node.dataset.term) return TOOLTIPS[node.dataset.term];
  return null;
}

["mouseover", "focusin"].forEach(function (name) {
  document.addEventListener(name, function (event) {
    const node = event.target.closest ? event.target.closest("[data-tip], [data-term]") : null;
    const tip = node ? tipFor(node) : null;
    if (tip) showTip(node, tip);
    else hideTooltip();
  });
});

["mouseout", "focusout", "scroll"].forEach(function (name) {
  document.addEventListener(name, hideTooltip, true);
});

window.addEventListener("pointerup", endStroke);
window.addEventListener("pointercancel", cancelStroke);

document.addEventListener("keydown", function (event) {
  const painting = !isQuiz() && state.mode === "solve";
  const onButton = event.target.tagName === "BUTTON";
  if (event.key === "Escape") { cancelStroke(); return; }
  if (painting && (event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "z") {
    event.preventDefault();
    undoPick();
    return;
  }
  if (painting && !onButton && (event.key === " " || event.key === "Spacebar")) {
    event.preventDefault();
    cycleTool();
    return;
  }
  if (painting && /^[1-9]$/.test(event.key)) {
    const res = view.resources[Number(event.key) - 1];
    if (res) {
      event.preventDefault();
      pickTool(res.id);
      return;
    }
  }
  if (onButton) {
    if (event.key !== "ArrowRight" && event.key !== "ArrowLeft" && event.key !== "Home" && event.key !== "End") return;
  }
  if (event.key === "ArrowRight") { stopPlay(); goTo(state.index + 1); event.preventDefault(); }
  else if (event.key === "ArrowLeft") { stopPlay(); goTo(state.index - 1); event.preventDefault(); }
  else if (event.key === "Home") { stopPlay(); goTo(0); event.preventDefault(); }
  else if (event.key === "End") { stopPlay(); goTo(maxIndex()); event.preventDefault(); }
});

dom.firstStep.addEventListener("click", function () { stopPlay(); goTo(0); });
dom.prevStep.addEventListener("click", function () { stopPlay(); goTo(state.index - 1); });
dom.nextStep.addEventListener("click", function () { stopPlay(); goTo(state.index + 1); });
dom.lastStep.addEventListener("click", function () { stopPlay(); goTo(maxIndex()); });
dom.playPause.addEventListener("click", togglePlay);
dom.undoPick.addEventListener("click", undoPick);
dom.finishBoard.addEventListener("click", finishAll);

EXAMPLES.forEach(function (example) {
  if (example.quiz) return;
  (example.variants || [null]).forEach(function (variant) {
    verifyView(buildView(example, variant));
  });
});

rebuildView();
render();
</script>

</body>
</html>
