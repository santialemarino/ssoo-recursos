<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23b45309%22%2F%3E%3Crect%20x%3D%229.5%22%20y%3D%229.5%22%20width%3D%2213%22%20height%3D%2213%22%20rx%3D%222.5%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.4%22%2F%3E%3Cg%20stroke%3D%22%23fff%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M13%209.5V5M19%209.5V5M13%2027v-4.5M19%2027v-4.5M9.5%2013H5M9.5%2019H5M27%2013h-4.5M27%2019h-4.5%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<title>Ciclo de instrucción e interrupciones</title>
<style>
  :root {
    --ink: #10151d;
    --ink-soft: #35404f;
    --muted: #66707f;
    --faint: #6b7484;
    --line: #e3e7ee;
    --line-strong: #c6ccd8;
    --page: #edf0f6;
    --card: #ffffff;

    --user: #1d4ed8;
    --user-soft: #e8eefc;
    --handler: #0d7a52;
    --handler-soft: #e2f3ec;
    --data: #6d4aad;
    --data-soft: #eee9f8;
    --alert: #c0392f;
    --alert-soft: #fbeae8;
    --accent: #a85a06;
    --accent-soft: #fdf0dc;
    --marked: #1c2534;
    --marked-soft: #e3e8f1;
    --stack: #6d4aad;
    --stack-soft: #eee9f8;

    --radius: 11px;
    --shadow: 0 1px 2px rgba(16, 21, 29, 0.05), 0 1px 8px rgba(16, 21, 29, 0.04);
    --fast: 160ms;
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html, body { margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    color: var(--ink);
    background: var(--page);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 9px;
    padding: 10px 14px 12px;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { margin: 0; font-weight: 640; }

  button {
    font: inherit;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--line-strong);
    border-radius: 7px;
    cursor: pointer;
    transition: background-color var(--fast) ease-out, border-color var(--fast) ease-out, color var(--fast) ease-out, transform var(--fast) ease-out;
  }

  button:hover:not([disabled]) { border-color: var(--faint); }
  button:active:not([disabled]) { transform: translateY(1px); }

  button:focus-visible, [tabindex]:focus-visible {
    outline: 3px solid var(--marked);
    outline-offset: 2px;
  }

  button[disabled] { opacity: 0.4; cursor: not-allowed; }

  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-variant-numeric: tabular-nums;
  }

  header { display: flex; flex-direction: column; gap: 8px; flex: 0 0 auto; }

  .head-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  .head-row.secondary:empty { display: none; }

  header > h1 { font-size: 16px; letter-spacing: -0.012em; color: var(--ink-soft); }

  .head-row .spacer { flex: 1; }

  .context-holder { position: relative; }

  #contextToggle {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 10px 5px 12px;
    font-size: 13px;
    box-shadow: var(--shadow);
  }

  #contextToggle .count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 19px;
    height: 19px;
    padding: 0 5px;
    border-radius: 10px;
    background: var(--page);
    color: var(--muted);
    font-size: 11.5px;
    font-weight: 700;
  }

  #contextToggle[aria-expanded="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  #contextToggle[aria-expanded="true"] .count { background: rgba(255, 255, 255, 0.22); color: #fff; }

  #contextToggle.fresh { border-color: var(--marked); background: var(--marked-soft); color: var(--marked); }
  #contextToggle.fresh .count { background: var(--marked); color: #fff; }

  .context-drawer {
    position: absolute;
    right: 0;
    top: calc(100% + 7px);
    z-index: 15;
    width: min(400px, calc(100vw - 30px));
    max-height: 60vh;
    overflow: auto;
    background: var(--card);
    border: 1px solid var(--line-strong);
    border-radius: var(--radius);
    box-shadow: 0 8px 26px rgba(16, 21, 29, 0.16);
    padding: 12px 14px;
  }

  .toggle { display: flex; }

  .toggle button {
    padding: 5px 13px;
    font-size: 13px;
    border-radius: 0;
    border-right-width: 0;
  }

  .toggle button:first-child { border-radius: 7px 0 0 7px; }
  .toggle button:last-child { border-radius: 0 7px 7px 0; border-right-width: 1px; }

  .toggle button[aria-pressed="true"] {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  .toggle-label { font-size: 13px; color: var(--muted); }

  .examples { display: flex; gap: 7px; flex-wrap: wrap; }

  .examples button {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 9px 5px 6px;
    font-size: 12.5px;
    text-align: left;
    box-shadow: var(--shadow);
  }

  .examples button .num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 19px;
    height: 19px;
    border-radius: 50%;
    background: var(--page);
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
  }

  .examples button[aria-current="true"] {
    background: var(--user);
    border-color: var(--user);
    color: #fff;
  }

  .examples button[aria-current="true"] .num { background: rgba(0, 0, 0, 0.22); color: #fff; }

  main {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: 1.1fr 0.8fr 0.82fr 0.62fr;
    gap: 9px;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .panel > h2 {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--faint);
    padding: 9px 12px 8px;
    border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }

  .panel > h2 .tip { border-bottom-color: var(--line); color: inherit; letter-spacing: inherit; text-transform: inherit; font-size: inherit; font-weight: inherit; }
  .panel > h2 .tip:hover { border-bottom-color: var(--faint); }

  .panel > h2::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--line-strong);
    flex: 0 0 auto;
  }

  .panel.memory > h2::before { background: var(--user); }
  .panel.stack > h2::before { background: var(--stack); }
  .panel.cycle > h2::before { background: var(--accent); }
  .panel.contexts > h2::before { background: var(--data); }

  main.with-contexts { grid-template-columns: 0.95fr 0.66fr 0.68fr 0.85fr 0.6fr; }
  main.no-stack { grid-template-columns: 1.15fr 0.9fr 0.7fr; }

  .context-box {
    border: 1.5px solid var(--data);
    background: var(--data-soft);
    border-radius: 8px;
    padding: 5px 8px 6px;
  }

  .panel.contexts .panel-body { display: grid; grid-template-columns: 1fr; gap: 7px; align-content: start; }

  .context-box h3 {
    font-size: 10.5px;
    letter-spacing: 0.03em;
    color: var(--data);
    margin-bottom: 3px;
    line-height: 1.2;
  }

  .context-box.changed { box-shadow: 0 0 0 2px var(--marked); animation: flash var(--fast) ease-out; }

  .context-box-empty { font-size: 11.5px; color: var(--muted); margin: 0; }

  .context-field {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    padding: 0 4px;
    border-radius: 3px;
    font-size: 12px;
  }

  .context-field + .context-field { margin-top: 2px; }
  .context-field .name { color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: 0.04em; }
  .context-field .val { font-weight: 700; }
  .context-field.changed { background: var(--marked-soft); }
  .context-field.changed .name, .context-field.changed .val { color: var(--marked); }

  .panel-body {
    padding: 10px 12px 12px;
    overflow: auto;
    min-height: 0;
    flex: 1 1 auto;
  }

  .region + .region { margin-top: 10px; }

  .panel-body.two-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-width: 0;
    gap: 10px 16px;
    align-content: start;
  }

  .panel-body.two-columns .region { margin-top: 0; }

  .region h3 {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 5px;
  }

  .region h3::before {
    content: "";
    width: 8px;
    height: 2px;
    border-radius: 1px;
    background: currentColor;
  }

  .region.user h3 { color: var(--user); }
  .region.handler h3 { color: var(--handler); }
  .region.data h3 { color: var(--data); }

  .cell {
    display: flex;
    gap: 10px;
    align-items: baseline;
    padding: 2px 7px;
    border-left: 3px solid transparent;
    border-radius: 4px;
    font-size: 13.5px;
    color: var(--ink-soft);
  }

  .cell + .cell { margin-top: 1px; }
  .cell .addr { color: var(--faint); min-width: 3ch; text-align: right; }
  .cell .text { flex: 1; white-space: nowrap; }
  .cell .value { font-weight: 650; color: var(--ink); min-width: 2ch; text-align: right; }
  .cell .cell-label { flex: 1; font-size: 11.5px; color: var(--muted); }

  .cell.executed { border-left-color: var(--line-strong); }
  .cell.suspended { border-left: 3px dashed var(--accent); background: var(--accent-soft); }

  .cell.current { color: var(--ink); font-weight: 600; }
  .region.user .cell.current { background: var(--user-soft); border-left-color: var(--user); }
  .region.handler .cell.current { background: var(--handler-soft); border-left-color: var(--handler); }
  .region.data .cell.changed { background: var(--marked-soft); border-left-color: var(--marked); animation: flash var(--fast) ease-out; }

  .cell .tip { border-bottom-color: var(--line-strong); }
  .cell .tip:hover { border-bottom-color: currentColor; }


  .reg-grid { display: grid; gap: 5px; }
  .reg-grid.general { grid-template-columns: repeat(3, 1fr); }
  .reg-grid.pointers { grid-template-columns: 1fr 1fr; margin-top: 5px; }
  .reg-grid.general .reg { flex-direction: column; align-items: flex-start; gap: 0; }

  .reg {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    padding: 4px 9px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #fcfdff;
  }

  .reg .name { color: var(--faint); font-size: 11px; letter-spacing: 0.07em; font-weight: 650; }
  .reg .val { font-weight: 700; font-size: 15px; }
  .reg.pointer { border-color: var(--line-strong); background: var(--card); border-left: 3px solid var(--line-strong); }
  .reg.pointer .name { color: var(--ink-soft); }
  .reg.ip { border-left-color: var(--user); }
  .reg.ip .name { color: var(--user); }
  .reg.sp { border-left-color: var(--stack); }
  .reg.sp .name { color: var(--stack); }
  .reg.changed { background: var(--marked-soft); border-color: var(--marked); animation: flash var(--fast) ease-out; }
  .reg.changed .name { color: var(--marked); }

  .psw { margin-top: 7px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 9px; }
  .psw h3 { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); }
  .psw-bits { display: flex; gap: 6px; margin-top: 6px; }

  .bit {
    flex: 1;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 6px;
    text-align: center;
    background: #fcfdff;
  }

  .bit .name { display: block; font-size: 10px; letter-spacing: 0.08em; color: var(--faint); font-weight: 650; }
  .bit .val { font-weight: 700; font-size: 14px; }
  .bit.on { border-color: var(--handler); background: var(--handler-soft); }
  .bit.on .val { color: var(--handler); }
  .bit.off { border-color: var(--alert); background: var(--alert-soft); }
  .bit.off .val { color: var(--alert); }
  .bit.user { border-color: var(--user); background: var(--user-soft); }
  .bit.user .val { color: var(--user); }
  .bit.kernel { border-color: var(--handler); background: var(--handler-soft); }
  .bit.kernel .val { color: var(--handler); }
  .bit.changed { box-shadow: 0 0 0 2px var(--marked); animation: flash var(--fast) ease-out; }

  .psw-note { font-size: 11px; color: var(--muted); margin: 6px 0 0; }

  .panel.stack .panel-body { display: flex; flex-direction: column; justify-content: center; }

  .stack-graphic { display: flex; flex-direction: column; padding: 0 6px; }

  .stack-slot { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
  .stack-slot:last-child { margin-bottom: 0; }

  .stack-graphic.dense .stack-slot { margin-bottom: 2px; }
  .stack-graphic.dense .disc { padding: 10px 13px 5px; }
  .stack-graphic.dense .disc.ghost,
  .stack-graphic.dense .disc.base { padding: 8px 13px 4px; }
  .stack-graphic.dense .shell.cap { height: 10px; }
  .stack-graphic.dense .shell.body { top: 5px; bottom: 5px; }
  .stack-graphic.dense .disc .label { font-size: 10px; line-height: 1.15; margin-top: 0; }
  .stack-graphic.dense .disc .value { font-size: 12.5px; }
  .stack-graphic.dense .disc .addr { font-size: 10.5px; }
  .stack-graphic.dense .sp-marker { flex-basis: 32px; font-size: 11px; }

  .sp-marker {
    flex: 0 0 40px;
    font-size: 12px;
    font-weight: 800;
    color: var(--stack);
    text-align: right;
    letter-spacing: -0.01em;
  }

  .disc {
    --fill: var(--card);
    --fill-top: #fbfcfe;
    --stroke: var(--line-strong);
    flex: 1;
    min-width: 0;
    position: relative;
    padding: 19px 20px 12px;
  }

  .disc .shell {
    position: absolute;
    left: 0;
    right: 0;
    border: 1.5px solid var(--stroke);
  }

  .disc .shell.body {
    top: 7px;
    bottom: 7px;
    background: var(--fill);
    border-top: 0;
    border-bottom: 0;
  }

  .disc .shell.cap {
    height: 14px;
    border-radius: 50%;
    background: var(--fill);
  }

  .disc .shell.cap.bottom { bottom: 0; }
  .disc .shell.cap.top { top: 0; background: var(--fill-top); }

  .disc .content { position: relative; }

  .disc.user { --fill: var(--user-soft); --fill-top: #f1f5fd; --stroke: var(--user); }
  .disc.handler { --fill: var(--handler-soft); --fill-top: #eef8f3; --stroke: var(--handler); }
  .disc.hw { --fill: var(--alert-soft); --fill-top: #fdf1f0; --stroke: var(--alert); }
  .disc.base { --fill: var(--stack-soft); --fill-top: #f5f1fc; --stroke: var(--stack); }
  .disc.ghost { --fill: var(--page); --fill-top: #f1f4f9; --stroke: var(--line-strong); }

  .disc.ghost .shell { border-style: dashed; }
  .disc.ghost { padding: 17px 20px 10px; color: var(--muted); font-size: 11.5px; text-align: center; }

  .disc.base { padding: 15px 20px 8px; color: var(--stack); font-size: 12px; font-weight: 650; text-align: center; }

  .disc .content { text-align: center; }
  .disc .top-row { display: flex; justify-content: center; gap: 10px; align-items: baseline; }
  .disc .addr { color: var(--muted); font-size: 11.5px; }
  .disc .value { font-weight: 700; font-size: 14px; }
  .disc .label { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.3; }

  .disc.changed { --stroke: var(--marked); --fill-top: var(--marked-soft); animation: flash var(--fast) ease-out; }
  .disc.changed .shell { border-width: 2px; }
  .disc.empty .value { color: var(--faint); font-weight: 400; font-size: 11px; }

  .stack-empty { font-size: 13px; color: var(--muted); margin: 14px 6px 0; text-align: center; }

  .stack-legend { font-size: 11.5px; color: var(--muted); margin: 12px 0 0; }

  .context-line { font-size: 13.5px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .context-line:first-child { padding-top: 0; }
  .context-line:last-child { border-bottom: 0; padding-bottom: 0; }

  .context-line .tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 4px;
    padding: 1px 6px;
    margin-bottom: 5px;
  }

  .context-line.fresh { animation: flash var(--fast) ease-out; }

  .context-empty { font-size: 13px; color: var(--muted); margin: 10px 0 0; }

  .context-intro {
    font-size: 12.5px;
    color: var(--muted);
    margin: 0 0 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
  }

  footer { flex: 0 0 254px; display: block; min-height: 0; }

  .cycle-body { flex: 1 1 auto; min-height: 0; overflow: auto; }

  .narration-panel { display: flex; flex-direction: column; min-height: 0; height: 100%; }

  .narration-head {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 9px 12px 8px;
    border-bottom: 1px solid var(--line);
  }

  .narration-head .title { font-weight: 660; font-size: 14.5px; }
  .narration-head .subtitle { font-size: 13px; color: var(--muted); flex: 1; min-width: 160px; }

  .variants { display: flex; gap: 6px; flex-wrap: wrap; }

  .variants button { padding: 4px 11px; font-size: 12.5px; }

  .variants button[aria-pressed="true"] {
    background: var(--data);
    border-color: var(--data);
    color: #fff;
  }

  .counter {
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    padding: 3px 10px;
    border: 1px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 6px;
  }

  .counter-label { font-size: 11px; font-weight: 700; letter-spacing: 0.03em; color: var(--accent); white-space: nowrap; }
  .counter-value { font-size: 16px; font-weight: 800; color: var(--accent); }

  .kernel-badge {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--handler);
    background: var(--handler-soft);
    border: 1px solid var(--handler);
    border-radius: 5px;
    padding: 2px 8px;
  }

  .proc-state {
    margin-left: auto;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-radius: 5px;
    padding: 1px 7px;
    border: 1px solid currentColor;
  }
  .proc-state.running { color: var(--user); background: var(--user-soft); }
  .proc-state.ready { color: var(--handler); background: var(--handler-soft); }
  .proc-state.blocked { color: var(--alert); background: var(--alert-soft); }

  .narration-body {
    padding: 9px 12px 3px;
    flex: 1 1 auto;
    min-height: 40px;
    overflow-y: auto;
  }

  .instruction-help {
    display: flex;
    align-items: baseline;
    gap: 9px;
    margin: 0 0 8px;
    padding: 5px 9px;
    background: var(--page);
    border-radius: 7px;
    font-size: 13px;
    color: var(--ink-soft);
  }

  .instruction-help .mnemonic {
    font-weight: 700;
    font-size: 13px;
    color: var(--user);
    flex: 0 0 auto;
  }

  .narration-text { font-size: 15.5px; margin: 0; color: var(--ink); }
  .narration-note { font-size: 14px; color: var(--muted); margin: 7px 0 0; }

  .context-card {
    padding: 7px 11px;
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    border-radius: 0 7px 7px 0;
    font-size: 14px;
    animation: flash var(--fast) ease-out;
  }

  .side-panel.callout-slot {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 8px 18px;
    padding-top: 5px;
    min-height: 0;
    overflow-y: auto;
  }

  .side-panel.callout-slot > * { flex: 1 1 280px; min-width: 0; }

  .closing {
    padding: 0 0 0 11px;
    border-left: 3px solid var(--data);
  }

  .closing .tag {
    display: block;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 800;
    color: var(--data);
    margin-bottom: 3px;
  }

  .closing { overflow-x: auto; }

  @media (max-width: 1150px) {

  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

<header>

    </div>
    <div class="context-holder">

      <div class="context-drawer" id="contextDrawer" hidden></div>
    </div>
  </div>
  <div class="head-row secondary">
    <div class="variants" id="variantList" hidden role="group" aria-label="Mecanismo"></div>
    <span class="counter" id="counter" hidden></span>
  </div>
</header>

<main>
  <section class="panel memory">
    <h2><button type="button" class="tip" data-tip="panel:memory">Memoria</button></h2>
    <div class="panel-body" id="memoryPanel"></div>
  </section>

  <section class="panel registers">
    <h2><button type="button" class="tip" data-tip="panel:registers">Registros</button></h2>
    <div class="panel-body" id="registerPanel"></div>
  </section>

  <section class="panel stack" id="stackSection">
    <h2><button type="button" class="tip" data-tip="panel:stack">Pila del sistema</button></h2>
    <div class="panel-body" id="stackPanel"></div>
  </section>

  <section class="panel contexts" id="contextsSection" hidden>
    <h2><button type="button" class="tip" id="contextsHeading" data-tip="panel:contexts"></button></h2>
    <div class="panel-body" id="contextsPanel"></div>
  </section>

  <section class="panel cycle">
    <h2><button type="button" class="tip" data-tip="panel:cycle">Ciclo</button></h2>
    <div class="cycle-body">
      <div class="stages" id="stagePanel"></div>
    </div>
  </section>
</main>

<footer>
  <section class="panel narration-panel">
    <div class="narration-head">
      <span class="title" id="exampleTitle"></span>
      <span class="subtitle" id="exampleSubtitle"></span>
      <span class="kernel-badge" id="kernelBadge" hidden></span>
    </div>
    <div class="narration-body" id="narrationPanel" aria-live="polite"></div>
    <div class="side-panel" id="sidePanel" hidden></div>
    <div class="progress-row">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="progress" id="progress"></span>
    </div>
    <div class="controls">
      <button type="button" class="small" id="firstStep"></button>
      <button type="button" class="big" id="prevStep"></button>
      <button type="button" class="big primary" id="nextStep"></button>
      <button type="button" class="small" id="lastStep"></button>
      <button type="button" class="small" id="playPause"></button>
    </div>
  </section>

</footer>

<div id="tooltip" role="tooltip"></div>

<script id="engine">
const REGISTER_PATTERN = /^(AX|BX|CX)$/;
const MEMORY_PATTERN = /^\[(\d+)\]$/;
const MINIMUM_STACK_SLOTS = 3;

function parseOperand(raw) {
  const text = raw.trim();
  const memory = text.match(MEMORY_PATTERN);
  if (memory) return { type: "memory", address: Number(memory[1]) };
  if (REGISTER_PATTERN.test(text.toUpperCase())) return { type: "register", name: text.toUpperCase() };
  return { type: "immediate", value: Number(text) };
}

function parseInstruction(address, text) {
  const normalized = text.trim().replace(/\s+/g, " ");
  const space = normalized.indexOf(" ");
  const op = (space === -1 ? normalized : normalized.slice(0, space)).toUpperCase();
  const rest = space === -1 ? "" : normalized.slice(space + 1);
  const operands = rest === "" ? [] : rest.split(",").map(parseOperand);
  const base = { address, text: normalized, op };

  if (op === "MOV") {
    const [target, source] = operands;
    if (target.type === "memory") return { ...base, form: "MOV_STORE", target, source };
    if (source.type === "memory") return { ...base, form: "MOV_LOAD", target, source };
    return { ...base, form: "MOV_IMM", target, source };
  }
  if (op === "ADD" || op === "SUB" || op === "CMP") {
    const [target, source] = operands;
    const suffix = source.type === "memory" ? "LOAD" : source.type === "register" ? "REG" : "IMM";
    return { ...base, form: op + "_" + suffix, target, source };
  }
  if (op === "JMP" || op === "JZ") return { ...base, form: op, target: operands[0].value };
  if (op === "PUSH" || op === "POP") return { ...base, form: op, target: operands[0] };
  if (op === "SYSCALL") return { ...base, form: "SYSCALL", service: operands[0].value };
  return { ...base, form: op };
}

function buildPrograms(example) {
  const programs = {};
  const byAddress = {};
  Object.keys(example.programs).forEach(function (key) {
    const source = example.programs[key];
    const instructions = source.lines.map(function (line, index) {
      return parseInstruction(source.origin + index, line);
    });
    programs[key] = { ...source, key, instructions };
    instructions.forEach(function (instruction) {
      byAddress[instruction.address] = { instruction, programKey: key };
    });
  });
  return { programs, byAddress };
}

function fill(template, values) {
  return String(template).replace(/\{(\w+)\}/g, function (match, key) {
    return values[key] === undefined ? match : String(values[key]);
  });
}

function createState(example) {
  const data = {};
  Object.keys(example.initialData || {}).forEach(function (address) {
    data[address] = example.initialData[address];
  });
  return {
    AX: 0, BX: 0, CX: 0,
    IP: example.programs.P1.origin,
    SP: STACK_BASE,
    IF: example.initialIF,
    ZF: 0,
    MODE: "user",
    data: data,
    stack: [],
    visited: {},
    pending: [],
    halted: false,
    diskReads: 0,
    kernelInstructions: 0,
    contexts: JSON.parse(JSON.stringify(example.initialContexts || {})),
    procState: Object.assign({}, example.procState && example.procState.initial)
  };
}

function captureContext(state) {
  return {
    AX: state.AX, BX: state.BX, CX: state.CX,
    IP: state.IP, SP: state.SP,
    IF: state.IF, ZF: state.ZF, MODE: state.MODE
  };
}

function cloneState(state) {
  return {
    AX: state.AX, BX: state.BX, CX: state.CX,
    IP: state.IP, SP: state.SP,
    IF: state.IF, ZF: state.ZF, MODE: state.MODE,
    data: { ...state.data },
    stack: state.stack.map(function (cell) { return { ...cell }; }),
    visited: { ...state.visited },
    pending: state.pending.slice(),
    halted: state.halted,
    diskReads: state.diskReads,
    kernelInstructions: state.kernelInstructions,
    contexts: JSON.parse(JSON.stringify(state.contexts)),
    procState: Object.assign({}, state.procState)
  };
}

function pswSummary(state) {
  return "IF=" + state.IF + " · ZF=" + state.ZF + " · " + MODE_LABELS[state.MODE];
}

function readOperand(state, operand) {
  if (operand.type === "register") return state[operand.name];
  if (operand.type === "memory") return state.data[operand.address] || 0;
  return operand.value;
}

function operandLabel(operand) {
  if (operand === undefined || operand === null) return "";
  if (typeof operand === "number") return String(operand);
  if (operand.type === "register") return operand.name;
  if (operand.type === "memory") return String(operand.address);
  return String(operand.value);
}

function operandVariant(instruction) {
  const form = instruction.form;
  if (form === "MOV_LOAD" || form === "ADD_LOAD" || form === "SUB_LOAD" || form === "CMP_LOAD") return "load";
  if (form === "MOV_STORE") return "store";
  if (form === "POP" || form === "IRET") return "stack";
  if (form === "PUSH" || form === "ADD_REG" || form === "SUB_REG" || form === "CMP_REG") return "register";
  if (form === "MOV_IMM" || form === "ADD_IMM" || form === "SUB_IMM" || form === "CMP_IMM") return "immediate";
  return "none";
}

function highestPriority(pending) {
  return pending.slice().sort(function (a, b) {
    return INTERRUPTS[b].priority - INTERRUPTS[a].priority;
  })[0];
}

function buildTrace(example) {
  const built = buildPrograms(example);
  const state = createState(example);
  const steps = [];
  let group = 0;

  function programKeyAt(address) {
    const entry = built.byAddress[address];
    return entry ? entry.programKey : null;
  }

  function emit(step) {
    steps.push({
      kind: step.kind,
      stage: step.stage || null,
      serviceStep: step.serviceStep || null,
      group: step.group === undefined ? null : step.group,
      narration: step.narration,
      note: step.note || null,
      tag: step.tag || null,
      compactNarration: step.compactNarration || null,
      compactNote: step.compactNote || null,
      compactTag: step.compactTag || null,
      silent: step.silent === true,
      highlight: step.highlight || null,
      state: cloneState(state)
    });
  }

  function noteFor(key) {
    return (example.notes && example.notes[key]) || null;
  }

  function raiseInterruptsAt(address, stage) {
    const raised = [];
    (example.interrupts || []).forEach(function (entry) {
      if (entry.atAddress === address && entry.atStage === stage && state.pending.indexOf(entry.id) === -1) {
        state.pending.push(entry.id);
        raised.push(entry.id);
      }
    });
    return raised.map(function (id) {
      return fill(NARRATION.raised, { name: INTERRUPTS[id].name });
    }).join("");
  }

  function enterKernel(options) {
    const texts = options.texts;
    serviceCount += 1;
    const prefix = options.noteKey;
    const occurrence = serviceCount;

    function serviceNote(step) {
      return noteFor(prefix + "." + step + "." + occurrence) || noteFor(prefix + "." + step);
    }

    emit({
      kind: "service", serviceStep: "identify", highlight: options.highlight, tag: "HW",
      narration: fill(texts.identify, { name: options.name }),
      note: serviceNote("identify"),
      compactNarration: fill(texts.identify, { name: options.name }),
      compactNote: serviceNote("identify"), compactTag: "HW"
    });

    const savedPsw = { IF: state.IF, ZF: state.ZF, MODE: state.MODE };
    state.SP = state.SP - 1;
    state.stack.push({
      address: state.SP,
      value: pswSummary(state),
      label: fill(STACK_LABELS.psw, { owner: options.owner }),
      saved: savedPsw,
      tone: "hw"
    });
    emit({
      kind: "service", serviceStep: "pushPsw", highlight: options.highlight, tag: "HW",
      narration: fill(texts.pushPsw, { addr: state.SP }),
      note: serviceNote("pushPsw"),
      compactNarration: fill(texts.pushPsw, { addr: state.SP }),
      compactNote: serviceNote("pushPsw"), compactTag: "HW"
    });

    const savedIp = state.IP;
    state.SP = state.SP - 1;
    state.stack.push({
      address: state.SP,
      value: savedIp,
      label: fill(STACK_LABELS.ip, { owner: options.owner }),
      tone: "hw",
      kind: "ip"
    });
    emit({
      kind: "service", serviceStep: "pushIp", highlight: options.highlight, tag: "HW",
      narration: fill(texts.pushIp, { ip: savedIp, addr: state.SP }),
      note: serviceNote("pushIp"),
      compactNarration: fill(texts.pushIp, { ip: savedIp, addr: state.SP }),
      compactNote: serviceNote("pushIp"), compactTag: "HW"
    });

    state.MODE = "kernel";
    state.IF = 0;
    state.IP = options.handler;
    const switchValues = { handler: options.handler, name: options.name };
    emit({
      kind: "service", serviceStep: "switchMode",
      highlight: { address: options.handler, programKey: programKeyAt(options.handler) },
      tag: "HW",
      narration: fill(texts.switchMode, switchValues),
      note: serviceNote("switchMode"),
      compactNarration: fill(texts.switchMode, switchValues),
      compactNote: serviceNote("switchMode"), compactTag: "HW"
    });
  }

  let serviceCount = 0;
  let guard = 0;
  while (!state.halted && guard < 2000) {
    guard += 1;
    group += 1;

    const address = state.IP;
    const entry = built.byAddress[address];
    if (!entry) break;

    (example.procState && example.procState.events || []).forEach(function (ev) {
      if (ev.atAddress === address) state.procState[ev.program] = ev.to;
    });

    const instruction = entry.instruction;
    const programKey = entry.programKey;
    const highlight = { address: address, programKey: programKey };
    const tag = (example.tags && example.tags[address]) || null;
    const ipBefore = state.IP;

    let raisedDuringInstruction = "";

    state.visited[address] = true;
    if (state.MODE === "kernel") state.kernelInstructions += 1;
    state.IP = address + 1;
    const raisedAtFetch = raiseInterruptsAt(address, "fetch");
    raisedDuringInstruction += raisedAtFetch;
    emit({
      kind: "stage", stage: "fetch", group: group, highlight: highlight, tag: tag,
      narration: fill(NARRATION.fetch, { addr: address, instr: instruction.text, ipAfter: state.IP }) + raisedAtFetch,
      note: noteFor(address + ".fetch")
    });

    const decodeValues = {
      value: operandLabel(instruction.source),
      dest: operandLabel(instruction.target),
      src: operandLabel(instruction.source),
      a: operandLabel(instruction.target),
      b: operandLabel(instruction.source),
      reg: operandLabel(instruction.target),
      target: instruction.target,
      n: instruction.service,
      service: instruction.service === undefined ? "" : SYSCALLS[instruction.service].name.toLowerCase()
    };

    const raisedAtDecode = raiseInterruptsAt(address, "decode");
    raisedDuringInstruction += raisedAtDecode;
    emit({
      kind: "stage", stage: "decode", group: group, highlight: highlight, tag: tag,
      narration: fill(NARRATION.decode[instruction.form], decodeValues) + raisedAtDecode,
      note: noteFor(address + ".decode")
    });

    const disk = example.disk;
    if (disk && instruction.source && instruction.source.type === "memory" &&
        instruction.source.address === disk.statusCell) {
      state.diskReads += 1;
      state.data[disk.statusCell] = state.diskReads >= disk.readyAfterReads ? 1 : 0;
    }

    const variant = operandVariant(instruction);
    const operandValues = {
      src: instruction.source ? operandLabel(instruction.source) : "",
      value: instruction.source && instruction.source.type === "memory" ? readOperand(state, instruction.source) : ""
    };
    const raisedAtOperands = raiseInterruptsAt(address, "operands");
    raisedDuringInstruction += raisedAtOperands;
    emit({
      kind: "stage", stage: "operands", group: group, highlight: highlight, tag: tag,
      narration: fill(NARRATION.operands[variant], operandValues) + raisedAtOperands,
      note: noteFor(address + ".operands")
    });

    const pendingWrite = { form: instruction.form };
    let executeNarration = "";
    let writebackNarration = "";
    let compactNarration = "";

    if (instruction.form === "MOV_IMM" || instruction.form === "MOV_LOAD") {
      const value = readOperand(state, instruction.source);
      pendingWrite.register = instruction.target.name;
      pendingWrite.value = value;
      executeNarration = fill(NARRATION.execute[instruction.form], { value: value });
      writebackNarration = fill(NARRATION.writeback.REGISTER, { dest: instruction.target.name, value: value });
      compactNarration = fill(NARRATION.compact[instruction.form], {
        instr: instruction.text, value: value, dest: instruction.target.name,
        src: instruction.source.type === "memory" ? instruction.source.address : ""
      });
    } else if (instruction.form === "MOV_STORE") {
      const value = readOperand(state, instruction.source);
      pendingWrite.memory = instruction.target.address;
      pendingWrite.value = value;
      executeNarration = fill(NARRATION.execute.MOV_STORE, { value: value });
      writebackNarration = fill(NARRATION.writeback.MEMORY, { dest: instruction.target.address, value: value });
      compactNarration = fill(NARRATION.compact.MOV_STORE, { instr: instruction.text, value: value, dest: instruction.target.address });
    } else if (instruction.form.indexOf("ADD_") === 0 || instruction.form.indexOf("SUB_") === 0) {
      const left = state[instruction.target.name];
      const right = readOperand(state, instruction.source);
      const isAdd = instruction.form.indexOf("ADD_") === 0;
      const result = isAdd ? left + right : left - right;
      pendingWrite.register = instruction.target.name;
      pendingWrite.value = result;
      executeNarration = fill(NARRATION.execute[isAdd ? "ADD" : "SUB"], { left: left, right: right, result: result });
      writebackNarration = fill(NARRATION.writeback.REGISTER, { dest: instruction.target.name, value: result });
      compactNarration = fill(NARRATION.compact[isAdd ? "ADD" : "SUB"], {
        instr: instruction.text, dest: instruction.target.name, before: left, after: result
      });
    } else if (instruction.form.indexOf("CMP_") === 0) {
      const left = state[instruction.target.name];
      const right = readOperand(state, instruction.source);
      const equal = left === right;
      pendingWrite.zf = equal ? 1 : 0;
      state.ZF = equal ? 1 : 0;
      executeNarration = fill(NARRATION.execute[equal ? "CMP_EQUAL" : "CMP_DIFFERENT"], { left: left, right: right });
      writebackNarration = NARRATION.writeback.CMP;
      compactNarration = fill(NARRATION.compact.CMP, { instr: instruction.text, zf: equal ? 1 : 0 });
    } else if (instruction.form === "JMP" || instruction.form === "JZ") {
      const taken = instruction.form === "JMP" || state.ZF === 1;
      pendingWrite.jump = taken ? instruction.target : null;
      executeNarration = instruction.form === "JMP"
        ? NARRATION.execute.JMP
        : NARRATION.execute[taken ? "JZ_TAKEN" : "JZ_NOT_TAKEN"];
      writebackNarration = taken
        ? fill(NARRATION.writeback.JUMP_TAKEN, { ipBefore: state.IP, ipAfter: instruction.target })
        : NARRATION.writeback.JUMP_NOT_TAKEN;
      compactNarration = instruction.form === "JMP"
        ? fill(NARRATION.compact.JMP, { instr: instruction.text, target: instruction.target })
        : fill(NARRATION.compact[taken ? "JZ_TAKEN" : "JZ_NOT_TAKEN"], {
            instr: instruction.text, target: instruction.target, ipAfter: state.IP
          });
    } else if (instruction.form === "PUSH") {
      const value = state[instruction.target.name];
      const owner = built.programs[programKey].stackName || built.programs[programKey].shortName;
      const label = (example.stackLabels && example.stackLabels[address])
        || fill(STACK_LABELS.register, { reg: instruction.target.name, owner: owner });
      const spBefore = state.SP;
      state.SP = state.SP - 1;
      state.stack.push({ address: state.SP, value: null, label: label, tone: built.programs[programKey].kind });
      pendingWrite.stackValue = value;
      executeNarration = fill(NARRATION.execute.PUSH, { spBefore: spBefore, spAfter: state.SP });
      writebackNarration = fill(NARRATION.writeback.PUSH, { value: value, addr: state.SP });
      compactNarration = fill(NARRATION.compact.PUSH, { instr: instruction.text, value: value, addr: state.SP, spAfter: state.SP });
    } else if (instruction.form === "POP") {
      const cell = state.stack[state.stack.length - 1];
      const value = cell.value;
      const spBefore = state.SP;
      state.stack.pop();
      state.SP = state.SP + 1;
      pendingWrite.register = instruction.target.name;
      pendingWrite.value = value;
      executeNarration = fill(NARRATION.execute.POP, { value: value, spBefore: spBefore, spAfter: state.SP });
      writebackNarration = fill(NARRATION.writeback.REGISTER, { dest: instruction.target.name, value: value });
      compactNarration = fill(NARRATION.compact.POP, { instr: instruction.text, value: value, dest: instruction.target.name, spAfter: state.SP });
    } else if (instruction.form === "STI" || instruction.form === "CLI") {
      if (state.MODE === "user") {
        pendingWrite.halt = true;
        executeNarration = NARRATION.execute.REFUSED;
        writebackNarration = NARRATION.writeback.REFUSED;
        compactNarration = fill(NARRATION.compact.REFUSED, { instr: instruction.text });
      } else {
        pendingWrite.flag = instruction.form === "STI" ? 1 : 0;
        executeNarration = NARRATION.execute[instruction.form];
        writebackNarration = fill(NARRATION.writeback.FLAG, { value: pendingWrite.flag });
        compactNarration = fill(NARRATION.compact[instruction.form], { instr: instruction.text });
      }
    } else if (instruction.form === "SYSCALL") {
      const requested = SYSCALLS[instruction.service];
      pendingWrite.syscall = instruction.service;
      executeNarration = NARRATION.execute.SYSCALL;
      writebackNarration = NARRATION.writeback.SYSCALL;
      compactNarration = fill(NARRATION.compact.SYSCALL, {
        instr: instruction.text, n: instruction.service, service: requested.name.toLowerCase()
      });
    } else if (instruction.form === "IRET") {
      const spBefore = state.SP;
      const ipCell = state.stack.pop();
      const pswCell = state.stack.pop();
      state.SP = state.SP + 2;
      pendingWrite.iret = { ip: ipCell.value, psw: pswCell.saved };
      executeNarration = fill(NARRATION.execute.IRET, { ip: ipCell.value, spBefore: spBefore, spAfter: state.SP });
      const modeLabel = MODE_LABELS[pswCell.saved.MODE];
      const ifState = pswCell.saved.IF === 1 ? "habilitadas" : "deshabilitadas";
      writebackNarration = fill(NARRATION.writeback.IRET, { ip: ipCell.value, mode: modeLabel, ifState: ifState });
      compactNarration = fill(NARRATION.compact.IRET, { instr: instruction.text, ip: ipCell.value, mode: modeLabel, ifState: ifState });
    } else if (instruction.form === "HALT") {
      pendingWrite.halt = true;
      executeNarration = NARRATION.execute.HALT;
      writebackNarration = NARRATION.writeback.HALT;
      compactNarration = fill(NARRATION.compact.HALT, { instr: instruction.text });
    } else {
      throw new Error("Unsupported instruction form: " + instruction.form);
    }

    const raisedAtExecute = raiseInterruptsAt(address, "execute");
    raisedDuringInstruction += raisedAtExecute;
    emit({
      kind: "stage", stage: "execute", group: group, highlight: highlight, tag: tag,
      narration: executeNarration + raisedAtExecute,
      note: noteFor(address + ".execute")
    });

    if (pendingWrite.register !== undefined) state[pendingWrite.register] = pendingWrite.value;
    if (pendingWrite.memory !== undefined) state.data[pendingWrite.memory] = pendingWrite.value;
    if (pendingWrite.stackValue !== undefined) state.stack[state.stack.length - 1].value = pendingWrite.stackValue;
    if (pendingWrite.jump) state.IP = pendingWrite.jump;
    if (pendingWrite.flag !== undefined) state.IF = pendingWrite.flag;
    if (pendingWrite.iret) {
      state.IP = pendingWrite.iret.ip;
      state.IF = pendingWrite.iret.psw.IF;
      state.ZF = pendingWrite.iret.psw.ZF;
      state.MODE = pendingWrite.iret.psw.MODE;
    }
    if (pendingWrite.halt) state.halted = true;

    const raisedAtWriteback = raiseInterruptsAt(address, "writeback");
    raisedDuringInstruction += raisedAtWriteback;
    emit({
      kind: "stage", stage: "writeback", group: group, highlight: highlight, tag: tag,
      narration: writebackNarration + raisedAtWriteback,
      note: noteFor(address + ".writeback"),
      compactNarration: compactNarration + raisedDuringInstruction,
      compactNote: noteFor(address + ".compact"),
      compactTag: tag
    });

    if (state.halted) break;

    const dma = example.dma;
    if (dma && dma.afterAddress === address) {
      dma.writes.forEach(function (write, index) {
        state.data[write.cell] = write.value;
        emit({
          kind: "dma", highlight: null, tag: "HW",
          narration: fill(NARRATION.dma.transfer, { cell: write.cell, value: write.value, n: index + 1, total: dma.writes.length }),
          note: noteFor("dma." + (index + 1)),
          compactNarration: fill(NARRATION.dma.transfer, { cell: write.cell, value: write.value, n: index + 1, total: dma.writes.length }),
          compactNote: noteFor("dma." + (index + 1)), compactTag: "HW"
        });
      });
      state.pending.push(dma.raise);
    }

    if (pendingWrite.syscall !== undefined) {
      const requested = SYSCALLS[pendingWrite.syscall];
      enterKernel({
        texts: NARRATION.syscallService,
        noteKey: "syscall",
        name: requested.name,
        handler: requested.routine,
        owner: built.programs[programKey].stackName || built.programs[programKey].shortName,
        highlight: highlight
      });
    }

    let checkNarration;
    let serviced = null;
    if (state.pending.length === 0) {
      checkNarration = NARRATION.check[state.IF === 1 ? "idleEnabled" : "idleDisabled"];
    } else if (state.IF === 0) {
      checkNarration = fill(NARRATION.check.pendingBlocked, { name: INTERRUPTS[highestPriority(state.pending)].name });
    } else {
      serviced = highestPriority(state.pending);
      checkNarration = state.pending.length > 1
        ? fill(NARRATION.check.servicePriority, { name: INTERRUPTS[serviced].name })
        : fill(NARRATION.check.service, { name: INTERRUPTS[serviced].name, addr: address });
    }

    const forced = (example.forceCheck || []).indexOf(address) !== -1;
    emit({
      kind: "check", stage: "check", highlight: highlight,
      narration: checkNarration,
      note: noteFor(address + ".check"),
      compactNarration: checkNarration,
      compactNote: noteFor(address + ".check"),
      silent: !serviced && state.pending.length === 0 && !forced
    });

    if (serviced) {
      const interrupt = INTERRUPTS[serviced];
      state.pending = state.pending.filter(function (id) { return id !== serviced; });
      enterKernel({
        texts: NARRATION.service,
        noteKey: "service",
        name: interrupt.name,
        handler: interrupt.handler,
        owner: built.programs[programKey].stackName || built.programs[programKey].shortName,
        highlight: highlight
      });
    }

    (example.switches || []).forEach(function (change) {
      if (change.afterAddress !== address) return;
      const labels = example.contextNames || {};
      const savedName = labels[change.save] || change.save;
      const loadedName = labels[change.load] || change.load;

      emit({
        kind: "switch", tag: "SO", highlight: highlight,
        narration: change.decide,
        compactNarration: change.decide, compactTag: "SO"
      });

      state.contexts[change.save] = captureContext(state);
      emit({
        kind: "switch", tag: "SO", highlight: highlight,
        narration: fill(NARRATION.contextSwitch.save, { name: savedName }),
        note: noteFor("switch.save." + change.save),
        compactNarration: fill(NARRATION.contextSwitch.save, { name: savedName }),
        compactNote: noteFor("switch.save." + change.save), compactTag: "SO"
      });

      const loaded = state.contexts[change.load];
      state.AX = loaded.AX; state.BX = loaded.BX; state.CX = loaded.CX;
      state.IP = loaded.IP; state.SP = loaded.SP;
      state.IF = loaded.IF; state.ZF = loaded.ZF; state.MODE = loaded.MODE;
      emit({
        kind: "switch", tag: "SO",
        highlight: { address: loaded.IP, programKey: programKeyAt(loaded.IP) },
        narration: fill(NARRATION.contextSwitch.load, { name: loadedName, ip: loaded.IP }),
        note: noteFor("switch.load." + change.load),
        compactNarration: fill(NARRATION.contextSwitch.load, { name: loadedName, ip: loaded.IP }),
        compactNote: noteFor("switch.load." + change.load), compactTag: "SO"
      });
    });
  }

  return { steps: steps, programs: built.programs, byAddress: built.byAddress };
}

function stageKeysFor(step) {
  if (step.kind === "stage") return [step.stage];
  if (step.kind === "check") return ["check"];
  if (step.kind === "dma") return ["dma"];
  if (step.kind === "switch") return ["switch"];
  return ["service"];
}

function stageSnapshot(step, index) {
  return {
    kind: step.kind,
    stage: step.stage,
    serviceStep: step.serviceStep,
    stagesLit: stageKeysFor(step),
    narration: step.narration,
    note: step.note,
    tag: step.tag,
    highlight: step.highlight,
    state: step.state,
    sourceIndex: index
  };
}

function compactSnapshot(step, index) {
  return {
    kind: step.kind,
    stage: step.kind === "stage" ? "writeback" : step.stage,
    serviceStep: step.serviceStep,
    stagesLit: step.kind === "stage"
      ? ["fetch", "decode", "operands", "execute", "writeback"]
      : stageKeysFor(step),
    narration: step.compactNarration || step.narration,
    note: step.compactNote || null,
    tag: step.compactTag || step.tag,
    highlight: step.highlight,
    state: step.state,
    sourceIndex: index
  };
}

function markChanges(snapshots) {
  snapshots.forEach(function (snapshot, index) {
    const previous = index === 0 ? null : snapshots[index - 1].state;
    const current = snapshot.state;
    const changed = { registers: [], psw: [], memory: [], stack: [] };
    if (previous) {
      ["AX", "BX", "CX", "IP", "SP"].forEach(function (name) {
        if (previous[name] !== current[name]) changed.registers.push(name);
      });
      ["IF", "ZF", "MODE"].forEach(function (name) {
        if (previous[name] !== current[name]) changed.psw.push(name);
      });
      Object.keys(current.data).forEach(function (address) {
        if (previous.data[address] !== current.data[address]) changed.memory.push(Number(address));
      });
      current.stack.forEach(function (cell) {
        const before = previous.stack.filter(function (other) { return other.address === cell.address; })[0];
        if (!before || before.value !== cell.value) changed.stack.push(cell.address);
      });
    }
    snapshot.changed = changed;
  });
  return snapshots;
}

function buildVariant(example) {
  const trace = buildTrace(example);
  const detailed = markChanges(trace.steps.map(stageSnapshot));
  const compact = markChanges(trace.steps
    .filter(function (step, index) {
      if (step.kind === "check") return !step.silent;
      if (step.kind !== "stage") return true;
      const next = trace.steps[index + 1];
      return !next || next.group !== step.group;
    })
    .map(function (step) { return compactSnapshot(step, trace.steps.indexOf(step)); }));
  const maxStackDepth = detailed.reduce(function (deepest, snapshot) {
    return Math.max(deepest, snapshot.state.stack.length);
  }, 0);
  const usedKinds = {};
  detailed.forEach(function (snapshot) {
    snapshot.stagesLit.forEach(function (key) { usedKinds[key] = true; });
  });

  return {
    example: example,
    label: example.variantLabel || null,
    usedKinds: usedKinds,
    programs: trace.programs,
    detailed: detailed,
    compact: compact,
    usesStack: maxStackDepth > 0,
    stackSlots: Math.max(maxStackDepth, MINIMUM_STACK_SLOTS)
  };
}

function buildExample(example) {
  const variants = (example.variants || [{}]).map(function (variant) {
    return buildVariant(Object.assign({}, example, variant));
  });
  return { example: example, variants: variants };
}

function verifyVariant(built) {
  const expected = built.example.expectedFinalState;
  if (!expected) return;
  const last = built.detailed[built.detailed.length - 1].state;
  const problems = [];
  Object.keys(expected).forEach(function (key) {
    if (key === "neverExecuted") {
      expected.neverExecuted.forEach(function (address) {
        if (last.visited[address]) problems.push("la celda " + address + " se ejecutó y no debía");
      });
      return;
    }
    if (last[key] !== expected[key]) {
      problems.push(key + " es " + last[key] + " y se esperaba " + expected[key]);
    }
  });
  const expectedContexts = built.example.expectedContexts || {};
  Object.keys(expectedContexts).forEach(function (key) {
    const saved = last.contexts[key];
    if (!saved) {
      problems.push("la estructura de " + key + " quedó vacía");
      return;
    }
    Object.keys(expectedContexts[key]).forEach(function (field) {
      if (saved[field] !== expectedContexts[key][field]) {
        problems.push(key + "." + field + " es " + saved[field] + " y se esperaba " + expectedContexts[key][field]);
      }
    });
  });

  const compactLast = built.compact[built.compact.length - 1].state;
  ["AX", "BX", "CX", "IP", "SP", "IF", "ZF", "MODE"].forEach(function (key) {
    if (compactLast[key] !== last[key]) {
      problems.push("compacto y detallado difieren en " + key);
    }
  });
  if (problems.length > 0) {
    console.error("Ejemplo " + built.example.number + (built.label ? " (" + built.label + ")" : "") +
      ": " + problems.join("; "));
  }
}

const BUILT_EXAMPLES = EXAMPLES.map(buildExample);
BUILT_EXAMPLES.forEach(function (built) { built.variants.forEach(verifyVariant); });
</script>

function renderRich(target, text) {
  target.textContent = "";
  const pattern = /\[\[(\w+):([^\]]+)\]\]|\*([^*]+)\*/g;
  let cursor = 0;
  let match = pattern.exec(text);
  while (match) {
    if (match.index > cursor) target.appendChild(document.createTextNode(text.slice(cursor, match.index)));
    if (match[1]) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "tip";
      button.textContent = match[2];
      button.dataset.tip = match[1];
      target.appendChild(button);
    } else {
      const strong = document.createElement("strong");
      strong.textContent = match[3];
      target.appendChild(strong);
    }
    cursor = match.index + match[0].length;
    match = pattern.exec(text);
  }
  if (cursor < text.length) target.appendChild(document.createTextNode(text.slice(cursor)));
  return target;

      const value = document.createElement("span");
      value.className = "value mono";
      value.textContent = snapshot.state.data[address];
      row.appendChild(addr);
      row.appendChild(value);
      if (labels[address]) {
        const note = document.createElement("span");
        note.className = "cell-label";
        note.textContent = labels[address];
        row.appendChild(note);
      }
      if (snapshot.changed.memory.indexOf(Number(address)) !== -1) changedRow = row;
      box.appendChild(row);
    });
    dom.memory.appendChild(box);
  }

  const target = changedRow || currentRow;
  if (target) target.scrollIntoView({ block: "nearest" });
}

function registerBox(name, value, changed, extraClass) {
  const box = document.createElement("div");
  box.className = "reg" + (extraClass ? " " + extraClass : "") + (changed ? " changed" : "");
  const label = document.createElement("span");
  label.className = "name";
  label.textContent = UI_TEXT.registerLabels[name];
  const val = document.createElement("span");
  val.className = "val mono";
  val.textContent = value;
  box.appendChild(label);
  box.appendChild(val);
  return box;
}

function renderRegisters(snapshot) {
  dom.registers.textContent = "";
  const general = document.createElement("div");
  general.className = "reg-grid general";
  REGISTER_NAMES.forEach(function (name) {
    general.appendChild(registerBox(name, snapshot.state[name], snapshot.changed.registers.indexOf(name) !== -1));
  });
  dom.registers.appendChild(general);

  const pointers = document.createElement("div");
  pointers.className = "reg-grid pointers";
  pointers.appendChild(registerBox("IP", snapshot.state.IP, snapshot.changed.registers.indexOf("IP") !== -1, "pointer ip"));
  pointers.appendChild(registerBox("SP", snapshot.state.SP, snapshot.changed.registers.indexOf("SP") !== -1, "pointer sp"));
  dom.registers.appendChild(pointers);

  const psw = document.createElement("div");
  psw.className = "psw";
  const heading = document.createElement("h3");
  heading.textContent = "PSW";
  psw.appendChild(heading);
  const bits = document.createElement("div");
  bits.className = "psw-bits";
  [["IF", snapshot.state.IF], ["ZF", snapshot.state.ZF], ["MODE", MODE_LABELS[snapshot.state.MODE]]].forEach(function (pair) {
    const bit = document.createElement("div");
    bit.className = "bit" + (snapshot.changed.psw.indexOf(pair[0]) !== -1 ? " changed" : "");
    if (pair[0] === "IF") bit.classList.add(snapshot.state.IF === 1 ? "on" : "off");
    if (pair[0] === "MODE") bit.classList.add(snapshot.state.MODE === "kernel" ? "kernel" : "user");
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = UI_TEXT.pswBits[pair[0]];
    const value = document.createElement("span");
    value.className = "val mono";
    value.textContent = pair[1];
    bit.appendChild(name);
    bit.appendChild(value);
    bits.appendChild(bit);
  });
  psw.appendChild(bits);
  const note = document.createElement("p");
  note.className = "psw-note";
  note.textContent = UI_TEXT.pswNote;
  psw.appendChild(note);
  dom.registers.appendChild(psw);

  if (snapshot.state.pending.length > 0) {
    const banner = document.createElement("p");
    banner.className = "pending-banner";
    banner.textContent = fill(UI_TEXT.pendingBanner, {
      names: snapshot.state.pending.map(function (id) { return INTERRUPTS[id].name; }).join(", ")
    });
    dom.registers.appendChild(banner);
  }
}

function stackSlot(markerText, disc) {
  const slot = document.createElement("div");
  slot.className = "stack-slot";
  const marker = document.createElement("span");
  marker.className = "sp-marker mono";
  marker.textContent = markerText;
  slot.appendChild(marker);
  slot.appendChild(disc);
  return slot;
}

function buildDisc(toneClasses) {
  const disc = document.createElement("div");
  disc.className = "disc " + toneClasses;
  ["cap bottom", "body", "cap top"].forEach(function (layer) {
    const shell = document.createElement("span");
    shell.className = "shell " + layer;
    disc.appendChild(shell);
  });
  const content = document.createElement("div");
  content.className = "content";
  disc.appendChild(content);
  return { disc: disc, content: content };
}

function renderStack(snapshot) {
  const shows = currentBuilt().usesStack;
  dom.stackSection.hidden = !shows;
  document.querySelector("main").classList.toggle("no-stack", !shows);
  dom.stack.textContent = "";
  if (!shows) return;
  const cells = snapshot.state.stack.slice().sort(function (a, b) { return a.address - b.address; });
  const slots = currentBuilt().stackSlots;
  const graphic = document.createElement("div");
  graphic.className = "stack-graphic" + (slots >= DENSE_STACK_SLOTS ? " dense" : "");

  const freeSlots = Math.max(slots - cells.length, 0);
  for (let offset = freeSlots; offset > 0; offset -= 1) {
    const ghost = buildDisc("ghost");
    ghost.content.textContent = UI_TEXT.stackFreeSlot;
    graphic.appendChild(stackSlot("", ghost.disc));
  }

  cells.forEach(function (cell, index) {
    const changed = snapshot.changed.stack.indexOf(cell.address) !== -1;
    const built = buildDisc((cell.tone || "") + (changed ? " changed" : "") + (cell.value === null ? " empty" : ""));
    const top = document.createElement("div");
    top.className = "top-row";
    const addr = document.createElement("span");
    addr.className = "addr mono";
    addr.textContent = cell.address;
    const value = document.createElement("span");
    value.className = "value mono";
    value.textContent = cell.value === null ? UI_TEXT.stackPendingValue : cell.value;
    top.appendChild(addr);
    top.appendChild(value);
    const label = document.createElement("div");
    label.className = "label";
    label.textContent = cell.label;
    built.content.appendChild(top);
    built.content.appendChild(label);
    graphic.appendChild(stackSlot(index === 0 ? UI_TEXT.stackPointerMarker : "", built.disc));
  });

  const base = buildDisc("base");
  base.content.className = "content mono";
  base.content.textContent = UI_TEXT.stackBase;
  graphic.appendChild(stackSlot(cells.length === 0 ? UI_TEXT.stackPointerMarker : "", base.disc));
  dom.stack.appendChild(graphic);

  if (cells.length === 0) {
    const empty = document.createElement("p");
    empty.className = "stack-empty";
    empty.textContent = UI_TEXT.stackEmpty;
    dom.stack.appendChild(empty);
  }
}

const CONTEXT_FIELDS = ["AX", "BX", "CX", "IP", "SP"];

function renderContexts(snapshot) {
  const names = currentBuilt().example.contextNames;
  dom.contextsSection.hidden = !names;
  document.querySelector("main").classList.toggle("with-contexts", Boolean(names));
  if (!names) return;
  dom.contextsHeading.textContent = UI_TEXT.contextsTitle;
  dom.contextsPanel.textContent = "";

  const previous = view.stepIndex === 0 ? null : currentSnapshots()[view.stepIndex - 1].state.contexts;

  Object.keys(names).forEach(function (key) {
    const box = document.createElement("div");
    box.className = "context-box";
    const heading = document.createElement("h3");
    heading.textContent = fill(UI_TEXT.contextBoxLabel, { name: names[key] });
    box.appendChild(heading);

    const saved = snapshot.state.contexts[key];
    const before = previous ? previous[key] : null;
    if (JSON.stringify(saved) !== JSON.stringify(before)) box.classList.add("changed");

    if (!saved) {
      const empty = document.createElement("p");
      empty.className = "context-box-empty";
      empty.textContent = UI_TEXT.contextBoxEmpty;
      box.appendChild(empty);
    } else {
      CONTEXT_FIELDS.concat("PSW").forEach(function (field) {
        const row = document.createElement("div");
        row.className = "context-field";
        const label = document.createElement("span");
        label.className = "name";
        label.textContent = field;
        const value = document.createElement("span");
        value.className = "val mono";
        value.textContent = field === "PSW"
          ? "IF=" + saved.IF + " · " + MODE_LABELS[saved.MODE]
          : saved[field];
        if (before && (field === "PSW"
          ? (before.IF !== saved.IF || before.MODE !== saved.MODE)
          : before[field] !== saved[field])) row.classList.add("changed");
        row.appendChild(label);
        row.appendChild(value);
        box.appendChild(row);
      });
    }
    dom.contextsPanel.appendChild(box);
  });
}

function renderContext() {
  dom.contextLabel.textContent = UI_TEXT.contextTitle;
  dom.contextCount.textContent = view.revealed.length;
  dom.contextToggle.classList.toggle("fresh", Boolean(view.freshContext));
  dom.contextDrawer.textContent = "";
  const intro = document.createElement("p");
  intro.className = "context-intro";
  intro.textContent = UI_TEXT.contextIntro;
  dom.contextDrawer.appendChild(intro);
  if (view.revealed.length === 0) {
    const empty = document.createElement("p");
    empty.className = "context-empty";
    empty.textContent = UI_TEXT.contextEmpty;
    dom.contextDrawer.appendChild(empty);
    return;
  }
  view.revealed.forEach(function (entry) {
    const line = document.createElement("div");
    line.className = "context-line";
    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = fill(UI_TEXT.contextTag, { n: entry.number });
    line.appendChild(tag);
    const body = document.createElement("div");
    renderRich(body, entry.text);
    line.appendChild(body);
    dom.contextDrawer.appendChild(line);
  });
}

const CYCLE_STAGE_KEYS = ["fetch", "decode", "operands", "execute", "writeback"];

function renderStages(snapshot) {
  dom.stages.textContent = "";
  const grouped = view.granularity === "compacto";
  const group = document.createElement("div");
  group.className = "stage-group" + (grouped ? " grouped" : "");
  if (grouped && snapshot.stagesLit.length > 1) group.classList.add("lit");
  dom.stages.appendChild(group);

  const used = currentBuilt().usedKinds;
  UI_TEXT.stages.forEach(function (stage) {
    const inCycle = CYCLE_STAGE_KEYS.indexOf(stage.key) !== -1;
    if (!inCycle && !used[stage.key]) return;
    const lit = snapshot.stagesLit.indexOf(stage.key) !== -1;
    const row = document.createElement("div");
    row.className = "stage " + stage.key + (lit && !(grouped && inCycle) ? " lit" : "");
    const num = document.createElement("span");
    num.className = "num mono";
    num.textContent = stage.num;
    const label = document.createElement("span");
    label.textContent = stage.label;
    row.appendChild(num);
    row.appendChild(label);
    (inCycle ? group : dom.stages).appendChild(row);
  });

}

function instructionAt(address) {
  const programs = currentBuilt().programs;
  let found = null;
  Object.keys(programs).forEach(function (key) {
    programs[key].instructions.forEach(function (instruction) {
      if (instruction.address === address) found = instruction;
    });
  });
  return found;
}

function renderInstructionHelp(snapshot) {
  const example = currentBuilt().example;
  const atClosing = (example.closingCard || example.closing) &&
    view.stepIndex === currentSnapshots().length - 1;
  if (atClosing || snapshot.kind === "service" || !snapshot.highlight) return null;
  const instruction = instructionAt(snapshot.highlight.address);
  if (!instruction) return null;
  const help = INSTRUCTION_HELP[instruction.op];
  if (!help) return null;
  const row = document.createElement("p");
  row.className = "instruction-help";
  const mnemonic = document.createElement("span");
  mnemonic.className = "mnemonic mono";
  mnemonic.textContent = help.title;
  const body = document.createElement("span");
  body.textContent = help.body;
  row.appendChild(mnemonic);
  row.appendChild(body);
  return row;
}

function renderVariants() {
  const variants = BUILT_EXAMPLES[view.exampleIndex].variants;
  dom.variantList.hidden = variants.length < 2;
  dom.variantList.textContent = "";
  if (variants.length < 2) return;
  variants.forEach(function (variant, index) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = variant.label;
    button.setAttribute("aria-pressed", index === view.variantIndex ? "true" : "false");
    button.addEventListener("click", function () { selectVariant(index); });
    dom.variantList.appendChild(button);
  });
}

function renderCounter(snapshot) {
  const counter = currentBuilt().example.counter;
  dom.counter.hidden = !counter;
  if (!counter) return;
  dom.counter.textContent = "";
  const label = document.createElement("span");
  label.className = "counter-label";
  label.textContent = counter.label;
  const value = document.createElement("span");
  value.className = "counter-value mono";
  value.textContent = snapshot.state.kernelInstructions;
  dom.counter.appendChild(label);
  dom.counter.appendChild(value);
}

function contextCard() {
  const card = document.createElement("div");
  card.className = "context-card";
  const tag = document.createElement("span");
  tag.className = "tag";
  tag.textContent = UI_TEXT.contextCardTag;
  card.appendChild(tag);
  const body = document.createElement("div");
  renderRich(body, view.freshContext);
  card.appendChild(body);
  return card;
}

function closingCardBlock(text) {
  const card = document.createElement("div");
  card.className = "closing-card";
  const tag = document.createElement("span");
  tag.className = "tag";
  tag.textContent = UI_TEXT.takeawayTag;
  card.appendChild(tag);
  const body = document.createElement("div");
  renderRich(body, text);
  card.appendChild(body);
  return card;
}

function renderSidePanel() {
  const example = currentBuilt().example;
  const atEnd = view.stepIndex === currentSnapshots().length - 1;
  dom.sidePanel.textContent = "";

  const blocks = [];
  if (view.freshContext) blocks.push(contextCard());
  if (atEnd && example.closing) blocks.push(closingTable(example.closing));
  if (atEnd && example.closingCard) blocks.push(closingCardBlock(example.closingCard));

  if (blocks.length > 0) {
    dom.sidePanel.hidden = false;
    dom.sidePanel.className = "side-panel callout-slot";
    blocks.forEach(function (block) { dom.sidePanel.appendChild(block); });
    return;
  }

  const panel = example.sidePanel;
  dom.sidePanel.className = "side-panel";
  dom.sidePanel.hidden = !panel;
  if (!panel) return;
  const heading = document.createElement("h3");
  heading.textContent = panel.title;
  dom.sidePanel.appendChild(heading);
  panel.items.forEach(function (item) {
    const box = document.createElement("div");
    box.className = "side-item " + item.tone;
    const label = document.createElement("span");
    label.className = "side-label";
    label.textContent = item.label;
    const text = document.createElement("span");
    text.textContent = item.text;
    box.appendChild(label);
    box.appendChild(text);
    dom.sidePanel.appendChild(box);
  });
}

function closingTable(closing) {
  const wrapper = document.createElement("div");
  wrapper.className = "closing";
  const heading = document.createElement("span");
  heading.className = "tag";
  heading.textContent = closing.title;
  wrapper.appendChild(heading);

  const table = document.createElement("table");
  const head = document.createElement("tr");
  closing.headers.forEach(function (text) {
    const cell = document.createElement("th");
    cell.textContent = text;
    head.appendChild(cell);
  });
  table.appendChild(head);

  BUILT_EXAMPLES[view.exampleIndex].variants.forEach(function (variant, index) {
    const row = document.createElement("tr");
    if (index === view.variantIndex) row.className = "current";
    const last = variant.detailed[variant.detailed.length - 1].state;
    [variant.label, variant.example.answers.waits, variant.example.answers.copies, last.kernelInstructions]
      .forEach(function (value) {
        const cell = document.createElement("td");
        cell.textContent = value;
        row.appendChild(cell);
      });
    table.appendChild(row);
  });
  wrapper.appendChild(table);
  return wrapper;
}

function renderNarration(snapshot) {
  dom.narration.textContent = "";
  const help = renderInstructionHelp(snapshot);
  if (help) dom.narration.appendChild(help);
  const paragraph = document.createElement("p");
  paragraph.className = "narration-text";
  if (snapshot.tag) {
    const tag = document.createElement("span");
    tag.className = "step-tag " + snapshot.tag.toLowerCase();
    tag.textContent = "[" + snapshot.tag + "]";
    paragraph.appendChild(tag);
  }
  const body = document.createElement("span");
  renderRich(body, snapshot.narration);
  paragraph.appendChild(body);
  dom.narration.appendChild(paragraph);

  const granularityNote = currentBuilt().example.granularityNote;
  if (granularityNote && view.granularity === "compacto" && view.stepIndex === 0) {
    const note = document.createElement("p");
    note.className = "narration-note";
    renderRich(note, granularityNote);
    dom.narration.appendChild(note);
  }

  if (snapshot.note) {
    const note = document.createElement("p");
    note.className = "narration-note";
    renderRich(note, snapshot.note);
    dom.narration.appendChild(note);
  }

}

function contextRevealIndex() {
  const line = currentBuilt().example.contextLine;
  if (!line) return -1;
  let index = -1;
  currentSnapshots().forEach(function (snapshot, position) {
    const matches = snapshot.stage === "writeback" && snapshot.highlight &&
      snapshot.highlight.address === line.revealAfter;
    if (matches && index === -1) index = position;
  });
  return index;
}

function updateRevealedContext() {
  const built = currentBuilt();
  const line = built.example.contextLine;
  view.freshContext = null;
  if (!line) return;
  const index = contextRevealIndex();
  if (index === -1 || view.stepIndex < index) return;
  const already = view.revealed.some(function (entry) { return entry.number === built.example.number; });
  if (!already) {
    view.revealed.push({ number: built.example.number, text: line.text });
    view.revealed.sort(function (a, b) { return a.number - b.number; });
  }
  if (view.stepIndex === index) view.freshContext = line.text;
}

function render() {
  const snapshot = currentSnapshot();
  const built = currentBuilt();
  dom.title.textContent = built.example.number + ". " + built.example.title;
  dom.subtitle.textContent = built.example.subtitle;
  Array.prototype.forEach.call(dom.variantList.children, function (button, index) {
    button.setAttribute("aria-pressed", index === view.variantIndex ? "true" : "false");
  });
  updateRevealedContext();
  renderMemory(snapshot);
  renderRegisters(snapshot);
  renderStack(snapshot);
  renderContexts(snapshot);
  renderContext();
  renderStages(snapshot);
  renderVariants();
  renderCounter(snapshot);
  renderSidePanel();
  renderNarration(snapshot);
  const total = currentSnapshots().length;
  dom.progress.textContent = fill(UI_TEXT.progress, { current: view.stepIndex + 1, total: total });
  dom.progressFill.style.transform = "scaleX(" + ((view.stepIndex + 1) / total) + ")";
  dom.kernelBadge.hidden = snapshot.state.MODE !== "kernel";
  dom.kernelBadge.textContent = UI_TEXT.kernelBadge;
  dom.prev.disabled = view.stepIndex === 0;
  dom.next.disabled = view.stepIndex === currentSnapshots().length - 1;
  dom.detailed.setAttribute("aria-pressed", view.granularity === "detallado" ? "true" : "false");
  dom.compact.setAttribute("aria-pressed", view.granularity === "compacto" ? "true" : "false");
  dom.play.textContent = view.playing ? UI_TEXT.pause : UI_TEXT.play;
  dom.prev.textContent = UI_TEXT.prevStep;
  dom.next.textContent = UI_TEXT.nextStep;
  dom.first.textContent = UI_TEXT.firstStep;
  dom.last.textContent = UI_TEXT.lastStep;
  dom.first.disabled = view.stepIndex === 0;
  dom.last.disabled = view.stepIndex === currentSnapshots().length - 1;
  Array.prototype.forEach.call(dom.exampleList.children, function (button, index) {
    button.setAttribute("aria-current", index === view.exampleIndex ? "true" : "false");
  });
}

function goTo(index) {
  const snapshots = currentSnapshots();
  view.stepIndex = Math.max(0, Math.min(index, snapshots.length - 1));
  render();
  if (view.playing && view.stepIndex === snapshots.length - 1) stopPlaying();
}

function selectExample(index) {
  stopPlaying();
  view.exampleIndex = index;
  view.variantIndex = 0;
  view.granularity = BUILT_EXAMPLES[index].example.defaultGranularity;
  view.stepIndex = 0;
  render();
}

function selectVariant(index) {
  stopPlaying();
  view.variantIndex = index;
  view.stepIndex = 0;
  render();
}

function setGranularity(granularity) {
  if (view.granularity === granularity) return;
  const previous = currentSnapshot().sourceIndex;
  view.granularity = granularity;
  const snapshots = currentSnapshots();
  let target = 0;
  snapshots.forEach(function (snapshot, index) {
    if (snapshot.sourceIndex <= previous) target = index;
  });
  view.stepIndex = target;
  render();
}

function startPlaying() {
  view.playing = true;
  scheduleTick();
  render();
}

function stopPlaying() {
  view.playing = false;
  if (view.timer) { clearTimeout(view.timer); view.timer = null; }
  dom.play.textContent = UI_TEXT.play;
}

function scheduleTick() {
  if (view.timer) clearTimeout(view.timer);
  view.timer = setTimeout(function () {
    if (!view.playing) return;
    if (view.stepIndex >= currentSnapshots().length - 1) { stopPlaying(); render(); return; }
    goTo(view.stepIndex + 1);
    if (view.playing) scheduleTick();
  }, AUTOPLAY_DELAY);
}

function lookupTooltip(key) {
  if (key.indexOf("instr:") === 0) return INSTRUCTION_HELP[key.slice(6)];
  if (key.indexOf("panel:") === 0) return PANEL_TIPS[key.slice(6)];
  return TOOLTIPS[key];
}

function showTooltip(trigger) {
  const tip = lookupTooltip(trigger.dataset.tip);
  if (!tip) return;
  dom.tooltip.textContent = "";
  const title = document.createElement("strong");
  title.className = "tip-title";
  title.textContent = tip.title;
  dom.tooltip.appendChild(title);
  dom.tooltip.appendChild(document.createTextNode(tip.body));
  dom.tooltip.classList.add("open");
  const box = trigger.getBoundingClientRect();
  const width = dom.tooltip.offsetWidth;
  const height = dom.tooltip.offsetHeight;
  let left = box.left;
  if (left + width > window.innerWidth - 12) left = window.innerWidth - width - 12;
  let top = box.top - height - 8;
  if (top < 8) top = box.bottom + 8;
  dom.tooltip.style.left = Math.max(8, left) + "px";
  dom.tooltip.style.top = top + "px";
}

function hideTooltip() {
  dom.tooltip.classList.remove("open");
}

dom.contextToggle.addEventListener("click", function () {
  const open = dom.contextToggle.getAttribute("aria-expanded") === "true";
  dom.contextToggle.setAttribute("aria-expanded", open ? "false" : "true");
  dom.contextDrawer.hidden = open;
});

dom.next.addEventListener("click", function () { stopPlaying(); goTo(view.stepIndex + 1); });
dom.prev.addEventListener("click", function () { stopPlaying(); goTo(view.stepIndex - 1); });
dom.first.addEventListener("click", function () { stopPlaying(); goTo(0); });
dom.last.addEventListener("click", function () { stopPlaying(); goTo(currentSnapshots().length - 1); });
dom.play.addEventListener("click", function () { view.playing ? (stopPlaying(), render()) : startPlaying(); });
dom.detailed.addEventListener("click", function () { stopPlaying(); setGranularity("detallado"); });
dom.compact.addEventListener("click", function () { stopPlaying(); setGranularity("compacto"); });

function closestElement(target, selector) {
  return target && typeof target.closest === "function" ? target.closest(selector) : null;
}

document.addEventListener("keydown", function (event) {
  if (closestElement(event.target, "button") && event.key === " ") return;
  if (event.key === "ArrowRight") { stopPlaying(); goTo(view.stepIndex + 1); event.preventDefault(); }
  if (event.key === "ArrowLeft") { stopPlaying(); goTo(view.stepIndex - 1); event.preventDefault(); }
  if (event.key === "Home") { stopPlaying(); goTo(0); event.preventDefault(); }
  if (event.key === "End") { stopPlaying(); goTo(currentSnapshots().length - 1); event.preventDefault(); }
  if (event.key === " ") { view.playing ? (stopPlaying(), render()) : startPlaying(); event.preventDefault(); }
  if (event.key === "Escape") hideTooltip();
});

document.addEventListener("mouseover", function (event) {
  const trigger = closestElement(event.target, "[data-tip]");
  if (trigger) showTooltip(trigger);
});

document.addEventListener("mouseout", function (event) {
  if (closestElement(event.target, "[data-tip]")) hideTooltip();
});

document.addEventListener("click", function (event) {
  if (!closestElement(event.target, ".context-holder")) {
    dom.contextToggle.setAttribute("aria-expanded", "false");
    dom.contextDrawer.hidden = true;
  }
  const trigger = closestElement(event.target, "[data-tip]");
  if (trigger) { showTooltip(trigger); return; }
  hideTooltip();
});

document.addEventListener("focusin", function (event) {
  const trigger = closestElement(event.target, "[data-tip]");
